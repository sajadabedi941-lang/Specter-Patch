# Independent CI for the Silent Death V25 → SPECTER planner.
# Never writes SPECTER BIGs. apply stays refused.
# This repo's git pack is ~21GiB; do not use a full actions/checkout.
name: V25 sync engine

on:
  pull_request:
    paths:
      - "patch/tools/v25_sync/**"
      - ".github/workflows/v25-sync.yml"
  push:
    paths:
      - "patch/tools/v25_sync/**"
      - ".github/workflows/v25-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v25-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v25-sync:
    name: Stage 1–3 tests and guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse fetch engine only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git version
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local advice.detachedHead false
          git sparse-checkout init --cone
          git sparse-checkout set .github patch/tools/v25_sync
          echo "Fetching ${GITHUB_SHA} with blob:none"
          git fetch --no-tags --depth=1 --filter=blob:none origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          test -f patch/tools/v25_sync/ci_github.py
          test -f .github/workflows/v25-sync.yml
          echo "Workspace files:" && find patch/tools/v25_sync .github -type f | wc -l

      - name: Fetch PR base commit (names only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git fetch --no-tags --depth=1 --filter=blob:none origin ${{ github.event.pull_request.base.sha }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Run V25 CI
        env:
          V25_CI_BASE: ${{ github.event.pull_request.base.sha }}
          V25_CI_EVENT: ${{ github.event_name }}
        run: python3 patch/tools/v25_sync/ci_github.py
