# Independent CI for the Silent Death V25 → SPECTER planner.
# Never writes SPECTER BIGs. apply stays refused.
# Do not clone this repository: the git pack is ~21GiB. Fetch engine files via the GitHub API.
name: V25 sync engine

on:
  pull_request:
    paths:
      - "patch/tools/v25_sync/**"
      - ".github/workflows/v25-sync.yml"
  push:
    paths:
      - "patch/tools/v25_sync/**"
      - ".github/workflows/v25-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: v25-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v25-sync:
    name: Stage 1–5 tests and guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch engine files via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import base64, json, os, pathlib, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "v25-sync-ci",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          tree = get(f"https://api.github.com/repos/{repo}/git/trees/{sha}?recursive=1")
          if tree.get("truncated"):
              raise SystemExit("git tree truncated; cannot fetch engine files")
          wanted = []
          for item in tree["tree"]:
              path = item["path"]
              if item.get("type") != "blob":
                  continue
              if path.startswith("patch/tools/v25_sync/") or path == ".github/workflows/v25-sync.yml":
                  wanted.append(item)
          print(f"fetching {len(wanted)} files at {sha[:12]}")
          for item in wanted:
              blob = get(f"https://api.github.com/repos/{repo}/git/blobs/{item['sha']}")
              dest = pathlib.Path(item["path"])
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(base64.b64decode(blob["content"]))
          print("ok", pathlib.Path("patch/tools/v25_sync/ci_github.py").stat().st_size)
          PY

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Run V25 CI
        env:
          V25_CI_BASE: ${{ github.event.pull_request.base.sha }}
          V25_CI_EVENT: ${{ github.event_name }}
          V25_CI_PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 patch/tools/v25_sync/ci_github.py
