; SPECTER PATCH — EXPERIMENT B ONLY. Not the approved appearance.
; Controlled A/B: same Object USAPAC3 gameplay, Draw uses live US_THAAD
; models so UsaPac3F / UsaPac3Car are not on the spawn preload path.
; W3DModelDraw loads every ConditionState Model at object create, so both
; packed and deployed New Donor models must be swapped for the isolate.
; Restore original Draw from USAPAC3_EXPERIMENT_A.ini after the test.

Object USAPAC3
