  ; *** ART Parameters ***
  SelectPortrait         = USAPAC3
  ButtonImage            = USAPAC3
  ; EXPERIMENT B Draw: live packed Object US_THAAD (US_M1120.ini).
  Draw = W3DTruckDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model             = US_M1120
      Animation         = US_M1120.US_M1120
      AnimationMode     = ONCE_BACKWARDS
      Flags             = START_FRAME_FIRST
    End
    ConditionState      = REALLYDAMAGED
      Model             = US_M1120D
      Animation         = US_M1120D.US_M1120D
      AnimationMode     = ONCE_BACKWARDS
      Flags             = START_FRAME_FIRST
    End
    ConditionState      = RUBBLE
      Model             = US_M1120D
    End
    ConditionState      = MOVING
      Animation         = US_M1120.US_M1120
      AnimationMode     = ONCE_BACKWARDS
