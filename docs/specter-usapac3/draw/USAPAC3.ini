  End
  ExperienceValue      = 160 160 260 420
  ExperienceRequired   = 0 500 1000 1700
  IsTrainable          = Yes
  CrusherLevel         = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel       = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet           = USAPAC3CommandSet_Deployed
  ; *** AUDIO Parameters ***
  VoiceSelect = ScudLauncherVoiceSelect
  VoiceMove = ScudLauncherVoiceMove
  VoiceGuard = ScudLauncherVoiceMove
  VoiceAttack = ScudLauncherVoiceAttack
  SoundMoveStart = ScudLauncherMoveStart
  SoundMoveStartDamaged = ScudLauncherMoveStart
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate       = ScudLauncherVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop
    TruckLandingSound = NoSound
    TruckPowerslideSound = NoSound
    VoiceCrush = ScudLauncherVoiceCrush
    VoiceEnter = ScudLauncherVoiceMove
    VoicePrimaryWeaponMode = ScudLauncherVoiceModeHiEx
    VoiceSecondaryWeaponMode = ScudLauncherVoiceModeAnthrax
  End
  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD SELECTABLE HEAL_PAD NO_HEAL_ICON DONT_AUTO_CRUSH_INFANTRY CAN_ATTACK CAN_CAST_REFLECTIONS VEHICLE HUGE_VEHICLE SCORE ;BOI?
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 400.0
    InitialHealth   = 400.0
    SubdualDamageCap = 480
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
   Behavior                 = AIUpdateInterface ModuleTag_FT
  End
  ClientUpdate = AnimatedParticleSysBoneClientUpdate ModuleTag_Client05
  End
  Locomotor = SET_NORMAL None
  Behavior  = PhysicsBehavior ModuleTag_06
    Mass    = 25
  End
;------------------------ Death ----------------------------------
  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_L8F09
    DeathTypes = ALL -SPLATTED -EXTRA_8
    ProbabilityModifier = 50
    DestructionDelay = 100
    DestructionDelayVariance = 300
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_ThaadDeathEffect
    FX  = FINAL    FX_GenericFreeFallBombsExplosion
  End
  Behavior = SlowDeathBehavior ModuleTag_111
    DeathTypes = NONE +SPLATTED
    OCL = FINAL    OCL_USAPAC3_Pack
  End
  Behavior = ProductionUpdate ModuleTag_05
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  Behavior = TransitionDamageFX ModuleTag_09
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = FlammableUpdate ModuleTag_11
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Behavior  = DestroyDie ModuleTag_07c23z4
  End
;------------------------ End Of Death ----------------------------------
;------------------------ Fire Control System ---------------------------
  
  Behavior               = FireWeaponWhenDeadBehavior ModuleTag_FCS_Down
    StartsActive         = Yes
    DeathWeapon          = FCS_POWER_ZERO_Pack
  End
;------------------------ End Of Fire Control System ---------------------------
  Geometry            = BOX
  GeometryMajorRadius = 45.0
  GeometryMinorRadius = 12.0
  GeometryHeight      = 16.0     
  GeometryIsSmall     = Yes
  Shadow              = SHADOW_VOLUME 
  ShadowSizeX         = 45
End

Object USAPAC3_FireControlSystem
Scale = 0.9

  ; *** ART Parameters ***
  Draw = W3DOverlordTankDraw ModuleTag_01
    ParticlesAttachedToAnimatedBones = Yes
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model                   = THAAD_FCS
      WeaponLaunchBone        = PRIMARY WEAPONA
      WeaponMuzzleFlash       = PRIMARY WEAPONA
      WeaponFireFXBone        = PRIMARY WEAPONA
    End
  End
  ; --- Indicator
  Draw = W3DModelDraw ModuleTag_Indicator
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = Spec_Indic_AAM
    End
    ConditionState = DYING
      Model = None
    End
  End
  WeaponSet
    Conditions        = None
    Weapon            = PRIMARY   8x_LRSAM_THAAD
  End
  VisionRange         = 900
  ShroudClearingRange = 0
  ArmorSet
    Conditions        = None
    Armor             = Generic_FCS_Armor
    DamageFX          = EmptyDamageFX
  End
  ; ***DESIGN parameters ***
  EditorSorting = SYSTEM
  KindOf = UNATTACKABLE CAN_ATTACK PRELOAD IMMOBILE NO_SELECT
  ; *** ENGINEERING Parameters ***  
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 1
    InitialHealth   = 1
  End
  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate        = 1
  End
  Behavior  = PhysicsBehavior ModuleTag_06
    Mass    = 25
  End
  Behavior  = DestroyDie ModuleTag_0725
  End
  Geometry            = CYLINDER
  GeometryMajorRadius = 2.0
  GeometryHeight      = 2.0
  GeometryIsSmall     = No
End

