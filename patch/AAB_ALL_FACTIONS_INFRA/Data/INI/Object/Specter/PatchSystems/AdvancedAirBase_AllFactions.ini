; AAB ALL-FACTIONS INFRASTRUCTURE LAYER
; Separate AdvancedAirBase per faction. Faction art retained when available.
; Large runway + repair/refuel + increased pad capacity. Heavy-ready later.
; No aircraft INI changes. No B-2/B-52/AWACS added.



