; USA-ONLY AAB wiring — separate CommandButton override.
; Do NOT edit stock CommandSet.ini / CommandButton.ini / Dozer.ini.
; AmericaDozerCommandSet slots stay stock (Power/Barracks/WF/...).
; Only Strategy Center construct buttons retarget Object -> America_AdvancedAirBase.
;
; SAGE: duplicate CommandButton re-parses into the existing button (last load wins).
; This file sorts after CommandButton.ini so Object=America_AdvancedAirBase applies.

CommandButton Command_ConstructAmericaStrategyCenter_T
  Command       = DOZER_CONSTRUCT
  Object        = America_AdvancedAirBase
  TextLabel     = CONTROLBAR:ConstructAmericaStrategyCenter
  ButtonImage   = us_stratcenter
  ButtonBorderType        = BUILD
  DescriptLabel           = CONTROLBAR:ToolTipUSABuildStrategyCenter
End

CommandButton Command_ConstructAmericaStrategyCenter
  Command       = DOZER_CONSTRUCT
  Object        = America_AdvancedAirBase
  TextLabel     = CONTROLBAR:ConstructAmericaStrategyCenter
  ButtonImage   = us_stratcenter
  ButtonBorderType        = BUILD
  DescriptLabel           = CONTROLBAR:ToolTipUSABuildStrategyCenter
End
