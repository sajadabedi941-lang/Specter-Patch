; AAB command visibility — UNIQUE buttons (do not redefine stock CommandButton.ini names;
; SAGE keeps the FIRST CommandButton definition, so stock SC buttons cannot be retargeted).

; DEBUG / known-visible reference (Barracks) — kept as named test button for audits
CommandButton Command_AAB_VisibilityTest_Barracks
  Command       = DOZER_CONSTRUCT
  Object        = AmericaBarracks
  TextLabel     = CONTROLBAR:ConstructAmericaBarracks
  ButtonImage   = us_camp
  ButtonBorderType        = BUILD
  DescriptLabel           = CONTROLBAR:ToolTipUSABuildBarracks
End

