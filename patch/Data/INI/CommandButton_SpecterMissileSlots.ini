; SPECTER universal missile slots A-L.
; Visual identity is the slot (موشک A ... موشک L), not a country missile name.
; ZH binds Object on the CommandButton. Only slot A is assigned today.
; Slots B-L omit Object until a real missile is connected. Do not wire them
; into a factory CommandSet until then: UNIT_BUILD with a null Object can
; crash or hide the button when the factory is selected.

CommandButton CB_MISSILE_A
  Command       = UNIT_BUILD
  Object        = Iraq_AlFahd500
  TextLabel     = CONTROLBAR:SpecterMissileA
  ButtonImage   = specter_missile_a
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipSpecterMissileA
End

