; SPECTER PATCH - USA Air Force CommandButtons (unique IDs only)
; Do not redefine names that already exist in INIZH.big CommandButton.ini.
; These buttons exist only in packed SPEC CommandButton.ini, which INIZH
; overwrites. They must live in this unique-path file to be visible.

