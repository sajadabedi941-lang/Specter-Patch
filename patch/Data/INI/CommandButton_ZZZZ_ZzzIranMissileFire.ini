; Unique Iran fire buttons. CommandButton.ini is a stock path and may be
; first-won by INIZH; these names exist only in this extra file.

CommandButton Command_IranFirePrimary
  Command           = FIRE_WEAPON
  WeaponSlot        = PRIMARY
  Options           = OK_FOR_MULTI_SELECT NEED_TARGET_POS
  TextLabel         = CONTROLBAR:FireMainWeapon
  ButtonImage       = sys_fire
  ButtonBorderType  = ACTION
  DescriptLabel     = CONTROLBAR:TooltipTFireMainWeapon
  RadiusCursorType  = ATTACK_SCATTER_AREA
  InvalidCursorName = GenericInvalid
End

CommandButton Command_IranFireSecondary
  Command           = FIRE_WEAPON
  WeaponSlot        = SECONDARY
  Options           = OK_FOR_MULTI_SELECT NEED_TARGET_POS
  TextLabel         = CONTROLBAR:TacticalThermoNuclearStrike
  ButtonImage       = sys_fire
  ButtonBorderType  = ACTION
  DescriptLabel     = CONTROLBAR:ToolTipTacticalThermoNuclearStrike
  RadiusCursorType  = NUCLEARMISSILE
  InvalidCursorName = GenericInvalid
End

CommandButton Command_IranDeployWeapon
  Command           = FIRE_WEAPON
  WeaponSlot        = TERTIARY
  MaxShotsToFire    = 1
  Options           = OK_FOR_MULTI_SELECT
  TextLabel         = CONTROLBAR:Deploy
  ButtonImage       = sys_deploy
  DescriptLabel     = DeployWeapon
End
