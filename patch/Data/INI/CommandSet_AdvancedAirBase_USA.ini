; --- Bound on America_AdvancedAirBase (FS_AIRFIELD production bar) ---
CommandSet AmericaAirfieldCommandSet
  1  = Command_ConstructPatch_America_B2
  2  = Command_ConstructPatch_America_B21
  3  = Command_ConstructPatch_America_B52
  4  = Command_ConstructPatch_America_E3
  5  = Command_ConstructAmericaJetC5Galaxy_AAB
  6  = Command_ConstructAmericaJetStealthFighter
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

; Canonical USA AAB alias (same roster)
CommandSet AdvancedAirBase_USA
