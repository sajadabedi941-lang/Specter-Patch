;==============================================================================
; CommandSet_AdvancedAirBase_USA — USA Advanced Air Base production only
; Object America_AdvancedAirBase.CommandSet = AmericaAirfieldCommandSet
; (FS_AIRFIELD production bar binds the stock airfield CommandSet name.)
; Canonical alias: AdvancedAirBase_USA (same six aircraft).
; Exactly: B-2, B-21, B-52, AWACS, C-5, F-117
; No Science / Upgrade / hidden locks on these UNIT_BUILD buttons.
; Does not modify other factions. Does not change AAB model/W3D/textures.
;==============================================================================

; --- Unlocked UNIT_BUILD buttons ---
CommandButton Command_ConstructPatch_America_B2
  Command          = UNIT_BUILD
  Object           = Patch_America_B2
  TextLabel        = CONTROLBAR:ConstructAmericaJetB2Spirit
  ButtonImage      = us_b1r
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipUSABuildB2Spirit
End

CommandButton Command_ConstructPatch_America_B21
  Command          = UNIT_BUILD
  Object           = Patch_America_B21
  TextLabel        = CONTROLBAR:ConstructPatch_America_B21
  ButtonImage      = SACRaptor
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructPatch_America_B21
End

CommandButton Command_ConstructPatch_America_B52
  Command          = UNIT_BUILD
  Object           = Patch_America_B52
