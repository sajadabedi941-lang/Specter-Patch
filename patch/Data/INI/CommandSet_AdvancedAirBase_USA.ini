  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructPatch_America_B52
End

CommandButton Command_ConstructPatch_America_E3
  Command          = UNIT_BUILD
  Object           = Patch_America_E3
  TextLabel        = CONTROLBAR:ConstructPatch_America_E3
  ButtonImage      = us_e3g
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructPatch_America_E3
End

CommandButton Command_ConstructAmericaJetC5Galaxy_AAB
  Command          = UNIT_BUILD
  Object           = Patch_America_C17
  TextLabel        = CONTROLBAR:ConstructAmericaJetC5Galaxy
  ButtonImage      = us_airfield
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructAmericaJetC5Galaxy
End

CommandButton Command_ConstructAmericaJetStealthFighter
  Command          = UNIT_BUILD
  Object           = AmericaJetStealthFighter
  TextLabel        = CONTROLBAR:ConstructAmericaJetStealthFighter
  ButtonImage      = us_f22a
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipUSABuildStealthFighter
