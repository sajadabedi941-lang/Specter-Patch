; SPECTER PATCH - USA Air Force CommandSets (unique names + hangar set)
; INIZH.big already owns AmericaAirfieldCommandSet and
; AmericaCommandCenterCommandSet. Buildings use the _USAAirForce copies
; so extra slots can be added without redefining those names.
;
; Airfield / Command Center contents are exact INIZH working copies
; plus extra slots only. Specter-only buttons used in extra / hangar
; slots are defined in CommandButton_USA_AirForce.ini.

; INIZH AmericaAirfieldCommandSet + extra aircraft slots
CommandSet AmericaAirfieldCommandSet_USAAirForce
  1  = Command_ConstructAmericaJetRaptor
  2  = Command_ConstructAmericaVehicleComanche
  3  = Command_ConstructAmericaJetAurora
  4  = Command_ConstructAmericaJetStealthFighter
  5  = Command_ConstructAmericaJetF35C_AA
  6  = Command_ConstructAmerica_AuterF22
  7  = Command_UpgradeComancheRocketPods
  8  = Command_UpgradeAmericaLaserMissiles
  9  = Command_UpgradeAmericaCountermeasures
  10 = Command_UpgradeAmericaBunkerBusters
  11 = Command_ConstructAmericaJetV22Visual
  12 = Command_ConstructAmericaJetF35C
  13 = Command_SetRallyPoint
  14 = Command_Sell
  15 = Command_ConstructAmericaJetA10C
  16 = Command_ConstructAmericaJetF-16C_AG
  17 = Command_ConstructAmericaJetF-15E_AA
  18 = Command_ConstructAmericaJetF-22A_AA
End

; INIZH AmericaCommandCenterCommandSet + one extra upgrade slot
CommandSet AmericaCommandCenterCommandSet_USAAirForce
  1  = Command_ConstructAmericaDozer
  2  = Command_SpectreGunship
  3  = Command_UpgradeAmerica_AirForceBombs
  4  = Command_LeafletDrop
  5  = Command_A10ThunderboltMissileStrike
  6  = Command_Paradrop
  7  = Command_SpyDrone
  8  = Command_EmergencyRepair
  9  = Command_DaisyCutter
  10 = Command_SpySatelliteScan
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

; Not present in INIZH.big — must be defined here or the hangar has no set.
; Packed SPEC hangar roster plus B21A extra slot. Existing heavies kept.
CommandSet America_LargeAirBaseCommandSet
  1  = Command_ConstructAmericaJetRaptor
  2  = Command_ConstructAmericaVehicleComanche
  3  = Command_ConstructAmericaJetAurora
  4  = Command_ConstructAmericaJetA10C
  5  = Command_ConstructAmericaJetF-16C_AG
  6  = Command_ConstructAmericaJetF-15E_AA
  7  = Command_ConstructAmericaJetF-22A_AA
  8  = Command_UpgradeAmericaCountermeasures
  9  = Command_ConstructAmericaVehicleUH60
  10 = Command_ConstructAmericaJetEA18
  11 = Command_ConstructAmericaJetF35C
  12 = Command_ConstructAmericaJetF35C_AA
  13 = Command_ConstructAmericaJetF117
  14 = Command_Sell
  15 = Command_ConstructAmerica_B21A
  16 = Command_ConstructAmericaJetB52H
  17 = Command_ConstructAmericaJetB1R
  18 = Command_ConstructAmericaJetB2Spirit
