; SPECTER last-win. NEW CommandSet names only — never defined in CommandSet.ini.
;
; Crash cause (wf-detach-sarab7-9p117-alabbas): these blocks were packed as
; Data\INI\Object\zzzzz_SpecterWfRemoveSarab\CommandSets.ini. Files under
; Object\ are parsed as Object INI. In that context CommandSet is a FIELD
; (CommandSet = Name), not a block (CommandSet Name). The Object parser
; consumes CommandSet SaudiArabia and leaves _WarFactoryCommandSet_NoSarab,
; which is the crash token _warfactorycommandset_nosarab.
;
; CommandSet blocks belong in Data\INI\CommandSet*.ini (same pattern as
; CommandSet_Pakistan.ini and other SPECTER extras). Unique names were
; never in CommandSet.ini, so this file is the first and only definition.
; Redefining the OLD shared names does not change the in-game bar.
;
; Slots 9 and 13 on the Iraq-clone bars are rewritten to country units
; (AlKhalid / CombatDrone) so merge leftovers cannot return.

;============================================================================
; Iraq-clone remaining roster (5 countries). Slot 9/13 were Sarab7 / 9P117.
;============================================================================

