; Unique Iran missile CommandSets. Scud_B_CommandSet / Smerch_CommandSet live
; only in CommandSet.ini, which INIZH can first-win. Objects point at these
; new names so the bar is this file, not a shadowed stock set.
; Buttons are stock CommandButton.ini names only (Command_FireMainWeapon,
; Command_Guard, Command_Stop, Command_AttackMove). Do not reference
; extra-only button names — those never appear on the live ControlBar.

CommandSet IranMissileFireCommandSet
  1  = Command_FireMainWeapon
  12 = Command_AttackMove
  13 = Command_Guard
  14 = Command_Stop
End

