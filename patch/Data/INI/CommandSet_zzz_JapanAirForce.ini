; SPECTER PATCH - Japan airfield roster (unique file, unique CommandSet name)
; Japan_Airfield and Japan_LargeAirBase use Japan_JASDF_AirfieldCommandSet.
; This path is not in INIZH.big, so a later CommandSet.ini cannot wipe it.
; CommandSet_Japan.ini must NOT define this name (or Japan_AirfieldCommandSet).
; A leftover loose CommandSet_Japan.ini cannot override this set.

CommandSet Japan_JASDF_AirfieldCommandSet
  1 = Command_ConstructJapan_F35A
  2 = Command_ConstructJapan_F35B
  3 = Command_ConstructJapan_F15JKai
  4 = Command_ConstructJapan_F15DJ
  5 = Command_ConstructJapan_F2A
  6 = Command_ConstructJapan_F2B
  7 = Command_ConstructJapan_X2Shinshin
  8 = Command_ConstructJapan_F3GCAP
  9 = Command_ConstructJapan_F4EJKai
  10 = Command_ConstructJapan_F3
  11 = Command_ConstructJapan_F16AJ
  12 = Command_ConstructJapan_F2Kai
  13 = Command_SetRallyPoint
  14 = Command_Sell
End
