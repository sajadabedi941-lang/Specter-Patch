; TEOD B-2 FXLists — TEOD definitions with Specter-available particles/sounds

FXList FX_B2BombDrop
  Sound
    Name = Cin_BombDropFlyBy
  End
End

FXList FX_B2DeathInitial
  ParticleSystem
    Name           = JetBigExplosionInitial
    OrientToObject = yes
  End
  ParticleSystem
    Name           = JetBigExplosionLenzflare
    OrientToObject = yes
  End
  Sound
    ; TEOD B2Falling assets absent; map to Specter cargo-jet flambe
    Name = CargoJetFlambe
  End
End

FXList FX_B2ClusterRelease
  ; TEOD Smrech/Smerch particles absent in Specter — Aurora bomb detonate set
  ParticleSystem
    Name = BigExplosionRingSmoke
  End
  ParticleSystem
    Name = BigExplosionArms
  End
  ParticleSystem
    Name = BigExplosionCarpetPuff
  End
  Sound
    Name = BombTruckDefaultBombDetonation
  End
End

FXList FX_BigPlaneHitGround
  ParticleSystem
    Name = JetBigExplosion
    Offset = X:-15 Y:0 Z:20
    OrientToObject = Yes
  End
  ParticleSystem
    Name = MortarDebris
    Count = 3
    Offset = X:-15 Y:0 Z:5
    Radius = 5 50 UNIFORM
    OrientToObject = Yes
  End
  Sound
    Name = CargoJetFlambe
  End
  TerrainScorch
    Type = RANDOM
    Radius = 90
  End
End

FXList FX_JetWaterExplosionBigBig
  ; TEOD water FX absent in Specter — ground-jet stand-in for water death reaction
  ParticleSystem
    Name = JetBigExplosion
    Offset = X:0 Y:0 Z:5
    OrientToObject = Yes
  End
  Sound
    Name = CargoJetFlambe
  End
End

FXList FX_BigMissileCarrierDeath
  ParticleSystem
    Name = JetBigExplosion
    Offset = X:5 Y:0 Z:5
  End
  ParticleSystem
    Name = JetBigExplosionInitial
  End
  Sound
    Name = BombTruckDefaultBombDetonation
  End
  ViewShake
    Type = STRONG
  End
  TerrainScorch
    Type = RANDOM
    Radius = 50
  End
End
