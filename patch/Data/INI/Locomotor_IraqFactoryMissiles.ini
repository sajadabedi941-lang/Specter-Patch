; Iraq factory missile locos. Clones of R11SRBMLocomotor with Speed/Acceleration
; scaled from MOTHER (Iraq_R11ScudB / ALHIJARAH_MRBM_Object) Radar Stealth 5/100.
;
; Authoritative time-to-impact stack in this SPECTER ballistic implementation:
;   1. Locomotor Speed           (THRUST cruise velocity, dist/sec)  MOTHER = 450
;   2. Locomotor Acceleration    (time to reach cruise)              MOTHER = 250
;   3. Weapon WeaponSpeed        (weapon-system projectile speed)    MOTHER = 280
;   4. MissileAIUpdate InitialVelocity (boost start)                 MOTHER = 10
;
; Scale = score / 5. R11SRBMLocomotor itself is NOT modified (MOTHER uses it).
; SpeedDamaged / AccelerationDamaged keep the same ratio as MOTHER.

Locomotor Iraq_AlHusseinII_Locomotor
  Surfaces = AIR
  Speed = 900
