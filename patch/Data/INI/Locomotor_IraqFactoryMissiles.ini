  Acceleration = 500
  AccelerationDamaged = 1640
  Braking = 0
  TurnRate = 9999
  MaxThrustAngle = 45
  AllowAirborneMotiveForce = Yes
  Appearance = THRUST
  PreferredHeight = 1200
  PreferredHeightDamping = 0.9
  ThrustRoll                     = 0.02
  ThrustWobbleRate               = 0.002
  ThrustMinWobble                = -0.002
  ThrustMaxWobble                = 0.002
End

