  SpeedDamaged = 95         
;  MinSpeed = 120             
; !!! DO NOT REDUCE MinSpeed BELOW 60 UNTIL LANDINGS ARE FIXED (srj)
  MinSpeed = 60             
  TurnRate = 150            
  TurnRateDamaged = 130      
