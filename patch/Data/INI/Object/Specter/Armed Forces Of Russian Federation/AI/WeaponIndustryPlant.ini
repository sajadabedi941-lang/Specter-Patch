;------------------------------------------------------------------------------
Object ChinaPropagandaCenter
Scale = 0.9

  ; *** ART Parameters ***
  SelectPortrait         = rus_wip
  ButtonImage            = rus_wip
  UpgradeCameo1 = Upgrade_NuclearReactor
  ; ---- the building itself ------
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    ; day ********************************************
    ConditionState       = NONE;
      Model              = RUS_WepInd
      Animation          = RUS_WepInd.RUS_WepInd
      AnimationMode      = LOOP
      ParticleSysBone    = Steam01 SteamVent
      ParticleSysBone    = Steam02 SteamVent
      ParticleSysBone    = Steam03 SteamVent
    End
    ConditionState       = DAMAGED
      Model              = RUS_WepInd
      Animation          = RUS_WepInd.RUS_WepInd
      AnimationMode      = LOOP
      ParticleSysBone    = Steam01 SteamVent
      ParticleSysBone    = Steam02 SteamVent
      ParticleSysBone    = Steam03 SteamVent
    End
    ConditionState       = REALLYDAMAGED RUBBLE
      Model              = RUS_WepInd
      Animation          = RUS_WepInd.RUS_WepInd
      AnimationMode      = LOOP
      ParticleSysBone    = Steam01 SteamVent
      ParticleSysBone    = Steam02 SteamVent
      ParticleSysBone    = Steam03 SteamVent
    End
  End
  
  
 
  PlacementViewAngle = -45

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:RUWIP
  Side                = China
  EditorSorting       = STRUCTURE
  Prerequisites
    Object            = ChinaWarFactory
  End
  BuildCost           = 2000
  BuildTime           = 45.0           ; in seconds
  EnergyProduction    = -2
  EnergyBonus         = 35
  VisionRange         = 200.0           ; Shroud clearing distance
  ShroudClearingRange = 200
  MaxSimultaneousOfType = 1
  ArmorSet
    Conditions        = None
    Armor             = StructureArmor
    DamageFX          = StructureDamageFXNoShake
  End
  CommandSet          = ChinaPropagandaCenterCommandSet
  ExperienceValue     = 200 200 200 200  ; Experience point value at each level


  ; *** AUDIO Parameters ***
  VoiceSelect         = PropagandaCenterSelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End

  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD STRUCTURE SELECTABLE IMMOBILE FS_POWER SCORE CAPTURABLE FS_TECHNOLOGY MP_COUNT_FOR_VICTORY FS_ADVANCED_TECH
  Body            = StructureBody ModuleTag_07
    MaxHealth     = 1500.0
    InitialHealth = 1500.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 1200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
  Behavior = DestroyDie ModuleTag_12
    ;<NO DATA>
  End
  Behavior = ProductionUpdate ModuleTag_12c23r
    NumDoorAnimations            = 1
    DoorOpeningTime              = 4000  ;in mSeconds
    DoorWaitOpenTime             = 2000  ;in mSeconds
    DoorCloseTime                = 5000  ;in mSeconds
    ConstructionCompleteDuration = 1500  ;in mSeconds
  End
  Behavior = DefaultProductionExitUpdate ModuleTag_1332
    UnitCreatePoint   = X:  0.0  Y:-27.0   Z:0.0
    NaturalRallyPoint = X: 57.0  Y:-27.0   Z:0.0;NaturalRallyPointX must always match GeometryMajorRadius! -ML
  End
  Behavior  = FXListDie ModuleTag_14
    DeathFX = FX_StructureMediumDeath
  End

  Behavior             = FlammableUpdate ModuleTag_17
    AflameDuration     = 5000    ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay  = 500     ; this often.
  End
;;;;-- Nuclear Power Upgrade
  Behavior = PowerPlantUpgrade ModuleTag_023r
    TriggeredBy = Upgrade_NuclearReactor
  End
  Behavior = BaseRegenerateUpdate ModuleTag_043v
    ;No data
  End
  Behavior = PowerPlantUpdate ModuleTag_056h
    RodsExtendTime = 600
  End
;;;;-- End

  Behavior = TransitionDamageFX ModuleTag_18
    ;-------------DESIGNED FOR MEDIUM SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End
  Behavior = GrantUpgradeCreate ModuleTag_ICBMBK
    UpgradeToGrant = Upgrade_ICBM_BoosterKiller
  End
  Behavior                  = ObjectCreationUpgrade ModuleTag_MMT
    UpgradeObject           = OCL_RUBTD
    TriggeredBy             = Upgrade_ICBM_BoosterKiller
  End
  
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_KillMarker
    DeathWeapon  = GenericTargetMarkerKiller
    StartsActive = Yes
  End
  Behavior          = FireWeaponWhenDeadBehavior ModuleTag_KillMarker2
    DeathWeapon     = GenericTargetMarkerKiller
    StartsActive    = Yes
    RequiredStatus  = SOLD
  End
  Geometry            = BOX
  GeometryMajorRadius = 33.0
  GeometryMinorRadius = 57.0
  GeometryHeight      = 40.0
  GeometryIsSmall     = No
  Shadow              = SHADOW_VOLUME
  BuildCompletion     = PLACED_BY_PLAYER

End