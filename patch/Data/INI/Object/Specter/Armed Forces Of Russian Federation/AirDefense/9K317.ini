Object RussiaVehicle9K317
Scale = 0.92
  ; *** ART Parameters ***
  SelectPortrait         = irq_sam6
  ButtonImage            = irq_sam6
  ;UpgradeCameo5 = NONE
  Draw = W3DTankDraw ModuleTag_01
    OkToChangeModelColor = Yes
     ProjectileBoneFeedbackEnabledSlots = PRIMARY
    DefaultConditionState
      Model = RUS_9K317
      Turret = TURRET
      TurretPitch = Turretle
      WeaponFireFXBone = PRIMARY WeaponFX
      WeaponLaunchBone = PRIMARY Missile
    End
    ConditionState = REALLYDAMAGED
      Model = RUS_9K317D
      Turret = TURRET
      TurretPitch = Turretle
      WeaponFireFXBone = PRIMARY WeaponFX
      WeaponLaunchBone = PRIMARY Missile
    End
    AliasConditionState = RUBBLE
    TrackMarks           = EXTnkTrack.tga
    TreadAnimationRate      = 2.0  ; amount of tread texture to move per second
    TreadDriveSpeedFraction = 0.3  ; fraction of locomotor speed below which treads stop moving.
    TreadPivotSpeedFraction = 0.6  ; fraction of locomotor speed below which we allow pivoting.
    OkToChangeModelColor = Yes
  End
  ; ***DESIGN parameters ***
  DisplayName           = OBJECT:9k317
  Side                  = Russia
  EditorSorting         = VEHICLE
  TransportSlotCount    = 3                 ;how many "slots" we take in a transport (0 == not transportable)
  WeaponSet
   Weapon           = PRIMARY 4x_MRSAM_9M317
   PreferredAgainst = PRIMARY AIRCRAFT
 End
  ArmorSet
    Conditions      = None
    Armor           = TankArmor
    DamageFX        = TankDamageFX
  End
  Prerequisites
    Object  = RussiaIndustrialComplex
    Science = SCIENCE_Rank3
  End
  BuildCost       = 1000
  BuildTime       = 15.0          ;in seconds    
  VisionRange     = 700
  ShroudClearingRange = 270
  ExperienceValue = 60 60 120 200    ;Experience point value at each level
  ExperienceRequired = 0 100 200 400  ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet       = T72B3TankCommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect           = QuadCannonVoiceSelect
  VoiceMove             = QuadCannonVoiceMove
  VoiceAttack           = QuadCannonVoiceAttack
  VoiceAttackAir        = QuadCannonVoiceAttackAir
  SoundMoveStart        = QuadCannonMoveStart
  SoundMoveStartDamaged = QuadCannonMoveStart
  VoiceGuard             = QuadCannonVoiceMove
  UnitSpecificSounds
   ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate         = QuadCannonVoiceCreate
   TurretMoveStart      = NoSound
   TurretMoveLoop       = TurretMoveLoop
   ; Required for the W3DTruckDraw module
   TruckLandingSound    = NoSound
   TruckPowerslideSound = NoSound
   VoiceSalvage         = QuadCannonVoiceSalvage
   VoiceCrush           = QuadCannonVoiceCrush
   VoiceEnter             = QuadCannonVoiceMove
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 720.0
    InitialHealth   = 720.0
    SubdualDamageCap = 600
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = StealthDetectorUpdate ModuleTag_05
    DetectionRate     = 800   ; how often to rescan for stealthed things in my sight (msec)
    DetectionRange   =  800 ;Dustin, enable this for independant balancing!
    CanDetectWhileGarrisoned  = No ;Garrisoned means being in a structure that you units can shoot out of.
    CanDetectWhileContained   = No ;Contained means being in a transport or tunnel network.
  End
  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate = 100
      TurretPitchRate = 80
      AllowsPitch = Yes
      NaturalTurretPitch = 0
      NaturalTurretAngle = 180
      RecenterTime = 5000   ; how long to wait during idle before recentering
      ControlledWeaponSlots = PRIMARY 
    End
    AutoAcquireEnemiesWhenIdle = Yes
  End
  Behavior = CommandButtonHuntUpdate  ModuleTag_0mhg
  End
  Behavior = ProductionUpdate ModuleTag_12c3
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  Locomotor = SET_NORMAL V-55_diesel
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 200.0
  End
  Behavior        = ReplaceObjectUpgrade ModuleTag_80bvm
    ReplaceObject = RussiaVehicle9K317M
    TriggeredBy   = Upgrade_WeaponSetUpgrade
  End
  ; just explode death
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -CRUSHED -SPLATTED
;    ProbabilityModifier = 33
    DestructionDelay = 500
    DestructionDelayVariance = 500
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_2K12DeathEffect
    FX  = FINAL    FX_FreeFallBombsDetonation
  End
  Behavior                 = TransitionDamageFX ModuleTag_12h45
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
  End
  Behavior = DestroyDie ModuleTag_13
    DeathTypes = NONE +CRUSHED +SPLATTED
  End
  ; A crushing defeat
  Behavior = FXListDie ModuleTag_14
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_TankCrush
  End
  Behavior = CreateObjectDie ModuleTag_15
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End
  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Geometry = BOX
  GeometryMajorRadius = 20.0
  GeometryMinorRadius = 11.0
  GeometryHeight = 10.5    
  GeometryIsSmall = Yes 
  Shadow = SHADOW_VOLUME   
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length
End
