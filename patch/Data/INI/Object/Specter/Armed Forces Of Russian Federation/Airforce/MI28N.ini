Object RussiaHelicopterMi28N
Scale = 0.9
  ; *** ART Parameters ***
  SelectPortrait         = rus_mi28n
  ButtonImage            = rus_mi28n
  UpgradeCameo1 = Upgrade_AmericaCountermeasures
  Draw = W3DOverlordAircraftDraw ModuleTag_01
    ExtraPublicBone                    = FIREPOINT01
    DefaultConditionState
      Model                           = RUS_MI28N
      Animation                       = RUS_MI28N.RUS_MI28N
      Flags                           = RANDOMSTART
      AnimationMode                   = LOOP
      Turret                          = Body
      TurretPitch                     = Turretle
      WeaponMuzzleFlash               = PRIMARY WeaponA01
      WeaponFireFXBone                = PRIMARY WeaponA01
      WeaponLaunchBone                = PRIMARY WeaponA01
      WeaponFireFXBone                = SECONDARY WeaponB
      WeaponLaunchBone                = SECONDARY WeaponB
      WeaponFireFXBone                = TERTIARY WeaponC
      WeaponLaunchBone                = TERTIARY WeaponC
    End
    ConditionState = REALLYDAMAGED
      Model                           = RUS_MI28N
      Animation                       = RUS_MI28N.RUS_MI28N
      Flags                           = RANDOMSTART
      AnimationMode                   = LOOP
      Turret                          = Body
      TurretPitch                     = Turretle
      WeaponMuzzleFlash               = PRIMARY WeaponA01
      WeaponFireFXBone                = PRIMARY WeaponA01
      WeaponLaunchBone                = PRIMARY WeaponA01
      WeaponFireFXBone                = SECONDARY WeaponB
      WeaponLaunchBone                = SECONDARY WeaponB
      WeaponFireFXBone                = TERTIARY WeaponC
      WeaponLaunchBone                = TERTIARY WeaponC
    End
    ConditionState = RUBBLE
      Model                           = RUS_MI28N
      Animation                       = RUS_MI28N.RUS_MI28N
    End
    ConditionState = RUBBLE SPECIAL_DAMAGED
      Model                           = RUS_MI28N 
    End
    OkToChangeModelColor = Yes
  End
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:Mi28N
  EditorSorting       = VEHICLE
  Side                = Russia
  TransportSlotCount  = 0                 ;how many "slots" we take in a transport (0 == not transportable)
  VisionRange         = 620.0 
  ShroudClearingRange = 500
  WeaponSet
    Conditions          = None 
    ; -----
    Weapon              = PRIMARY     GenericHeliGunnerSight
    PreferredAgainst    = PRIMARY     INFANTRY VEHICLE
    AutoChooseSources   = PRIMARY     FROM_PLAYER FROM_SCRIPT FROM_AI
    ; -----
    Weapon              = SECONDARY   9M120_Ataka
    PreferredAgainst    = SECONDARY   VEHICLE STRUCTURE
    AutoChooseSources   = SECONDARY   FROM_PLAYER FROM_SCRIPT FROM_AI
    ; -----
    Weapon              = TERTIARY    6X_80mm_S8_Rockets_MI28N
    PreferredAgainst    = TERTIARY    INFANTRY STRUCTURE
    AutoChooseSources   = TERTIARY    FROM_PLAYER FROM_SCRIPT FROM_AI
  End
  ArmorSet
    Conditions      = None
    Armor           = ComancheArmor_P
    DamageFX        = None
  End
  ArmorSet
    Conditions            = PLAYER_UPGRADE
    Armor                 = CountermeasuresComancheArmor_P
    DamageFX              = None
  End
  BuildCost           = 2600
  BuildTime           = 22              ; in seconds  
  ExperienceValue     = 50 50 100 200   ; Experience point value at each level
  ExperienceRequired  = 0 100 200 400   ; Experience points needed to gain each level
  IsTrainable         = Yes             ; Can gain experience
  CommandSet          = GenericAttackHelicopterHoverCommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect           = ComancheVoiceSelect
  VoiceMove             = ComancheVoiceMove
  VoiceGuard            = ComancheVoiceMove
  VoiceAttack           = ComancheVoiceAttack
  SoundAmbient          = MI28AmbientLoop
  SoundAmbientRubble    = NoSound
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate         = ComancheVoiceCreate
    SoundEject          = Spec_RUS_Eject
    VoiceEject          = Spec_RUS_Eject
    Afterburner         = RaptorAfterburner
    VoiceGarrison       = ComancheVoiceMove
    TurretMoveStart     = NoSound
    TurretMoveLoop      = NoSound
    VoiceFireRocketPods = ComancheVoiceAttackRocket
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority   = UNIT
  KindOf          = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT PRODUCED_AT_HELIPAD

  Body = ActiveBody ModuleTag_04
    MaxHealth       = 550.0
    InitialHealth   = 550.0
  End
  Behavior = FXListDie ModuleTag_05
    ;DeathTypes = ALL -EXTRA_7
    DeathFX = FX_HelicopterStartDeath
  End
  Behavior = JetAIUpdate ModuleTag_0v3321
    MinHeight                     = 10
    NeedsRunway                   = No
    KeepsParkingSpaceWhenAirborne = No
    AutoAcquireEnemiesWhenIdle    = Yes
    Turret
      TurretTurnRate              = 70      ; this "turret" does not turn
      TurretPitchRate             = 30     ; nor does it pitch
      MinPhysicalPitch            = -25
      AllowsPitch                 = No ;Yes 
      RecenterTime                = 120   
      GroundUnitPitch             = -15
      ControlledWeaponSlots       = SECONDARY TERTIARY ;PRIMARY 
    End
  End
  Locomotor = SET_NORMAL  TV3_SB3_heli
  Locomotor = SET_TAXIING BasicHelicopterTaxiLocomotor
  Behavior  = PhysicsBehavior ModuleTag_07f34
    Mass = 50.0
    AerodynamicFriction = 0.05
    AllowCollideForce = Yes
    AllowBouncing = No
    ShockResistance = 0.50
    MinFallHeightForDamage = 120.0
  End
  ;Behavior = CreateObjectDie ModuleTag_Lioter
    ;DeathTypes             = NONE +EXTRA_7
    ;CreationList           = OCL_Mi28N_Loiter
    ;TransferPreviousHealth = Yes
  ;End
  Behavior        = ReplaceObjectUpgrade ModuleTag_Lioter
    TriggeredBy   = Upgrade_AADS_AA_Mode
    ReplaceObject = RussiaHelicopterMi28N_Loiter
  End
  Behavior = ProductionUpdate ModuleTag_05k67
    MaxQueueEntries = 1
  End
  Behavior = HelicopterSlowDeathBehavior ModuleTag_08
    DestructionDelay                = 99999999        ; the destruction delay
    SpiralOrbitTurnRate             = 92.0           ; in degrees per second, bigger # = tighter spiral
    SpiralOrbitForwardSpeed         = 220.0           ; bigger # = larger spiral
    SpiralOrbitForwardSpeedDamping  = .9999           ; smaller #'s = slow down faster
    MaxBraking                      = 110   ; max braking we can use during death spiral (lower num = wilder spiral)    
    SoundDeathLoop                  = ComancheDamagedLoop
    MinSelfSpin                     = 50                     ; in degrees per second
    MaxSelfSpin                     = 130                     ; in degrees per second
    SelfSpinUpdateDelay             = 299             ; in milliseconds
    SelfSpinUpdateAmount            = 6             ; in degrees   
    FallHowFast                     = 22.0%  ; fraction of gravity, lower = take longer to fall
    MinBladeFlyOffDelay             = 1500            ; in milliseconds
    MaxBladeFlyOffDelay             = 1500            ; in milliseconds
    AttachParticle                  = SootySmokeTrail
    AttachParticleBone              = Propeller02
    BladeObjectName                 = ComancheBlades
    BladeBoneName                   = Propeller01    
    FXBlade                         = FX_HelicopterBladeExplosion
    OCLBlade                        = OCL_HelicopterBladeExplosion
    FXHitGround                     = FX_HelicopterHitGround
    OCLHitGround                    = OCL_HelicopterHitGround
    FXFinalBlowUp                   = FX_GroundedHelicopterBlowUp
    OCLFinalBlowUp                  = OCL_GroundedHelicopterBlowUp
    DelayFromGroundToFinalDeath     = 15
    FinalRubbleObject               = ComancheRubbleHull
  End
  Behavior                = ArmorUpgrade ModuleTag_Armor01
    TriggeredBy           = Upgrade_AmericaCountermeasures
  End
  Behavior                = CountermeasuresBehavior ModuleTag_10
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = RussiaSystemCountermeasureFlare
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 2     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = -90.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 4.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 150  ; Time between flare volleys
    NumberOfVolleys       = 4     ; Number of times the volleys will fire before reloading
    ReloadTime            = 2000     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 45%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 100     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 200   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End
  Behavior                = CountermeasuresBehavior ModuleTag_10f23
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureCHAFF
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 2     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = -190.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 3.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 2000  ; Time between flare volleys
    NumberOfVolleys       = 2     ; Number of times the volleys will fire before reloading
    ReloadTime            = 2500     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 55%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 100     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 200   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_SAP14
    WeaponTemplate        = KNIRTI_SAP_14
    PrimaryTargetTypes    = PROJECTILE INERT
    ScanRate              = 800
    ScanRange             = 300
    PredictTargetVelocityFactor = 3.0
  End
  Behavior = CreateObjectDie ModuleTag_Deletion
    DeathTypes   = NONE +EXTRA_6
    CreationList = None
  End
  Behavior = TransitionDamageFX ModuleTag_09
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuousDown
    ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:0 FXList:FX_ComancheDamageTransition
  End
  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Behavior = ObjectCreationUpgrade Upgrade_j67
    UpgradeObject = OCL_RussiaTurretShipunov2A42
    TriggeredBy   = Upgrade_ICBM_BoosterKiller
  End
  Behavior = OverlordContain ModuleTag_GT
    Slots                   = 1
    DamagePercentToUnits    = 100%
    AllowInsideKindOf       = PORTABLE_STRUCTURE
    PassengersAllowedToFire = Yes
    PassengersInTurret      = Yes ; My passengers ride in my turret, that's where the Firepoint bones are
    ExperienceSinkForRider  = Yes ; I get the Exp for things my turret friend kills
    ;PayloadTemplateName     = RussiaTurretShipunov2A42
  End
;---------- Radar Signature --------------- ;
  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE
  End
;---------- End Of Radar Signature ----------;
  Geometry = BOX
  GeometryMajorRadius = 30.0
  GeometryMinorRadius = 22.0
  GeometryHeight = 25.0     
  GeometryIsSmall = No
  Shadow = SHADOW_VOLUME    
  ShadowSizeX = 89  ; minimum elevation angle above horizon. Used to limit shadow length
End
