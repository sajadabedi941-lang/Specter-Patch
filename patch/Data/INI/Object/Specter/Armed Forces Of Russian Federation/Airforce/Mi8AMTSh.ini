    Weapon            = PRIMARY    16x_80mm_S8_Rockets_Mi17
  End
  BuildCost           = 1300
  BuildTime           = 18.0          ;in seconds  
  ExperienceValue     = 50 50 50 50 ;Experience point value at each level
