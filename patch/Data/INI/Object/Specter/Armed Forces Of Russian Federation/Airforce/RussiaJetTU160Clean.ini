;==============================================================================
; RussiaJetTU160Clean - Tu-160 Blackjack
;
; VISUAL DONOR  = TEOD TU160FOAB / TU160.ini (!TEOD_*.big)
;                 Models RU-TU160 / RU-TU160_D / RU-TU160_E + TU-160*.dds
; GAMEPLAY DONOR = AmericaJetB52H heavy-bomber airfield architecture
;                 JetAIUpdate (NeedsRunway) / D30-F6 locomotor / RTB / death
;
; Clean object (B-21 / F-117 / SU-75 / SU-47 method):
;   - NO SpecialPower / FOAB science launch
;   - NO Rank / Science / Industrial unlock gates
;   - NO Scale (native donor size)
;   - Geometry sized for heavy-bomber airfield taxi/takeoff (B-52H HeavyRunway)
; WEAPON: Russia_Weapon_TU160_KH55 → Russia_TU160_KH55MS_Projectile
;   (complete unique TEOD KH55MS clone — Object KH55MS NOT redefined)
; Launch bone: PRIMARY WEAPONA → RU-TU160 WEAPONA01
;
; BuildCost = 8500
;==============================================================================

Object RussiaJetTU160Clean

  ; *** ART Parameters — REAL Tu-160 Blackjack (TEOD RU-TU160) ***
  SelectPortrait         = TU-160ic
  ButtonImage            = TU-160ic

  UpgradeCameo1 = Upgrade_AmericaCountermeasures

  Draw = W3DModelDraw ModuleTag_01

    OkToChangeModelColor = Yes
    ParticlesAttachedToAnimatedBones = Yes

    DefaultConditionState
      Model               = RU-TU160
      WeaponLaunchBone    = PRIMARY WEAPONA
      WeaponFireFXBone    = PRIMARY WEAPONA
      ParticleSysBone     = ENGINE01 JetBlackTrailThin
      ParticleSysBone     = ENGINE02 JetBlackTrailThin
      ParticleSysBone     = ENGINE03 JetBlackTrailThin
      ParticleSysBone     = ENGINE04 JetBlackTrailThin
      ParticleSysBone     = Wingtip01 JetContrailThin
      ParticleSysBone     = Wingtip02 JetContrailThin
    End

    ConditionState        = JETEXHAUST
      Model               = RU-TU160
      WeaponLaunchBone    = PRIMARY WEAPONA
      WeaponFireFXBone    = PRIMARY WEAPONA
      ParticleSysBone     = ENGINE01 JetBlackTrailThin
      ParticleSysBone     = ENGINE02 JetBlackTrailThin
      ParticleSysBone     = ENGINE03 JetBlackTrailThin
      ParticleSysBone     = ENGINE04 JetBlackTrailThin
      ParticleSysBone     = Wingtip01 JetContrailThin
      ParticleSysBone     = Wingtip02 JetContrailThin
    End

    ConditionState        = JETEXHAUST JETAFTERBURNER
      Model               = RU-TU160
      WeaponLaunchBone    = PRIMARY WEAPONA
      WeaponFireFXBone    = PRIMARY WEAPONA
      ParticleSysBone     = ENGINE01 JetLenzflare
      ParticleSysBone     = ENGINE02 JetLenzflare
      ParticleSysBone     = ENGINE03 JetLenzflare
      ParticleSysBone     = ENGINE04 JetLenzflare
      ParticleSysBone     = Wingtip01 JetContrailThin
      ParticleSysBone     = Wingtip02 JetContrailThin
    End

    ConditionState        = REALLYDAMAGED
      Model               = RU-TU160_D
      WeaponLaunchBone    = PRIMARY WEAPONA
      WeaponFireFXBone    = PRIMARY WEAPONA
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = ENGINE01 JetBlackTrailThin
      ParticleSysBone     = ENGINE02 JetBlackTrailThin
      ParticleSysBone     = Wingtip01 JetContrailThin
      ParticleSysBone     = Wingtip02 JetContrailThin
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST
      Model               = RU-TU160_D
      WeaponLaunchBone    = PRIMARY WEAPONA
      WeaponFireFXBone    = PRIMARY WEAPONA
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = ENGINE01 JetBlackTrailThin
      ParticleSysBone     = ENGINE02 JetBlackTrailThin
      ParticleSysBone     = Wingtip01 JetContrailThin
      ParticleSysBone     = Wingtip02 JetContrailThin
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
      Model               = RU-TU160_D
      WeaponLaunchBone    = PRIMARY WEAPONA
      WeaponFireFXBone    = PRIMARY WEAPONA
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = ENGINE01 JetLenzflare
      ParticleSysBone     = ENGINE02 JetLenzflare
      ParticleSysBone     = Wingtip01 JetContrailThin
      ParticleSysBone     = Wingtip02 JetContrailThin
    End

    ConditionState        = RUBBLE
      Model               = RU-TU160_D
    End

    ConditionState        = RUBBLE JETEXHAUST JETAFTERBURNER
      Model               = RU-TU160_D
      ParticleSysBone     = Wingtip01 JetContrailThin
      ParticleSysBone     = Wingtip02 JetContrailThin
    End

  End

  ; *** DESIGN parameters — heavy bomber (B-52H architecture) ***
  DisplayName             = OBJECT:RussiaJetTU160
  EditorSorting           = VEHICLE
  Side                    = Russia
  TransportSlotCount      = 0
  VisionRange             = 660.0
  ShroudClearingRange     = 225
  Prerequisites
  End
  MaxSimultaneousOfType   = 2

  BuildCost               = 8500
  BuildTime               = 115.0
  WeaponSet
    Conditions = None
    Weapon              = PRIMARY    Russia_Weapon_TU160_KH55
    PreferredAgainst    = PRIMARY    VEHICLE STRUCTURE
  End
  ArmorSet
    Conditions      = None
    Armor           = AirplaneArmor
    DamageFX        = None
  End
  ArmorSet
    Conditions            = PLAYER_UPGRADE
    Armor                 = CountermeasuresAirplaneArmor
    DamageFX              = None
  End

  ExperienceValue         = 50 50 100 150
  ExperienceRequired      = 0 100 200 400
  IsTrainable             = Yes
  CrusherLevel            = 1
  CrushableLevel          = 2
  CommandSet              = GenericTacticalBomberCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = AuroraBomberVoiceSelect
  VoiceMove = AuroraBomberVoiceMove
  VoiceGuard = AuroraBomberVoiceMove
  VoiceAttack = AuroraBomberVoiceAttack
  SoundAmbient = B52AmbientLoop
  SoundAmbientRubble    = NoSound
  UnitSpecificSounds
    VoiceCreate          = AuroraBomberVoiceCreate
    SoundEject           = Spec_RUS_Eject
    VoiceEject           = Spec_RUS_Eject
    Afterburner          = RaptorAfterburner
    VoiceLowFuel         = AuroraBomberVoiceLowFuel
    VoiceGarrison        = AuroraBomberVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
  Body                   = ActiveBody ModuleTag_02
    MaxHealth            = 800.0
    InitialHealth        = 800.0
  End

  Behavior                          = JetSlowDeathBehavior ModuleTag_03
    FXOnGroundDeath                 = FX_JetOnGroundDeath
    OCLOnGroundDeath                = OCL_AuroraDeathFinalBlowUp
    DestructionDelay                = 99999999
    RollRate                        = 0.2
    RollRateDelta                   = 100%
    PitchRate                       = 0.0
    FallHowFast                     = 110.0%
    FXInitialDeath                  = FX_AuroraDeathInitial
    DelaySecondaryFromInitialDeath  = 500
    FXSecondary                     = FX_JetDeathSecondary
    FXHitGround                     = FX_JetDeathHitGround
    DelayFinalBlowUpFromHitGround   = 200
    FXFinalBlowUp                   = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp                  = OCL_AuroraDeathFinalBlowUp
  End
  Behavior = EjectPilotDie ModuleTag_04
    GroundCreationList = OCL_EjectPilotOnGround
    AirCreationList = OCL_EjectPilotViaParachute
    ExemptStatus = HIJACKED
    VeterancyLevels =  ALL -REGULAR
  End
  Behavior = CreateObjectDie ModuleTag_Deletion
    DeathTypes   = NONE +EXTRA_6
    CreationList = None
  End
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 500.0
  End

  ; Heavy-bomber airfield JetAI (from AmericaJetB52H HeavyRunway)
  Behavior = JetAIUpdate ModuleTag_07
    OutOfAmmoDamagePerSecond  = 10%
    TakeoffDistForMaxLift     = 25%
    TakeoffPause              = 900
    MinHeight                 = 5
    ParkingOffset             = 12
    ReturnToBaseIdleTime      = 10000
    NeedsRunway               = Yes
  End
  Locomotor = SET_NORMAL      D30-F6_JetLocomotor
  Locomotor = SET_TAXIING     BasicJetTaxiLocomotor

  Behavior                = ArmorUpgrade ModuleTag_Armor01
    TriggeredBy           = Upgrade_AmericaCountermeasures
  End

  Behavior                = CountermeasuresBehavior ModuleTag_10
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = RussiaSystemCountermeasureFlare
    FlareBoneBaseName     = Flare
    VolleySize            = 3
    VolleyArcAngle        = 90.0
    VolleyVelocityFactor  = 1.0
    DelayBetweenVolleys   = 600
    NumberOfVolleys       = 6
    ReloadTime            = 0
    EvasionRate           = 30%
    ReactionLaunchLatency = 0
    MissileDecoyDelay     = 200
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Behavior                 = TransitionDamageFX ModuleTag_22
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  ; Gameplay geometry only (visual W3D unscaled) — heavy bomber airfield fit
  Geometry                 = Box
  GeometryIsSmall          = No
  GeometryMajorRadius      = 45.0
  GeometryMinorRadius      = 15.0
  GeometryHeight           = 18.0
  Shadow                   = SHADOW_VOLUME
  ShadowSizeX              = 89

End
