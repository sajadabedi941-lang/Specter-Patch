;==============================================================================
; Russia_T50_R27_Projectile
;
; Complete UNIQUE clone of TEOD Object R27 (Data\INI\Object\WeaponObjects.ini).
; Used only by Russia_Weapon_T50_PAKFA / RussiaJetT50PAKFAClean.
;
; DO NOT define Object R27 here.
; FireWeaponUpdate control weapons/OCLs use unique T50 names to avoid TEOD dupes.
; Geometry kept inside the Object End (TEOD source had a stray early End).
;==============================================================================

Object Russia_T50_R27_Projectile
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = R-27
      ; TEOD used MediumAA_MissileTrail_Bright (EXContrail5); Specter pack uses
      ; proven packed trail particle (iw_cloud01) — same role, no missing texture.
      ParticleSysBone = NONE GenericMediumMissileExhaust
    End
  End

  Draw = W3DModelDraw ModuleTag_Exhaust01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = SMF
      Animation       = SMF.SMF
      AnimationMode   = LOOP
    End
    ConditionState = JAMMED
      ParticleSysBone = NONE SparksMedium
    End
  End

  ; *** DESIGN parameters ***
  EditorSorting     = SYSTEM
  VisionRange = 0.0

  ArmorSet
    Conditions      = NONE
    Armor           = ProjectileArmor
    DamageFX        = NONE
  End

  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD PROJECTILE SMALL_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 120.0
    InitialHealth   = 120.0
    SubdualDamageCap = 200
    SubdualDamageHealRate = 100000
    SubdualDamageHealAmount = 50
  End

; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    FX         = FX_GenericMissileDeath
  End
; ---- end Projectile death behaviors

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 10
  End
  Behavior = MissileAIUpdate ModuleTag_08
    TryToFollowTarget     = Yes
    FuelLifetime          = 3000
    InitialVelocity       = 75
    IgnitionDelay         = 30
    IgnitionFX            = FX_JetMissileIgnition
  End
  Locomotor = SET_NORMAL RaptorJetMissileLocomotor

  Behavior = FireWeaponUpdate ModuleTag_09
    Weapon               = Russia_T50_JetMissileControl
    InitialDelay         = 100
  End
  Behavior = FireWeaponUpdate ModuleTag_09b
    Weapon               = Russia_T50_JetMissileControlForcer
    InitialDelay         = 0
  End

  ClientUpdate = AnimatedParticleSysBoneClientUpdate ModuleTag_10

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
  Scale = 1.05
End
