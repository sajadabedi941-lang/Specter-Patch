;==============================================================================
; Russia_TU160_KH55MS_Projectile
;
; Complete UNIQUE clone of TEOD Object KH55MS
; (!TEOD_INI.big / Data\INI\Object\WeaponObjects.ini)
; Used only by Russia_Weapon_TU160_KH55 / RussiaJetTU160Clean.
;
; DO NOT define Object KH55MS here.
; Detonation weapon + locomotor use unique TU160 names (no TEOD name collision).
; OCL_KAB500WatercheckObject omitted (depends on missing TEOD watercheck objects);
; InstantDeathBehavior keeps the detonation Weapon only.
; Trail uses packed GenericMediumMissileExhaust (MediumAA trail texture not packed).
;==============================================================================

Object Russia_TU160_KH55MS_Projectile
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = KH-55MS
      ParticleSysBone = NONE GenericMediumMissileExhaust
    End
  End

  Draw = W3DModelDraw ModuleTag_Exhaust01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = SMF
      Animation       = SMF.SMF
      AnimationMode   = LOOP
    End
    ConditionState = JAMMED
      ParticleSysBone = NONE SparksMedium
    End
  End

  ; *** DESIGN parameters ***
  EditorSorting     = SYSTEM
  VisionRange = 0.0

  ArmorSet
    Conditions      = NONE
    Armor           = ProjectileArmor
    DamageFX        = NONE
  End

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE BALLISTIC_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 9999.0
    InitialHealth   = 9999.0
    SubdualDamageCap = 200
    SubdualDamageHealRate = 100000
    SubdualDamageHealAmount = 50
  End

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 1
  End
  Behavior = MissileAIUpdate ModuleTag_08
    TryToFollowTarget     = No
    FuelLifetime          = 9000
    InitialVelocity       = 90
    IgnitionDelay         = 30
    IgnitionFX            = FX_JetMissileIgnition
    DistanceToTravelBeforeTurning = 250
  End
  Locomotor = SET_NORMAL Russia_TU160_KH55MissileLocomotor

  Behavior = HeightDieUpdate ModuleTag_09
    TargetHeight = 1.0
    TargetHeightIncludesStructures = Yes
  End

  Behavior = InstantDeathBehavior DeathModuleTag_10
    DeathTypes = ALL
    Weapon     = Russia_TU160_KH55_Detonation
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
  Scale = 1.1
End
