;------------------------------------------------------------------------------
;RS28
Object RussiaRS28NuclearMissileSilo
Scale = 0.9

  ; *** ART Parameters ***
  SelectPortrait         = rus_rs28
  ButtonImage            = rus_rs28



  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = No
    ConditionState       = NONE
      Model              = RUS_RS28
    End
    ConditionState       = DOOR_1_OPENING
      Model              = RUS_RS28_A1
      Animation          = RUS_RS28_A1.RUS_RS28_A1
      Flags              = MAINTAIN_FRAME_ACROSS_STATES
      AnimationMode      = ONCE
    End
    ConditionState       = DOOR_1_WAITING_OPEN
      Model              = RUS_RS28_A1
      Animation          = RUS_RS28_A1.RUS_RS28_A1
      Flags              = START_FRAME_LAST PRISTINE_BONE_POS_IN_FINAL_FRAME
      AnimationMode      = MANUAL
      ParticleSysBone    = SMOKE1 SteamLarge
      WeaponLaunchBone   = PRIMARY  RS28
      WeaponFireFXBone   = PRIMARY  FIREMS
    End
    ConditionState       = DOOR_1_WAITING_TO_CLOSE
      Model              = RUS_RS28_A1
      Animation          = RUS_RS28_A1.RUS_RS28_A1
      Flags              = START_FRAME_LAST
      AnimationMode      = MANUAL
      WeaponLaunchBone   = PRIMARY  RS28
      WeaponFireFXBone   = PRIMARY  FIREMS
    End
    ConditionState       = DOOR_1_CLOSING
      Model              = RUS_RS28_A1
      Animation          = RUS_RS28_A1.RUS_RS28_A1
      Flags              = MAINTAIN_FRAME_ACROSS_STATES
      AnimationMode      = ONCE_BACKWARDS
      WeaponLaunchBone   = PRIMARY  RS28
      WeaponFireFXBone   = PRIMARY  FIREMS
    End
    AliasConditionState  = SOLD 
    AliasConditionState  = SOLD DAMAGED
    AliasConditionState  = SOLD REALLYDAMAGED
    AliasConditionState  = SOLD NIGHT
    AliasConditionState  = SOLD NIGHT DAMAGED
    AliasConditionState  = SOLD NIGHT REALLYDAMAGED
    AliasConditionState  = SOLD SNOW
    AliasConditionState  = SOLD SNOW DAMAGED
    AliasConditionState  = SOLD SNOW REALLYDAMAGED
    AliasConditionState  = SOLD NIGHT SNOW
    AliasConditionState  = SOLD NIGHT SNOW DAMAGED
    AliasConditionState  = SOLD NIGHT SNOW REALLYDAMAGED
  End
  PlacementViewAngle = -135
  ; ------------ Comms Extending -----------------
  Draw                = W3DModelDraw ModuleTag_03
    ConditionState    = None
      Model           = RS_28_COMMS
      Animation       = RS_28_COMMS.RS_28_COMMS
      AnimationMode   = LOOP
    End
    AliasConditionState = NIGHT
    AliasConditionState = SNOW
    AliasConditionState = NIGHT SNOW
    
    ConditionState    = DAMAGED
      Model           = RS_28_COMMS
      Animation       = RS_28_COMMS.RS_28_COMMS
      AnimationMode   = LOOP
    End
    AliasConditionState = NIGHT DAMAGED
    AliasConditionState = SNOW DAMAGED
    AliasConditionState = NIGHT SNOW DAMAGED
    
    ConditionState    = REALLYDAMAGED RUBBLE
      Model           = RS_28_COMMS
      Animation       = RS_28_COMMS.RS_28_COMMS
      AnimationMode   = LOOP
    End
  End
  PlacementViewAngle  = -135

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:RS28
  Side = Russia
  EditorSorting    = STRUCTURE
  ;WeaponSet
    ;Conditions        = None 
    ;Weapon            = PRIMARY RS28_Sarmat
    ;AutoChooseSources = PRIMARY NONE
  ;End
  Prerequisites
    Object = RussiaIndustrialComplex
    Science = SCIENCE_Rank8
  End
  BuildCost        = 3000
  BuildTime        = 60           ; in seconds
  EnergyProduction    = -6
  CommandSet          = RussiaRS28CommandSet
  VisionRange         = 200.0           ; Shroud clearing distance
  ShroudClearingRange = 140
  ShroudRevealToAllRange = 60  ; Reveals shroud to all players at a specific amount which can be different. 
                               ; Using same value? Then use KINDOF_REVEAL_TO_ALL instead!
  ArmorSet
    Conditions      = None
    Armor           = StructureArmorTough
    DamageFX        = StructureDamageFXNoShake
  End
  ExperienceValue     = 400 400 400 400  ; Experience point value at each level
  MaxSimultaneousOfType = DeterminedBySuperweaponRestriction ; Normally unlimited, but can be selected by players in multiplayer games
  MaxSimultaneousLinkKey = Superweapon  ; Count all superweapons **AND THE GLA SCUD STORM REBUILD HOLE** as one "type" for MaxSimultaneousOfType

  ; *** AUDIO Parameters ***
  VoiceSelect = NuclearMissileSelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End
  UnitSpecificSounds
  ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    TurretMoveStart = NoSound
    TurretMoveLoop = NoSound ;These aren't playing properly, will revisit (mp) TurretMoveLoopLoud
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority       = STRUCTURE
   KindOf = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE CAPTURABLE FS_TECHNOLOGY POWERED MP_COUNT_FOR_VICTORY FS_SUPERWEAPON
  Body                = StructureBody ModuleTag_1330
    MaxHealth       = 4000.0
    InitialHealth   = 4000.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 4200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
  Behavior = BaseRegenerateUpdate ModuleTag_07c23
    ;No data
  End
  Behavior = AIUpdateInterface ModuleTag_09d2
  End

  Behavior    = OCLSpecialPower ModuleTag_08b6
    SpecialPowerTemplate = RussiaSpecialPowerRS28
    OCL                  = SUPERWEAPON_Russia_RS28
  End

  Behavior = SpecialPowerCreate ModuleTag_09sd
    ;nothing
  End
  Behavior = MissileLauncherBuildingUpdate ModuleTag_1c40
    SpecialPowerTemplate = RussiaSpecialPowerRS28
    DoorOpenTime         = 6000
    DoorWaitOpenTime     = 2000
    DoorCloseTime        = 8000

    ; FXLists to play at transitions
    DoorOpeningFX        = ChinaNuclearMissileLauncherDoorOpen
    DoorWaitingToCloseFX = ChinaNuclearMissileLauncherLaunch

    ; looping sound to play while open
    DoorOpenIdleAudio = BuildingNeutronMissileHiss
  End
  Behavior = SpecialPowerCreate ModuleTag_16ac52
    ;nothing
  End

  Behavior = OCLSpecialPower ModuleTag_095v9
    SpecialPowerTemplate = RussiaSpecialPowerRS28
    OCL                  = SUPERWEAPON_Russia_RS28
  End
  Behavior = SpecialPowerCreate ModuleTag_121c1
    ;nothing
  End
  Behavior = ProductionUpdate ModuleTag_2sw10
    DisabledTypesToProcess = DISABLED_HELD DISABLED_UNDERPOWERED
  End
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_1c52
    DeathWeapon = ChinaPowerPlantDeathWeapon
    StartsActive  = Yes
  End

  Behavior             = CreateObjectDie ModuleTag_108
    CreationList  = OCL_SmallStructureDebris
  End
  Behavior             = FXListDie ModuleTag_109
    DeathFX       = FX_StructureMediumDeath
  End
  Behavior = FlammableUpdate ModuleTag_121
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Behavior = DestroyDie ModuleTag_017
    ;nothing
  End

  Behavior = TransitionDamageFX ModuleTag_12c42
    ;-------------DESIGNED FOR MEDIUM SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End
  Behavior = GrantUpgradeCreate ModuleTag_ICBMBK
    UpgradeToGrant = Upgrade_ICBM_BoosterKiller
  End
  Behavior                  = ObjectCreationUpgrade ModuleTag_MMT
    UpgradeObject           = OCL_RUBTD
    TriggeredBy             = Upgrade_ICBM_BoosterKiller
  End
  
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_KillMarker
    DeathWeapon  = GenericTargetMarkerKiller
    StartsActive = Yes
  End
  Behavior          = FireWeaponWhenDeadBehavior ModuleTag_KillMarker2
    DeathWeapon     = GenericTargetMarkerKiller
    StartsActive    = Yes
    RequiredStatus  = SOLD
  End

  Geometry            = BOX
  GeometryMajorRadius = 21.0
  GeometryMinorRadius = 27.0
  GeometryHeight      = 15.0
  GeometryIsSmall     = No
  Shadow          = SHADOW_VOLUME
  BuildCompletion = PLACED_BY_PLAYER


End