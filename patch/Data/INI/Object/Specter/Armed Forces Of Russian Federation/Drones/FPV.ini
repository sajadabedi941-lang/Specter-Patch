Object RussiaDroneFPV
  ; *** ART Parameters ***
  SelectPortrait         = rus_fpv
  ButtonImage            = rus_fpv
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = RUS_FPV
      Animation = RUS_FPV.RUS_FPV
      AnimationMode = LOOP
    End
    ConditionState = REALLYDAMAGED
      Model = RUS_FPV
      Animation = RUS_FPV.RUS_FPV
      AnimationMode = LOOP
    End
  End
  ; ***DESIGN parameters ***
  DisplayName        = OBJECT:FPV
  EditorSorting      = VEHICLE
  TransportSlotCount = 0
  Side               = Russia
  VisionRange         = 500
  ShroudClearingRange = 230
  WeaponSet
    Conditions = None
    Weapon     = PRIMARY    RussianFPVDeathweapon
  End
  ArmorSet
    Conditions = None
    Armor      = ManualControlledMissileArmor_N
    DamageFX   = None
  End
  CrusherLevel            = 1  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel          = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet              = GenericSuicideDroneCommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect = SentryDroneVoiceSelect
  VoiceMove = SentryDroneVoiceMove
  VoiceGuard = SentryDroneVoiceMove
  VoiceAttack = SentryDroneVoiceMove
  SoundAmbient          = GenericUAVAmbientLoop
  UnitSpecificSounds
    VoiceCreate = SentryDroneVoiceSelect
    TurretMoveStart = NoSound
    TurretMoveLoop = NoSound
    VoiceEnter = NoSound
    Deploy = NoSound
    Undeploy = NoSound
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority   = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS VEHICLE SELECTABLE CAN_ATTACK DRONE NO_SELECT SMALL_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 150.0
    InitialHealth   = 150.0
    SubdualDamageCap = 1480
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = DeletionUpdate ModuleTag_04
    MinLifetime = 20000
    MaxLifetime = 40000
  End
  Behavior = AIUpdateInterface ModuleTag_061
    AutoAcquireEnemiesWhenIdle = No
  End
  Behavior = InstantDeathBehavior ModuleTag_1214
     DeathTypes = NONE +SUICIDED
  End
  Behavior = FireOCLAfterWeaponCooldownUpdate ModuleTag_Selfdestruct
    WeaponSlot = PRIMARY
    OCL = OCL_Ababil200Explosive
    MinShotsToCreateOCL = 1
  End
  Behavior = StealthUpdate ModuleTag_Stealth
    StealthDelay                          = 800 ; msec
    StealthForbiddenConditions            = FIRING_PRIMARY
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
  Behavior = PhysicsBehavior ModuleTag_0jj5
    Mass = 10.0
    KillWhenRestingOnGround = Yes
    AllowBouncing = No
  End
  Locomotor = SET_NORMAL FPVDroneLocomotor
  Behavior = FlammableUpdate ModuleTag_211
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Behavior = DestroyDie ModuleTag_08
    DeathTypes = ALL
  End
  Behavior                 = CreateObjectDie  ModuleTag_09
    DeathTypes = ALL
    CreationList      = OCL_AmericaBattleDroneExplode
  End
  Behavior                 = TransitionDamageFX ModuleTag_10
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleDroneDamageTransitionSmall
  End
  Behavior                 = FXListDie ModuleTag_11
    DeathTypes             = ALL
    DeathFX                = FX_AmericaBattleDroneExplode
  End
  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 20.0
  GeometryMinorRadius      = 11.0
  GeometryHeight           = 6.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45
End
