Object RussiaDroneLancet3

  ; *** ART Parameters ***
  SelectPortrait = rus_lancet3
  ButtonImage = rus_lancet3
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model               = RUS_Lancet3
      Animation           = RUS_Lancet3.RUS_Lancet3
      AnimationMode       = LOOP
      Turret              = Turret
      TurretPitch         = barrleend
      WeaponFireFXBone    = PRIMARY TURRETMS01
      WeaponFireFXBone    = SECONDARY TURRETMS01
    End
  End
  ; ***DESIGN parameters ***
  DisplayName        = OBJECT:Lancet3
  EditorSorting      = VEHICLE
  TransportSlotCount = 0
  Side               = Russia
  VisionRange         = 500
  ShroudClearingRange = 230
  WeaponSet
    Conditions = None
    Weapon     = PRIMARY    Lancet3Deathweapon
  End
  ArmorSet
    Conditions = None
    Armor      = ManualControlledMissileArmor_N
    DamageFX   = None
  End
  Prerequisites
    Object  = RussiaIndustrialComplex
    Science = SCIENCE_Rank3
  End
  BuildCost               = 1500
  BuildTime               = 10.0 
  ExperienceValue         = 50 50 100 150  ;Experience point value at each level
  ExperienceRequired      = 0 100 200 400   ;Experience points needed to gain each level
  IsTrainable             = Yes             ;Can gain experience
  CrusherLevel            = 1  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel          = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet              = GenericSuicideDroneCommandSet


  ; *** AUDIO Parameters ***
  VoiceSelect = SentryDroneVoiceSelect
  VoiceMove = SentryDroneVoiceMove
  VoiceGuard = SentryDroneVoiceMove
  VoiceAttack = SentryDroneVoiceMove
  UnitSpecificSounds
    VoiceCreate = SentryDroneVoiceSelect
    TurretMoveStart = NoSound
    TurretMoveLoop = NoSound
    VoiceEnter = NoSound
    Deploy = NoSound
    Undeploy = NoSound
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority   = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS PRODUCED_AT_HELIPAD VEHICLE SELECTABLE CAN_ATTACK DRONE SMALL_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 320.0
    InitialHealth   = 320.0
    SubdualDamageCap = 480
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = DeletionUpdate ModuleTag_04
    MinLifetime = 50000
    MaxLifetime = 70000
  End
  Behavior = AIUpdateInterface ModuleTag_061
    AutoAcquireEnemiesWhenIdle = No
  End
  Behavior = InstantDeathBehavior ModuleTag_1214
     DeathTypes = NONE +SUICIDED
  End
  Behavior = FireOCLAfterWeaponCooldownUpdate ModuleTag_Selfdestruct
    WeaponSlot = PRIMARY
    OCL = OCL_Ababil200Explosive
    MinShotsToCreateOCL = 1
  End
  Behavior                = ArmorUpgrade ModuleTag_Armor01
    TriggeredBy           = Upgrade_AmericaCountermeasures
  End
  Behavior                = CountermeasuresBehavior ModuleTag_Chaff
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureCHAFF
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 2     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = 80.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 5.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 200  ; Time between flare volleys
    NumberOfVolleys       = 3     ; Number of times the volleys will fire before reloading
    ReloadTime            = 2000  ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 45%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 0     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 50   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End
  Behavior = StealthUpdate ModuleTag_Stealth
    StealthDelay                          = 800 ; msec
    StealthForbiddenConditions            = FIRING_PRIMARY
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
  Behavior = PhysicsBehavior ModuleTag_0jj5
    Mass = 20.0
  End
  Locomotor = SET_NORMAL Ababil200Locomotor
  Behavior = FlammableUpdate ModuleTag_211
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Behavior                 = TransitionDamageFX ModuleTag_2d22
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End
  Behavior = ProductionUpdate ModuleTag_2f43
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
;---------- Radar Signature --------------- ;
  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE +HAZARD_CLEANUP
  End
;---------- End Of Radar Signature ----------;
  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 20.0
  GeometryMinorRadius      = 11.0
  GeometryHeight           = 6.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45
End
; ------------------------------------------------------------------------------
Object Lancet3WeaponObject
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_001
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model               = RUS_Lancet3
      Animation           = RUS_Lancet3.RUS_Lancet3
      AnimationMode       = LOOP
    End
  End
  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:HEwarhead
  EditorSorting     = SYSTEM
  VisionRange       = 0.0
  ShroudClearingRange = 220
  ArmorSet
    Conditions      = None
    Armor           = SmartBombsArmor
    DamageFX        = None
  End
  ; *** AUDIO parameters ***
  SoundAmbient = JdamFalling
  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD CAN_CAST_REFLECTIONS SMALL_MISSILE PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End
; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = NONE +DETONATED +EXPLODED
  End
  Behavior = InstantDeathBehavior DeathModuleTag_04
    DeathTypes = NONE +LASERED
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
; ---- end Projectile death behaviors
  Behavior = PhysicsBehavior ModuleTag_05
    Mass                = 1
  End
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_Pentrator
    DeathWeapon   = Lancet3Penetrator
    StartsActive  = Yes
  End
  Behavior = MissileAIUpdate ModuleTag_06
    TryToFollowTarget = Yes
    FuelLifetime      = 9000
    DetonateCallsKill = Yes
    IgnitionDelay     = 0
    InitialVelocity   = 0
    KillSelfDelay     = 900
    DistanceToTravelBeforeTurning = 25
    DistanceToTargetBeforeDiving = 600
  End
  Locomotor = SET_NORMAL GenericSuicideDroneBomb
  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 20.0
  GeometryMinorRadius      = 11.0
  GeometryHeight           = 6.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45
End