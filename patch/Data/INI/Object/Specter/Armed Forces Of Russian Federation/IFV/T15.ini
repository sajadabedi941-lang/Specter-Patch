;------------------------------------------------------------------------------
Object RussianTankT15
Scale = 0.9

  ; *** ART Parameters ***
  SelectPortrait         = rus_t15
  ButtonImage            = rus_t15
  
  ;UpgradeCameo1 = Upgrade_RussiaUraniumShells
  ;UpgradeCameo2 = Upgrade_RussiaNuclearTanks
  ;UpgradeCameo3 = Upgrade_RussiaOverlordBattleBunker
  ;UpgradeCameo4 = Upgrade_RussiaOverlordGattlingCannon
  ;UpgradeCameo5 = Upgrade_RussiaOverlordPropagandaTower
  
  
  Draw = W3DTankDraw ModuleTag_01
    
    ExtraPublicBone = Laser 

    DefaultConditionState
      Model               = RUS_T15
      Turret              = Turret
      WeaponFireFXBone    = PRIMARY WeaponA01
      WeaponRecoilBone    = PRIMARY Barrel
      WeaponMuzzleFlash   = PRIMARY WeaponA01
      WeaponLaunchBone    = PRIMARY WeaponA01
      WeaponFireFXBone    = SECONDARY WeaponB
      WeaponMuzzleFlash   = SECONDARY WeaponB
      WeaponLaunchBone    = SECONDARY WeaponB
    End
    ConditionState       = REALLYDAMAGED
      Model              = RUS_T15D
    End
    ConditionState       = RUBBLE
      Model              = RUS_T15R
    End
    TrackMarks           = EXTnkTrack.tga
    TreadAnimationRate      = 2.0  ; amount of tread texture to move per second
    TreadDriveSpeedFraction = 0.3  ; fraction of locomotor speed below which treads stop moving.
    TreadPivotSpeedFraction = 0.6  ; fraction of locomotor speed below which we allow pivoting.
    OkToChangeModelColor = Yes
  End

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:T15
  Side                = Russia
  EditorSorting       = VEHICLE
  TransportSlotCount  = 3                 ;how many "slots" we take in a transport (0 == not transportable)
  WeaponSet
    Conditions        = None 
    Weapon            = PRIMARY     30mm_2A42M3_T15
    Weapon            = SECONDARY   9M133_Kornet_T15
    ;Weapon            = TERTIARY    TroopCrawlerAssault
  End
  ArmorSet
    Conditions        = None
    Armor             = T14_Armata_Armor
    DamageFX          = TankDamageFX
  End
  Prerequisites
    Object  = RussiaWarFactory
    Object  = RussiaIndustrialComplex
    Science = SCIENCE_Rank6
  End
  MaxSimultaneousOfType = 5
  BuildCost       = 1800
  BuildTime       = 13.0          ;in seconds    
  VisionRange     = 550
  ShroudClearingRange = 380
  Prerequisites
    Object = RussiaWarFactory
    Object = RussiaIndustrialComplex
    Science = SCIENCE_Rank7
  End

  ExperienceValue = 200 200 400 600   ;Experience point value at each level
  ExperienceRequired = 0 400 600 1200  ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet = GenericIFVcommandset

  ; *** AUDIO Parameters ***
  VoiceSelect = OverlordTankVoiceSelect
  SoundMoveStart = OverlordTankMoveStart
  SoundMoveStartDamaged = OverlordTankMoveStart
  VoiceMove = OverlordTankVoiceMove
  VoiceGuard = OverlordTankVoiceMove
  VoiceAttack = OverlordTankVoiceAttack

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate          = OverlordTankVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = OverlordTankTurretMoveLoop
    VoiceCrush = OverlordTankVoiceCrush
    VoiceEnter = OverlordTankVoiceMove
    VoiceUnload     = OverlordTankVoiceUnload
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS TRANSPORT SCORE VEHICLE DONT_AUTO_CRUSH_INFANTRY
  
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 1250
    InitialHealth   = 1250

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 2200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End

  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate       = 182
      ControlledWeaponSlots= PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate        = 1
  End
  Locomotor   = SET_NORMAL ChTZ_12N360_A85_3A
  Behavior = PhysicsBehavior ModuleTag_04
    Mass      = 400.0
  End
  Behavior = TransportContain ModuleTag_22
    Slots                 = 8
    ScatterNearbyOnExit   = Yes
    HealthRegen%PerSec    = 10
    ;InitialPayload        = PLA_V1_AK 8
    EnterSound            = GarrisonEnter
    ExitSound             = GarrisonExit
    DamagePercentToUnits  = 100%
    AllowInsideKindOf     = INFANTRY
    ExitDelay             = 250
    NumberOfExitPaths     = 3 ; Defaults to 1.  Set 0 to not use ExitStart/ExitEnd, set higher than 1 to use ExitStart01-nn/ExitEnd01-nn
    GoAggressiveOnExit    = Yes ; AI Will tell people to set their mood to Aggressive on exiting
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_Afghanit
    WeaponTemplate        = Afghanit_APS_T14
    PrimaryTargetTypes    = SMALL_MISSILE PROJECTILE
    ScanRate              = 880
    ScanRange             = 210
    PredictTargetVelocityFactor = 3.0
  End
  ;Behavior = PointDefenseLaserUpdate ModuleTag_AESA_RADAR_WAVE
    ;WeaponTemplate        = SMALL_AESA_RADAR_RADIO_WAVES
    ;PrimaryTargetTypes    = VEHICLE INFANTRY
    ;ScanRate              = 10000
    ;ScanRange             = 1200
    ;PredictTargetVelocityFactor = 3.0
  ;End

 ; Turret fly off death
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 50
    DestructionDelay  = 500
    DestructionDelayVariance  = 100
    FX  = INITIAL  FX_GenericTankDeathEffect
    OCL = MIDPOINT OCL_T15DeathEffect
    FX  = FINAL    FX_GenericFreeFallBombsExplosion
  End
  Behavior                 = TransitionDamageFX ModuleTag_12
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = DestroyDie ModuleTag_13
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  ; A crushing defeat
  Behavior = FXListDie ModuleTag_14
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = StealthDetectorUpdate ModuleTag_InfantryDetection
    DetectionRate             = 500
    DetectionRange            = 300
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
    ;ExtraRequiredKindOf       = INFANTRY VEHICLE
    ExtraForbiddenKindOf      = AIRCRAFT DRONE
  End

  Behavior = CreateObjectDie ModuleTag_15
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End

  Behavior                    = CreateCrateDie ModuleTag_CratesChange
   CrateData             = SalvageCrateData
   ;CrateData             = EliteTankCrateData
   ;CrateData             = HeroicTankCrateData
  End
  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Geometry               = BOX
  GeometryMajorRadius    = 25.0
  GeometryMinorRadius    = 20.0
  GeometryHeight         = 10.0     
  GeometryIsSmall        = Yes    
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End