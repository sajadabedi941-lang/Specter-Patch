Object RussiaSystemCountermeasureFlare
  Draw = W3DModelDraw ModuleTag_01dc3
    ParticlesAttachedToAnimatedBones = Yes
    DefaultConditionState
      Model = Spec_Flares
      ;Animation = Spec_Flares.Spec_Flares
      ;AnimationMode = LOOP ;ONCE_BACKWARDS
      ;Flags = START_FRAME_FIRST
