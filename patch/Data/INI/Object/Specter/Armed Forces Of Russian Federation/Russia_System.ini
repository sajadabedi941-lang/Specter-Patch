    MinLifetime = 2500   ; min lifetime in msec
    MaxLifetime = 2500   ; max lifetime in msec
  End
  ClientUpdate = AnimatedParticleSysBoneClientUpdate ModuleTag_Dancing
  End
  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 4.0
End
