  ArmorSet
    Conditions      = None
    Armor           = CruiseMissileArmor
    DamageFX        = None
  End
  
  ; *** AUDIO Parameters ***
  ;SoundMoveLoop = GenericMissileAmbientLoop
  SoundAmbient  = GenericMissileAmbientLoop

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PROJECTILE SMALL_MISSILE VEHICLE CAN_ATTACK
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 800.0
    InitialHealth   = 800.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    ; A projectile is not disabled, but instead loses target and scatters
    SubdualDamageCap = 200
    SubdualDamageHealRate = 100000
    SubdualDamageHealAmount = 50
  End

; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
    ; we detonated normally.
    ; no FX, just quiet destroy ourselves
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    ; shot down by laser.
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    ; shot down by nonlaser.
    FX         = FX_GenericMissileDeath
  End
; ---- end Projectile death behaviors

  
  Behavior = StealthUpdate ModuleTag_Stealth
    StealthDelay                = 2000 ; msec
    StealthForbiddenConditions  = FIRING_PRIMARY
    HintDetectableConditions    = IS_FIRING_WEAPON 
    FriendlyOpacityMin          = 50.0%
    FriendlyOpacityMax          = 100.0%
    InnateStealth               = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
; ---- end Projectile death behaviors
  Behavior = DumbProjectileBehavior ModuleTag_03
    MaxLifespan                     = 20000
    OrientToFlightPath              = Yes
    TumbleRandomly                  = No
    FirstHeight                     = -270
    SecondHeight                    = 80
    FirstPercentIndent              = 20% ;30% ;20 90 for inferno cannon
    SecondPercentIndent             = 90% ;70%
    DetonateCallsKill               = Yes
    FlightPathAdjustDistPerSecond   = 60
  End

  Behavior = PhysicsBehavior ModuleTag_05
    Mass                  = 500.0 ;75.0
    ShockResistance       = 0.8
    AerodynamicFriction   = 1.2  ; this is now friction-per-sec
    CenterOfMassOffset    = 2    ; Default of 0 means nothing tips as it falls.  Positive tips forward, negative tips back
    AllowBouncing = Yes
    AllowCollideForce = Yes
    KillWhenRestingOnGround = No ;Yes
  End
  Behavior = MissileAIUpdate ModuleTag_01ff8
    TryToFollowTarget     = Yes 
    FuelLifetime          = 999999
    InitialVelocity       = 40                ; in dist/sec
    IgnitionDelay         = 800
    ;IgnitionFX            = FX_TomahawkIgnition
    DistanceToTravelBeforeTurning = 200
    DistanceToTargetBeforeDiving = 150
  End
  Locomotor = SET_NORMAL KH32CruiseMissileLocomotor

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0

End
