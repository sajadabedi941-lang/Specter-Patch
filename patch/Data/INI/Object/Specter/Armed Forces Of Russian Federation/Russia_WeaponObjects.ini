    DelayBetweenVolleys   = 200  ; Time between flare volleys
    NumberOfVolleys       = 1     ; Number of times the volleys will fire before reloading
    ReloadTime            = 2000     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 65%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 0     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 40   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End
