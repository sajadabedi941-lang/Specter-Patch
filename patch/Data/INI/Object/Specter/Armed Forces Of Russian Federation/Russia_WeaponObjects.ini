Object Lancet3DeployingObject

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState = NONE
      Model = RUS_Lancet3
    End
  End

  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:Lancet3
  EditorSorting     = SYSTEM
  TransportSlotCount = 1
  ArmorSet
    Conditions      = None
    Armor           = BallisticMissileArmor
    DamageFX        = None
  End
  VisionRange = 150.0
  ShroudClearingRange = 100
  ExperienceValue = 10 10 10 10
  SoundAmbient  = GenericMissileAmbientLoop
  ; *** ENGINEERING Parameters ***
  RadarPriority = LOCAL_UNIT_ONLY
  KindOf = PRELOAD CAN_CAST_REFLECTIONS PROJECTILE BALLISTIC_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 200.0
    InitialHealth   = 200.0
    SubdualDamageCap = 400
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = DumbProjectileBehavior ModuleTag_03
    MaxLifespan                     = 20000
    OrientToFlightPath              = Yes
    FirstHeight                     = 150
    SecondHeight                    = 600
    FirstPercentIndent              = 20% ;30% ;20 90 for inferno cannon
    SecondPercentIndent             = 90% ;70%
    DetonateCallsKill               = Yes
    FlightPathAdjustDistPerSecond   = 60
  End
  Behavior = PhysicsBehavior ModuleTag_05
    Mass                  = 20.0 ;75.0
    ShockResistance       = 0.8
    AerodynamicFriction   = 0.2  ; this is now friction-per-sec
    CenterOfMassOffset    = 2    ; Default of 0 means nothing tips as it falls.  Positive tips forward, negative tips back
    AllowBouncing = Yes
    AllowCollideForce = Yes
    KillWhenRestingOnGround = No ;Yes
  End
  Behavior = CreateObjectDie ModuleTag_06
    CreationList = OCL_RussiaLancet3Deployer
  End
  Behavior = FXListDie ModuleTag_r307
    DeathFX = None
    OrientToObject = No
  End
; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = ALL -EXPLODED -LASERED
    ;FX = WeaponFX_GenericATGMDetonation
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +EXPLODED +LASERED ;ie shot down
    ;FX  = FX_GenericMissileDeath
    OCL = OCL_Quds5Launching
  End
; ---- end Projectile death behaviors
  Behavior = HeightDieUpdate ModuleTag_06f43
    TargetHeight = 1222.0
    TargetHeightIncludesStructures = No
    OnlyWhenMovingDown = Yes
    InitialDelay = 800
  End
  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0

End
