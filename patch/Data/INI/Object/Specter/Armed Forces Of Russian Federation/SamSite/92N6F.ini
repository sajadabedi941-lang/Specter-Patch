;------------------------------------------------------------
Object RussiaRadar92N6F
Scale = 0.8
  ; *** ART Parameters ***
  SelectPortrait         = rus_92n6r
  ButtonImage            = rus_92n6r
  Draw                   = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model              = RUS_92N6F_AI
      Turret             = Radarcommand
      WeaponLaunchBone   = PRIMARY   WEAPONA
    End
    ConditionState       = REALLYDAMAGED 
      Model              = RUS_92N6F_AI
      Turret             = Radarcommand
      WeaponLaunchBone   = PRIMARY   WEAPONA
    End
    AliasConditionState  = RUBBLE
    OkToChangeModelColor = Yes
  End
  ; --- Indicator
  Draw = W3DModelDraw ModuleTag_Indicator
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = Spec_Indic_Srch
    End
  End
  ; ***DESIGN parameters ***
  DisplayName           = OBJECT:92N6R
  Side                  = Russia
  EditorSorting         = STRUCTURE
  EnergyProduction      = -1
  ArmorSet
    Conditions      = None
    Armor           = AATruckArmor
    DamageFX        = TruckDamageFX
  End
  WeaponSet
    Conditions          = None 
    Weapon              = PRIMARY 92N6F_FCR
  End
  VisionRange         = 700.0
  ShroudClearingRange = 300
  CommandSet           = None
  ; *** ENGINEERING Parameters ***
  RadarPriority   = STRUCTURE
  KindOf          = PRELOAD STRUCTURE SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT IMMOBILE SCORE FS_TECHNOLOGY POWERED IMMUNE_TO_CAPTURE
  Body            = StructureBody ModuleTag_04
    MaxHealth     = 1000.0
    InitialHealth = 1000.0
    SubdualDamageCap = 1200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End 
  Behavior = AIUpdateInterface ModuleTag_0f43
    Turret
      TurretTurnRate        = 50   // turn rate, in degrees per sec
      ControlledWeaponSlots = PRIMARY
      MinIdleScanInterval   = 80    ; in milliseconds
      MaxIdleScanInterval   = 80    ; in milliseconds
      MinIdleScanAngle      = 0       ; in degrees off the natural turret angle
      MaxIdleScanAngle      = 360     ; in degrees off the natural turret angle
    End
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate        = 1
  End
  Behavior        = RebuildHoleExposeDie ModuleTag_08f234
    HoleName      = Russia92N6FDamaged
    HoleMaxHealth = 500.0
    DeathTypes    = ALL -TOPPLED
  End
  Behavior = GrantUpgradeCreate ModuleTag_0xd99
    UpgradeToGrant     = Upgrade_AmericaRadar
    ;ExemptStatus      = UNDER_CONSTRUCTION
  End
  Behavior             = RadarUpgrade ModuleTag_0d995
    TriggeredBy        = Upgrade_AmericaRadar
    DisableProof       = No
  End
  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_08
    DeathTypes = ALL -TOPPLED
    ProbabilityModifier = 50
    DestructionDelay = 2000
    DestructionDelayVariance = 300
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_RadarVanDeathEffect2
    FX  = FINAL    FX_ScudLauncherExplosionOneFinal
  End
  Behavior = SlowDeathBehavior ModuleTag_TOPPLED01
    DeathTypes = NONE +TOPPLED
  End
  Behavior = TransitionDamageFX ModuleTag_10c23
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = FlammableUpdate ModuleTag_12hb4
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
;-------------------- Fire Control Radar --------------------
  Behavior                    = FireWeaponUpdate ModuleTag_FCSSP
    Weapon                    = 92N6R_WaveEmitter
  End
  Behavior = StealthDetectorUpdate ModuleTag_StealthDetection_Radar_Missiles
    DetectionRate             = 600
    DetectionRange            = 680
    ExtraForbiddenKindOf      = INFANTRY
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
  End
;-------------------- End Of Fire Control System --------------------

  Geometry            = BOX
  GeometryMajorRadius = 42.0
  GeometryMinorRadius = 10.0
  GeometryHeight      = 20.0     
  GeometryIsSmall     = Yes
  Shadow              = SHADOW_VOLUME 
  ShadowSizeX         = 45
End
;------------------------------------------------------------------------------
