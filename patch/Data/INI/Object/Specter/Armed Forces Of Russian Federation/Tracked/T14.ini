;------------------------------------------------------------------------------
Object RussiaTankT14
Scale = 0.9
  ; *** ART Parameters ***
  SelectPortrait         = rus_t14
  ButtonImage            = rus_t14
  Draw = W3DOverlordTankDraw ModuleTag_01
    ExtraPublicBone = FIREPOINT01
    ExtraPublicBone = Laser
    DefaultConditionState
      Model               = RUS_T14
      Turret              = Turret
      WeaponFireFXBone    = PRIMARY turretms01
      WeaponRecoilBone    = PRIMARY Barrel
      WeaponMuzzleFlash   = PRIMARY turretms01
      WeaponLaunchBone    = PRIMARY turretms01
      WeaponFireFXBone    = SECONDARY TURRETMS02
      WeaponMuzzleFlash   = SECONDARY TURRETMS02
      WeaponLaunchBone    = SECONDARY TURRETMS02
      WeaponFireFXBone    = TERTIARY TURRETMS01
      WeaponLaunchBone    = TERTIARY TURRETMS01
    End
    ConditionState       = REALLYDAMAGED
      Model              = RUS_T14D
    End
    ConditionState       = RUBBLE
      Model              = RUS_T14D
    End
    
    TrackMarks           = EXTnkTrack.tga
    TreadAnimationRate      = 2.0  ; amount of tread texture to move per second
    TreadDriveSpeedFraction = 0.3  ; fraction of locomotor speed below which treads stop moving.
    TreadPivotSpeedFraction = 0.6  ; fraction of locomotor speed below which we allow pivoting.
    OkToChangeModelColor = Yes
  End

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:T14
  Side                = Russia
  EditorSorting       = VEHICLE
  TransportSlotCount  = 3                 ;how many "slots" we take in a transport (0 == not transportable)
  WeaponSet
    Conditions           = None 
    Weapon               = PRIMARY     125mm_2A82_1M
    Weapon               = SECONDARY   12_7mm_NSVT_HMG_RCCWS_Dummy
    Weapon               = TERTIARY    3UBK21_Sprinter
    PreferredAgainst     = SECONDARY   INFANTRY
    PreferredAgainst     = TERTIARY    STRUCTURE VEHICLE
  End
  ArmorSet
    Conditions        = None
    Armor             = T14_Armata_Armor
    DamageFX          = TankDamageFX
  End
  MaxSimultaneousOfType = 8
  BuildCost       = 2200
  BuildTime       = 17.0          ;in seconds    
  VisionRange     = 550
  ShroudClearingRange = 444
  Prerequisites
    Object = RussiaWarFactory
    Object = RussiaIndustrialComplex
    Science = SCIENCE_Rank8
  End

  ExperienceValue = 200 200 400 600   ;Experience point value at each level
  ExperienceRequired = 0 400 600 1200  ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet = AmericaTankCrusaderCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = Spec_RUS_T14_Select
  SoundMoveStart = OverlordTankMoveStart
  SoundMoveStartDamaged = OverlordTankMoveStart
  VoiceMove = Spec_RUS_T14_Move
  VoiceGuard = Spec_RUS_T14_Move
  VoiceAttack = Spec_RUS_T14_Attack
  UnitSpecificSounds
    VoiceCreate          = Spec_RUS_T14_Created
    TurretMoveStart = NoSound
    TurretMoveLoop = OverlordTankTurretMoveLoop
    VoiceCrush = OverlordTankVoiceCrush
    VoiceEnter = OverlordTankVoiceMove
    VoiceUnload     = OverlordTankVoiceUnload
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK DONT_AUTO_CRUSH_INFANTRY ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE
  
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 1450
    InitialHealth   = 1450

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 2200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End

  Behavior = TransportAIUpdate ModuleTag_03
    Turret
      TurretTurnRate       = 180 ;60   // turn rate, in degrees per sec
      ControlledWeaponSlots= PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate        = 1
  End
  Locomotor   = SET_NORMAL ChTZ_12N360_A85_3A
  Behavior = PhysicsBehavior ModuleTag_04
    Mass      = 500.0
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_Afghanit
    WeaponTemplate        = Afghanit_APS_T14
    PrimaryTargetTypes    = SMALL_MISSILE PROJECTILE
    ScanRate              = 880
    ScanRange             = 210
    PredictTargetVelocityFactor = 3.0
  End
  ;Behavior = PointDefenseLaserUpdate ModuleTag_AESA_RADAR_WAVE
    ;WeaponTemplate        = SMALL_AESA_RADAR_RADIO_WAVES
    ;PrimaryTargetTypes    = VEHICLE INFANTRY
    ;ScanRate              = 10000
    ;ScanRange             = 1200
    ;PredictTargetVelocityFactor = 3.0
  ;End
  Behavior = OverlordContain ModuleTag_RCWS
    Slots                   = 1
    DamagePercentToUnits    = 100%
    AllowInsideKindOf       = PORTABLE_STRUCTURE
    PassengersAllowedToFire = Yes
    PassengersInTurret      = Yes ; My passengers ride in my turret, that's where the Firepoint bones are
    ExperienceSinkForRider  = Yes ; I get the Exp for things my turret friend kills
    PayloadTemplateName     = Russia_RCWS
  End
 ; Turret fly off death
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 50
    DestructionDelay  = 5000
    DestructionDelayVariance  = 100
    FX  = INITIAL  FX_GenericTankAmmoCockoff
    OCL = MIDPOINT OCL_T14DeathEffect
    FX  = FINAL    FX_GenericFreeFallBombsExplosion
    ;OCL = FINAL    OCL_CrusaderTurret
  End

  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_11
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 50
    DestructionDelay  = 4900
    DestructionDelayVariance  = 300
    FX  = INITIAL  FX_GenericTankAmmoCockoff
    OCL = FINAL    OCL_T14DeathEffect
    FX  = FINAL    FX_UnguidedRocketExplosion
  End

  Behavior                 = TransitionDamageFX ModuleTag_12
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End

  Behavior = DestroyDie ModuleTag_13
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  ; A crushing defeat
  Behavior = FXListDie ModuleTag_14
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End

  Behavior = CreateObjectDie ModuleTag_15
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End

  Behavior                    = CreateCrateDie ModuleTag_CratesChange
   CrateData             = SalvageCrateData
   ;CrateData             = EliteTankCrateData
   ;CrateData             = HeroicTankCrateData
  End
  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Geometry               = BOX
  GeometryMajorRadius    = 25.0
  GeometryMinorRadius    = 20.0
  GeometryHeight         = 10.0     
  GeometryIsSmall        = Yes    
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End


;------------------------------------------------------------------------------
Object Russia_RCWS
  ; *** ART Parameters ***
  SelectPortrait            = SNGatTower_L
  ButtonImage               = SNGatTower
  Draw                      = W3DDependencyModelDraw ModuleTag_01
    OkToChangeModelColor    = Yes
    AttachToBoneInContainer = FIREPOINT01
    DefaultConditionState
      Model               = RUS_T14_CT
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY TURRETMS01
      WeaponMuzzleFlash   = PRIMARY TURRETMS01
      WeaponFireFXBone    = SECONDARY TURRETMS01
      WeaponMuzzleFlash   = SECONDARY TURRETMS01
    End
    ConditionState        = REALLYDAMAGED 
      Model               = RUS_T14_CTD
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY TURRETMS01
      WeaponMuzzleFlash   = PRIMARY TURRETMS01
      WeaponFireFXBone    = SECONDARY TURRETMS01
      WeaponMuzzleFlash   = SECONDARY TURRETMS01
    End
  End
  ; ***DESIGN parameters ***
  Side             = Russia
  EditorSorting    = SYSTEM
  TransportSlotCount = 1
  WeaponSet
    Conditions          = None 
    Weapon              = PRIMARY   12_7mm_NSVT_HMG_RCCWS
    Weapon              = SECONDARY 12_7mm_NSVT_HMG_RCCWS_Air
    PreferredAgainst    = SECONDARY BALLISTIC_MISSILE AIRCRAFT
  End
  ArmorSet
    Conditions     = None
    Armor          = InvulnerableAllArmor ; We can't be hurt on the field.  We share damage from the Overlord with his damage module
  End
  VisionRange     = 480
  ; *** AUDIO Parameters ***
  UnitSpecificSounds
    TurretMoveStart = NoSound
    TurretMoveLoop  = NoSound ;TurretMoveLoop
    VoiceRapidFire  = NoSound
  End
  ; *** ENGINEERING Parameters ***
  KindOf            = PRELOAD PORTABLE_STRUCTURE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CLICK_THROUGH IGNORED_IN_GUI
    Body            = StructureBody ModuleTag_02
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End
  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      ControlledWeaponSlots = PRIMARY SECONDARY
      TurretTurnRate      = 180   // turn rate, in degrees per sec
      TurretPitchRate     = 180
      AllowsPitch         = Yes
      FiresWhileTurning   = Yes
    End
    AutoAcquireEnemiesWhenIdle = Yes 
  End
  Behavior             = DestroyDie ModuleTag_04
    ;nothing
  End
  Behavior = StealthDetectorUpdate ModuleTag_InfantryDetection
    DetectionRate             = 500
    DetectionRange            = 300
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
    ;ExtraRequiredKindOf       = INFANTRY VEHICLE
    ExtraForbiddenKindOf      = AIRCRAFT DRONE
  End
  Geometry            = BOX
  GeometryMajorRadius = 8.0
  GeometryMinorRadius = 8.0
  GeometryHeight      = 9.0
  GeometryIsSmall     = No      
  Shadow              = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End