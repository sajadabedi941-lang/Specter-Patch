;------------------------------------------------------------------------------
Object RussiaTurretsT90Turret
  ; *** ART Parameters ***
  SelectPortrait            = SNGatTower_L
  ButtonImage               = SNGatTower
  Draw                      = W3DDependencyModelDraw ModuleTag_01
    OkToChangeModelColor    = Yes
    AttachToBoneInContainer = FIREPOINT01
    DefaultConditionState
      Model               = T90A_RCWS
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY WEAPONA01
      WeaponMuzzleFlash   = PRIMARY WEAPONA01
      WeaponFireFXBone    = SECONDARY WEAPONA01
      WeaponMuzzleFlash   = SECONDARY WEAPONA01
    End
    ConditionState        = REALLYDAMAGED 
      Model               = T90A_RCWS
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY WEAPONA01
      WeaponMuzzleFlash   = PRIMARY WEAPONA01
      WeaponFireFXBone    = SECONDARY WEAPONA01
      WeaponMuzzleFlash   = SECONDARY WEAPONA01
    End
  End
  ; ***DESIGN parameters ***
  Side             = Russia
  EditorSorting    = SYSTEM
  TransportSlotCount = 1
  WeaponSet
    Conditions          = None 
    Weapon              = PRIMARY   12_7mm_NSVT_HMG_RCCWS
    Weapon              = SECONDARY 12_7mm_NSVT_HMG_RCCWS_Air
    PreferredAgainst    = SECONDARY BALLISTIC_MISSILE AIRCRAFT
  End
  ArmorSet
    Conditions     = None
    Armor          = InvulnerableAllArmor ; We can't be hurt on the field.  We share damage from the Overlord with his damage module
  End
  VisionRange     = 480
  ; *** AUDIO Parameters ***
  UnitSpecificSounds
    TurretMoveStart = NoSound
    TurretMoveLoop  = NoSound ;TurretMoveLoop
    VoiceRapidFire  = NoSound
  End
  ; *** ENGINEERING Parameters ***
  KindOf            = PRELOAD PORTABLE_STRUCTURE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CLICK_THROUGH IGNORED_IN_GUI
    Body            = StructureBody ModuleTag_02
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End
  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      ControlledWeaponSlots = PRIMARY SECONDARY
      TurretTurnRate      = 180   // turn rate, in degrees per sec
      TurretPitchRate     = 180
      AllowsPitch         = Yes
      FiresWhileTurning   = Yes
    End
    AutoAcquireEnemiesWhenIdle = Yes 
  End
  Behavior             = DestroyDie ModuleTag_04
    ;nothing
  End
  Geometry            = BOX
  GeometryMajorRadius = 8.0
  GeometryMinorRadius = 8.0
  GeometryHeight      = 9.0
  GeometryIsSmall     = No      
  Shadow              = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End




;------------------------------------------------------------------------------
Object RussiaSightSosnaU
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model               = None
      Turret              = Turret
    End
  End
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:SosnaU
  Side                = Russia
  EditorSorting       = VEHICLE
  TransportSlotCount  = 0                 ;how many "slots" we take in a transport (0 == not transportable)
  WeaponSet
    Conditions        = None 
    Weapon            = PRIMARY SosnaUSightT90A
  End
  ArmorSet
    Conditions        = None
    Armor             = TankArmor
    DamageFX          = SmallTankDamageFX
  End
  VisionRange         = 650
  ShroudClearingRange = 300
  ExperienceValue     = 10 10 10 10 ;Experience point value at each level
  IsTrainable         = No
  ; *** AUDIO Parameters ***
  VoiceSelect         = NoSound
  VoiceMove           = NoSound
  VoiceAttack         = NoSound
  SoundMoveStart      = NoSound
  UnitSpecificSounds
  ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    TurretMoveStart   = NoSound
    TurretMoveLoop    = TurretMoveLoop
  End
  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD NO_SELECT NO_COLLIDE CAN_ATTACK VEHICLE SCORE IGNORED_IN_GUI INERT CLICK_THROUGH UNATTACKABLE NO_HEAL_ICON
  Body = ActiveBody ModuleTag_03
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End
  Behavior = AIUpdateInterface ModuleTag_04
    Turret
      TurretTurnRate        = 50
      ControlledWeaponSlots = PRIMARY
    End
    AutoAcquireEnemiesWhenIdle = Yes
  End
  Locomotor = SET_NORMAL GenericTankSightLocomotor
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 5.0
  End
  Behavior = SlavedUpdate ModuleTag_07
    GuardMaxRange           = 400
    GuardWanderRange        = 400
    AttackRange             = 1
    AttackWanderRange       = 1
    ScoutRange              = 500
    ScoutWanderRange        = 400
    StayOnSameLayerAsMaster = Yes
  End
  Behavior = DestroyDie ModuleTag_08
    DeathTypes = ALL
  End
  Behavior                 = TransitionDamageFX ModuleTag_10
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleDroneDamageTransitionSmall
  End
  Behavior                 = FXListDie ModuleTag_11
    DeathTypes = ALL
  End
  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Geometry = CYLINDER
  GeometryMajorRadius = 5
  GeometryMinorRadius = 5
  GeometryHeight = 10.0     
  GeometryIsSmall = Yes 
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89  ; minimum elevation angle above horizon. Used to limit shadow length
End
