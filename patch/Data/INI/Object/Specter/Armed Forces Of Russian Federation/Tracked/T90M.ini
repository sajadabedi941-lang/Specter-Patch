;------------------------------------------------------------------------------
Object RussiaTankT90M
  ; *** ART Parameters ***
  SelectPortrait         = rus_t90m
  ButtonImage            = rus_t90m
  ;UpgradeCameo1 = Upgrade_GLAScorpionRocket
  Draw = W3DOverlordTankDraw ModuleTag_01
    ExtraPublicBone = FIREPOINT01
    DefaultConditionState
      Model             = RUS_T90M
      Turret            = Turret
      WeaponFireFXBone  = PRIMARY TURRETMS01
      WeaponRecoilBone  = PRIMARY Barrel
      WeaponMuzzleFlash = PRIMARY TURRETMS01
      WeaponLaunchBone  = PRIMARY TURRETMS01
      WeaponFireFXBone  = SECONDARY WeaponB01
      WeaponLaunchBone  = SECONDARY WeaponB01
      WeaponFireFXBone  = TERTIARY WeaponB01
      WeaponRecoilBone  = TERTIARY Barrel
      WeaponMuzzleFlash = TERTIARY TURRETMS01
      WeaponLaunchBone  = TERTIARY TURRETMS01
      ;HideSubObject    = Shtora
    End
    ConditionState       = REALLYDAMAGED
      Model              = RUS_T90MD
      ;HideSubObject     = Shtora
    End
    ConditionState       = RUBBLE
      Model              = RUS_T90MD
      ;HideSubObject     = Shtora
    End
    TrackMarks           = EXTnkTrack.tga
    TreadAnimationRate      = 2.0  ; amount of tread texture to move per second
    TreadDriveSpeedFraction = 0.3  ; fraction of locomotor speed below which treads stop moving.
    TreadPivotSpeedFraction = 0.6  ; fraction of locomotor speed below which we allow pivoting.
    OkToChangeModelColor = Yes
  End
  ; ***DESIGN parameters ***
  DisplayName           = OBJECT:T90M
  Side                  = Russia
  ;BuildVariations       = RussiaTankT90M RussiaTankT90SM RussiaTankT90SM1
  EditorSorting         = VEHICLE
  TransportSlotCount    = 3                 ;how many "slots" we take in a transport (0 == not transportable)
   WeaponSet
    Conditions = None 
    Weapon = PRIMARY 125mm_2A46M_T90M
    Weapon = SECONDARY 7_62mm_PKT_Coaxial
    ;Weapon = TERTIARY 9M118M_Refleks
    PreferredAgainst    = SECONDARY   INFANTRY
    AutoChooseSources   = SECONDARY    FROM_PLAYER FROM_SCRIPT FROM_AI
    PreferredAgainst    = TERTIARY    VEHICLE STRUCTURE
  End
  ArmorSet
    Conditions      = None
    Armor           = T90A_Obr2006_Armor
    DamageFX        = TankDamageFX
  End
  BuildCost       = 1200
  BuildTime       = 16.0          ;in seconds    
  VisionRange     = 530
  ShroudClearingRange = 432
  ExperienceValue = 60 60 120 200    ;Experience point value at each level
  ExperienceRequired = 0 100 200 400  ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet      = GenericTankCommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect = OverlordTankVoiceSelect
  SoundMoveStart = OverlordTankMoveStart
  SoundMoveStartDamaged = OverlordTankMoveStart
  VoiceMove = OverlordTankVoiceMove
  VoiceGuard = OverlordTankVoiceMove
  VoiceAttack = OverlordTankVoiceAttack

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate          = OverlordTankVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = OverlordTankTurretMoveLoop
    VoiceCrush = OverlordTankVoiceCrush
    VoiceEnter = OverlordTankVoiceMove
    VoiceUnload     = OverlordTankVoiceUnload
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE DONT_AUTO_CRUSH_INFANTRY
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 1350.0
    InitialHealth   = 1350.0
    SubdualDamageCap = 740
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate = 165
      ControlledWeaponSlots = PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate        = 5
  End
  Locomotor = SET_NORMAL V92S2_DieselEngine_T90M
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 500.0
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_Shtora
    WeaponTemplate        = Shtora_ECM_Weapon
    PrimaryTargetTypes    = SMALL_MISSILE PROJECTILE
    ScanRate              = 700
    ScanRange             = 180
    PredictTargetVelocityFactor = 3.0
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_Afghanit
    WeaponTemplate        = Afghanit_APS_T90M
    PrimaryTargetTypes    = SMALL_MISSILE PROJECTILE
    ScanRate              = 700
    ScanRange             = 180
    PredictTargetVelocityFactor = 3.0
  End
  Behavior = OverlordContain ModuleTag_RCWS
    Slots                   = 1
    DamagePercentToUnits    = 100%
    AllowInsideKindOf       = PORTABLE_STRUCTURE
    PassengersAllowedToFire = Yes
    PassengersInTurret      = Yes ; My passengers ride in my turret, that's where the Firepoint bones are
    ExperienceSinkForRider  = Yes ; I get the Exp for things my turret friend kills
    PayloadTemplateName     = Russia_RCWS
  End
  Behavior                = SpawnBehavior ModuleTag_Guard
    SpawnNumber           = 1
    SpawnReplaceDelay     = 2200
    SpawnTemplateName     = RussiaSightSosnaU
    SpawnedRequireSpawner = Yes
    OneShot               = Yes
    ExitByBudding         = Yes
    AggregateHealth       = No
    SlavesHaveFreeWill    = No
    InitialBurst          = 0
  End
  Behavior                = QueueProductionExitUpdate ModuleTag_USC
    NaturalRallyPoint     = X:0.0  Y:0.0  Z:0.0
    UnitCreatePoint       = X:0.0  Y:0.0  Z:0.0
    ExitDelay             = 2200
    InitialBurst          = 1
  End
  ; Turret fly off death
  Behavior = SlowDeathBehavior ModuleTag_10g45
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 80
    DestructionDelay  = 5000
    DestructionDelayVariance  = 10
    FX  = INITIAL  FX_GenericTankAmmoCockoff
    OCL = MIDPOINT OCL_T90SDeathEffect
    FX  = FINAL    FX_GenericFreeFallBombsExplosion
    OCL = FINAL    OCL_T90STurret
  End
  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_11k768
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 20
    DestructionDelay  = 5000
    DestructionDelayVariance  = 300
    FX  = INITIAL  FX_GenericTankAmmoCockoff
    OCL = FINAL    OCL_T90SDeathEffect
    FX  = FINAL    FX_GenericTankDeathExplosion
  End
  Behavior                 = TransitionDamageFX ModuleTag_12m67
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
  End
  Behavior                 = TransitionDamageFX ModuleTag_CFS67bn
    ReallyDamagedParticleSystem1 = Bone:Smoke02 RandomBone:Yes PSys:GenericDamagedTankSmoke
  End
  Behavior                 = TransitionDamageFX ModuleTag_CSv45
    RubbleParticleSystem1  = Bone:Fire01 RandomBone:Yes PSys:TankFire
  End
  Behavior = DestroyDie ModuleTag_09hfgj7
    DeathTypes = NONE +CRUSHED +SPLATTED
  End
  ; A crushing defeat
  Behavior = FXListDie ModuleTag_10l89
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = CreateObjectDie ModuleTag_1145mhg
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End
  Behavior = CreateCrateDie ModuleTag_12k6
    CrateData = SalvageCrateData
    ;CrateData = EliteTankCrateData
    ;CrateData = HeroicTankCrateData
  End
  Behavior = FlammableUpdate ModuleTag_21j56
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Geometry = BOX
  GeometryMajorRadius = 14.0
  GeometryMinorRadius = 9.0
  GeometryHeight = 10.5    
  GeometryIsSmall = Yes 
  Shadow = SHADOW_VOLUME   
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length
End


