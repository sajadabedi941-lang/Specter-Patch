Object RussiaTankTos1A
Scale = 0.9

  ; *** ART Parameters ***
  SelectPortrait         = rus_tosm1
  ButtonImage            = rus_tosm1
  
  
  ;UpgradeCameo3 = NONE
  ;UpgradeCameo4 = NONE
  ;UpgradeCameo5 = NONE
  
  Draw                    = W3DTankDraw ModuleTag_01
    OkToChangeModelColor  = Yes
    DefaultConditionState
      Model               = RUS_TOS1A
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY WEAPONFX
      WeaponLaunchBone    = PRIMARY WEAPONA
      WeaponFireFXBone    = SECONDARY WEAPONFX
      WeaponLaunchBone    = SECONDARY WEAPONA
      WeaponFireFXBone    = TERTIARY WEAPONFX
      WeaponLaunchBone    = TERTIARY WEAPONA
    End
    
    ConditionState        = RUBBLE REALLYDAMAGED
      Model               = RUS_TOS1AD
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY WEAPONFX
      WeaponLaunchBone    = PRIMARY WEAPONA
      WeaponFireFXBone    = SECONDARY WEAPONFX
      WeaponLaunchBone    = SECONDARY WEAPONA
      WeaponFireFXBone    = TERTIARY WEAPONFX
      WeaponLaunchBone    = TERTIARY WEAPONA
    End

   
    TrackMarks           = EXTnkTrack.tga
    TreadAnimationRate      = 2.0  ; amount of tread texture to move per second
  End


  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:Tos1A
  Side             = Russia
  EditorSorting    = VEHICLE
  TransportSlotCount = 3                 ;how many "slots" we take in a transport (0 == not transportable)
  WeaponSet
    Conditions             = None 
    Weapon                 = PRIMARY      220mm_Buratino_Thermobaric_Salvo ;220mm_Buratino_Thermobaric
    ;Weapon                 = SECONDARY    220mm_Buratino_Thermobaric_Smi
    ;Weapon                 = TERTIARY     220mm_Buratino_Thermobaric_Salvo
    ;AutoChooseSources      = PRIMARY FROM_SCRIPT FROM_AI FROM_PLAYER DEFAULT_SWITCH_WEAPON
    ;AutoChooseSources      = SECONDARY None
    ;AutoChooseSources      = TERTIARY  None
    ;ShareWeaponReloadTime = Yes
  End
  
  ArmorSet
    Conditions      = None
    Armor           = T72A_Obr1984_Armor
    DamageFX        = TankDamageFX
  End
  Prerequisites
    Science = SCIENCE_Rank6
  End
  BuildCost       = 1500
  BuildTime       = 16.0          ;in seconds    
  VisionRange     = 460
  ShroudClearingRange = 200
  
  ExperienceValue = 100 100 200 400    ;Experience point value at each level
  ExperienceRequired = 0 200 300 600 ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet       = GenericDeployableArtillaryCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = DragonTankVoiceSelect
  VoiceMove = DragonTankVoiceMove
  VoiceGuard = DragonTankVoiceMove
  VoiceAttack = DragonTankVoiceAttack
  SoundMoveStart = DragonTankMoveStart
  SoundMoveStartDamaged = DragonTankMoveStart

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate     = DragonTankVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop
    VoiceEnter = DragonTankVoiceMove
    VoiceFlameLocation = DragonTankVoiceFireStorm
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS VEHICLE SCORE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 900.0
    InitialHealth   = 900.0
    SubdualDamageCap = 800
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End

  Behavior = AIUpdateInterface ModuleTag_043fr2
    Turret
      TurretTurnRate = 35
      TurretPitchRate = 30
      AllowsPitch = Yes
      FirePitch = 35
      ControlledWeaponSlots = PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes NotWhileAttacking
  End
  Locomotor            = SET_NORMAL V-12_diesel
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 500.0
  End
  Behavior = ProductionUpdate ModuleTag_08AD
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  ; Turret fly off death
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 80
    DestructionDelay  = 50
    DestructionDelayVariance  = 10
    FX  = INITIAL  FX_GenericTankDeathEffect
    OCL = MIDPOINT OCL_GenericTankDeathEffect
    FX  = FINAL    FX_GenericTankDeathExplosion
    OCL = FINAL    OCL_CrusaderTurret
  End

  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_11
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 20
    DestructionDelay  = 2000
    DestructionDelayVariance  = 300
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_GenericTankDeathEffect  
    FX  = FINAL    FX_GenericTankDeathExplosion
  End

  Behavior                 = TransitionDamageFX ModuleTag_12
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
  End

  Behavior = DestroyDie ModuleTag_13
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  ; A crushing defeat
  Behavior = FXListDie ModuleTag_134
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_TankCrush
  End

  Behavior = CreateObjectDie ModuleTag_15
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End

  Geometry = BOX
  GeometryMajorRadius = 18.0
  GeometryMinorRadius = 11.0
  GeometryHeight = 10     
  GeometryIsSmall = Yes
  Shadow = SHADOW_VOLUME    
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End