    PrimaryTargetTypes    = AIRCRAFT
    ScanRate              = 1100
    ScanRange             = 1100
    PredictTargetVelocityFactor = 3.0
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_GPSBlocker
