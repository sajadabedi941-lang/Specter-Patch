Object WFUnlock_Arab_Tor1M
Scale = 0.9

  ; *** ART Parameters ***
  SelectPortrait         = arb_tor1m
  ButtonImage            = arb_tor1m
  
  Draw = W3DTankDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ExtraPublicBone = WEAPONA01

    ConditionState = NONE
      Model             = Arb_Tor1M
