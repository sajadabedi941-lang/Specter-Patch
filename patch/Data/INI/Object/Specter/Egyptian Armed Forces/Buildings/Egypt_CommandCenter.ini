; SPECTER PARSE FIX - Egypt_CommandCenter
; Donor structure/ART: USA CommandCenter (us_commandcenter / US_Command / US_COM_Strb)
; Egypt special powers from Egypt_MilitaryHQ; gunship Patch_Egypt_AWACS
; Identity: Egypt_CommandCenter + Side=Egypt + Egypt_CommandCenterCommandSet
; Preserved: cost/time/HP/CommandSet/balance
; Clean identity: no foreign leftover assets

;------------------------------------------------------------------------------
Object Egypt_CommandCenter

Scale = 0.8

  ; *** ART Parameters ***
  SelectPortrait         = us_commandcenter
  ButtonImage            = us_commandcenter

  ; ----------------- Main Building ------------------------
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ; day
    ConditionState       = NONE
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
    ConditionState       = DAMAGED
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
    ConditionState       = REALLYDAMAGED RUBBLE
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
  End

  PlacementViewAngle  = -135

  ; ------------ Strobes -----------------
  Draw                = W3DModelDraw ModuleTag_03
    ConditionState    = None
      Model           = US_COM_Strb
      Animation       = US_COM_Strb.US_COM_Strb
      AnimationMode   = LOOP
    End
    AliasConditionState = NIGHT
    AliasConditionState = SNOW
    AliasConditionState = NIGHT SNOW

    ConditionState    = DAMAGED
      Model           = US_COM_Strb
      Animation       = US_COM_Strb.US_COM_Strb
      AnimationMode   = LOOP
    End
    AliasConditionState = NIGHT DAMAGED
    AliasConditionState = SNOW DAMAGED
    AliasConditionState = NIGHT SNOW DAMAGED

    ConditionState    = REALLYDAMAGED RUBBLE
      Model           = US_COM_Strb
      Animation       = US_COM_Strb.US_COM_Strb
      AnimationMode   = LOOP
    End
  End

  ; ***DESIGN parameters ***
  DisplayName           = OBJECT:Egypt_CommandCenter
  Side                  = Egypt
  EditorSorting         = STRUCTURE
  BuildCost             = 2000
  BuildTime             = 45.0
  EnergyProduction      = 0
  CommandSet            = Egypt_CommandCenterCommandSet
  VisionRange           = 300.0
  ShroudClearingRange   = 300
  ArmorSet
    Conditions          = None
    Armor               = StructureArmorTough
    DamageFX            = StructureDamageFXNoShake
  End
  ExperienceValue     = 200 200 200 200

  ; *** AUDIO Parameters ***
  VoiceSelect           = CommandCenterUSASelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority       = STRUCTURE
  KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE COMMANDCENTER SCORE CAPTURABLE FS_FACTORY AUTO_RALLYPOINT MP_COUNT_FOR_VICTORY
  Body                = StructureBody ModuleTag_08
    MaxHealth         = 5000.0
    InitialHealth     = 5000.0
    SubdualDamageCap = 5200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End

  Behavior = PreorderCreate ModuleTag_PreorderCreate
  End
  Behavior = ProductionUpdate ModuleTag_11
    NumDoorAnimations            = 1
    DoorOpeningTime              = 1500
    DoorWaitOpenTime             = 3000
    DoorCloseTime                = 1500
    ConstructionCompleteDuration = 1500
  End
  Behavior = DefaultProductionExitUpdate ModuleTag_13
    UnitCreatePoint   = X:-18.0  Y:  35.0   Z:0.0
    NaturalRallyPoint = X: 60.0  Y:  35.0   Z:0.0
  End
  Behavior = BaseRegenerateUpdate ModuleTag_14
  End
  Behavior             = DestroyDie ModuleTag_15
  End
  Behavior             = CreateObjectDie ModuleTag_16
    CreationList  = OCL_LargeStructureDebris
  End
  Behavior             = FXListDie ModuleTag_18
    DeathFX       = FX_StructureMediumDeath
  End

  Behavior = GrantUpgradeCreate ModuleTag_ICBMBK
    UpgradeToGrant = Upgrade_ICBM_BoosterKiller
  End

  ; Egypt special powers (verified with Egypt_MilitaryHQ)
  Behavior           = OCLSpecialPower ModuleTag_EgyptInsertion
    SpecialPowerTemplate = SuperweaponEgyptSFInsertion
    OCL                  = SUPERWEAPON_Paradrop1
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    OCLAdjustPositionToPassable = Yes
  End

  Behavior           = OCLSpecialPower ModuleTag_EgyptTu22
    SpecialPowerTemplate = SuperweaponEgyptTu22CruiseMissileStrike
    OCL                  = SUPERWEAPON_Tu22CruiseMissileStrike
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior = SpecialAbility ModuleTag_EgyptAWACS_SP
    SpecialPowerTemplate = SuperweaponEgyptAWACS
    UpdateModuleStartsAttack = Yes
  End

  Behavior = SpectreGunshipDeploymentUpdate ModuleTag_EgyptAWACS
    SpecialPowerTemplate = SuperweaponEgyptAWACS
    GunshipTemplateName = Patch_Egypt_AWACS
    AttackAreaRadius = 225
    CreateLocation = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior           = OCLSpecialPower ModuleTag_EgyptParadrop
    SpecialPowerTemplate = SuperweaponEgyptParadrop
    OCL                  = SUPERWEAPON_Paradrop1
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    OCLAdjustPositionToPassable = Yes
  End

  Behavior           = OCLSpecialPower ModuleTag_EgyptCruise
    SpecialPowerTemplate = SuperweaponEgyptCruiseStrike
    UpgradeOCL           = SCIENCE_Egypt_CruiseStrike3 SUPERWEAPON_US_CruiseMissileStrike_3
    UpgradeOCL           = SCIENCE_Egypt_CruiseStrike2 SUPERWEAPON_US_CruiseMissileStrike_2
    OCL                  = SUPERWEAPON_AmericaTomahawkStrike1
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior           = OCLSpecialPower ModuleTag_EgyptFOAB
    SpecialPowerTemplate = SuperweaponEgyptFOAB
    OCL                  = SUPERWEAPON_FOAB
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior           = OCLSpecialPower ModuleTag_EgyptRecon
    SpecialPowerTemplate = SuperweaponEgyptReconnaissance
    OCL                  = SUPERWEAPON_SpySatellite
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior = FlammableUpdate ModuleTag_30
    AflameDuration = 5000
    AflameDamageAmount = 5
    AflameDamageDelay = 500
  End

  Behavior = TransitionDamageFX ModuleTag_31
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_KillMarker
    DeathWeapon  = GenericTargetMarkerKiller
    StartsActive = Yes
  End
  Behavior          = FireWeaponWhenDeadBehavior ModuleTag_KillMarker2
    DeathWeapon     = GenericTargetMarkerKiller
    StartsActive    = Yes
    RequiredStatus  = SOLD
  End

  Geometry            = BOX
  GeometryMajorRadius = 110.0
  GeometryMinorRadius = 90.0
  GeometryHeight      = 49.0
  GeometryIsSmall     = No
  FactoryExitWidth    = 25
  Shadow              = SHADOW_VOLUME
  BuildCompletion     = PLACED_BY_PLAYER

End
