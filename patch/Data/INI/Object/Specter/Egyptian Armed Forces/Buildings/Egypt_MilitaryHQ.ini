; SPECTER REPAIR - Egypt_MilitaryHQ
; Donor: USA America_MilitaryHQ (MilitaryHQ_StockFactions / US_Command art)
; Clean ASCII-only INI; USA Command Center art; no foreign leftover assets
; Identity: Egypt_MilitaryHQ + Side=Egypt + Egypt_MilitaryHQCommandSet
; Keep Egypt special powers, cost/time balance, production/command-center role

;----------------------------------------------------------------------------;
;-------------- USA Military Headquarters (Specter) -----------------;

Object Egypt_MilitaryHQ
Scale = 0.9
  ; *** ART Parameters ***
  SelectPortrait         = us_commandcenter
  ButtonImage            = us_commandcenter

  ; ----- The actual command center
  Draw                   = W3DModelDraw ModuleTag_0981
    OkToChangeModelColor = Yes

    ; day
    ConditionState       = NONE
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End

    ConditionState       = DAMAGED
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
    ConditionState       = REALLYDAMAGED RUBBLE
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
  End

  PlacementViewAngle = -175

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:Egypt_MilitaryHQ
  Side                = Egypt
  EditorSorting       = STRUCTURE
  BuildCost           = 1615
  BuildTime           = 3.2           ; in seconds
  EnergyProduction    = 0  ;Command center should be free
  CommandSet          = Egypt_MilitaryHQCommandSet
  VisionRange         = 308.0           ; Shroud clearing distance
  ShroudClearingRange = 306.0
  ArmorSet
    Conditions        = None
    Armor             = StructureArmorTough
    DamageFX          = StructureDamageFXNoShake
  End
  ExperienceValue     = 200 200 200 200  ; Experience point value at each level

  ; *** AUDIO Parameters ***
  VoiceSelect         = CommandCenterGLASelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End


  ; *** ENGINEERING Parameters ***
  RadarPriority       = STRUCTURE
  KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE COMMANDCENTER SCORE CAPTURABLE FS_FACTORY AUTO_RALLYPOINT MP_COUNT_FOR_VICTORY
  Body                = StructureBody ModuleTag_0984
    MaxHealth         = 2400.0
    InitialHealth     = 2400.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 5200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
  Behavior = AutoDepositUpdate ModuleTag_PatchOilIncome
    DepositTiming       = 12000
    DepositAmount       = 20
    InitialCaptureBonus = 0
  End
  Behavior = PreorderCreate ModuleTag_PreorderCreate
  End

  Behavior = ProductionUpdate ModuleTag_30985
    NumDoorAnimations            = 1
    DoorOpeningTime              = 1500  ;in mSeconds
    DoorWaitOpenTime             = 3000  ;in mSeconds
    DoorCloseTime                = 1500  ;in mSeconds
    ConstructionCompleteDuration = 1500  ;in mSeconds
  End
  Behavior = DefaultProductionExitUpdate ModuleTag_12306
    UnitCreatePoint   = X:-80.0  Y:  55.0   Z:0.0
    NaturalRallyPoint = X: 60.0  Y:  35.0   Z:0.0;NaturalRallyPointX must always match GeometryMajorRadius! -ML
  End
  Behavior             = DestroyDie ModuleTag_10988
    ;nothing
  End
  Behavior             = CreateObjectDie ModuleTag_09849
    CreationList  = OCL_LargeStructureDebris
  End
  Behavior             = FXListDie ModuleTag_1120
    DeathFX       = FX_StructureMediumDeath
  End
  Behavior = GrantUpgradeCreate ModuleTag_ICBMBK
    UpgradeToGrant = Upgrade_ICBM_BoosterKiller
  End

  Behavior           = OCLSpecialPower ModuleTag_Insertion
    SpecialPowerTemplate = SuperweaponEgyptSFInsertion
    OCL                  = SUPERWEAPON_Paradrop1
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    OCLAdjustPositionToPassable = Yes ;Like RA2, shift target to passable cell so we don't land in water and on cliffs.
  End

  Behavior           = OCLSpecialPower ModuleTag_173
    SpecialPowerTemplate = SuperweaponEgyptTu22CruiseMissileStrike
    OCL                  = SUPERWEAPON_Tu22CruiseMissileStrike
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior = SpecialAbility ModuleTag_EgyptAWACS_SP
    SpecialPowerTemplate = SuperweaponEgyptAWACS
    UpdateModuleStartsAttack = Yes
  End

  Behavior = SpectreGunshipDeploymentUpdate ModuleTag_EgyptAWACS
    SpecialPowerTemplate = SuperweaponEgyptAWACS
    GunshipTemplateName = US_E3G_AWACS
    AttackAreaRadius = 225
    CreateLocation = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior           = OCLSpecialPower ModuleTag_2432
    SpecialPowerTemplate = SuperweaponEgyptParadrop
    OCL                  = SUPERWEAPON_Paradrop1
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    OCLAdjustPositionToPassable = Yes ;Like RA2, shift target to passable cell so we don't land in water and on cliffs.
  End
  Behavior           = OCLSpecialPower ModuleTag_286
    SpecialPowerTemplate = SuperweaponEgyptCruiseStrike
    UpgradeOCL           = SCIENCE_Egypt_CruiseStrike3 SUPERWEAPON_US_CruiseMissileStrike_3
    UpgradeOCL           = SCIENCE_Egypt_CruiseStrike2 SUPERWEAPON_US_CruiseMissileStrike_2
    OCL                  = SUPERWEAPON_AmericaTomahawkStrike1
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior           = OCLSpecialPower ModuleTag_143
    SpecialPowerTemplate = SuperweaponEgyptFOAB
    OCL                  = SUPERWEAPON_FOAB
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End
  Behavior           = OCLSpecialPower ModuleTag_213f3w
    SpecialPowerTemplate = SuperweaponEgyptReconnaissance
    OCL                  = SUPERWEAPON_SpySatellite
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior = FlammableUpdate ModuleTag_149
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = TransitionDamageFX ModuleTag_620
    ;-------------DESIGNED FOR MEDIUM SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End

  Geometry            = BOX
  GeometryMajorRadius = 65.0
  GeometryMinorRadius = 65.0
  GeometryHeight      = 54.0
  FactoryExitWidth    = 25
  GeometryIsSmall     = No
  Shadow              = SHADOW_VOLUME
  BuildCompletion     = PLACED_BY_PLAYER

End
