Object Scalp_EG_Object
Scale = 0.9
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState = NONE
      Model          = Scalp_EG
      Animation      = Scalp_EG.Scalp_EG
      AnimationMode  = ONCE
      Flags          = START_FRAME_FIRST
    End
    ConditionState = JAMMED
      Model = PMMoab
      ParticleSysBone = None SparksMedium
      ParticleSysBone = None MissileContrail
    End
  End

  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:Missile
  EditorSorting     = SYSTEM
  VisionRange = 200.0  

  ArmorSet
    Conditions      = None
    Armor           = CruiseMissileArmor
    DamageFX        = None
  End
  SoundAmbient  = GenericMissileAmbientLoop
  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE SMALL_MISSILE VEHICLE CAN_ATTACK
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 400.0
    InitialHealth   = 400.0
    SubdualDamageCap = 200
    SubdualDamageHealRate = 100000
    SubdualDamageHealAmount = 50
  End

; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
    ; we detonated normally.
    ; no FX, just quiet destroy ourselves
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    ; shot down by laser.
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    ; shot down by nonlaser.
    FX         = FX_GenericMissileDeath
  End
; ---- end Projectile death behaviors

  Behavior = StealthUpdate ModuleTag_Stealth
    StealthDelay                = 1200 ; msec
    StealthForbiddenConditions  = FIRING_PRIMARY
    FriendlyOpacityMin          = 50.0%
    FriendlyOpacityMax          = 100.0%
    InnateStealth               = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
  Behavior = PhysicsBehavior ModuleTag_05
    Mass                  = 15
  End
  Behavior = FireWeaponUpdate ModuleTag_FinalStageGuide
      Weapon = GenericCruiseMissileFinalStageGuide
      InitialDelay = 5200
  End
  Behavior = FireWeaponUpdate ModuleTag_FinalStageBooster
      Weapon = LRCM_FinalStageBooster
      InitialDelay = 7000
  End
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_WEC
    DeathWeapon   = HE_BGM109_450kg
    StartsActive  = Yes                      
  End
  Behavior = MissileAIUpdate ModuleTag_01ff8
    TryToFollowTarget     = Yes 
    FuelLifetime          = 999999
    DetonateCallsKill     = Yes
    InitialVelocity       = 10                ; in dist/sec
    IgnitionDelay         = 10
    ;DistanceToTravelBeforeTurning = 1
    DistanceToTargetBeforeDiving  = 520
  End
  Locomotor = SET_NORMAL ScalpEGMissileLocomotor
;---------- Radar Signature --------------- ;
  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE
  End
;---------- End Of Radar Signature ----------;

  Geometry = Box
  GeometryIsSmall = Yes
  GeometryMajorRadius = 12.0

End
