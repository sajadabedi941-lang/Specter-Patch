Object IranVehicleBMP1A_AI

  ; *** ART Parameters ***
  SelectPortrait         = irn_bmp1a
  ButtonImage            = irn_bmp1a
  ;UpgradeCameo3 = NONE
  ;UpgradeCameo4 = NONE
  ;UpgradeCameo5 = NONE
  Draw = W3DTankDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = Irn_BMP1A
      Turret = Turret
      WeaponFireFXBone  = PRIMARY WeaponA
      WeaponMuzzleFlash = PRIMARY WeaponA
      WeaponLaunchBone  = PRIMARY WeaponA
      WeaponRecoilBone  = PRIMARY BarrelA01
      WeaponFireFXBone  = SECONDARY WeaponB
      WeaponLaunchBone  = SECONDARY Missile
      WeaponFireFXBone  = TERTIARY WeaponC
      WeaponMuzzleFlash = TERTIARY WeaponC
    End
    ConditionState = REALLYDAMAGED
      Model = Irn_BMP1AD
      Turret = Turret
      WeaponFireFXBone  = PRIMARY WeaponA
      WeaponMuzzleFlash = PRIMARY WeaponA
      WeaponLaunchBone  = PRIMARY WeaponA
      WeaponRecoilBone  = PRIMARY BarrelA01
      WeaponFireFXBone  = SECONDARY WeaponB
      WeaponLaunchBone  = SECONDARY Missile01
      WeaponFireFXBone  = TERTIARY WeaponC
      WeaponMuzzleFlash = TERTIARY WeaponC
    End
     ConditionState = RUBBLE
      Model = Irn_BMP1AD
    End

    TrackMarks = EXTnkTrack.tga
    TreadAnimationRate      = 2.0  ; amount of tread texture to move per second
  End

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:Bmp1a
  Side = Iran
  BuildVariations     = IranVehicleBMP1A_AI IranVehicleBMP2A_AI IranVehicleBTR60_AI
  EditorSorting   = VEHICLE
  TransportSlotCount = 3                 ;how many "slots" we take in a transport (0 == not transportable)

  WeaponSet 
    Conditions        = None 
    Weapon               = PRIMARY   73mm_2A28_Grom
    PreferredAgainst     = PRIMARY   VEHICLE INFANTRY
    Weapon               = TERTIARY   7_62mm_PKT_Coaxial
    PreferredAgainst     = TERTIARY   INFANTRY
    AutoChooseSources    = TERTIARY   FROM_PLAYER FROM_SCRIPT FROM_AI
  End

  ArmorSet
    Conditions           = None
    Armor                = Bmp1_Armor
    DamageFX             = TankDamageFX
  End

  BuildCost           = 500
  BuildTime           = 7.0          ;in seconds    
  VisionRange         = 340
  ShroudClearingRange = 140

  ExperienceValue = 50 50 100 150    ;Experience point value at each level
  ExperienceRequired = 0 100 150 300  ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet    = GenericIFVcommandset

  ; *** AUDIO Parameters ***
  VoiceSelect = DragonTankVoiceSelect
  VoiceMove = DragonTankVoiceMove
  VoiceGuard = DragonTankVoiceMove
  VoiceAttack = DragonTankVoiceAttack
  SoundMoveStart = DragonTankMoveStart
  SoundMoveStartDamaged = DragonTankMoveStart

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate     = DragonTankVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop
    VoiceEnter = DragonTankVoiceMove
    VoiceFlameLocation = DragonTankVoiceFireStorm
  End


  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = PRELOAD TRANSPORT SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE DONT_AUTO_CRUSH_INFANTRY
  
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 800
    InitialHealth   = 800
  End

  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate       = 180 ;   // turn rate, in degrees per sec
      ControlledWeaponSlots= PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes
  End
  Locomotor            = SET_NORMAL UTD-20_6cyl
  Behavior             = PhysicsBehavior ModuleTag_04
    Mass               = 300.0
  End
  ; just explode death
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -CRUSHED -SPLATTED
;    ProbabilityModifier = 33
    DestructionDelay = 500
    DestructionDelayVariance = 500
    FX  = INITIAL  FX_GenericTankAmmoCockoff
    OCL = FINAL    OCL_BMP1PDebris
    FX  = FINAL    FX_UnguidedRocketExplosion
  End
  Behavior                 = TransitionDamageFX ModuleTag_12
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
  End
  Behavior = DestroyDie ModuleTag_13
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  ; A crushing defeat
  Behavior = FXListDie ModuleTag_14
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_TankCrush
  End

  Behavior = CreateObjectDie ModuleTag_15
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End

  Behavior = CreateCrateDie ModuleTag_CratesChange
   CrateData = SalvageCrateData=
  End
  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  
  Behavior = TransportContain ModuleTag_22
    Slots                 = 8
    ScatterNearbyOnExit   = Yes
    HealthRegen%PerSec    = 10
    EnterSound            = GarrisonEnter
    ExitSound             = GarrisonExit
    ;InitialPayload        = Iran_Revo_V1 8
    DamagePercentToUnits  = 100%
    AllowInsideKindOf     = INFANTRY
    ExitDelay             = 250
    NumberOfExitPaths     = 3 ; Defaults to 1.  Set 0 to not use ExitStart/ExitEnd, set higher than 1 to use ExitStart01-nn/ExitEnd01-nn
    GoAggressiveOnExit    = Yes ; AI Will tell people to set their mood to Aggressive on exiting
  End  

  Geometry               = BOX
  GeometryMajorRadius    = 15.0
  GeometryMinorRadius    = 10.0
  GeometryHeight         = 10.0     
  GeometryIsSmall        = Yes    
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End
