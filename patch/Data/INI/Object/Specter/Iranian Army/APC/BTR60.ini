Object IranVehicleBTR60

  ; *** ART Parameters ***
  SelectPortrait         = irn_btr60
  ButtonImage            = irn_btr60
  ;UpgradeCameo2 = NONE
  ;UpgradeCameo3 = NONE
  ;UpgradeCameo4 = NONE
  ;UpgradeCameo5 = NONE
  
  Draw = W3DTruckDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState = NONE
      Model = Iran_BTR60
      Turret              = Turret
      WeaponFireFXBone    = PRIMARY WeaponA
      WeaponRecoilBone    = PRIMARY Barrel
      WeaponMuzzleFlash   = PRIMARY WeaponA
      WeaponLaunchBone    = PRIMARY WeaponA
      WeaponFireFXBone    = SECONDARY WeaponA
      WeaponLaunchBone    = SECONDARY WeaponA
      WeaponMuzzleFlash   = SECONDARY WeaponA
    End
    ConditionState        = REALLYDAMAGED RUBBLE
      Model               = Iran_BTR60
    End  
    TrackMarks = EXTireTrack.tga
    Dust = RocketBuggyDust
    DirtSpray = RocketBuggyDirtSpray
    ; PowerslideSpray = RocketBuggyDirtPowerSlide doesn't powerslide
    ; These parameters are only used if the model has a separate suspension, 
    ; and the locomotor has HasSuspension = Yes.
    LeftFrontTireBone     = Wheel01
    RightFrontTireBone    = Wheel08
    LeftRearTireBone      = Wheel03
    RightRearTireBone     = Wheel05
    MidLeftFrontTireBone  = Wheel02
    MidRightFrontTireBone = Wheel07
    MidLeftRearTireBone   = Wheel04
    MidRightRearTireBone  = Wheel06
    TireRotationMultiplier      = 0.2   ; this * speed = rotation.
    PowerslideRotationAddition  = 0   ; This vehicle doesn't powerslide.
  End
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:BTR60
  Side                = Iran
  EditorSorting       = VEHICLE
  TransportSlotCount  = 8                 ;how many "slots" we take in a transport (0 == not transportable)
  Prerequisites
    Object = IranWarFactory
  End
  WeaponSet 
    Conditions        = None 
    Weapon               = PRIMARY   14.5mm_KPV
  End
  ArmorSet
    Conditions           = None
    Armor                = BTR90Armor
    DamageFX             = TankDamageFX
  End
  Prerequisites
    Science = SCIENCE_IranGen2Tech
  End
  BuildCost           = 700
  BuildTime           = 12.0          ;in seconds    
  VisionRange         = 420
  ShroudClearingRange = 140
  ExperienceValue     = 50 50 100 150    ;Experience point value at each level
  ExperienceRequired  = 0 100 150 300  ;Experience points needed to gain each level
  IsTrainable         = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet          = GenericIFVcommandset
  ; *** AUDIO Parameters ***
  VoiceSelect = TroopCrawlerVoiceSelect
  VoiceMove = TroopCrawlerVoiceMove
  VoiceGuard = TroopCrawlerVoiceMove
  VoiceAttack = TroopCrawlerVoiceAttack
  SoundMoveStart = TroopCrawlerMoveStart
  SoundMoveStartDamaged = TroopCrawlerMoveStart
  SoundEnter = HumveeEnter
  SoundExit = HumveeExit
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate     = TroopCrawlerVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop
    TruckLandingSound = NoSound ;RocketBuggyLand
    TruckPowerslideSound = NoSound ;RocketBuggyPowerslide
    VoiceCrush = TroopCrawlerVoiceCrush
    VoiceUnload   = TroopCrawlerVoiceUnload
    VoiceEnter = TroopCrawlerVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = PRELOAD TRANSPORT SELECTABLE DONT_AUTO_CRUSH_INFANTRY CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE
  
  Body              = ActiveBody ModuleTag_4f02
    MaxHealth       = 700
    InitialHealth   = 700
  End
  Behavior = AIUpdateInterface ModuleTag_s4f03
    Turret
      TurretTurnRate = 360
      TurretPitchRate = 360
      AllowsPitch = Yes
      ControlledWeaponSlots = PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes
  End
  Locomotor            = SET_NORMAL 6x6WheleedEngine
  Behavior             = PhysicsBehavior ModuleTag_0s4f4
    Mass               = 120.0
  End
  ; Turret fly off death
  Behavior = SlowDeathBehavior ModuleTag_1fs40
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 80
    DestructionDelay  = 50
    DestructionDelayVariance  = 10
    FX  = INITIAL  FX_GenericTankDeathEffect
    OCL = MIDPOINT OCL_GenericTankDeathEffect
    FX  = FINAL    FX_GenericTankDeathExplosion
    OCL = FINAL    OCL_CrusaderTurret
  End

  Behavior = SlowDeathBehavior ModuleTag_0f47A
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 15
    DestructionDelay = 200
    DestructionDelayVariance = 100
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_FinalTroopCrawlerDebris
    FX  = FINAL    FX_SupplyTruckExplosionOneFinal
  End

  Behavior = SlowDeathBehavior ModuleTag_0x7B
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 85
    DestructionDelay = 10
    DestructionDelayVariance = 5
    OCL = FINAL    OCL_FinalTroopCrawlerDebris
    FX  = FINAL    FX_SupplyTruckExplosionOneFinal
  End

  Behavior                 = TransitionDamageFX ModuleTag_084f
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
  End

  Behavior = DestroyDie ModuleTag_09
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  Behavior = FXListDie ModuleTag_10g4
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_TankCrush
  End

  ; A crushing defeat
  Behavior = FXListDie ModuleTag_1134
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_TankCrush
  End

  Behavior = FlammableUpdate ModuleTag_2143
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

    
  Behavior = TransportContain ModuleTag_2234
    Slots                 = 6
    ScatterNearbyOnExit   = Yes
    HealthRegen%PerSec    = 10
    EnterSound            = GarrisonEnter
    ExitSound             = GarrisonExit
    InitialPayload        = IranInfantryRevoVariant 6
    DamagePercentToUnits  = 100%
    AllowInsideKindOf     = INFANTRY
    ExitDelay             = 250
    NumberOfExitPaths     = 3 ; Defaults to 1.  Set 0 to not use ExitStart/ExitEnd, set higher than 1 to use ExitStart01-nn/ExitEnd01-nn
    GoAggressiveOnExit    = Yes ; AI Will tell people to set their mood to Aggressive on exiting
  End  

  Geometry = BOX
  GeometryMajorRadius = 22.0
  GeometryMinorRadius = 9.0
  GeometryHeight = 13.0     
  GeometryIsSmall = No
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End