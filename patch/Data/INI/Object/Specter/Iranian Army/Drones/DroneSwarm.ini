Object IranDroneSwarmWeaponObject
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState = NONE
      Model = AVRaptor_M
    End
  End
  Side = Iran
  EditorSorting = SYSTEM
  BuildVariations = IranDroneArash2Swarm IranDroneShahed136Swarm
  KindOf = PROJECTILE 
End
;------------------------------------------------------------------------------
Object IranDroneArash2Swarm
Scale = 1.0
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = Irn_Arash2
    End
  End
  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:HEwarhead
  EditorSorting     = SYSTEM
  VisionRange       = 0.0
  ShroudClearingRange = 100
  ArmorSet
    Conditions      = None
    Armor           = ManualControlledMissileArmor_N
    DamageFX        = None
  End
  ; *** AUDIO parameters ***
  SoundAmbient = GenericUAVAmbientLoop
  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE BALLISTIC_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 100.0
    InitialHealth   = 100.0
    SubdualDamageCap = 1140
    SubdualDamageHealRate = 300
    SubdualDamageHealAmount = 30
  End
; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED +NORMAL
    ; we detonated normally.
    ; no FX, just quiet destroy ourselves
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = ALL -DETONATED -NORMAL
    ; shot down by laser.
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    ; shot down by nonlaser.
    FX         = FX_GenericMissileDeath
  End
  Behavior = DestroyDie ModuleTag_fv45
  End
; ---- end Projectile death behaviors
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 7
    AllowCollideForce = Yes
  End
;---------- Radar Signature --------------- ;
  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE
  End
;---------- End Of Radar Signature ----------;
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_WEC
    ;DeathTypes    = NONE +NORMAL +DETONATED
    DeathWeapon   = Arash2SwarmDeathweapon
    StartsActive  = Yes                      
  End
  Behavior = MissileAIUpdate ModuleTag_06
    TryToFollowTarget = Yes
    DetonateCallsKill = Yes
    FuelLifetime      = 99999
    DetonateCallsKill = Yes
    IgnitionDelay     = 0
    InitialVelocity   = 0
    DistanceToTravelBeforeTurning = 45
    DistanceToTargetBeforeDiving = 300
  End
  Locomotor = SET_NORMAL GenericSuicideDroneBomb
  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 20.0
  GeometryMinorRadius      = 22.0
  GeometryHeight           = 6.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45
End
