  Body = ActiveBody ModuleTag_02
    MaxHealth       = 320.0
    InitialHealth   = 320.0
    SubdualDamageCap = 1140
    SubdualDamageHealRate = 300
    SubdualDamageHealAmount = 30
  End
  Behavior = AIUpdateInterface ModuleTag_061
    AutoAcquireEnemiesWhenIdle = No
  End
  Behavior         = JetSlowDeathBehavior ModuleTag_03
