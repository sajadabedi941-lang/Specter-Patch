;------------------------------------------------------------------------------
Object IranDroneShahed136AIGV1
Scale = 0.9
  ; *** ART Parameters ***
  SelectPortrait         = irn_shahed136
  ButtonImage            = irn_shahed136
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model                           = Irn_Shahed136
      Animation                       = Irn_Shahed136.Irn_Shahed136
      Flags                           = RANDOMSTART
      AnimationMode                   = LOOP
      Turret                          = Turret
      WeaponMuzzleFlash               = PRIMARY MuzzleFX
    End
    ConditionState = REALLYDAMAGED
      Model                           = Irn_Shahed136
      Animation                       = Irn_Shahed136.Irn_Shahed136
      Flags                           = RANDOMSTART
      AnimationMode                   = LOOP
      Turret                          = Turret
      WeaponMuzzleFlash               = PRIMARY MuzzleFX
    End
    OkToChangeModelColor = Yes
  End
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:Shahed136
  EditorSorting       = VEHICLE
  Side                = Iran
  TransportSlotCount  = 0                 ;how many "slots" we take in a transport (0 == not transportable)
  VisionRange         = 2500.0 
  ShroudClearingRange = 200
  WeaponSet
    Conditions          = None 
    Weapon              = PRIMARY     AIGuidedShahed136
    Weapon              = SECONDARY   GenericIranianDroneSwarmGuidance
  End
  ArmorSet
    Conditions      = None
    Armor           = ManualControlledMissileArmor_N
    DamageFX        = None
  End
  CommandSet          = GenericSuicideDroneCommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect = SentryDroneVoiceSelect
  VoiceMove = SentryDroneVoiceMove
  VoiceGuard = SentryDroneVoiceMove
  VoiceAttack = SentryDroneVoiceMove
  SoundAmbient          = GenericUAVAmbientLoop
  UnitSpecificSounds
    VoiceCreate = SentryDroneVoiceSelect
    TurretMoveStart = NoSound
    TurretMoveLoop = NoSound
    VoiceEnter = NoSound
    Deploy = NoSound
    Undeploy = NoSound
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority   = UNIT
  KindOf          = PRELOAD BALLISTIC_MISSILE CAN_CAST_REFLECTIONS SMALL_MISSILE CAN_ATTACK SELECTABLE
  Body = ActiveBody ModuleTag_04
    MaxHealth       = 360.0
    InitialHealth   = 360.0
  End
    Behavior = ChinookAIUpdate ModuleTag_03ca4
    AutoAcquireEnemiesWhenIdle = Yes
    Turret
      TurretTurnRate = 999999
      ControlledWeaponSlots = PRIMARY SECONDARY
    End
  End
  Locomotor = SET_NORMAL  AIGuidedDroneLocomotor
  Behavior = PhysicsBehavior ModuleTag_07f34
    Mass = 50.0
    AerodynamicFriction = 0.05
    AllowCollideForce = Yes
    AllowBouncing = No
    ShockResistance = 0.50
  End
  Behavior         = JetSlowDeathBehavior ModuleTag_03
    DeathTypes     = ALL -SUICIDED
    OCL            = FINAL OCL_GenericSuicideDroneExplode
    FXInitialDeath = FX_MigDeathInitial
  End
  Behavior = InstantDeathBehavior ModuleTag_1214
     DeathTypes = NONE +SUICIDED
  End
  Behavior = TransitionDamageFX ModuleTag_09
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuousDown
    ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:0 FXList:FX_ComancheDamageTransition
  End
;---------- Radar Signature --------------- ;
  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE +HAZARD_CLEANUP
  End
;---------- End Of Radar Signature ----------;
  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Geometry = BOX
  GeometryMajorRadius = 30.0
  GeometryMinorRadius = 22.0
  GeometryHeight = 25.0     
  GeometryIsSmall = No
  Shadow = SHADOW_VOLUME    
  ShadowSizeX = 89  ; minimum elevation angle above horizon. Used to limit shadow length

End
