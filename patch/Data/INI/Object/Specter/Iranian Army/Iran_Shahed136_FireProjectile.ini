; Unique Shahed-136 fire projectile. Shahed136_AI_Object is SELECTABLE CAN_ATTACK
; with MissileAIUpdate (a drone), which does not fire as a weapon shot.
; This follows IranVehicleFateh313 / SRBM_Fateh313_Object (DumbProjectileBehavior).

Object Iran_Shahed136_FireProjectile
Scale = 0.9
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState = NONE
      Model = Irn_Shahed136
      Animation = Irn_Shahed136.Irn_Shahed136
      AnimationMode = LOOP
      ParticleSysBone = ENGINE01 CruiseMissileExhaust_Ending_VLS
    End
  End
  DisplayName = OBJECT:UAV
  EditorSorting = SYSTEM
  KindOf = PROJECTILE BALLISTIC_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 200.0
    InitialHealth = 200.0
  End
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED +NORMAL
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = ALL -DETONATED -NORMAL
    FX = FX_GenericMissileDisintegrate
    OCL = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    FX = FX_GenericMissileDeath
  End
  Behavior = DestroyDie ModuleTag_04
  End
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 5.0
  End
  Behavior = DumbProjectileBehavior ModuleTag_06
    DetonateCallsKill = Yes
    FirstHeight = 220
    SecondHeight = 900
    FirstPercentIndent = 21%
    SecondPercentIndent = 85%
  End
  Geometry = Box
  GeometryIsSmall = Yes
  GeometryMajorRadius = 8.0
  GeometryMinorRadius = 4.0
  GeometryHeight = 3.0
  Shadow = SHADOW_DECAL
  ShadowSizeX = 30
End
