    DeathTypes = NONE +DETONATED
    FX         = FX_NEWGenericMissileDeath
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    ; shot down by laser.
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    ; shot down by nonlaser.
    FX         = FX_GenericMissileDeath
  End
; ---- end Projectile death behaviors
    
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 44
    ShockResistance       = 0.5
    AerodynamicFriction   = 0.4  ; this is now friction-per-sec
    CenterOfMassOffset    = 2    ; Default of 0 means nothing tips as it falls.  Positive tips forward, negative tips back
    AllowBouncing = Yes
    AllowCollideForce = Yes
    PitchRollYawFactor  = 1.5
  End
  Behavior = MissileAIUpdate ModuleTag_05
    ;DetonateCallsKill = Yes
    TryToFollowTarget = Yes
    FuelLifetime = 3000
    IgnitionDelay = 100
    IgnitionFX = FX_TubedMissileLaunchIgnition2
    InitialVelocity = 25               ; in dist/sec
    DistanceToTravelBeforeTurning = 50
  End
  Locomotor = SET_NORMAL BavarMissileLocomotor


  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 1.0
  GeometryMinorRadius      = 1.0
  GeometryHeight           = 1.0
  Shadow                   = SHADOW_VOLUME
  ShadowSizeX              = 90
End

