Object IranBavarSiteAI
Scale = 0.9

  ; *** ART Parameters ***
  SelectPortrait         = irn_bavar
  ButtonImage            = irn_bavar
  
  Draw = W3DModelDraw ModuleTag_01

    OkToChangeModelColor = Yes

    DefaultConditionState
      Model             = Spec_SamIriCnfg
    End
    AliasConditionState = NIGHT
    
    ConditionState      = DAMAGED
      Model             = Spec_SamIriCnfg
    End
    AliasConditionState = DAMAGED NIGHT
    
    ConditionState      = REALLYDAMAGED RUBBLE
      Model             = Spec_SamIriCnfg
    End
    AliasConditionState = REALLYDAMAGED RUBBLE NIGHT
    AliasConditionState = SOLD
  End
  PlacementViewAngle = -45

  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:Bavar
  Side              = Iran
  EditorSorting     = STRUCTURE
  ArmorSet
    Conditions      = None
    Armor           = BaseDefenseArmor
    DamageFX        = StructureDamageFXNoShake
  End
  BuildCost        = 1100
  BuildTime        = 20
  ;EnergyProduction = -2
  VisionRange         = 200.0           ; Shroud clearing distance
  ShroudClearingRange = 250
  CommandSet        = ChinaGattlingCannonCommandSet
  ExperienceValue     = 200 200 200 200  ; Experience point value at each level
  ; *** AUDIO Parameters ***
  VoiceSelect = PatriotBatterySelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy
  UnitSpecificSounds
    UnderConstruction   = UnderConstructionLoop
  End
  UnitSpecificSounds
    TurretMoveStart = NoSound
    TurretMoveLoop = NoSound ;These aren't playing properly, will revisit (mp) TurretMoveLoopLoud
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority       = STRUCTURE
  KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE FS_BASE_DEFENSE IMMUNE_TO_CAPTURE SPAWNS_ARE_THE_WEAPONS POWERED
  Body                = HiveStructureBody ModuleTag_02
    MaxHealth         = 1000.0
    InitialHealth     = 1000.0
    PropagateDamageTypesToSlavesWhenExisting = NONE +SMALL_ARMS +SNIPER +POISON +RADIATION +SURRENDER +MICROWAVE
    SwallowDamageTypesIfSlavesNotExisting    = NONE +SNIPER +POISON +SURRENDER; Take no damage if no one to pass this to
    SubdualDamageCap = 3200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
  Behavior = FireWeaponCollide ModuleTag_KillRadar
    CollideWeapon  = SamInstallationDismantle
    RequiredStatus = SOLD
  End
  Behavior                  = SpawnPointProductionExitUpdate ModuleTag_RadarSpawnPoint
    SpawnPointBoneName      = SpawnPoint
  End
  Behavior                  = SpawnBehavior ModuleTag_RadarSpawn
    SpawnNumber             = 3
    OneShot                 = Yes
    SpawnReplaceDelay       = 80000 ;msec
    SpawnTemplateName       = IranLauncherBavarAI_AAM IranLauncherBavarAI_ABM IranLauncherBavarAI_AAM
    CanReclaimOrphans       = No
    SpawnedRequireSpawner   = Yes
    SlavesHaveFreeWill      = No
  End
  Behavior        = FireWeaponUpdate ModuleTag_SRVW
    Weapon        = SpawnMerajViaWeapon
  End
  Behavior        = DestroyDie ModuleTag_09
    ;<NO DATA>
  End
  Behavior        = CreateObjectDie ModuleTag_10
    CreationList  = OCL_ABStingerSiteDebris
  End
  Behavior        = FXListDie ModuleTag_11
    DeathFX       = FX_StructureSmallDeath
  End
  Behavior        = FireWeaponWhenDeadBehavior ModuleTag_12
    DeathWeapon   = SamSiteDeathConcussion
    StartsActive  = Yes
  End
  Behavior = ProductionUpdate ModuleTag_15
  End
  Behavior                = FlammableUpdate ModuleTag_16
    AflameDuration        = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount    = 5       ; taking this much damage...
    AflameDamageDelay     = 500       ; this often.
  End

  Behavior = TransitionDamageFX ModuleTag_17
    ;-------------DESIGNED FOR SMALL SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionSmallSmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionSmallSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionSmallExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionSmallShockwave
  End
  Geometry            = CYLINDER
  GeometryMajorRadius = 68.0
  GeometryHeight      = 11.0    
  GeometryIsSmall     = No
  Shadow              = SHADOW_VOLUME
  BuildCompletion     = PLACED_BY_PLAYER
End