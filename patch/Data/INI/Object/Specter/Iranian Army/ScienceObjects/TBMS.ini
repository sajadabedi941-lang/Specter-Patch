

;------------------------------------------------------------------------------
Object IranSystemTBMAttackCommand
; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model           = None
    End
    OkToChangeModelColor = Yes
  End
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:TBMS
  EditorSorting       = VEHICLE
  Side                = Iran
  ShroudClearingRange = 0
  ArmorSet
    Conditions      = None
    Armor           = AirplaneArmor
    DamageFX        = None
  End
  CommandSet        = Command_ScriptedTransportDrops
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS UNATTACKABLE CAN_ATTACK VEHICLE SCORE TRANSPORT AIRCRAFT FORCEATTACKABLE IGNORED_IN_GUI EMP_HARDENED
  Body = ActiveBody ModuleTag_03
    MaxHealth       = 1000.0
    InitialHealth   = 1000.0
  End
  ExperienceValue     = 40 40 40 40  ; Experience point value at each level
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 500.0
  End
  Behavior = DeliverPayloadAIUpdate ModuleTag_05
    DoorDelay = 500
    MaxAttempts = 4
    DropOffset = X:0 Y:0 Z:-10
    DropDelay = 300 ;500 ; time in between each item dropped (if more than one)
    PutInContainer = AmericaParachute
    DeliveryDistance = 150
  End
  Locomotor = SET_NORMAL GLCCE_SOO
  Behavior = TransportContain ModuleTag_06
    Slots = 100                     ; hey, it's a BIG transport
    ScatterNearbyOnExit = No
    OrientLikeContainerOnExit = Yes
    KeepContainerVelocityOnExit = Yes
    ExitPitchRate = 30
    ExitBone = WeaponA01
    AllowInsideKindOf  = INFANTRY VEHICLE PROJECTILE DOZER PARACHUTABLE
    DoorOpenTime = 0                ; this prevents the Contain module from messing with the doors, since we want DeliverPayload to handle 'em
    NumberOfExitPaths = 0
    DestroyRidersWhoAreNotFreeToExit = Yes  ; 'destroy' as opposed to 'kill'
  End
  Behavior    = OCLSpecialPower ModuleTag_07
    SpecialPowerTemplate = SuperweaponIranianTBMS
    OCL                  = SUPERWEAPON_IranianTBMS
    CreateLocation       = USE_OWNER_OBJECT
    ScriptedSpecialPowerOnly = Yes
  End
  Geometry = Box
  GeometryIsSmall = No
  GeometryMajorRadius = 40.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 10.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89  ; minimum elevation angle above horizon. Used to limit shadow length
End
;------------------------------------------------------------------------------
Object IranTBMSLauncher
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model                           = Spec_GPSMC
      Turret                          = Klaw
      WeaponLaunchBone                = PRIMARY   WeaponA
      WeaponLaunchBone                = SECONDARY WeaponB
    End
    OkToChangeModelColor = Yes
  End
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:DSLC
  EditorSorting       = VEHICLE
  Side                = Iran
  TransportSlotCount  = 1                 ;how many "slots" we take in a transport (0 == not transportable)
  VisionRange         = 1200
  ShroudClearingRange = 800
  WeaponSet
    Conditions            = None 
    Weapon                = PRIMARY    22x_TBM_IranianStrike
    Weapon                = SECONDARY  IranianTBMMultipleTargetDesignator
  End
  ArmorSet
    Conditions      = None
    Armor           = ComancheArmor_P
    DamageFX        = None
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority   = UNIT
  KindOf          = UNATTACKABLE PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK VEHICLE SCORE AIRCRAFT IGNORED_IN_GUI EMP_HARDENED
  Body = ActiveBody ModuleTag_04
    MaxHealth       = 1.0
    InitialHealth   = 1.0
  End
  Behavior = FXListDie ModuleTag_05
    DeathFX = FX_HelicopterStartDeath
  End
  Behavior = JetAIUpdate ModuleTag_0v3321
    MinHeight                     = 10
    NeedsRunway                   = No
    KeepsParkingSpaceWhenAirborne = No
    AutoAcquireEnemiesWhenIdle    = Yes
    Turret
      TurretTurnRate              = 999999     ; this "turret" does not turn
      ControlledWeaponSlots       = PRIMARY SECONDARY TERTIARY
    End
  End
  Behavior = DeletionUpdate ModuleTag_07d23
    MinLifetime = 180000
    MaxLifetime = 180000
  End
  Locomotor = SET_NORMAL  GLCPSD_FO
  Locomotor = SET_TAXIING BasicHelicopterTaxiLocomotor
  Behavior  = PhysicsBehavior ModuleTag_07f34
    Mass = 50.0
    AerodynamicFriction = 0.05
    AllowCollideForce = Yes
    AllowBouncing = No
    ShockResistance = 0.50
    MinFallHeightForDamage = 120.0
  End
  Behavior = ProductionUpdate ModuleTag_05k67
    MaxQueueEntries = 1
  End
  Geometry = BOX
  GeometryMajorRadius = 30.0
  GeometryMinorRadius = 22.0
  GeometryHeight = 25.0     
  GeometryIsSmall = No
  Shadow = SHADOW_VOLUME    
  ShadowSizeX = 89  ; minimum elevation angle above horizon. Used to limit shadow length
End