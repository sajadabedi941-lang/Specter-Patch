;------------------------------------------------------------------------------
; SPECTER — Iraqi Missile Factory (s baseline)
; Separate building object. Does NOT replace Iraq_WarFactory / Irq_WarFactory.
; Donor ART: LSFIQMCheChang / LSFIQMCheChangd / LSFIQMCheChange / LSFMCheChangCB
;------------------------------------------------------------------------------
Object Iraq_MissileFactory

  SelectPortrait         = irq_mslbrg
  ButtonImage            = irq_mslbrg

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    ConditionState       = NONE
      Model              = LSFIQMCheChang
    End
    AliasConditionState = NIGHT
    AliasConditionState = SNOW
    AliasConditionState = NIGHT SNOW
    AliasConditionState = GARRISONED
    AliasConditionState = GARRISONED NIGHT
    AliasConditionState = GARRISONED SNOW
    AliasConditionState = GARRISONED NIGHT SNOW

    ConditionState       = DAMAGED
      Model              = LSFIQMCheChangd
      ParticleSysBone    = Smoke01 SmolderingSmoke
      ParticleSysBone    = Smoke02 SmolderingSmoke
    End
    AliasConditionState = DAMAGED NIGHT
    AliasConditionState = DAMAGED SNOW
    AliasConditionState = DAMAGED NIGHT SNOW
    AliasConditionState = DAMAGED GARRISONED
    AliasConditionState = DAMAGED GARRISONED NIGHT
    AliasConditionState = DAMAGED GARRISONED SNOW
    AliasConditionState = DAMAGED GARRISONED NIGHT SNOW

    ConditionState       = REALLYDAMAGED RUBBLE
      Model              = LSFIQMCheChange
      ParticleSysBone    = Smoke01 SmolderingSmoke
      ParticleSysBone    = Smoke02 SmolderingSmoke
    End
    AliasConditionState = REALLYDAMAGED RUBBLE NIGHT
    AliasConditionState = REALLYDAMAGED RUBBLE SNOW
    AliasConditionState = REALLYDAMAGED RUBBLE NIGHT SNOW
    AliasConditionState = REALLYDAMAGED GARRISONED
    AliasConditionState = REALLYDAMAGED GARRISONED NIGHT
    AliasConditionState = REALLYDAMAGED GARRISONED SNOW
    AliasConditionState = REALLYDAMAGED GARRISONED NIGHT SNOW
  End

  ; house-color / team-color mesh
  Draw = W3DModelDraw ModuleTag_HouseColor
    OkToChangeModelColor = Yes
    ConditionState       = NONE
      Model              = LSFMCheChangCB
    End
    AliasConditionState = NIGHT
    AliasConditionState = SNOW
    AliasConditionState = NIGHT SNOW
    AliasConditionState = DAMAGED
    AliasConditionState = DAMAGED NIGHT
    AliasConditionState = DAMAGED SNOW
    AliasConditionState = DAMAGED NIGHT SNOW
    AliasConditionState = REALLYDAMAGED RUBBLE
    AliasConditionState = REALLYDAMAGED RUBBLE NIGHT
    AliasConditionState = REALLYDAMAGED RUBBLE SNOW
    AliasConditionState = REALLYDAMAGED RUBBLE NIGHT SNOW
  End

  Draw                = W3DModelDraw ModuleTag_Flag_Hs
    ConditionState    = None
      Model           = IQ__IQFlag_HsWF
      Animation       = IQ__IQFlag_HsWF.IQ__IQFlag_HsWF
      AnimationMode   = LOOP
    End
    AliasConditionState = NIGHT
    AliasConditionState = SNOW
    AliasConditionState = NIGHT SNOW

    ConditionState    = DAMAGED
      Model           = IQ__IQFlag_HsWF
      Animation       = IQ__IQFlag_HsWF.IQ__IQFlag_HsWF
      AnimationMode   = LOOP
    End
    AliasConditionState = NIGHT DAMAGED
    AliasConditionState = SNOW DAMAGED
    AliasConditionState = NIGHT SNOW DAMAGED

    ConditionState    = REALLYDAMAGED RUBBLE
      Model           = IQ__IQFlag_HsWF
      Animation       = IQ__IQFlag_HsWF.IQ__IQFlag_HsWF
      AnimationMode   = LOOP
    End
  End

  PlacementViewAngle  = -135

  DisplayName      = OBJECT:IraqMissileFactory
  Side             = Iraq
  EditorSorting    = STRUCTURE

  Prerequisites
    Object = Iraq_SupplyCenter
  End

  BuildCost        = 1500
  BuildTime        = 16.0
  EnergyProduction = -3
  CommandSet       = Iraq_MissileFactoryCommandSet
  VisionRange     = 200.0
  ShroudClearingRange = 200
  ArmorSet
    Conditions        = None
    Armor             = GLAUpgradedStructureArmor
    DamageFX          = StructureDamageFXNoShake
  End

  ExperienceValue     = 200 200 200 200

  VoiceSelect = WarFactoryGLASelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End

  RadarPriority     = STRUCTURE
  KindOf            = PRELOAD STRUCTURE SELECTABLE IMMOBILE CAPTURABLE AUTO_RALLYPOINT MP_COUNT_FOR_VICTORY SCORE_CREATE FS_FACTORY FS_TECHNOLOGY
  Body              = StructureBody ModuleTag_05
    MaxHealth       = 2000.0
    InitialHealth   = 2000.0
    SubdualDamageCap = 2200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
  Behavior             = DestroyDie ModuleTag_07
  End
  Behavior             = CreateObjectDie ModuleTag_08
    CreationList  = OCL_LargeStructureDebris
  End
  Behavior             = FXListDie ModuleTag_09
    DeathFX       = FX_StructureMediumDeath
  End

  Behavior = ProductionUpdate ModuleTag_10
    NumDoorAnimations            = 1
    DoorOpeningTime              = 2000
    DoorWaitOpenTime             = 3000
    DoorCloseTime                = 2000
    ConstructionCompleteDuration = 1500
  End

  Behavior = DefaultProductionExitUpdate ModuleTag_11
    UnitCreatePoint   = X: -20.0  Y:-15.0   Z:0.0
    NaturalRallyPoint = X: 40.0  Y:-15.0   Z:0.0
  End

  Behavior = FlammableUpdate ModuleTag_14
    AflameDuration = 5000
    AflameDamageAmount = 5
    AflameDamageDelay = 500
  End

  Behavior = TransitionDamageFX ModuleTag_31
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End

  Geometry            = BOX
  GeometryMajorRadius = 40.0
  GeometryMinorRadius = 62.0
  GeometryHeight      = 25.0
  GeometryIsSmall     = No
  FactoryExitWidth    = 25
  Shadow              = SHADOW_VOLUME
  BuildCompletion     = PLACED_BY_PLAYER

End
