; SPECTER — Iraq Missile Factory (IQMISS donor ART)
; Separate building from Iraq_WarFactory / Iraq_WarFactory_T / Irq_WarFactory.

Object Iraq_MissileFactory

  ; *** ART Parameters ***
  SelectPortrait         = LSFDaoDanTBO
  ButtonImage            = LSFDaoDanTBO

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = No

    DefaultConditionState
      Model = LSFIQMCheChang
    End
    ConditionState = DAMAGED
      Model = LSFIQMCheChangd
      ParticleSysBone = Smoke01 SmolderingSmoke
      ParticleSysBone = Smoke02 SmolderingSmoke
      ParticleSysBone = Smoke03 SmolderingSmoke
      ParticleSysBone = Smoke04 SmolderingFire
    End
    ConditionState = REALLYDAMAGED RUBBLE
      Model = LSFIQMCheChange
      ParticleSysBone = Smoke01 SmolderingSmoke
      ParticleSysBone = Smoke02 SmolderingSmoke
      ParticleSysBone = Smoke03 SmokeFactionLarge
      ParticleSysBone = Smoke04 SmokeFactionLarge
      ParticleSysBone = Smoke01 SmolderingFire
      ParticleSysBone = Smoke02 SmolderingFire
      ParticleSysBone = Smoke03 FireFactionLarge
      ParticleSysBone = Smoke04 SparksLarge
    End
  End

  PlacementViewAngle = -135

  Draw = W3DModelDraw ModuleTag_HousecolorDraw
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model = LSFMCheChangCB
      Animation = LSFMCheChangCB.LSFMCheChangCB
      AnimationMode = LOOP
      AnimationSpeedFactorRange = 0.3 0.3
    End
    AliasConditionState = WEAPONSET_PLAYER_UPGRADE
    AliasConditionState = REALLYDAMAGED
    AliasConditionState = WEAPONSET_PLAYER_UPGRADE REALLYDAMAGED
    AliasConditionState = RUBBLE
    AliasConditionState = WEAPONSET_PLAYER_UPGRADE RUBBLE
    AliasConditionState = ENEMYNEAR RUBBLE
    AliasConditionState = ENEMYNEAR WEAPONSET_PLAYER_UPGRADE RUBBLE
  End

  ; *** DESIGN parameters ***
  DisplayName      = OBJECT:Iraq_MissileFactory
  Side             = Iraq
  EditorSorting    = STRUCTURE
  Prerequisites
    Object = Iraq_SupplyCenter
  End
  BuildCost        = 2500
  BuildTime        = 18.0
  EnergyProduction = -3
  CommandSet       = Iraq_MissileFactoryCommandSet
  VisionRange      = 200.0
  ShroudClearingRange = 200
  ArmorSet
    Conditions      = None
    Armor           = StructureArmor
    DamageFX        = StructureDamageFXNoShake
  End
  ExperienceValue     = 200 200 200 200

  ; *** AUDIO Parameters ***
  VoiceSelect = WarFactoryGLASelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority   = STRUCTURE
  KindOf          = PRELOAD STRUCTURE SELECTABLE IMMOBILE REPAIR_PAD CAPTURABLE FS_TECHNOLOGY AUTO_RALLYPOINT MP_COUNT_FOR_VICTORY SCORE_CREATE FS_FACTORY FS_WARFACTORY
  Body            = StructureBody ModuleTag_09
    MaxHealth       = 2500.0
    InitialHealth   = 2500.0
    SubdualDamageCap = 2200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
  Behavior = ProductionUpdate ModuleTag_10
    NumDoorAnimations            = 1
    DoorOpeningTime              = 3250
    DoorWaitOpenTime             = 3000
    DoorCloseTime                = 4000
    ConstructionCompleteDuration = 1500
  End
  Behavior = DefaultProductionExitUpdate ModuleTag_11
    UnitCreatePoint   = X:  0.0  Y: -25.0   Z:0.0
    NaturalRallyPoint = X: 55.0  Y: -25.0   Z:0.0
  End
  Behavior = RepairDockUpdate ModuleTag_12
    TimeForFullHeal   = 5000
    NumberApproachPositions = 5
  End
  Behavior = BaseRegenerateUpdate ModuleTag_13
  End
  Behavior = TransitionDamageFX ModuleTag_15
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End
  Behavior = FlammableUpdate ModuleTag_18
    AflameDuration = 5000
    AflameDamageAmount = 5
    AflameDamageDelay = 500
  End
  Behavior             = CreateObjectDie ModuleTag_20
    CreationList  = OCL_LargeStructureDebris
  End
  Behavior             = FXListDie ModuleTag_21
    DeathFX       = FX_StructureMediumDeath
  End
  Behavior             = DestroyDie ModuleTag_22
  End

  Geometry             = BOX
  GeometryMajorRadius  = 43.0
  GeometryMinorRadius  = 52.0
  GeometryHeight       = 27.0
  GeometryIsSmall      = No
  FactoryExitWidth     = 30
  Shadow               = SHADOW_VOLUME
  BuildCompletion      = PLACED_BY_PLAYER

End
