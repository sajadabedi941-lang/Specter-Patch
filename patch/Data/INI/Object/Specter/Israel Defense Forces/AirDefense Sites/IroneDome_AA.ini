    DefaultConditionState
      Model = Spec_Indic_AAM
    End
    ConditionState = DYING
      Model = None
    End
  End
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:IroneDome
  Side                = AmericaAirForceGeneral
  EditorSorting       = VEHICLE
  WeaponSet
    Conditions        = None 
    Weapon            = PRIMARY   IroneDome_AA
  End
  ArmorSet
    Conditions        = None
    Armor             = TruckArmor
    DamageFX          = TruckDamageFX
  End
  VisionRange         = 870
  ShroudClearingRange = 200
  ; *** ENGINEERING Parameters ***
  KindOf = CAN_ATTACK PRELOAD CLICK_THROUGH SPAWNS_ARE_THE_WEAPONS
  Body = ActiveBody ModuleTag_02
    MaxHealth     = 1000.0
    InitialHealth = 1000.0
    SubdualDamageCap = 1200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = Yes Stealthed
    MoodAttackCheckRate        = 50
  End
  Behavior        = RebuildHoleExposeDie ModuleTag_08f234
    HoleName      = IroneDomeDamagedDamaged
    HoleMaxHealth = 500.0
  End
  ClientUpdate = AnimatedParticleSysBoneClientUpdate ModuleTag_Client05
  End
  Behavior  = PhysicsBehavior ModuleTag_06
