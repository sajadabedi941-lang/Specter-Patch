; SPECTER PATCH — Israel raw mobile chassis (stage 1)
; Independent Object. Vendor originals in patch/tools/ are untouched.
; Stage 1: display + move only. No Weapon, no DeployStyleAIUpdate,
; no construct button, no CommandSet, no HQ/Iron Dome/Barak-8 edits.

Object Israel_VehicleBONDKS

  ; *** ART Parameters ***
  SelectPortrait         = us_mim90d
  ButtonImage            = us_mim90d

  Draw = W3DTruckDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model              = BONDKS
    End
    ConditionState       = MOVING
      Model              = BONDKS
    End
    ConditionState       = REALLYDAMAGED
      Model              = BONDKS
    End
    ConditionState       = REALLYDAMAGED MOVING
      Model              = BONDKS
    End
    TrackMarks           = EXTireTrack.tga
    Dust                 = ScudLauncherDust
    DirtSpray            = RocketBuggyDirtSpray
  End

  PlacementViewAngle     = -45

  ; *** DESIGN parameters ***
  DisplayName            = OBJECT:Israel_VehicleBONDKS
  Side                   = Israel
  EditorSorting          = VEHICLE
  TransportSlotCount     = 6
  BuildCost              = 1000
  BuildTime              = 25.0
  VisionRange            = 200
  ShroudClearingRange    = 200
  ArmorSet
    Conditions           = None
    Armor                = TruckArmor
    DamageFX             = TankDamageFX
  End
  CrusherLevel           = 2
  CrushableLevel         = 2

  ; *** AUDIO Parameters ***
  VoiceSelect            = ScudLauncherVoiceSelect
  VoiceMove              = ScudLauncherVoiceMove
  VoiceGuard             = ScudLauncherVoiceMove
  SoundMoveStart         = ScudLauncherMoveStart
  SoundMoveStartDamaged  = ScudLauncherMoveStart
  UnitSpecificSounds
    VoiceCreate          = ScudLauncherVoiceCreate
    TruckLandingSound    = NoSound
    TruckPowerslideSound = NoSound
    VoiceCrush           = ScudLauncherVoiceCrush
    VoiceEnter           = ScudLauncherVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS VEHICLE SCORE

  Body = ActiveBody ModuleTag_02
    MaxHealth            = 1000.0
    InitialHealth        = 1000.0
    SubdualDamageCap     = 1200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End

  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = No
  End

  Locomotor = SET_NORMAL BasicTruckLocomotor

  Behavior = PhysicsBehavior ModuleTag_04
    Mass                 = 400.0
  End

  Behavior = DestroyDie ModuleTag_05
  End

  Behavior = FlammableUpdate ModuleTag_06
    AflameDuration       = 5000
    AflameDamageAmount   = 3
    AflameDamageDelay    = 500
  End

  Geometry               = BOX
  GeometryMajorRadius    = 18.0
  GeometryMinorRadius    = 7.0
  GeometryHeight         = 11.5
  GeometryIsSmall        = No
  Shadow                 = SHADOW_VOLUME
  ShadowSizeX            = 45

End
