  End
  ; ***DESIGN parameters ***
  DisplayName          = OBJECT:ArrowIS
  Side                 = AmericaAirForceGeneral
  EditorSorting        = VEHICLE
  TransportSlotCount   = 6
  WeaponSet
    Conditions         = None 
    Weapon             = SECONDARY S400R_Deploy
    Weapon             = TERTIARY  S400R_Deploy_ABM
  End
  ArmorSet
    Conditions         = None
    Armor              = LargeVehicleArmor
    DamageFX           = TruckDamageFX
  End
  Prerequisites
    Object = AirF_AmericaStrategyCenter
    Science = SCIENCE_IDF_Lvl3Tech
  End
  BuildCost            = 3200
  BuildTime            = 23.0
  VisionRange          = 50
  ShroudClearingRange  = 100
  ExperienceValue      = 160 160 260 420
  ExperienceRequired   = 0 500 1000 1700
  IsTrainable          = Yes
  CrusherLevel         = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel       = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet           = S400ECommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect = ScudLauncherVoiceSelect
  VoiceMove = ScudLauncherVoiceMove
  VoiceGuard = ScudLauncherVoiceMove
  VoiceAttack = ScudLauncherVoiceAttack
  SoundMoveStart = ScudLauncherMoveStart
  SoundMoveStartDamaged = ScudLauncherMoveStart
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate       = ScudLauncherVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop
    TruckLandingSound = NoSound
    TruckPowerslideSound = NoSound
    VoiceCrush = ScudLauncherVoiceCrush
    VoiceEnter = ScudLauncherVoiceMove
    VoicePrimaryWeaponMode = ScudLauncherVoiceModeHiEx
    VoiceSecondaryWeaponMode = ScudLauncherVoiceModeAnthrax
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE NO_HEAL_ICON DONT_AUTO_CRUSH_INFANTRY CAN_CAST_REFLECTIONS VEHICLE SCORE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 400.0
    InitialHealth   = 400.0
    SubdualDamageCap = 480
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
   Behavior = DeployStyleAIUpdate ModuleTag_03
    AutoAcquireEnemiesWhenIdle = No
    PackTime = 5000
    UnpackTime = 5000
    TurretsFunctionOnlyWhenDeployed = Yes
    TurretsMustCenterBeforePacking = Yes
    ManualDeployAnimations = Yes
  End
  Locomotor = SET_NORMAL      Generic8x8Locomotor
  Behavior  = PhysicsBehavior ModuleTag_07_1
  Mass      = 400.0
  End

;------------------------ Death ----------------------------------
  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_07
    DeathTypes = ALL -SPLATTED -EXTRA_8
    ProbabilityModifier = 50
    DestructionDelay = 2000
    DestructionDelayVariance = 300
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_SCUDLauncherDeathEffect
    FX  = FINAL    FX_ScudLauncherExplosionOneFinal
  End
  Behavior = SlowDeathBehavior ModuleTag_111
    DeathTypes = NONE +SPLATTED
    OCL = FINAL    OCL_Arrow_Deployed
  End
  Behavior = SlowDeathBehavior ModuleTag_222
    DeathTypes = NONE +EXTRA_8
    OCL = FINAL    OCL_Arrow_Deployed_ABM
  End
  Behavior = ProductionUpdate ModuleTag_05
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  Behavior = TransitionDamageFX ModuleTag_09
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = FlammableUpdate ModuleTag_11
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
;------------------------ End Of Death ----------------------------------



;------------------------ CombatModes -----------------------------------


  Behavior        = CommandSetUpgrade ModuleTag_CombatMode_AA
  TriggeredBy     = Upgrade_AADS_AA_Mode
  CommandSet      = S400ECommandSet_AA
  End
  Behavior        = CommandSetUpgrade ModuleTag_CombatMode_ABM
  TriggeredBy     = Upgrade_AADS_ABM_Mode
  CommandSet      = S400ECommandSet_ABM
  End

;----------------------- End Of CombatModes -----------------------------

  Geometry            = BOX
  GeometryMajorRadius = 45.0
  GeometryMinorRadius = 12.0
  GeometryHeight      = 16.0     
  GeometryIsSmall     = Yes
  Shadow              = SHADOW_VOLUME 
  ShadowSizeX         = 45
End
