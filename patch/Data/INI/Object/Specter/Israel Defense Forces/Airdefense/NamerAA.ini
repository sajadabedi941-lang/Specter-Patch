;------------------------------------------------------------------------------
Object AirF_AmericaTankAvenger

  ; *** ART Parameters ***
  SelectPortrait         = isi_nameraaa
  ButtonImage            = isi_nameraaa
  
  UpgradeCameo1 = ;Upgrade_AmericaBattleDrone
  UpgradeCameo2 = ;Upgrade_AmericaScoutDrone
  UpgradeCameo3 = ;Upgrade_AmericaHellfireDrone
  UpgradeCameo4 = Upgrade_AmericaAdvancedTraining
  UpgradeCameo5 = Upgrade_AmericaCompositeArmor
  
  Draw = W3DTankDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model               = Isr_Namer_AA
      Turret              = Turret
      TurretPitch         = TURRETLE
      WeaponFireFXBone    = PRIMARY WeaponA
      WeaponRecoilBone    = PRIMARY Barrel
      WeaponLaunchBone    = PRIMARY WeaponA
      WeaponMuzzleFlash   = PRIMARY WeaponA
      WeaponFireFXBone    = SECONDARY WeaponA
      WeaponLaunchBone    = SECONDARY WeaponA
      WeaponFireFXBone    = TERTIARY WeaponB
      WeaponLaunchBone    = TERTIARY WeaponB
    End
    ConditionState        = REALLYDAMAGED
      Model               = Isr_Namer_AA
      Turret              = Turret
      TurretPitch         = TURRETLE
      WeaponFireFXBone    = PRIMARY WeaponA
      WeaponRecoilBone    = PRIMARY Barrel
      WeaponLaunchBone    = PRIMARY WeaponA
      WeaponMuzzleFlash   = PRIMARY WeaponA
      WeaponFireFXBone    = SECONDARY WeaponA
      WeaponLaunchBone    = SECONDARY WeaponA
      WeaponFireFXBone    = TERTIARY WeaponB
      WeaponLaunchBone    = TERTIARY WeaponB
    End
    ConditionState        = RUBBLE
      Model               = Isr_Namer_AA
    End
    
    TrackMarks              = EXTnkTrack.tga
    TreadAnimationRate      = 4.0  ; amount of tread texture to move per second
  End

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:NamerAA
  Side = AmericaAirForceGeneral
  EditorSorting   = VEHICLE
  TransportSlotCount = 3                 ;how many "slots" we take in a transport (0 == not transportable)
  WeaponSet
    Conditions           = None 
    Weapon               = PRIMARY     25mm_M242Gun
    PreferredAgainst     = PRIMARY     INFANTRY STRUCTURE VEHICLE
    Weapon               = SECONDARY   25mm_M242Gun_AAA
    PreferredAgainst     = SECONDARY   BALLISTIC_MISSILE AIRCRAFT
    Weapon               = TERTIARY    SRHSAM_Fim92Stinger_M6A2
    PreferredAgainst     = TERTIARY    BALLISTIC_MISSILE AIRCRAFT
    ;AutoChooseSources   = TERTIARY   FROM_PLAYER FROM_AI FROM_SCRIPT
  End
  ArmorSet
    Conditions           = None
    Armor                = M6_Armor
    DamageFX             = TankDamageFX
  End
  BuildCost              = 720
  BuildTime              = 12.0          ;in seconds    
  VisionRange            = 600
  ShroudClearingRange = 180
  Prerequisites
    ;Object = AmericaWarFactory
  End

  ExperienceValue        = 100 100 200 400 ;Experience point value at each level
  ExperienceRequired     = 0 200 300 600 ;Experience points needed to gain each level

  IsTrainable     = Yes
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet      = AmericaTankAvengerCommandSet
    
  ; *** AUDIO Parameters ***
  VoiceSelect = AvengerVoiceSelect
  VoiceMove = AvengerVoiceMove
  VoiceGuard = AvengerVoiceMove
  VoiceAttack = AvengerVoicePaint
  VoiceAttackAir = AvengerVoiceAttack
  SoundMoveStart = HumveeMoveStart
  SoundMoveStartDamaged = HumveeMoveStart

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate     = AvengerVoiceCreate
    TurretMoveLoop = NoSound
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    VoiceCrush = NoSound
    VoiceEnter = AvengerVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE
  
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 600.0
    InitialHealth   = 600.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 1200
    SubdualDamageHealRate = 900
    SubdualDamageHealAmount = 50
  End
  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate = 360
      TurretPitchRate = 360
      AllowsPitch = Yes
      ControlledWeaponSlots = PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes Stealthed
    MoodAttackCheckRate        = 250
  End
  Locomotor            = SET_NORMAL VTA-903T_8-cylinder 
  Behavior = PhysicsBehavior ModuleTag_04
    Mass                 = 200.0
  End
  ; Turret fly off death
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 50
    DestructionDelay  = 500
    DestructionDelayVariance  = 100
    FX  = INITIAL  FX_GenericTankDeathEffect
    OCL = MIDPOINT OCL_MicrowaveTankDeath
    FX  = FINAL    FX_GenericTankDeathExplosion
  End

  Behavior                 = TransitionDamageFX ModuleTag_12
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End

  Behavior = DestroyDie ModuleTag_13
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  ; A crushing defeat
  Behavior = FXListDie ModuleTag_14
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End

  Behavior = CreateObjectDie ModuleTag_15
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_MicrowaveTankDeath_CrushEffect
  End

  Behavior                    = CreateCrateDie ModuleTag_CratesChange
   CrateData             = SalvageCrateData
   ;CrateData             = EliteTankCrateData
   ;CrateData             = HeroicTankCrateData
  End
  Behavior = MaxHealthUpgrade ModuleTag_18
    TriggeredBy   = Upgrade_AmericaCompositeArmor
    AddMaxHealth  = 100.0
    ChangeType    = ADD_CURRENT_HEALTH_TOO   ;Choices are PRESERVE_RATIO, ADD_CURRENT_HEALTH_TOO, and SAME_CURRENTHEALTH
  End
  Behavior = ProductionUpdate ModuleTag_Prod01
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Behavior = CommandButtonHuntUpdate  ModuleTag_24 ; allows use of command button hunt script with this unit. 
  End
  Geometry               = BOX
  GeometryMajorRadius    = 22.0
  GeometryMinorRadius    = 17.0
  GeometryHeight         = 10.0     
  GeometryIsSmall        = Yes    
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End
