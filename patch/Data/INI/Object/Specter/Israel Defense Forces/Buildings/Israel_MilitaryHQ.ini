; PatchBaseTime = 4.0
; CountryBalance side=Israel origin=Domestic tech=Standard cat=Building key=UnitCostMult => 1776 / 3.1s
; Phase F Advanced Military Headquarters
; PatchBaseCost = 2000
; PatchBaseTime = 4.0
Scale = 0.9
  ; *** ART Parameters ***
  SelectPortrait         = us_commandcenter
  ButtonImage            = us_commandcenter

  ; ----- The actual command center
  Draw                   = W3DModelDraw ModuleTag_0981
     
