    ; day
    ConditionState       = NONE
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
    
    ConditionState       = DAMAGED
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
    ConditionState       = REALLYDAMAGED RUBBLE
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
  End

  PlacementViewAngle = -175

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:Israel_MilitaryHQ
  Side                = Israel
  EditorSorting       = STRUCTURE
  BuildCost           = 1776
  BuildTime           = 3.1           ; in seconds
