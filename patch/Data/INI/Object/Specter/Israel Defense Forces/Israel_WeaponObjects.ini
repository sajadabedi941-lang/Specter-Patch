Object PredatorHawk_Object
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState
      Model             = ISR_PHM
      ParticleSysBone   = ENGINE01 GMLRS_LG_Trail
      ParticleSysBone = Engine01 AGM_MissileLenzFlare
      ParticleSysBone = Engine01 AGM_MissileFlare
    End
    ConditionState = POWER_PLANT_UPGRADED
      Model           = ISR_PHM
    End
  End

  ; *** AUDIO parameters ***
  SoundAmbient = MissilesIncomingWhistle

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:PH
  EditorSorting   = SYSTEM
  VisionRange = 20.0
  ShroudClearingRange = 20
  ArmorSet
    Conditions      = None
    Armor           = SRBMArmor
    DamageFX        = None
  End
  SoundAmbient  = GenericMissileAmbientLoop

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE BALLISTIC_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 700.0
    InitialHealth   = 700.0
    SubdualDamageCap = 200
    SubdualDamageHealRate = 100000
    SubdualDamageHealAmount = 50
  End

; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
    ; we detonated normally.
    ; no FX, just quiet destroy ourselves
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    ; shot down by laser.
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    ; shot down by nonlaser.
    FX         = FX_GenericMissileDeath
    Weapon     = FX_122mmWarheadExplosionExtra
  End
; ---- end Projectile death behaviors
  Behavior = FireWeaponUpdate ModuleTag_Booster2
      Weapon = SRBM_Boosters_Igniter_Isk
      InitialDelay = 4500
  End
  Behavior = PowerPlantUpgrade ModuleTag_IBK
    TriggeredBy = Upgrade_ICBM_BoosterKiller
  End
  Behavior = PowerPlantUpdate ModuleTag_IBKT
    RodsExtendTime = 6500
  End

  Behavior = PhysicsBehavior ModuleTag_05
    Mass                  = 170
    ShockResistance       = 0.8
    AerodynamicFriction   = 1.0  ; this is now friction-per-sec
    CenterOfMassOffset    = 2    ; Default of 0 means nothing tips as it falls.  Positive tips forward, negative tips back
    AllowBouncing = Yes
    AllowCollideForce = Yes
    KillWhenRestingOnGround = No ;Yes
  End
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_WEC
    DeathWeapon   = HE_BGM109_450kg
    StartsActive  = Yes                      
  End

  Behavior = MissileAIUpdate ModuleTag_01ff8
    TryToFollowTarget     = No
    DetonateCallsKill     = Yes
    FuelLifetime          = 999999
    DetonateCallsKill = Yes
    InitialVelocity       = 320                ; in dist/sec
    ;IgnitionDelay         = 800
    ;IgnitionFX            = None
    DistanceToTravelBeforeTurning = 250
    DistanceToTargetBeforeDiving = 300
  End
  Locomotor = SET_NORMAL M48_QRU_MissileLocomotor
;---------- Radar Signature --------------- ;
  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE
  End
;---------- End Of Radar Signature ----------;

  Geometry = Cylinder
  GeometryMajorRadius = 2.0
  GeometryHeight = 3.0
  GeometryIsSmall = Yes
  Shadow = SHADOW_DECAL
End
