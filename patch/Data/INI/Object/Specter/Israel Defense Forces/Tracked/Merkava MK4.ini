;------------------------------------------------------------------------------
Object Israel_MerkavaMk4

  ; *** ART Parameters ***
  SelectPortrait         = isi_merkavamk4
  ButtonImage            = isi_merkavamk4
  UpgradeCameo1 = Upgrade_AmericaCompositeArmor
  Draw = W3DOverlordTankDraw ModuleTag_01
    ExtraPublicBone = FIREPOINT01
    ConditionState        = NONE
      Model               = Isr_MerkavaMk4
      Turret              = Turret
      WeaponFireFXBone    = PRIMARY turretms01
      WeaponRecoilBone    = PRIMARY Barrel
      WeaponMuzzleFlash   = PRIMARY turretms01
      WeaponLaunchBone    = PRIMARY turretms01
      WeaponFireFXBone    = SECONDARY TURRETMS03
      WeaponMuzzleFlash   = SECONDARY TURRETMS03
      WeaponLaunchBone    = SECONDARY TURRETMS03
      WeaponFireFXBone    = TERTIARY turretms01
      WeaponLaunchBone    = TERTIARY turretms01
    End
    ConditionState       = REALLYDAMAGED
      Model              = Isr_MerkavaMk4D
      Turret              = Turret
      WeaponFireFXBone    = PRIMARY turretms01
      WeaponRecoilBone    = PRIMARY Barrel
      WeaponMuzzleFlash   = PRIMARY turretms01
      WeaponLaunchBone    = PRIMARY turretms01
      WeaponFireFXBone    = SECONDARY TURRETMS03
      WeaponMuzzleFlash   = SECONDARY TURRETMS03
      WeaponLaunchBone    = SECONDARY TURRETMS03
      WeaponFireFXBone    = TERTIARY turretms01
      WeaponLaunchBone    = TERTIARY turretms01
    End
    ConditionState       = RUBBLE
      Model              = Isr_MerkavaMk4D
    End
    
    TrackMarks           = EXTnkTrack.tga
    TreadAnimationRate      = 2.0  ; amount of tread texture to move per second
    TreadDriveSpeedFraction = 0.3  ; fraction of locomotor speed below which treads stop moving.
    TreadPivotSpeedFraction = 0.6  ; fraction of locomotor speed below which we allow pivoting.
    OkToChangeModelColor = Yes
  End

  ; ***DESIGN parameters ***
  DisplayName            = OBJECT:merkmk4
  Side                   = AmericaAirForceGeneral
  EditorSorting          = VEHICLE
  TransportSlotCount     = 3
  WeaponSet
    Conditions           = None 
    Weapon               = PRIMARY     120mm_MG253_APFSDS
    Weapon               = SECONDARY   7_62mm_Coxail_M240M
    Weapon               = TERTIARY    120mm_L-44_M256A1_HE
    AutoChooseSources    = TERTIARY    None
  End
  ArmorSet
    Conditions           = None
    Armor                = M1A2Sepv1_DU_Armor
    DamageFX             = TankDamageFX
  End
  BuildCost              = 800
  BuildTime              = 17.0          ;in seconds    
  VisionRange            = 520
  ShroudClearingRange = 400
  Prerequisites
    ;Object = AmericaWarFactory
  End
  ExperienceValue        = 100 100 200 400 ;Experience point value at each level
  ExperienceRequired     = 0 200 300 600 ;Experience points needed to gain each level
  IsTrainable            = Yes  ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet             = MerkavaMk4commandset
  
  ; *** AUDIO Parameters ***
  VoiceSelect           = CrusaderTankVoiceSelect
  VoiceMove             = CrusaderTankVoiceMove
  VoiceGuard            = CrusaderTankVoiceMove
  VoiceAttack           = CrusaderTankVoiceAttack
  SoundMoveStart        = CrusaderTankMoveStart
  SoundMoveStartDamaged = CrusaderTankMoveStart
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate         = CrusaderTankVoiceCreate
    VoiceEnter             = CrusaderTankVoiceMove
    TurretMoveStart     = NoSound
    TurretMoveLoop      = TurretMoveLoop
    SoundEject          = PilotSoundEject
    VoiceEject          = PilotVoiceEject
    VoiceCrush          = CrusaderTankVoiceCrush
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = PRELOAD TRANSPORT SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE
  
  Body                   = ActiveBody ModuleTag_02
    MaxHealth       = 1300
    InitialHealth   = 1300

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 960
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End

  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate       = 175 ;60   // turn rate, in degrees per sec
      ControlledWeaponSlots= PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes
  End
  Locomotor            = SET_NORMAL GD883_MTU883
  Behavior = PhysicsBehavior ModuleTag_04
    Mass                 = 500.0
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_Trophy2
    WeaponTemplate        = TrophyHardKillSystem
    PrimaryTargetTypes    = SMALL_MISSILE PROJECTILE
    ScanRate              = 800
    ScanRange             = 200
    PredictTargetVelocityFactor = 3.0
  End
  Behavior = ProductionUpdate ModuleTag_07
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  Behavior = TransportContain ModuleTag_22
    Slots                 = 5
    ScatterNearbyOnExit   = Yes
    HealthRegen%PerSec    = 8
    EnterSound            = GarrisonEnter
    ExitSound             = GarrisonExit
    DamagePercentToUnits  = 60%
    AllowInsideKindOf     = INFANTRY
    ExitDelay             = 250
    NumberOfExitPaths     = 3 ; Defaults to 1.  Set 0 to not use ExitStart/ExitEnd, set higher than 1 to use ExitStart01-nn/ExitEnd01-nn
    GoAggressiveOnExit    = Yes ; AI Will tell people to set their mood to Aggressive on exiting
  End
  Behavior = OverlordContain ModuleTag_RCWS
    Slots                   = 1
    DamagePercentToUnits    = 100%
    AllowInsideKindOf       = PORTABLE_STRUCTURE
    PassengersAllowedToFire = Yes
    PassengersInTurret      = Yes ; My passengers ride in my turret, that's where the Firepoint bones are
    ExperienceSinkForRider  = Yes ; I get the Exp for things my turret friend kills
    PayloadTemplateName     = America_RCWS
  End
  ; Turret fly off death
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 80
    DestructionDelay  = 5000
    DestructionDelayVariance  = 10
    FX  = INITIAL  FX_GenericTankAmmoCockoff
    OCL = MIDPOINT OCL_MerkavaMk4DeathEffect
    FX  = FINAL    FX_GenericFreeFallBombsExplosion
    OCL = FINAL    OCL_MerkavaMk4Turret
  End
  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_11
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 20
    DestructionDelay  = 5000
    DestructionDelayVariance  = 300
    FX  = INITIAL  FX_GenericTankAmmoCockoff
    OCL = FINAL    OCL_MerkavaMk4DeathEffect
    FX  = FINAL    FX_GenericTankDeathExplosion
  End
  Behavior                 = TransitionDamageFX ModuleTag_12
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
  End
  Behavior                 = TransitionDamageFX ModuleTag_CFS
    ReallyDamagedParticleSystem1 = Bone:Smoke02 RandomBone:Yes PSys:GenericDamagedTankSmoke
  End
  Behavior                 = TransitionDamageFX ModuleTag_CS
    RubbleParticleSystem1  = Bone:Fire01 RandomBone:Yes PSys:TankFire
  End
  Behavior = DestroyDie ModuleTag_13
    DeathTypes = NONE +CRUSHED +SPLATTED
  End
  ; A crushing defeat
  Behavior = FXListDie ModuleTag_14
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = CreateObjectDie ModuleTag_15
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_MerkavaTank_CrushEffect
  End
  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Geometry               = BOX
  GeometryMajorRadius    = 25.0
  GeometryMinorRadius    = 20.0
  GeometryHeight         = 10.0     
  GeometryIsSmall        = Yes    
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End
;---------------------------------------------------------------------------
Object DeadMerkavaHulk

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = Isr_MerkavaMk4R
      ParticleSysBone = Smoke01 SmallLightSmokeColumn
      ParticleSysBone = Smoke02 SmallLightSmokeColumn
    End
  End

  ; ***DESIGN parameters ***
  EditorSorting   = DEBRIS

  ; *** ENGINEERING Parameters ***
  KindOf =  NO_COLLIDE HULK UNATTACKABLE

  Behavior = PhysicsBehavior ModuleTag_03
    Mass = 100.0
    AllowBouncing = Yes
    KillWhenRestingOnGround = Yes
  End
  Behavior = LifetimeUpdate ModuleTag_04
    MinLifetime = 9500   ; min lifetime in msec
    MaxLifetime = 12600   ; max lifetime in msec
  End

  Behavior = SlowDeathBehavior ModuleTag_05
    SinkDelay         = 12500
    SinkRate          = 2     ; in Dist/Sec
    DestructionDelay  = 13000
  End
End