Object NatoRadarTRML4D_AI
Scale = 0.82
  ; *** ART Parameters ***
  SelectPortrait         = Nat_trml4d
  ButtonImage            = Nat_trml4d
  Draw = W3DTruckDraw ModuleTag_01

    DefaultConditionState
      Model               = NAT_TRML_A
      Animation           = NAT_TRML_A.NAT_TRML_A
      AnimationMode       = LOOP
    End
    ConditionState        = REALLYDAMAGED 
      Model               = NAT_TRML_A
      Animation           = NAT_TRML_A.NAT_TRML_A
      AnimationMode       = LOOP
    End
    AliasConditionState   = RUBBLE
    OkToChangeModelColor  = Yes
  End
  ; --- Indicator
  Draw = W3DModelDraw ModuleTag_Indicator
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = Spec_Indic_Srch
    End
    ConditionState = DYING
      Model = None
    End
  End
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:TRML4D
  Side                = Nato
  EditorSorting       = STRUCTURE
  TransportSlotCount  = 6
  ArmorSet
    Conditions      = None
    Armor           = AATruckArmor
    DamageFX        = TruckDamageFX
  End
  VisionRange          = 200
  ShroudClearingRange  = 300
  CrushableLevel       = 5
  CommandSet           = None
  ; *** ENGINEERING Parameters ***
  RadarPriority       = STRUCTURE
  KindOf              = SELECTABLE CAN_CAST_REFLECTIONS PRELOAD STRUCTURE IMMOBILE
  Body                = StructureBody ModuleTag_02
    MaxHealth       = 800
    InitialHealth   = 800
    SubdualDamageCap = 1000
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = PhysicsBehavior ModuleTag_Mass
    Mass = 500.0
  End
  Behavior        = RebuildHoleExposeDie ModuleTag_08f234
    HoleName      = NatoTRML4Damaged
    HoleMaxHealth = 500.0
    DeathTypes    = ALL -TOPPLED
  End
  Behavior = ProductionUpdate ModuleTag_UL1
    MaxQueueEntries = 1
  End
  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_08
    DeathTypes = ALL -TOPPLED
    ProbabilityModifier = 50
    DestructionDelay = 2000
    DestructionDelayVariance = 300
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_RadarVanDeathEffect2
    FX  = FINAL    FX_ScudLauncherExplosionOneFinal
  End
  Behavior = SlowDeathBehavior ModuleTag_TOPPLED01
    DeathTypes = NONE +TOPPLED
  End
  Behavior = TransitionDamageFX ModuleTag_10c23
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = FlammableUpdate ModuleTag_12hb4
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
;-------------------- Fire Control System --------------------
  Behavior                    = FireWeaponUpdate ModuleTag_FCR
    Weapon                    = AN_MPQ65_WaveEmitter
    ExclusiveWeaponDelay      = 1000
  End
  Behavior = StealthDetectorUpdate ModuleTag_StealthDetection_Radar_Missiles
    DetectionRate             = 500
    DetectionRange            = 470
    ExtraForbiddenKindOf      = INFANTRY
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
  End
;-------------------- End Of Fire Control System --------------------

  Geometry            = BOX
  GeometryMajorRadius = 42.0
  GeometryMinorRadius = 10.0
  GeometryHeight      = 20.0     
  GeometryIsSmall     = Yes
  Shadow              = SHADOW_VOLUME 
  ShadowSizeX         = 45
End
;------------------------------------------------------------------------------
Object NatoTRML4Damaged
Scale = 0.82

  ; *** ART Parameters ***
  SelectPortrait           = Nat_trml4d
  ButtonImage              = Nat_trml4d
  Draw                     = W3DModelDraw  ModuleTag_01
    OkToChangeModelColor   = Yes
    ConditionState         = NONE
      Model                = NAT_TRML_A
    End
    ConditionState         = DAMAGED
      Model                = NAT_TRML_A
      ParticleSysBone      = Smoke01 SteamVent
    End
    ConditionState         = REALLYDAMAGED
      Model                = NAT_TRML_A
      ParticleSysBone      = Smoke01 SteamVent
      ParticleSysBone      = Smoke02 SteamVent
      ParticleSysBone      = Fire01 GLAPowerPlantFlame
      ParticleSysBone      = Fire02 GLAPowerPlantFlame
      ParticleSysBone      = Fire03 GLAPowerPlantFlame
    End
  End
  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:DamagedRadar
  Side              = Nato
  EditorSorting     = SYSTEM
  Prerequisites
    Object = AmericaCommandCenter
  End
  BuildCost         = 100
  BuildTime         = 10.0           ; in seconds
  EnergyProduction  = 0
  VisionRange       = 50.0           ; Shroud clearing distance
  ShroudClearingRange = 50
  ArmorSet
    Conditions      = None
    Armor           = StructureArmor
    DamageFX        = StructureDamageFXNoShake
  End
  ; *** AUDIO Parameters ***
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy
  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority     = STRUCTURE
  KindOf            = PRELOAD STRUCTURE SELECTABLE IMMOBILE REBUILD_HOLE CAN_SEE_THROUGH_STRUCTURE IMMUNE_TO_CAPTURE SCORE_DESTROY MP_COUNT_FOR_VICTORY
  Body              = StructureBody ModuleTag_03
    MaxHealth       = 9999999.9
    InitialHealth   = 9999999.9
  End
  Behavior                    = RebuildHoleBehavior ModuleTag_04
    WorkerObjectName          = AmericaVehicleDozer
    WorkerRespawnDelay        = 50000
    HoleHealthRegen%PerSecond = 0.5%
  End
  Behavior             = CreateObjectDie ModuleTag_13
    CreationList       = OCL_LargeStructureDebris
  End
  Behavior             = FXListDie ModuleTag_14
    DeathFX            = FX_StructureSmallDeath
  End
  Behavior                  = FireWeaponUpdate ModuleTag_RadarPowerUp
    Weapon                  = SAM_PowerDownLoop
  End
  Geometry            = CYLINDER
  GeometryMajorRadius = 25.0
  GeometryHeight      = 5.0    
  GeometryIsSmall     = No
  Shadow              = SHADOW_VOLUME
  BuildCompletion     = PLACED_BY_PLAYER
End