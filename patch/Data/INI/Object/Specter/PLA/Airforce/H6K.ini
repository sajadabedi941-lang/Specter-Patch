;------------------------------------------------------------------------------
; PLA H-6K bomber — donor h6k.W3D. Cruise missiles + bombs.
; Skeleton: RussiaJetTu95 / JetAI bomber. Visuals: donor ART only.
; Scale 0.85 matches USA B-52 class (AmericaJetB52). Gameplay unchanged.
; Does not replace packed ChinaBomberH6M science bomber.
;------------------------------------------------------------------------------
Object ChinaBomberH6K
Scale = 0.85

  ; *** ART Parameters ***
  SelectPortrait         = pla_h6k
  ButtonImage            = pla_h6k

  Draw = W3DModelDraw ModuleTag_H6K_01
    OkToChangeModelColor = Yes
    ParticlesAttachedToAnimatedBones = Yes

    DefaultConditionState
      Model               = h6k
      WeaponLaunchBone    = PRIMARY   WEAPONA01
      WeaponLaunchBone    = SECONDARY WEAPONC01
      WeaponLaunchBone    = TERTIARY  WEAPONA01
      ParticleSysBone     = ENGINE01 JetBlackTrailThin
      ParticleSysBone     = ENGINE02 JetBlackTrailThin
      ParticleSysBone     = WINGTIP01 JetContrailThin
      ParticleSysBone     = WINGTIP02 JetContrailThin
    End

    ConditionState        = JETEXHAUST
      Model               = h6k
      WeaponLaunchBone    = PRIMARY   WEAPONA01
      WeaponLaunchBone    = SECONDARY WEAPONC01
      WeaponLaunchBone    = TERTIARY  WEAPONA01
      ParticleSysBone     = ENGINE01 JetBlackTrailThin
      ParticleSysBone     = ENGINE02 JetBlackTrailThin
      ParticleSysBone     = WINGTIP01 JetContrailThin
      ParticleSysBone     = WINGTIP02 JetContrailThin
    End

    ConditionState        = REALLYDAMAGED
      Model               = h6k
      WeaponLaunchBone    = PRIMARY   WEAPONA01
      WeaponLaunchBone    = SECONDARY WEAPONC01
      WeaponLaunchBone    = TERTIARY  WEAPONA01
      ParticleSysBone     = SMOKE01 JetSmoke
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST
      Model               = h6k
      WeaponLaunchBone    = PRIMARY   WEAPONA01
      WeaponLaunchBone    = SECONDARY WEAPONC01
      WeaponLaunchBone    = TERTIARY  WEAPONA01
      ParticleSysBone     = SMOKE01 JetSmoke
      ParticleSysBone     = ENGINE01 JetBlackTrailThin
      ParticleSysBone     = ENGINE02 JetBlackTrailThin
      ParticleSysBone     = WINGTIP01 JetContrailThin
      ParticleSysBone     = WINGTIP02 JetContrailThin
    End

    ConditionState        = RUBBLE
      Model               = h6k
    End
  End

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:ChinaBomberH6K
  EditorSorting       = VEHICLE
  Side                = China
  TransportSlotCount  = 0
  VisionRange         = 660.0
  ShroudClearingRange = 225
  MaxSimultaneousOfType = 4
  Prerequisites
  End
  Buildable           = Ignore_Prerequisites
  BuildCost           = 4500
  BuildTime           = 40.0

  ArmorSet
    Conditions = None
    Armor = AirplaneArmor
    DamageFX = None
  End

  ExperienceValue     = 50 50 100 150
  ExperienceRequired  = 0 100 200 400
  IsTrainable         = Yes
  CrusherLevel        = 1
  CrushableLevel      = 2
  CommandSet          = GenericTacticalBomberCommandSet

  WeaponSet
    Conditions = None
    Weapon = PRIMARY    China_Weapon_CJ10_H6K
    Weapon = SECONDARY  China_Weapon_FAB_H6K
    Weapon = TERTIARY   AmericaB52FifteenBombLineWeapon
  End

  VoiceSelect = AuroraBomberVoiceSelect
  VoiceMove = AuroraBomberVoiceMove
  VoiceGuard = AuroraBomberVoiceMove
  VoiceAttack = AuroraBomberVoiceAttack
  SoundAmbient = RaptorAmbientLoop
  SoundAmbientRubble = NoSound
  UnitSpecificSounds
    VoiceCreate = AuroraBomberVoiceCreate
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    Afterburner = RaptorAfterburner
    VoiceLowFuel = AuroraBomberVoiceLowFuel
    VoiceGarrison = AuroraBomberVoiceMove
  End

  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT

  Body = ActiveBody ModuleTag_H6K_02
    MaxHealth = 800.0
    InitialHealth = 800.0
  End

  Behavior = JetSlowDeathBehavior ModuleTag_H6K_03
    FXOnGroundDeath = FX_JetOnGroundDeath
    OCLOnGroundDeath = OCL_AuroraDeathFinalBlowUp
    DestructionDelay = 99999999
    RollRate = 0.2
    RollRateDelta = 100%
    PitchRate = 0.0
    FallHowFast = 110.0%
    FXInitialDeath = FX_AuroraDeathInitial
    DelaySecondaryFromInitialDeath = 500
    FXSecondary = FX_JetDeathSecondary
    FXHitGround = FX_JetDeathHitGround
    DelayFinalBlowUpFromHitGround = 200
    FXFinalBlowUp = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp = OCL_AuroraDeathFinalBlowUp
  End

  Behavior = CreateObjectDie ModuleTag_H6K_Deletion
    DeathTypes = NONE +EXTRA_6
    CreationList = None
  End

  Behavior = EjectPilotDie ModuleTag_H6K_04
    GroundCreationList = OCL_EjectPilotsOnGround
    AirCreationList = OCL_EjectPilotsViaParachute
    ExemptStatus = HIJACKED
    VeterancyLevels = ALL -REGULAR
  End

  Behavior = PhysicsBehavior ModuleTag_H6K_05
    Mass = 500.0
  End

  Behavior = JetAIUpdate ModuleTag_H6K_07
    OutOfAmmoDamagePerSecond = 10%
    TakeoffDistForMaxLift = 0%
    TakeoffPause = 500
    MinHeight = 5
    ParkingOffset = 3
    ReturnToBaseIdleTime = 10000
  End

  Locomotor = SET_NORMAL D30-F6_JetLocomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_H6K_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Behavior = TransitionDamageFX ModuleTag_H6K_22
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  Behavior = ProductionUpdate ModuleTag_H6K_12
  End

  Geometry = Box
  GeometryIsSmall = No
  GeometryMajorRadius = 32.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 9.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End
