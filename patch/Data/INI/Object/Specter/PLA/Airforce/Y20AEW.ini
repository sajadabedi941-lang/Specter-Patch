;------------------------------------------------------------------------------
; PLA Y-20 AEW (KJ-3000 analog) — donor HXYun20YJ.W3D (DOME / DISH bones).
; Skeleton: RussiaJetA50 SAR scan. Visuals: donor ART only.
; Scale 0.90 matches USA E-3 class (US_E3G_AWACS). Radar/scan increased.
; Unique SAR ping OCL for a slightly larger scan area. USA E-737 ping unchanged.
;------------------------------------------------------------------------------
Object ChinaAircraftY20AEW
Scale = 0.90

  SelectPortrait         = pla_y20aew
  ButtonImage            = pla_y20aew

  Draw = W3DModelDraw ModuleTag_Y20AEW_01
    OkToChangeModelColor = No
    ParticlesAttachedToAnimatedBones = Yes

    DefaultConditionState
      Model = HXYun20YJ
      Animation = HXYun20YJ.HXYun20YJ
      AnimationMode = LOOP
      ParticleSysBone = WINGTIP01 JetContrailThin
      ParticleSysBone = WINGTIP02 JetContrailThin
      ParticleSysBone = ENGINE01 JetBlackTrailThin
      ParticleSysBone = ENGINE02 JetBlackTrailThin
      ParticleSysBone = ENGINE03 JetBlackTrailThin
      ParticleSysBone = ENGINE04 JetBlackTrailThin
    End

    ConditionState = JETEXHAUST
      Model = HXYun20YJ
      Animation = HXYun20YJ.HXYun20YJ
      AnimationMode = LOOP
      ParticleSysBone = WINGTIP01 JetContrailThin
      ParticleSysBone = WINGTIP02 JetContrailThin
      ParticleSysBone = ENGINE01 JetBlackTrailThin
      ParticleSysBone = ENGINE02 JetBlackTrailThin
      ParticleSysBone = ENGINE03 JetBlackTrailThin
      ParticleSysBone = ENGINE04 JetBlackTrailThin
    End

    ConditionState = REALLYDAMAGED
      Model = HXYun20YJ
      Animation = HXYun20YJ.HXYun20YJ
      AnimationMode = LOOP
      ParticleSysBone = SMOKE01 JetSmoke
    End

    ConditionState = REALLYDAMAGED JETEXHAUST
      Model = HXYun20YJ
      Animation = HXYun20YJ.HXYun20YJ
      AnimationMode = LOOP
      ParticleSysBone = SMOKE01 JetSmoke
      ParticleSysBone = ENGINE01 JetBlackTrailThin
      ParticleSysBone = ENGINE02 JetBlackTrailThin
    End

    ConditionState = RUBBLE
      Model = HXYun20YJ
      Animation = HXYun20YJ.HXYun20YJ
      AnimationMode = LOOP
    End
  End

  DisplayName = OBJECT:ChinaAircraftY20AEW
  EditorSorting = VEHICLE
  Side = China
  TransportSlotCount = 0
  VisionRange = 1100
  ShroudClearingRange = 1200
  Prerequisites
  End
  Buildable = Ignore_Prerequisites
  BuildCost = 5500
  BuildTime = 42
  ExperienceValue = 50 50 100 150
  IsTrainable = No
  CommandSet = RussiaJetA50CommandSet

  VoiceSelect = RaptorVoiceSelect
  VoiceMove = RaptorVoiceMove
  VoiceGuard = RaptorVoiceAirPatrol
  SoundAmbient = AdvancedFightEngineLoop
  SoundAmbientRubble = NoSound
  UnitSpecificSounds
    VoiceCreate = RaptorVoiceCreate
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    Afterburner = RaptorAfterburner
    VoiceLowFuel = RaptorVoiceLowFuel
    VoiceGarrison = RaptorVoiceMove
  End

  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS SELECTABLE VEHICLE SCORE AIRCRAFT REVEALS_ENEMY_PATHS

  ArmorSet
    Conditions = None
    Armor = AirplaneArmor
    DamageFX = None
  End

  Body = ActiveBody ModuleTag_Y20AEW_02
    MaxHealth = 1150.0
    InitialHealth = 1150.0
  End

  Behavior = JetSlowDeathBehavior ModuleTag_Y20AEW_05
    FXOnGroundDeath = FX_JetOnGroundDeath
    OCLOnGroundDeath = OCL_RaptorDeathFinalBlowUp
    DestructionDelay = 99999999
    RollRate = 0.2
    RollRateDelta = 100%
    PitchRate = 0.0
    FallHowFast = 110.0%
    FXInitialDeath = FX_RaptorDeathInitial
    OCLInitialDeath = OCL_RaptorDeathInitial
    DelaySecondaryFromInitialDeath = 500
    FXSecondary = FX_JetDeathSecondary
    OCLSecondary = OCL_RaptorDeathSecondary
    FXHitGround = FX_JetDeathHitGround
    OCLHitGround = OCL_RaptorDeathHitGround
    DelayFinalBlowUpFromHitGround = 200
    FXFinalBlowUp = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp = OCL_RaptorDeathFinalBlowUp
  End

  Behavior = PhysicsBehavior ModuleTag_Y20AEW_07
    Mass = 500.0
  End

  Behavior = TransitionDamageFX ModuleTag_Y20AEW_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  Behavior = JetAIUpdate ModuleTag_Y20AEW_09
    KeepsParkingSpaceWhenAirborne = Yes
    MinHeight = 1
    NeedsRunway = Yes
    OutOfAmmoDamagePerSecond = 0%
    ReturnToBaseIdleTime = 10000
    TakeoffPause = 1000
    TakeoffDistForMaxLift = 0%
    AutoAcquireEnemiesWhenIdle = No
    ParkingOffset = 5
  End
  Locomotor = SET_NORMAL F100_PW_229_E737AEW
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_Y20AEW_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Behavior = StealthDetectorUpdate ModuleTag_Y20AEW_StealthDetect
    DetectionRate = 1500
    DetectionRange = 3600
    CanDetectWhileGarrisoned = No
    CanDetectWhileContained = No
    ExtraForbiddenKindOf = UNATTACKABLE
  End

  Behavior = OCLSpecialPower ModuleTag_Y20AEW_SAR
    SpecialPowerTemplate = AmericaE737TargetedSARScan
    OCL                  = OCL_ChinaY20AEWTargetedSARScan
    CreateLocation       = CREATE_AT_LOCATION
  End

  Geometry = Box
  GeometryIsSmall = No
  GeometryMajorRadius = 40.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 10.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End

; Unique Y-20 AEW scan ping. Slightly larger VisionRange than AmericaE737SARRevealPing (420).
; Does not replace packed AmericaE737SARRevealPing.
Object ChinaY20AEWSARRevealPing

  VisionRange     = 520
  EditorSorting   = SYSTEM
  KindOf = NO_COLLIDE IMMOBILE UNATTACKABLE INERT

  Body = ImmortalBody ModuleTag_Y20AEWPing_01
    MaxHealth = 1
    InitialHealth = 1
  End

  Behavior = DynamicShroudClearingRangeUpdate ModuleTag_Y20AEWPing_02
    FinalVision = 0.0
    ShrinkDelay = 85000
    ShrinkTime = 5000
    GrowDelay = 0
    GrowTime = 1000
    GrowInterval = 10
    ChangeInterval = 80
    GridDecalTemplate
      Texture           = EXGrid
      Style             = SHADOW_ADDITIVE_DECAL
      OpacityMin        = 50%
      OpacityMax        = 100%
      OpacityThrobTime  = 500
      Color             = R:32 G:64 B:128 A:0
    End
  End

  Behavior = DeletionUpdate ModuleTag_Y20AEWPing_03
    MinLifetime = 90000
    MaxLifetime = 90000
  End

  Behavior = StealthDetectorUpdate ModuleTag_Y20AEWPing_04
    DetectionRate = 500
  End
End
