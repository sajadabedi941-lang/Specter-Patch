Object DF41_Sgl_WarheadReentryObject
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01DF
    OkToChangeModelColor = Yes
    ParticlesAttachedToAnimatedBones = Yes
    DefaultConditionState
      Model            = ReentryVehicle
      Animation        = ReentryVehicle.ReentryVehicle
      AnimationMode    = LOOP
      WeaponLaunchBone = SECONDARY WEAPONA
    End
  End
  ; ***DESIGN parameters ***
  EditorSorting       = VEHICLE
  ShroudClearingRange = 250.0
  ShroudRevealToAllRange = 100
  WeaponSet
    Conditions          = None 
    Weapon              = SECONDARY DF41_1x_WarheadReentryWeapon
  End
  ArmorSet
    Conditions      = None
    Armor           = ReentryVehicleArmor
    DamageFX        = None
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority   = UNIT
  KindOf = UNATTACKABLE IGNORED_IN_GUI IGNORES_SELECT_ALL CLICK_THROUGH PRELOAD VEHICLE AIRCRAFT
  Body = ActiveBody ModuleTag_02HG23
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End
  Behavior = AIUpdateInterface ModuleTag_0FDG
  End
  Behavior = OCLUpdate ModuleTag_LaunchSeq085
    MinDelay     = 6500
    MaxDelay     = 6500
    OCL          = OCL_RS24WareheadsReentryLaunch
  End
  Behavior = DeletionUpdate ModuleTag_DJG3
    MinLifetime = 26000
    MaxLifetime = 26000
  End
  Behavior  = DestroyDie ModuleTag_024FD
  End
  Behavior                = ProductionUpdate ModuleTag_PU
  End
End
