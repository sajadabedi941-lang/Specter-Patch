Object ChinaTankZBD04
  ; *** ART Parameters ***
  SelectPortrait         = pla_zbd04
  ButtonImage            = pla_zbd04
  Draw = W3DTankDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model            = CHI_ZBD04A
      Turret           = Turret
      TurretPitch      = TURRETEL
      WeaponRecoilBone = PRIMARY   BarrelA01
      WeaponFireFXBone = PRIMARY   WeaponA01
      WeaponLaunchBone = PRIMARY   WeaponA01
      WeaponRecoilBone = SECONDARY BarrleB01
      WeaponFireFXBone = SECONDARY WeaponB01
      WeaponLaunchBone = SECONDARY WeaponB01
      WeaponFireFXBone = TERTIARY  WeaponA01
      WeaponLaunchBone = TERTIARY  WeaponA01
    End
    ConditionState     = REALLYDAMAGED
      Model            = CHI_ZBD04A_D
      Turret           = Turret
      TurretPitch      = TURRETLE
      WeaponFireFXBone = PRIMARY   WeaponA01
      WeaponLaunchBone = PRIMARY   WeaponA01
      WeaponFireFXBone = SECONDARY WeaponB01
      WeaponLaunchBone = SECONDARY WeaponB01
      WeaponFireFXBone = TERTIARY  WeaponA01
      WeaponLaunchBone = TERTIARY  WeaponA01
    End
    ConditionState     = RUBBLE
      Model            = CHI_ZBD04A_R
      Turret           = Turret
      TurretPitch      = TURRETEL
      WeaponRecoilBone = PRIMARY   BarrelA01
      WeaponFireFXBone = PRIMARY   WeaponA01
      WeaponLaunchBone = PRIMARY   WeaponA01
      WeaponRecoilBone = SECONDARY BarrleB01
      WeaponFireFXBone = SECONDARY WeaponB01
      WeaponLaunchBone = SECONDARY WeaponB01
      WeaponFireFXBone = TERTIARY  WeaponA01
      WeaponLaunchBone = TERTIARY  WeaponA01
    End
    TrackMarks              = EXTnkTrack.tga
    TreadAnimationRate      = 2.0  ; amount of tread texture to move per second
    TreadDriveSpeedFraction = 0.3  ; fraction of locomotor speed below which treads stop moving.
    TreadPivotSpeedFraction = 0.6  ; fraction of locomotor speed below which we allow pivoting.
  End
  ; ***DESIGN parameters ***
  DisplayName               = OBJECT:ZBD04
  Side                      = China
  EditorSorting             = VEHICLE
  TransportSlotCount        = 3            ;how many "slots" we take in a transport (0 == not transportable)

  WeaponSet
    Conditions = None 
    Weapon              = PRIMARY     100mm_2A70
    PreferredAgainst    = PRIMARY     INFANTRY VEHICLE STRUCTURE
    AutoChooseSources   = PRIMARY     FROM_PLAYER FROM_SCRIPT FROM_AI
    ; -----
    Weapon              = SECONDARY   30mm_2A72_dualfeed
    PreferredAgainst    = SECONDARY   INFANTRY VEHICLE STRUCTURE
    AutoChooseSources   = SECONDARY   FROM_PLAYER FROM_SCRIPT FROM_AI
    ; -----
    Weapon              = TERTIARY    9M117_Bastion
    PreferredAgainst    = TERTIARY    VEHICLE STRUCTURE
    AutoChooseSources   = TERTIARY    FROM_PLAYER FROM_SCRIPT FROM_AI
  End
  Prerequisites
    Object = ChinaBarracks
  End

  ArmorSet
    Conditions      = None
    Armor           = TankArmor
    DamageFX        = TankDamageFX
  End
  BuildCost           = 1200
  BuildTime           = 13.0          ;in seconds    
  VisionRange         = 480
  ShroudClearingRange = 300

  ExperienceValue     = 50 50 100 150    ;Experience point value at each level
  ExperienceRequired  = 0 100 150 300  ;Experience points needed to gain each level
  IsTrainable         = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet          = GenericIFVcommandset

  ; *** AUDIO Parameters ***
  VoiceSelect         = ToxinTractorVoiceSelect
  VoiceMove           = ToxinTractorVoiceMove
  VoiceGuard          = ToxinTractorVoiceMove
  VoiceAttack         = ToxinTractorVoiceAttack
  SoundMoveStart      = ToxinTractorMoveStart
  SoundMoveStartDamaged = ToxinTractorMoveStart

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate         = ToxinTractorVoiceCreate
    TurretMoveStart     = NoSound
    TurretMoveLoop      = TurretMoveLoop
   TruckLandingSound    = NoSound
   TruckPowerslideSound = NoSound
    VoiceCrush      = ToxinTractorVoiceCrush
    VoiceEnter           = ToxinTractorVoiceMove
    VoicePoisonLocation = ToxinTractorVoiceAttackContam

  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE
  
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 900.0
    InitialHealth   = 900.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 560
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End

  
  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate       = 130 ;   // turn rate, in degrees per sec
      ControlledWeaponSlots= PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate        = 15
  End
  Locomotor            = SET_NORMAL UTD-29M
  Behavior             = PhysicsBehavior ModuleTag_04
    Mass               = 300.0
  End
  Behavior = TransportContain ModuleTag_22
    Slots                 = 6
    ScatterNearbyOnExit   = Yes
    HealthRegen%PerSec    = 10
    InitialPayload        = PLA_V1_AK 6
    EnterSound            = GarrisonEnter
    ExitSound             = GarrisonExit
    DamagePercentToUnits  = 100%
    AllowInsideKindOf     = INFANTRY
    ExitDelay             = 250
    NumberOfExitPaths     = 3 ; Defaults to 1.  Set 0 to not use ExitStart/ExitEnd, set higher than 1 to use ExitStart01-nn/ExitEnd01-nn
    GoAggressiveOnExit    = Yes ; AI Will tell people to set their mood to Aggressive on exiting
  End  
  ; A crushing defeat
  Behavior = DestroyDie ModuleTag_06
    DeathTypes = NONE +CRUSHED +SPLATTED
  End
  Behavior = FXListDie ModuleTag_07
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = CreateObjectDie ModuleTag_08
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End
  Behavior = CreateCrateDie ModuleTag_09
    CrateData = SalvageCrateData
    ;CrateData = EliteTankCrateData
    ;CrateData = HeroicTankCrateData
  End
  ; just explode death
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -CRUSHED -SPLATTED
;    ProbabilityModifier = 33
    DestructionDelay = 500
    DestructionDelayVariance = 500
    FX  = INITIAL  FX_GenericTankAmmoCockoff
    OCL = FINAL    OCL_BMP3MDebris
    FX  = FINAL    FX_UnguidedRocketExplosion
  End

  Behavior = FlammableUpdate ModuleTag_12
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = TransitionDamageFX ModuleTag_13
;   ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedParticleSystem2 = Bone:Smoke RandomBone:Yes Psys:DragonTransitionFire
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_DragonDamageTransition
  End

  Geometry = BOX
  GeometryMajorRadius = 15.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 11.0   ; Height set to allow clear clipping of projectile stream  
  GeometryIsSmall = Yes
  Shadow = SHADOW_VOLUME    
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End