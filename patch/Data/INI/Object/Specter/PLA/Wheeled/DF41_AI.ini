  End
  Draw = W3DTruckDraw ModuleTag_Tires
    ConditionState         = NONE
      Model                = CHI_DF41_T
    End
    ConditionState         = REALLYDAMAGED
      Model                = CHI_DF41_TD
    End
    AliasConditionState    = RUBBLE
    TrackMarks             = EXTireTrack.tga
    Dust                   = ScudLauncherDust
    DirtSpray              = RocketBuggyDirtSpray
    PowerslideSpray        = RocketBuggyDirtPowerSlide
    LeftFrontTireBone      = Tire09
    RightFrontTireBone     = Tire010
    MidLeftFrontTireBone   = Tire011
    MidRightFrontTireBone  = Tire012
    MidRightRearTireBone   = Tire013
    MidLeftRearTireBone    = Tire014
    MidRightMidTireBone    = Tire015
    MidLeftMidTireBone     = Tire016
    TireRotationMultiplier = 0.2
  End
  ; --- WarningLights
  Draw = W3DModelDraw ModuleTag_WarningLights
    DefaultConditionState
      Model             = CHI_DF41_WL
      HideSubObject     = Light01 Light02
    End
    ConditionState      = UNPACKING
      Model             = CHI_DF41_WL
      Animation         = CHI_DF41_WL.CHI_DF41_WL
      AnimationMode     = Loop
      ShowSubObject     = Light01 Light02
    End
    ConditionState      = PACKING
      Model             = CHI_DF41_WL
      Animation         = CHI_DF41_WL.CHI_DF41_WL
      AnimationMode     = Loop
      ShowSubObject     = Light01 Light02
    End
  End
  ; --- HeadLights
  Draw = W3DModelDraw ModuleTag_HeadLights
    DefaultConditionState
      Model             = CHI_DF41HL
      HideSubObject     = Light01 Light02
    End
    ConditionState      = Night
      Model             = CHI_DF41HL
      ShowSubObject     = Light01 Light02
    End
    ConditionState      = Night ENEMYNEAR
      Model             = CHI_DF41HL
      HideSubObject     = Light01 Light02
    End
  End
  ; --- Camonet
  Draw = W3DModelDraw ModuleTag_Camonet
    DefaultConditionState
      Model             = CHI_DF41Camo
      HideSubObject     = Camonet
    End
    ConditionState      = DEPLOYED
      Model             = CHI_DF41Camo
      ShowSubObject     = Camonet
    End
  End
  ; --- Bones
  Draw = W3DModelDraw ModuleTag_Bones
    DefaultConditionState
      Model             = DF41_Bones
      WeaponLaunchBone  = PRIMARY   WeaponA
      WeaponFireFXBone  = PRIMARY   Smoker
      WeaponMuzzleFlash = PRIMARY   WEAPONFX
      WeaponLaunchBone  = SECONDARY WeaponA
      WeaponFireFXBone  = SECONDARY Smoker
      WeaponMuzzleFlash = SECONDARY WEAPONFX
    End
  End
  ; ***DESIGN parameters ***
  DisplayName        = OBJECT:DF41
  Side               = China
  EditorSorting      = VEHICLE
  TransportSlotCount = 6                 ;how many "slots" we take in a transport (0 == not transportable)

  WeaponSet
    Conditions = None 
    Weapon = PRIMARY DF41_ICBM_AI
  End
  ArmorSet
    Conditions      = None
    Armor           = TruckArmor
    DamageFX        = TankDamageFX
  End
  BuildCost       = 1500
  BuildTime       = 20.0          ;in seconds    
  VisionRange     = 600
  ShroudClearingRange = 150
  
  ExperienceValue    = 150 150 150 150     ;Experience point value at each level
  IsTrainable = No             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet             = Iraq_AlhussaienCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = ScudLauncherVoiceSelect
  VoiceMove = ScudLauncherVoiceMove
  VoiceGuard = ScudLauncherVoiceMove
  VoiceAttack = ScudLauncherVoiceAttack
  SoundMoveStart = ScudLauncherMoveStart
  SoundMoveStartDamaged = ScudLauncherMoveStart
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate       = ScudLauncherVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop
    TruckLandingSound = NoSound
    TruckPowerslideSound = NoSound
    VoiceCrush = ScudLauncherVoiceCrush
    VoiceEnter = ScudLauncherVoiceMove
    VoicePrimaryWeaponMode = ScudLauncherVoiceModeHiEx
    VoiceSecondaryWeaponMode = ScudLauncherVoiceModeAnthrax
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS VEHICLE SCORE
  Body = ActiveBody ModuleTag_H702
    MaxHealth       = 1000
    InitialHealth   = 1000
    SubdualDamageCap = 1500.0
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = DeployStyleAIUpdate ModuleTag_04
    Turret
      TurretTurnRate        = 0
      TurretPitchRate       = 0
      ControlledWeaponSlots = PRIMARY
      NaturalTurretAngle    = 0
      InitiallyDisabled     = Yes
    End
    AutoAcquireEnemiesWhenIdle = No
    PackTime = 6555
    UnpackTime = 6555
    TurretsFunctionOnlyWhenDeployed = Yes
    TurretsMustCenterBeforePacking = Yes
    ManualDeployAnimations = Yes
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate = 2
  End

  Locomotor = SET_NORMAL Generic8x8Locomotor_H
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 400.0
  End

  Behavior = TransitionDamageFX ModuleTag_MB708
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_ScudLauncherDamageTransition
  End

  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_L8F09
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 50
    DestructionDelay = 100
    DestructionDelayVariance = 300
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_RS24DeathEffect
    FX  = FINAL    FX_HeavyWarheadCruiseMissileExplosion
  End

  ; A crushing defeat
  Behavior = FXListDie ModuleTag_10F66
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  ;Behavior = DeletionUpdate ModuleTag_Clean
    ;MinLifetime = 150000
    ;MaxLifetime = 150000
  ;End

  Behavior = CreateObjectDie ModuleTag_11J6
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End

  Behavior = FlammableUpdate ModuleTag_21VHN
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = EjectPilotDie ModuleTag_HijackerEmerge01
    DeathTypes = ALL -CRUSHED -SPLATTED
    RequiredStatus = HIJACKED
    VeterancyLevels =  ALL
    GroundCreationList = OCL_HijackerEmerge
    AirCreationList = OCL_HijackerEmergeViaParachute
  End

  Behavior = DestroyDie ModuleTag_22MYUJ76
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  Behavior = ProductionUpdate ModuleTag_12
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  
  Geometry = BOX
  GeometryMajorRadius = 37.0
  GeometryMinorRadius = 10
  GeometryHeight = 17
  GeometryIsSmall = Yes
  Shadow = SHADOW_VOLUME   
  ShadowSizeX = 45
End