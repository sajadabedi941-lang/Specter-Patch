; Restore overlay. Replaces v4 last-wins of existing SPEC Object/OCL names.
; Unique marker only. Never spawned. Does not last-win HQ-9, S-400, S-500,
; THAAD, Arrow, or S-300 objects, weapons, or OCLs.

Object Specter_ABMDedicatedRadar_RestoreMarker
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = None
    End
  End
  KindOf = PRELOAD NO_SELECT UNATTACKABLE
  EditorSorting = SYSTEM
  Body = ActiveBody ModuleTag_02
    MaxHealth     = 1
    InitialHealth = 1
  End
  Geometry            = SPHERE
  GeometryMajorRadius = 1.0
  GeometryIsSmall     = Yes
End
