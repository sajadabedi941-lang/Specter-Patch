; Same OCL last-wins as ObjectCreationList_SpecterABMDedicatedRadar.ini.
; S-400 ABM deploy also spawns S400R_FireControlSystem_AUM (CRUSH fire witness).
ObjectCreationList OCL_S500_Deployed_ABM
  CreateObject
    ObjectNames           = S500_FireControlSystem_ABM
    Disposition           = LIKE_EXISTING
    IgnorePrimaryObstacle = Yes
    Count                 = 1
  End
  CreateObject
    ObjectNames           = S400R_FireControlSystem_AUM
    Disposition           = LIKE_EXISTING
    IgnorePrimaryObstacle = Yes
    Count                 = 1
  End
