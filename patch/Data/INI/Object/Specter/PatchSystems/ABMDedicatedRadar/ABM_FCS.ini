; SPECTER ABM overlay — last-win objects ThingFactory actually loads.
; Packed as Data\INI\Object\zzzz_SpecterABMDedicatedRadar\ABM_FCS.ini
; (sorts after Object\Specter\United States Of America\).
; Does not last-win S-400 or HQ-9 objects.
;
; Engine (WeaponSet.cpp): getAbleToUseWeaponAgainstTarget returns
; INVALID_SHOT unless estimateWeaponDamage > 0. SRBMArmor FALLING=0% /
; CRUSH=100%, so FALLING ABM primaries never even begin an attack.
; HQ-9 primary Hq9_AA_Missile_ABM (CRUSH) is the in-game fire witness.
; S-400 AUM 4x_MRSAM_9M96E2 (CRUSH) is the second witness.
; Unique ABM weapons are not used for fire: they are not in Weapon.ini.

Weapon Specter_S500_77H6_AAM
  PrimaryDamage              = 2000
  PrimaryDamageRadius        = 0.1
  SecondaryDamage            = 0.1
  SecondaryDamageRadius      = 0.1
  AttackRange                = 2100
  MinimumAttackRange         = 700
  DamageType                 = PENALTY
  DeathType                  = LASERED
  WeaponSpeed                = 9999999999
  FireFX                     = FX_LargeSamMissilesTubeOut
  ProjectileObject           = 77H6Missile1
  RadiusDamageAffects        = ENEMIES NEUTRALS
  DelayBetweenShots          = 1000
  ClipSize                   = 2
  ClipReloadTime             = 8500
  AutoReloadsClip            = Yes
  AntiAirborneVehicle        = Yes
  AntiAirborneInfantry       = No
  AntiGround                 = No
  AntiBallisticMissile       = No
  AntiSmallMissile           = No
  ProjectileDetonationFX     = FX_HeavyAAMImpact
  FireSound                  = S500_Launch
  AcceptableAimDelta         = 360
End

; S-500 AA only. SPEC 77H6Missile_ABM cannot target aircraft.
Object S500_FireControlSystem
Scale = 0.9
  Draw = W3DTruckDraw ModuleTag_01
    DefaultConditionState
      Model                   = S400R_MT
      WeaponLaunchBone        = PRIMARY MISSILE
      WeaponMuzzleFlash       = PRIMARY MISSILE
      WeaponFireFXBone        = PRIMARY MISSILE
    End
  End
  Draw = W3DModelDraw ModuleTag_Indicator
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = Spec_Indic_AAM
    End
    ConditionState = DYING
      Model = None
    End
  End
  WeaponSet
    Conditions        = None
    Weapon            = PRIMARY      Specter_S500_77H6_AAM
  End
  VisionRange         = 2000
  ShroudClearingRange = 0
  ArmorSet
    Conditions        = None
    Armor             = Generic_FCS_Armor
    DamageFX          = EmptyDamageFX
  End
  EditorSorting = SYSTEM
  KindOf = UNATTACKABLE CAN_ATTACK PRELOAD IMMOBILE NO_SELECT
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 1
    InitialHealth   = 1
  End
  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate        = 1
  End
  Behavior  = PhysicsBehavior ModuleTag_06
    Mass    = 25
  End
  Behavior  = DestroyDie ModuleTag_0725
  End
  Geometry            = CYLINDER
  GeometryMajorRadius = 2.0
  GeometryHeight      = 2.0
  GeometryIsSmall     = No
End

; SPEC used FALLING 77H6Missile_ABM and W3DOverlordTankDraw without IMMOBILE.
