; Master donor: USA MilitaryHQ art + USA CommandCenter working specials
; Objects: America_MilitaryHQ, Russia_MilitaryHQ, China_MilitaryHQ, NorthKorea_MilitaryHQ
; Faction Side/CommandSet/balance preserved; ASCII-only; no foreign leftover assets

Object America_MilitaryHQ
Scale = 0.9
  ; *** ART Parameters ***
  SelectPortrait         = us_commandcenter
  ButtonImage            = us_commandcenter

  Draw                   = W3DModelDraw ModuleTag_America_Draw
    OkToChangeModelColor = Yes
    ConditionState       = NONE
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
    ConditionState       = DAMAGED
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
    ConditionState       = REALLYDAMAGED RUBBLE
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
  End

  PlacementViewAngle = -175

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:America_MilitaryHQ
  Side                = America
  EditorSorting       = STRUCTURE
  BuildCost           = 1938
  BuildTime           = 3.2
  EnergyProduction    = 0
  CommandSet          = America_MilitaryHQCommandSet
  VisionRange         = 320.0
  ShroudClearingRange = 310.0
  ArmorSet
    Conditions        = None
    Armor             = StructureArmorTough
    DamageFX          = StructureDamageFXNoShake
  End
  ExperienceValue     = 200 200 200 200

  ; *** AUDIO Parameters ***
  VoiceSelect         = CommandCenterUSASelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy
  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority       = STRUCTURE
  KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE COMMANDCENTER SCORE CAPTURABLE FS_FACTORY AUTO_RALLYPOINT MP_COUNT_FOR_VICTORY
  Body                = StructureBody ModuleTag_America_Body
    MaxHealth         = 2400.0
    InitialHealth     = 2400.0
    SubdualDamageCap = 5200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
  Behavior = AutoDepositUpdate ModuleTag_America_Oil
    DepositTiming       = 12000
    DepositAmount       = 19
    InitialCaptureBonus = 0
  End
  Behavior = PreorderCreate ModuleTag_America_Preorder
  End
  Behavior = ProductionUpdate ModuleTag_America_Prod
    NumDoorAnimations            = 1
    DoorOpeningTime              = 1500
    DoorWaitOpenTime             = 3000
    DoorCloseTime                = 1500
    ConstructionCompleteDuration = 1500
  End
  Behavior = DefaultProductionExitUpdate ModuleTag_America_Exit
    UnitCreatePoint   = X:-80.0  Y:  55.0   Z:0.0
    NaturalRallyPoint = X: 60.0  Y:  35.0   Z:0.0
  End
  Behavior             = DestroyDie ModuleTag_America_Destroy
  End
  Behavior             = CreateObjectDie ModuleTag_America_Debris
    CreationList  = OCL_LargeStructureDebris
  End
  Behavior             = FXListDie ModuleTag_America_FXDie
    DeathFX       = FX_StructureMediumDeath
  End
  Behavior = GrantUpgradeCreate ModuleTag_America_ICBM
    UpgradeToGrant = Upgrade_ICBM_BoosterKiller
  End

  Behavior           = OCLSpecialPower ModuleTag_America_BGM
    SpecialPowerTemplate = SuperweaponBGM109Strike
    OCL                  = SUPERWEAPON_AmericaTomahawkStrike1
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End
  Behavior           = OCLSpecialPower ModuleTag_America_Daisy
    SpecialPowerTemplate = SuperweaponDaisyCutter
    UpgradeOCL           = SCIENCE_MOAB SUPERWEAPON_MOAB
    OCL                  = SUPERWEAPON_DaisyCutter
    CreateLocation       = CREATE_AT_EDGE_FARTHEST_FROM_TARGET
  End
  Behavior           = OCLSpecialPower ModuleTag_America_SpyDrone
    SpecialPowerTemplate = SpecialPowerSpyDrone
    OCL                  = SUPERWEAPON_SpyDrone
    CreateLocation       = CREATE_ABOVE_LOCATION
  End
  Behavior           = OCLSpecialPower ModuleTag_America_Paradrop
    SpecialPowerTemplate = SuperweaponParadropAmerica
    UpgradeOCL           = SCIENCE_Paradrop3 SUPERWEAPON_Paradrop3
    UpgradeOCL           = SCIENCE_Paradrop2 SUPERWEAPON_Paradrop2
    OCL                  = SUPERWEAPON_Paradrop1
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    OCLAdjustPositionToPassable = Yes
  End
  Behavior           = OCLSpecialPower ModuleTag_America_SpySat
    SpecialPowerTemplate = SpecialPowerSpySatellite
    OCL                  = SUPERWEAPON_SpySatellite
    CreateLocation       = CREATE_AT_LOCATION
  End
  Behavior           = OCLSpecialPower ModuleTag_America_Crate
    SpecialPowerTemplate = SuperweaponCrateDrop
    OCL                  = SUPERWEAPON_CrateDrop
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End
  Behavior           = OCLSpecialPower ModuleTag_America_A10
    SpecialPowerTemplate = SuperweaponA10ThunderboltMissileStrike
    UpgradeOCL           = SCIENCE_A10ThunderboltMissileStrike3 SUPERWEAPON_A10ThunderboltMissileStrike3
    UpgradeOCL           = SCIENCE_A10ThunderboltMissileStrike2 SUPERWEAPON_A10ThunderboltMissileStrike2
    OCL                  = SUPERWEAPON_A10ThunderboltMissileStrike1
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End
  Behavior           = OCLSpecialPower ModuleTag_America_Repair
    SpecialPowerTemplate = SuperweaponEmergencyRepair
    UpgradeOCL           = SCIENCE_EmergencyRepair3 SUPERWEAPON_RepairVehicles3
    UpgradeOCL           = SCIENCE_EmergencyRepair2 SUPERWEAPON_RepairVehicles2
    OCL                  = SUPERWEAPON_RepairVehicles1
    CreateLocation       = CREATE_AT_LOCATION
  End
  Behavior = SpecialAbility ModuleTag_America_AWACS_SP
    SpecialPowerTemplate = SuperweaponAmerica_AWACS
    UpdateModuleStartsAttack = Yes
  End
  Behavior = SpectreGunshipDeploymentUpdate ModuleTag_America_AWACS
    SpecialPowerTemplate = SuperweaponAmerica_AWACS
    GunshipTemplateName = US_E3G_AWACS
    AttackAreaRadius = 225
    CreateLocation = CREATE_AT_EDGE_NEAR_SOURCE
  End
  Behavior = SpecialAbility ModuleTag_America_Spectre_SP
    SpecialPowerTemplate = SuperweaponSpectreGunship
    UpdateModuleStartsAttack = Yes
  End
  Behavior = SpectreGunshipDeploymentUpdate ModuleTag_America_Spectre
    SpecialPowerTemplate = SuperweaponSpectreGunship
    GunshipTemplateName  = AmericaJetSpectreGunship
    AttackAreaRadius     = 200
    CreateLocation       = CREATE_AT_EDGE_FARTHEST_FROM_TARGET
  End
  Behavior           = OCLSpecialPower ModuleTag_America_Leaflet
    SpecialPowerTemplate = SuperweaponLeafletDrop
    OCL                  = SUPERWEAPON_LeafletDrop
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior = FlammableUpdate ModuleTag_America_Flame
    AflameDuration = 5000
    AflameDamageAmount = 5
    AflameDamageDelay = 500
  End
  Behavior = TransitionDamageFX ModuleTag_America_TDFX
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End

  Geometry            = BOX
  GeometryMajorRadius = 65.0
  GeometryMinorRadius = 65.0
  GeometryHeight      = 54.0
  FactoryExitWidth    = 25
  GeometryIsSmall     = No
  Shadow              = SHADOW_VOLUME
  BuildCompletion     = PLACED_BY_PLAYER

End

