; Clean Tu-160 KH-55MS cruise missile projectile (TEOD KH55MS art/AI)
; InstantDeath uses packed-local detonation weapon (no missing watercheck OCL).

Object Russia_Projectile_TU160_KH55
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = KH-55MS
      ParticleSysBone = NONE MediumAA_MissileTrail_Bright
    End
  End

  Draw = W3DModelDraw ModuleTag_Exhaust01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = SMF
      Animation       = SMF.SMF
      AnimationMode   = LOOP
    End
    ConditionState = JAMMED
      ParticleSysBone = NONE SparksMedium
    End
  End

  EditorSorting     = SYSTEM
  VisionRange = 0.0

  ArmorSet
    Conditions      = NONE
    Armor           = ProjectileArmor
    DamageFX        = NONE
  End

  KindOf = PROJECTILE BALLISTIC_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 9999.0
    InitialHealth   = 9999.0
    SubdualDamageCap = 200
    SubdualDamageHealRate = 100000
    SubdualDamageHealAmount = 50
  End

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 1
  End
  Behavior = MissileAIUpdate ModuleTag_08
    TryToFollowTarget     = No
    FuelLifetime          = 9000
    InitialVelocity       = 90
    IgnitionDelay         = 30
    IgnitionFX            = FX_JetMissileIgnition
    DistanceToTravelBeforeTurning = 250
  End
  Locomotor = SET_NORMAL KH55MissileLocomotor

  Behavior = HeightDieUpdate ModuleTag_09
    TargetHeight = 1.0
    TargetHeightIncludesStructures = Yes
  End

  Behavior = InstantDeathBehavior DeathModuleTag_10
    DeathTypes = ALL
    Weapon   = Russia_Weapon_TU160_KH55_Detonation
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0

End
