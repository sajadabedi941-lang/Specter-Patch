    DefaultConditionState
      Model              = TheAirPort
      Animation          = THEAIRPORT.THEAIRPORT
      AnimationMode      = LOOP
    End
    ConditionState       = DAMAGED
      Model              = TheAirPort
      Animation          = THEAIRPORT.THEAIRPORT
      AnimationMode      = LOOP
