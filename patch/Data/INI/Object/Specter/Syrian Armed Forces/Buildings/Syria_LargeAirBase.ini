; SPECTER — Pakistan LARGE fighter airbase
; Geometry: TheAirPort.W3D (existing ART). Gameplay logic cloned from Syria_Airfield_T.
; Capacity: NumRows=4 x NumCols=4 = 16 (bones Runway1-4 Parking1-4 — mesh-verified).
; HXUSABigAirPort reserved for future heavy airbase — NOT used here.
; Aircraft roster: Syria_AirfieldCommandSet (unchanged; JF-17 stays disabled).

