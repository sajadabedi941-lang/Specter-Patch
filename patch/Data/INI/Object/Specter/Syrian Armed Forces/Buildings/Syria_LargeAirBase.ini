      ParticleSysBone    = Fire01 SmokeStackHeat
      ParticleSysBone    = Fire02 SmolderingFire
      ParticleSysBone    = Fire02 SmokeStackHeat
      ParticleSysBone    = Fire03 FireFactionLarge
      ParticleSysBone    = Fire03 SmokeStackHeatLarge
