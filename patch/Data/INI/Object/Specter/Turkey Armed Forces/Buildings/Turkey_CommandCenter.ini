; SPECTER REPAIR - Turkey_CommandCenter
; Donor art: USA CommandCenter (us_commandcenter / US_Command / US_COM_Strb)
; Turkey special powers from verified Turkey_MilitaryHQ
; Identity: Turkey_CommandCenter + Side=Turkey + Turkey_CommandCenterCommandSet
; Preserved: cost/time/health/CommandSet; cleared irq_comndcntr leftovers

;------------------------------------------------------------------------------
Object Turkey_CommandCenter

Scale = 0.8

  ; *** ART Parameters ***
  SelectPortrait         = us_commandcenter
  ButtonImage            = us_commandcenter

  ; ----------------- Main Building ------------------------
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ; day
    ConditionState       = NONE
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
    ConditionState       = DAMAGED
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
    ConditionState       = REALLYDAMAGED RUBBLE
      Model              = US_Command
      Animation          = US_Command.US_Command
      AnimationMode      = LOOP
    End
  End

  PlacementViewAngle  = -135

  ; ------------ Strobes -----------------
  Draw                = W3DModelDraw ModuleTag_03
    ConditionState    = None
      Model           = US_COM_Strb
      Animation       = US_COM_Strb.US_COM_Strb
      AnimationMode   = LOOP
    End
    AliasConditionState = NIGHT
    AliasConditionState = SNOW
    AliasConditionState = NIGHT SNOW

    ConditionState    = DAMAGED
      Model           = US_COM_Strb
      Animation       = US_COM_Strb.US_COM_Strb
      AnimationMode   = LOOP
    End
    AliasConditionState = NIGHT DAMAGED
    AliasConditionState = SNOW DAMAGED
    AliasConditionState = NIGHT SNOW DAMAGED

    ConditionState    = REALLYDAMAGED RUBBLE
      Model           = US_COM_Strb
      Animation       = US_COM_Strb.US_COM_Strb
      AnimationMode   = LOOP
    End
  End

  ; ***DESIGN parameters ***
  DisplayName           = OBJECT:Turkey_CommandCenter
  Side                  = Turkey
  EditorSorting         = STRUCTURE
  BuildCost             = 2000
  BuildTime             = 45.0           ; in seconds
  EnergyProduction      = 0   ;Command Center should be free
  CommandSet            = Turkey_CommandCenterCommandSet
  VisionRange           = 300.0           ; Shroud clearing distance
  ShroudClearingRange   = 300
  ArmorSet
    Conditions          = None
    Armor               = StructureArmorTough
    DamageFX            = StructureDamageFXNoShake
  End
  ExperienceValue     = 200 200 200 200  ; Experience point value at each level

  ; *** AUDIO Parameters ***
  VoiceSelect           = CommandCenterUSASelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority       = STRUCTURE
  KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE COMMANDCENTER SCORE CAPTURABLE FS_FACTORY AUTO_RALLYPOINT MP_COUNT_FOR_VICTORY
  Body                = StructureBody ModuleTag_08
    MaxHealth         = 5000.0
    InitialHealth     = 5000.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 5200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End

  Behavior = PreorderCreate ModuleTag_PreorderCreate
  End
  Behavior = ProductionUpdate ModuleTag_11
    NumDoorAnimations            = 1
    DoorOpeningTime              = 1500  ;in mSeconds
    DoorWaitOpenTime             = 3000  ;in mSeconds
    DoorCloseTime                = 1500  ;in mSeconds
    ConstructionCompleteDuration = 1500  ;in mSeconds
  End
  Behavior = DefaultProductionExitUpdate ModuleTag_13
    UnitCreatePoint   = X:-18.0  Y:  35.0   Z:0.0
    NaturalRallyPoint = X: 60.0  Y:  35.0   Z:0.0;NaturalRallyPointX must always match GeometryMajorRadius! -ML
  End
  Behavior = BaseRegenerateUpdate ModuleTag_14
    ;No data
  End
  Behavior             = DestroyDie ModuleTag_15
    ;nothing
  End
  Behavior             = CreateObjectDie ModuleTag_16
    CreationList  = OCL_LargeStructureDebris
  End
  Behavior             = FXListDie ModuleTag_18
    DeathFX       = FX_StructureMediumDeath
  End

  Behavior = GrantUpgradeCreate ModuleTag_ICBMBK
    UpgradeToGrant = Upgrade_ICBM_BoosterKiller
  End

  ; Turkey special powers (verified with Turkey_MilitaryHQ)
  Behavior           = OCLSpecialPower ModuleTag_Insertion
    SpecialPowerTemplate = SuperweaponTurkishSFInsertion
    OCL                  = SUPERWEAPON_TurkishSFInsertion
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    OCLAdjustPositionToPassable = Yes ;Like RA2, shift target to passable cell so we don't land in water and on cliffs.
  End 

  Behavior           = OCLSpecialPower ModuleTag_173
    SpecialPowerTemplate = SuperweaponTurkey_Tu22CruiseMissileStrike
    OCL                  = SUPERWEAPON_Tu22CruiseMissileStrike
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior = SpecialAbility ModuleTag_TurkeyAWACS_SP
    SpecialPowerTemplate = SuperweaponTurkishAWACS
    UpdateModuleStartsAttack = Yes
  End

  Behavior = SpectreGunshipDeploymentUpdate ModuleTag_TurkeyAWACS
    SpecialPowerTemplate = SuperweaponTurkishAWACS
    GunshipTemplateName = Turkey_Adnan1
    AttackAreaRadius = 225
    CreateLocation = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior           = OCLSpecialPower ModuleTag_2432
    SpecialPowerTemplate = SuperweaponTurkishParadrop
    OCL                  = SUPERWEAPON_TurkishParadrop
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    OCLAdjustPositionToPassable = Yes ;Like RA2, shift target to passable cell so we don't land in water and on cliffs.
  End  
  Behavior           = OCLSpecialPower ModuleTag_286
    SpecialPowerTemplate = SuperweaponTurkishCruiseStrike
    UpgradeOCL           = SCIENCE_TurkishCruiseStrike3 SUPERWEAPON_TurkishCruiseStrike3
    UpgradeOCL           = SCIENCE_TurkishCruiseStrike2 SUPERWEAPON_TurkishCruiseStrike2
    OCL                  = SUPERWEAPON_TurkishCruiseStrike1
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior           = OCLSpecialPower ModuleTag_143
    SpecialPowerTemplate = SuperweaponTurkey_FOAB
    OCL                  = SUPERWEAPON_FOAB
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End
  Behavior           = OCLSpecialPower ModuleTag_213f3w
    SpecialPowerTemplate = SuperweaponTurkeyReconnaissance
    OCL                  = SUPERWEAPON_TurkeyReconnaissance
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
  End

  Behavior = FlammableUpdate ModuleTag_30
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = TransitionDamageFX ModuleTag_31
    ;-------------DESIGNED FOR MEDIUM SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_KillMarker
    DeathWeapon  = GenericTargetMarkerKiller
    StartsActive = Yes
  End
  Behavior          = FireWeaponWhenDeadBehavior ModuleTag_KillMarker2
    DeathWeapon     = GenericTargetMarkerKiller
    StartsActive    = Yes
    RequiredStatus  = SOLD
  End

  Geometry            = BOX
  GeometryMajorRadius = 110.0
  GeometryMinorRadius = 90.0
  GeometryHeight      = 49.0
  GeometryIsSmall     = No
  FactoryExitWidth    = 25     ; How much space to leave for units exiting.
  Shadow              = SHADOW_VOLUME
  BuildCompletion     = PLACED_BY_PLAYER

End
