; SPECTER TURKEY FACTION FULL RESET — Turkey_Systems
; Kept only non-weapon system Objects still referenced by buildings/OCL/commands.
; Removed weapon-like / unused system Objects.

Object TurkeySystemSpecialPowerShortcut
  SelectPortrait        = sys_specialpowers
  ButtonImage           = sys_specialpowers
  DisplayName           = OBJECT:TurkeySystemSpecialPower
  Side                  = Turkey
  EditorSorting         = SYSTEM
  CommandSet            = SpecialPowerShortcutTurkeySystem
  ; *** ENGINEERING Parameters ***
  RadarPriority         = NOT_ON_RADAR
  KindOf                = PRELOAD CLICK_THROUGH NO_SELECT NO_COLLIDE VEHICLE DRONE UNATTACKABLE AIRCRAFT
  ArmorSet
    Conditions          = None
    Armor               = InvulnerableAllArmor
    DamageFX            = EmptyDamageFX
  End
  MaxSimultaneousOfType = 1
  Body                  = ImmortalBody ModuleTag_01
    MaxHealth           = 1
    InitialHealth       = 1
  End
  Behavior = PhysicsBehavior ModuleTag_02
    Mass                = 10.0
  End
  Behavior              = DestroyDie ModuleTag_03
    DeathTypes          = ALL
  End
  Behavior              = AIUpdateInterface ModuleTag_04
  End
  Locomotor             = SET_NORMAL GenericSpecialPowersObjectEngine
  Geometry              = CYLINDER
  GeometryMajorRadius   = 1.0
  GeometryMinorRadius   = 1.0
  GeometryHeight        = 1.0
  GeometryIsSmall       = Yes
End

Object Turkey_Mig25RB_Radar

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = None 
    End
  End

  ; ***DESIGN parameters ***
  DisplayName           = OBJECT:Radar
  Side                  = Turkey
  EditorSorting         = SYSTEM
  TransportSlotCount    = 1
  VisionRange            = 450
  ShroudClearingRange = 450
  ArmorSet
    Conditions      = None
    Armor           = InvulnerableAllArmor 
    DamageFX        = None
  End

  ; *** AUDIO Parameters ***
  SoundFallingFromPlane = BombFallngFromPlane

  ; *** ENGINEERING Parameters ***
  KindOf            = PROJECTILE BALLISTIC_MISSILE

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 80000.0
    InitialHealth   = 80000.0
  End

  Behavior              = PhysicsBehavior ModuleTag_03
    Mass                = 75.0
    AerodynamicFriction = 4
    ForwardFriction     = 2
    CenterOfMassOffset  = 2
  End

  Behavior = MissileAIUpdate ModuleTag_04
    TryToFollowTarget   = No 
    FuelLifetime        = 0
    IgnitionDelay       = 0
    InitialVelocity     = 0
    DistanceToTravelBeforeTurning = 0
    DistanceToTargetBeforeDiving  = 0
  End
  Locomotor = SET_NORMAL NapalmBombLocomotor

  Behavior = FXListDie ModuleTag_FX
    DeathTypes = NONE +LASERED
    DeathFX = FX_GenericMissileDeath
  End

  Behavior = HeightDieUpdate ModuleTag_06
    TargetHeight = 1.0
    TargetHeightIncludesStructures = No
  End

  Behavior = DestroyDie ModuleTag_07
  End

  Geometry = SPHERE                      ;Collision geometry
  GeometryMajorRadius = 1.0              ;Collision major radius
  GeometryMinorRadius = 1.0              ;Collision minor radius
  GeometryHeight = 1.0                   ;Height for geometry
  GeometryIsSmall = Yes                  ;Is small geometry
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End

Object Turkey_GenericFakeRider1_Default_Rank

  ; ***DESIGN parameters ***
  Side                = Turkey
  EditorSorting       = SYSTEM
  TransportSlotCount  = 1
  
  WeaponSet
    Weapon            = SECONDARY SuicideUnresistableWeapon
    AutoChooseSources = SECONDARY NONE
  End
  
  ArmorSet
    Conditions      = None
    Armor           = InvulnerableAllArmor
    DamageFX        = DamageFX_Empty
  End
  
  ExperienceValue        = 0 0 0 0
  ExperienceRequired     = 0 50 100 200
  IsTrainable            = Yes             ;Can gain experience
  
  ; *** ENGINEERING Parameters ***
  KindOf =  PRELOAD CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS NO_COLLIDE IMMOBILE

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 10.0
    InitialHealth   = 10.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
  End

  Behavior = OCLUpdate ModuleTag_Remove01
    MinDelay     = 5000
    MaxDelay     = 5000
    OCL          = OCL_KillSelf
  End

  Behavior = DestroyDie ModuleTag_Die01
  End
  
  Geometry = CYLINDER
  GeometryMajorRadius = 1.0
  GeometryMinorRadius = 1.0
  GeometryHeight = 10000000.0
  GeometryIsSmall = Yes
End

