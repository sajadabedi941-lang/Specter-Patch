; SPECTER - Pakistan wrapper of AmericaFireBase (US M777 artillery structure)
; Donor Object AmericaFireBase / Command_ConstructAmericaFireBase. Side+prereqs only.



;------------------------------------------------------------------------------
Object UAE_FireBase
Scale = 0.9

  ; *** ART Parameters ***
  SelectPortrait         = us_m777N
  ButtonImage            = us_m777N
  Draw = W3DModelDraw ModuleTag_01

    IgnoreConditionStates = NIGHT

    OkToChangeModelColor = Yes

    ExtraPublicBone = STATION01
    ExtraPublicBone = STATION02


    DefaultConditionState
      Model             = US_M777
      WeaponMuzzleFlash  = PRIMARY MuzzleFX
      WeaponRecoilBone   = PRIMARY Barrel
      Turret            = Turret
      TurretPitch       = TurretLE
      WeaponLaunchBone  = PRIMARY   MuzzleFX
      WeaponFireFXBone  = PRIMARY   MuzzleFX
      WeaponLaunchBone  = SECONDARY   MuzzleFX
      WeaponFireFXBone  = SECONDARY   MuzzleFX
    End
    
    ConditionState      = DAMAGED
      Model             = US_M777
      WeaponMuzzleFlash  = PRIMARY MuzzleFX
      WeaponRecoilBone   = PRIMARY Barrel
      Turret            = Turret
      TurretPitch       = TurretLE
      WeaponLaunchBone  = PRIMARY   MuzzleFX
      WeaponFireFXBone  = PRIMARY   MuzzleFX
      WeaponLaunchBone  = SECONDARY   MuzzleFX
      WeaponFireFXBone  = SECONDARY   MuzzleFX
      WeaponMuzzleFlash  = SECONDARY MuzzleFX
      WeaponRecoilBone   = SECONDARY Barrel
    End
    
    ConditionState      = REALLYDAMAGED RUBBLE
      Model             = US_M777
      WeaponMuzzleFlash  = PRIMARY MuzzleFX
      WeaponRecoilBone   = PRIMARY Barrel
      Turret            = Turret
      TurretPitch       = TurretLE
      WeaponLaunchBone  = PRIMARY   MuzzleFX
      WeaponFireFXBone  = PRIMARY   MuzzleFX
      WeaponLaunchBone  = SECONDARY   MuzzleFX
      WeaponFireFXBone  = SECONDARY   MuzzleFX
      WeaponMuzzleFlash  = SECONDARY MuzzleFX
      WeaponRecoilBone   = SECONDARY Barrel
    End
  End
  PlacementViewAngle = -45



  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:M777
  Side              = UAE
  EditorSorting     = STRUCTURE
  Prerequisites
    Object = UAE_PowerPlant
  End
  BuildCost        = 1000
  BuildTime        = 20
  EnergyProduction = 0
  WeaponSet
    Conditions          = None 
    Weapon              = PRIMARY     M777A2_155mm_Howitzer
    AutoChooseSources   = PRIMARY     FROM_PLAYER FROM_SCRIPT FROM_AI
    Weapon              = SECONDARY   M777A2_155mm_ClusterShell_BD
    AutoChooseSources   = SECONDARY   FROM_PLAYER FROM_SCRIPT FROM_AI
    ShareWeaponReloadTime  = Yes
  End
  VisionRange    = 600.0           ; Shroud clearing distance AND targeting range
  ShroudClearingRange = 460
  ArmorSet
    Conditions      = None
    Armor           = FireBaseArmor
    DamageFX        = StructureDamageFXNoShake
  End
  CommandSet        = AmericaFireBaseCommandSet
  ExperienceValue     = 200 200 200 200  ; Experience point value at each level

  ; *** AUDIO Parameters ***
  VoiceSelect = FireBaseSelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End

  UnitSpecificSounds
  ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    TurretMoveStart = NoSound
    TurretMoveLoop = NoSound ;These aren't playing properly, will revisit (mp) TurretMoveLoopLoud
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority   = STRUCTURE
  KindOf          = PRELOAD STRUCTURE SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT IMMOBILE SPAWNS_ARE_THE_WEAPONS SCORE FS_TECHNOLOGY FS_BASE_DEFENSE IMMUNE_TO_CAPTURE GARRISONABLE_UNTIL_DESTROYED
  Body                 = HiveStructureBody ModuleTag_04
    MaxHealth          = 1000.0
    InitialHealth      = 1000.0
    SubdualDamageCap = 1200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
  Behavior = BaseRegenerateUpdate ModuleTag_05
    ;No data
  End 
  Behavior = AIUpdateInterface ModuleTag_06
    Turret
      TurretTurnRate        = 60   // turn rate, in degrees per sec
      TurretPitchRate       = 60
      AllowsPitch           = Yes
      NaturalTurretPitch    = 1   
      GroundUnitPitch       = 60
      MinPhysicalPitch      = -20
      ControlledWeaponSlots = PRIMARY SECONDARY TERTIARY
    End

    AutoAcquireEnemiesWhenIdle = Yes ;ATTACK_BUILDINGS; defensive weapon
    MoodAttackCheckRate        = 250
  End

  Behavior = GarrisonContain ModuleTag_07
    ContainMax                    = 2
    EnterSound                    = GarrisonEnter
    ExitSound                     = GarrisonExit
    ImmuneToClearBuildingAttacks  = Yes
    DamagePercentToUnits          = 100%

    IsEnclosingContainer          = No

  End

  Behavior = DestroyDie ModuleTag_08
    ;nothing
  End

  Behavior             = FXListDie ModuleTag_10
    DeathFX       = FX_StructureMediumDeath
  End

  Behavior = FlammableUpdate ModuleTag_12
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior                  = CreateObjectDie ModuleTag_13
    CreationList       = OCL_LargeStructureDebris
  End

  Behavior = TransitionDamageFX ModuleTag_14
    ;-------------DESIGNED FOR TINY SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionTinySmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionTinySmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionTinyExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionTinyShockwave
  End

  Geometry            = BOX
  GeometryMajorRadius = 45.0
  GeometryMinorRadius = 36.0
  GeometryHeight      = 15.0
  GeometryIsSmall     = No
  Shadow          = SHADOW_VOLUME
  BuildCompletion = PLACED_BY_PLAYER

End