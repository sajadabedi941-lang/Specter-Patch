; SPECTER PATCH - USAPAC3 stage 1 base unit.
; Gameplay cloned from packed Object US_THAAD in US_M1120.ini.
; Draw/models are live THAAD (US_M1120). No New Donor art.
; Does not redefine Object US_THAAD.

Object USAPAC3
Scale = 0.9

  ; *** ART Parameters ***
  SelectPortrait         = us_thaad
  ButtonImage            = us_thaad
  Draw = W3DTruckDraw ModuleTag_01
    OkToChangeModelColor               = Yes
    DefaultConditionState
      Model                   = US_M1120
      Animation               = US_M1120.US_M1120
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_FIRST
    End
    ConditionState            = REALLYDAMAGED
      Model                   = US_M1120D
      Animation               = US_M1120D.US_M1120D
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_FIRST
    End
    ConditionState            = RUBBLE
      Model                   = US_M1120D
    End
    ;*** PACKED STATE -- ready to move ***
    ConditionState            = MOVING
      Animation               = US_M1120.US_M1120
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_FIRST
    End
    ConditionState            = REALLYDAMAGED MOVING
      Model                   = US_M1120D
      Animation               = US_M1120D.US_M1120D
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_FIRST
    End
    ;*** UNPACKING STATE  -- preparing to fire ***
    ConditionState            = UNPACKING
      Animation               = US_M1120.US_M1120
      AnimationMode           = ONCE
    End
    ConditionState            = REALLYDAMAGED UNPACKING
      Model                   = US_M1120D
      Animation               = US_M1120D.US_M1120D
      AnimationMode           = ONCE
    End
    ;*** PACKING STATE -- preparing to move ***
    ConditionState            = PACKING
      Animation               = US_M1120.US_M1120
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_LAST
    End
    ConditionState            = REALLYDAMAGED PACKING
      Model                   = US_M1120D
      Animation               = US_M1120D.US_M1120D
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_LAST
    End
    ;*** DEPLOYED STATE -- ready to fire ***
    ConditionState            = DEPLOYED
      Model                   = US_M1120_A
      Animation               = US_M1120_A.US_M1120_A
      AnimationMode           = ONCE
      Flags                   = START_FRAME_LAST
    End
    ConditionState            = DEPLOYED REALLYDAMAGED
      Model                   = US_M1120_AD
      Animation               = US_M1120_AD.US_M1120_AD
      AnimationMode           = ONCE
      Flags                   = START_FRAME_LAST
    End
    TrackMarks                = EXTireTrack.tga
    Dust                      = ScudLauncherDust
    DirtSpray                 = RocketBuggyDirtSpray
    PowerslideSpray           = RocketBuggyDirtPowerSlide
    LeftFrontTireBone         = Tire01
    RightFrontTireBone        = Tire03
    LeftRearTireBone          = Tire06
    RightRearTireBone         = Tire08
    MidLeftFrontTireBone      = Tire02
    MidRightFrontTireBone     = Tire04
    MidLeftRearTireBone       = Tire05
    MidRightRearTireBone      = Tire07
    TireRotationMultiplier    = 0.2
  End
  ; ***DESIGN parameters ***
  DisplayName          = OBJECT:USAPAC3
  Side                 = America
  MaxSimultaneousOfType = 3
  EditorSorting        = VEHICLE
  TransportSlotCount   = 6
  WeaponSet
    Conditions         = None 
    Weapon             = SECONDARY USAPAC3_Weapon
    Weapon             = TERTIARY  USAPAC3_Weapon_ABM
  End
  ArmorSet
    Conditions         = None
    Armor              = LargeVehicleArmor
    DamageFX           = TankDamageFX
  End
  BuildCost            = 3876
  BuildTime            = 18.6
  VisionRange          = 100
  ShroudClearingRange  = 100
  ExperienceValue      = 160 160 260 420
  ExperienceRequired   = 0 500 1000 1700
  IsTrainable          = Yes
  CrusherLevel         = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel       = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet           = S400ECommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect = ScudLauncherVoiceSelect
  VoiceMove = ScudLauncherVoiceMove
  VoiceGuard = ScudLauncherVoiceMove
  VoiceAttack = ScudLauncherVoiceAttack
  SoundMoveStart = ScudLauncherMoveStart
  SoundMoveStartDamaged = ScudLauncherMoveStart
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate       = ScudLauncherVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop
    TruckLandingSound = NoSound
    TruckPowerslideSound = NoSound
    VoiceCrush = ScudLauncherVoiceCrush
    VoiceEnter = ScudLauncherVoiceMove
    VoicePrimaryWeaponMode = ScudLauncherVoiceModeHiEx
    VoiceSecondaryWeaponMode = ScudLauncherVoiceModeAnthrax
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE HEAL_PAD NO_HEAL_ICON DONT_AUTO_CRUSH_INFANTRY CAN_ATTACK CAN_CAST_REFLECTIONS VEHICLE HUGE_VEHICLE SCORE ;BOI?
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 400.0
    InitialHealth   = 400.0
    SubdualDamageCap = 480
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
   Behavior = DeployStyleAIUpdate ModuleTag_03
    AutoAcquireEnemiesWhenIdle = No
    PackTime = 5000
    UnpackTime = 5000
    TurretsFunctionOnlyWhenDeployed = Yes
    TurretsMustCenterBeforePacking = Yes
    ManualDeployAnimations = Yes
  End
  Locomotor = SET_NORMAL      Generic8x8Locomotor
  Behavior  = PhysicsBehavior ModuleTag_07_1
  Mass      = 400.0
  End



;------------------------ Death ----------------------------------
  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_L8F09
    DeathTypes = ALL -SPLATTED -EXTRA_8
    ProbabilityModifier = 50
    DestructionDelay = 100
    DestructionDelayVariance = 300
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_ThaadDeathEffect
    FX  = FINAL    FX_GenericFreeFallBombsExplosion
  End
  Behavior = SlowDeathBehavior ModuleTag_111
    DeathTypes = NONE +SPLATTED
    OCL = FINAL    OCL_THAAD_Deployed
  End
  Behavior = SlowDeathBehavior ModuleTag_222
    DeathTypes = NONE +EXTRA_8
    OCL = FINAL    OCL_THAAD_Deployed_ABM
  End
  Behavior = ProductionUpdate ModuleTag_05
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  Behavior = TransitionDamageFX ModuleTag_09
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = FlammableUpdate ModuleTag_11
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
;------------------------ End Of Death ----------------------------------



;------------------------ CombatModes -----------------------------------


  Behavior        = CommandSetUpgrade ModuleTag_CombatMode_AA
  TriggeredBy     = Upgrade_AADS_AA_Mode
  CommandSet      = S400ECommandSet_AA
  End
  Behavior        = CommandSetUpgrade ModuleTag_CombatMode_ABM
  TriggeredBy     = Upgrade_AADS_ABM_Mode
  CommandSet      = S400ECommandSet_ABM
  End

;----------------------- End Of CombatModes -----------------------------

  Geometry            = BOX
  GeometryMajorRadius = 45.0
  GeometryMinorRadius = 12.0
  GeometryHeight      = 16.0     
  GeometryIsSmall     = Yes
  Shadow              = SHADOW_VOLUME 
  ShadowSizeX         = 45
End
