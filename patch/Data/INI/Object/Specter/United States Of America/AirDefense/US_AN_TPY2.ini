Object US_AN_TPY2
Scale = 0.9

  ; *** ART Parameters ***
  SelectPortrait         = us_tpy2
  ButtonImage            = us_tpy2
  Draw = W3DTruckDraw ModuleTag_01
    OkToChangeModelColor               = Yes
    DefaultConditionState
      Model                   = US_AN_TPY2
      Animation               = US_AN_TPY2.US_AN_TPY2
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_FIRST
      WeaponLaunchBone        = PRIMARY MISSILE
      WeaponMuzzleFlash       = PRIMARY MISSILE
      WeaponFireFXBone        = PRIMARY MISSILE
      WeaponLaunchBone        = SECONDARY MISSILE
      WeaponMuzzleFlash       = SECONDARY MISSILE
      WeaponFireFXBone        = SECONDARY MISSILE
    End
    ConditionState            = REALLYDAMAGED
      Model                   = US_AN_TPY2D
      Animation               = US_AN_TPY2D.US_AN_TPY2D
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_FIRST
      WeaponLaunchBone        = PRIMARY MISSILE
      WeaponMuzzleFlash       = PRIMARY MISSILE
      WeaponFireFXBone        = PRIMARY MISSILE
      WeaponLaunchBone        = SECONDARY MISSILE
      WeaponMuzzleFlash       = SECONDARY MISSILE
      WeaponFireFXBone        = SECONDARY MISSILE
    End
    ConditionState            = RUBBLE
      Model                   = US_AN_TPY2D
    End
    ;*** PACKED STATE -- ready to move ***
    ConditionState            = MOVING
      Animation               = US_AN_TPY2.US_AN_TPY2
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_FIRST
    End
    ConditionState            = REALLYDAMAGED MOVING
      Model                   = US_AN_TPY2D
      Animation               = US_AN_TPY2D.US_AN_TPY2D
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_FIRST
    End
    ;*** UNPACKING STATE  -- preparing to fire ***
    ConditionState            = UNPACKING
      Model                   = US_AN_TPY2
      Animation               = US_AN_TPY2.US_AN_TPY2
      AnimationMode           = ONCE
    End
    ConditionState            = REALLYDAMAGED UNPACKING
      Model                   = US_AN_TPY2D
      Animation               = US_AN_TPY2D.US_AN_TPY2D
      AnimationMode           = ONCE
    End
    ;*** PACKING STATE -- preparing to move ***
    ConditionState            = PACKING
      Model                   = US_AN_TPY2
      Animation               = US_AN_TPY2.US_AN_TPY2
      Flags                   = START_FRAME_LAST
    End
    ConditionState            = REALLYDAMAGED PACKING
      Model                   = US_AN_TPY2D
      Animation               = US_AN_TPY2D.US_AN_TPY2D
      AnimationMode           = ONCE_BACKWARDS
      Flags                   = START_FRAME_LAST
    End
    ;*** DEPLOYED STATE -- ready to fire ***
    ConditionState            = DEPLOYED 
      Model                   = US_AN_TPY2
      Animation               = US_AN_TPY2.US_AN_TPY2
      AnimationMode           = ONCE
      ;Flags                   = START_FRAME_LAST
    End
    ConditionState            = DEPLOYED REALLYDAMAGED
      Model                   = US_AN_TPY2D
      Animation               = US_AN_TPY2D.US_AN_TPY2D
      AnimationMode           = ONCE
    End
    TrackMarks                = EXTireTrack.tga
    Dust                      = ScudLauncherDust
    DirtSpray                 = RocketBuggyDirtSpray
    PowerslideSpray           = RocketBuggyDirtPowerSlide
    LeftFrontTireBone         = Tire01
    RightFrontTireBone        = Tire03
    LeftRearTireBone          = Tire06
    RightRearTireBone         = Tire08
    MidLeftFrontTireBone      = Tire02
    MidRightFrontTireBone     = Tire04
    MidLeftRearTireBone       = Tire05
    MidRightRearTireBone      = Tire07
    TireRotationMultiplier    = 0.2
  End
  ; ***DESIGN parameters ***
  DisplayName          = OBJECT:ANTPY2N
  Side                 = America
  EditorSorting        = VEHICLE
  TransportSlotCount   = 6
  WeaponSet
    Conditions         = None 
    Weapon             = SECONDARY 92N6R_Deploy
    AutoChooseSources  = SECONDARY NONE
  End
  ArmorSet
    Conditions         = None
    Armor              = LargeVehicleArmor
    DamageFX           = TruckDamageFX
  End
  BuildCost            = 2600
  BuildTime            = 15.0
  VisionRange          = 100
  ShroudClearingRange  = 100

  ExperienceValue      = 125 125 220 345
  ExperienceRequired   = 0 220 345 640
  IsTrainable          = Yes
  CrusherLevel         = 2
  CrushableLevel       = 2
  CommandSet           = Iraq92N6ECommandSet2
  ; *** AUDIO Parameters ***
  VoiceSelect = RadarVanVoiceSelect
  VoiceMove = RadarVanVoiceMove
  VoiceAttack = RadarVanVoiceMove
;  SoundMoveStart = RadarVanMoveStart
;  SoundMoveStartDamaged = RadarVanMoveStart
  SoundMoveLoop = ConvoyTruckMoveLoop
  SoundMoveLoopDamaged = ConvoyTruckMoveLoop
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate     = RadarVanVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop  
    TruckLandingSound = NoSound ;RocketBuggyLand
    TruckPowerslideSound = NoSound ;RocketBuggyPowerslide
    VoiceCrush      = RadarVanVoiceCrush
    Deploy              = NukeCannonDeploy
    Undeploy            = NukeCannonUnDeploy
    VoiceEnter = RadarVanVoiceMove
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = DONT_AUTO_CRUSH_INFANTRY HEAL_PAD NO_HEAL_ICON SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS PRELOAD VEHICLE SCORE;Hey Boi ;)
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 800
    InitialHealth   = 800
    SubdualDamageCap = 480
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
   Behavior = DeployStyleAIUpdate ModuleTag_DS
    PackTime          = 3888
    UnpackTime        = 3888
    TurretsFunctionOnlyWhenDeployed  = Yes
    TurretsMustCenterBeforePacking   = Yes
    AutoAcquireEnemiesWhenIdle       = No
    ManualDeployAnimations           = Yes
  End
  Locomotor = SET_NORMAL Generic8x8Locomotor
  Behavior = PhysicsBehavior ModuleTag_Mass
    Mass = 300.0
  End
;------------------------ Death ----------------------------------

  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_L8F09
    DeathTypes = ALL -SPLATTED -EXTRA_8
    ProbabilityModifier = 50
    DestructionDelay = 100
    DestructionDelayVariance = 300
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_Tpy2DeathEffect
    FX  = FINAL    FX_UnguidedRocketExplosion
  End
  Behavior = SlowDeathBehavior ModuleTag_TOPPLED01
    DeathTypes = NONE +SPLATTED
    OCL = FINAL    OCL_AN_TPY2_Deployed
  End
  Behavior = TransitionDamageFX ModuleTag_10c23
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = ProductionUpdate ModuleTag_11vc34
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  Behavior = FlammableUpdate ModuleTag_12hb4
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

;------------------------ End Of Death ----------------------------------

;------------------------ Packing System ---------------------------
  Behavior               = FireWeaponWhenDeadBehavior ModuleTag_FCS_DOWN
    DeathWeapon          = Generic_SAM_FCS_PowerDown
    StartsActive         = Yes
  End
;------------------------ End Of Packing System ---------------------------


  Geometry            = BOX
  GeometryMajorRadius = 42.0
  GeometryMinorRadius = 10.0
  GeometryHeight      = 20.0     
  GeometryIsSmall     = Yes
  Shadow              = SHADOW_VOLUME 
  ShadowSizeX         = 45
End
