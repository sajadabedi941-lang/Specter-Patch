; SPECTER PATCH - USA Auter F22 (new object). Existing F-22 objects untouched.
; Donor ART: LSFF22 / LSFF22d / LSFF22k already in _SPEC_ART_ONE.big.
; Draw bones match donor W3D (MISSILEA01/B01, ENGINE01/02, WINGTIP01/02).
; No WeaponA / BurnerFX (those bones do not exist on LSFF22).
; Weapons / A2G role unchanged. Does not overwrite AmericaJetF-22A_AA.


;----------------------------------------------------------------------------;
;-------------- US AirForce - F22A AG Loadout -----------------;
;------------------------ Code By Pcc Studios Team --------------------------;








;------------------------------------------------------------------------------
Object AmericaJetAuterF22
Scale = 0.9
  ; *** ART Parameters ***
  SelectPortrait         = us_f22a
  ButtonImage            = us_f22a
  
  UpgradeCameo1 = Upgrade_AmericaCountermeasures
  UpgradeCameo2 = Upgrade_MTS
  ;UpgradeCameo4 = NONE
  ;UpgradeCameo5 = NONE
  
  Draw                   = W3DModelDraw ModuleTag_01
 
    DefaultConditionState
      Model               = LSFF22
      WeaponLaunchBone    = PRIMARY   MISSILEA01
      WeaponLaunchBone    = SECONDARY MISSILEB01
    End
    ConditionState        = RIDER1
      Model               = LSFF22
      WeaponLaunchBone    = PRIMARY   MISSILEA01
      WeaponLaunchBone    = SECONDARY MISSILEB01
    End
    ConditionState        = RIDER2
      Model               = LSFF22
      WeaponLaunchBone    = PRIMARY   MISSILEA01
      WeaponLaunchBone    = SECONDARY MISSILEB01
    End

    ConditionState        = JETEXHAUST
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End
    ConditionState        = RIDER1 JETEXHAUST
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End
    ConditionState        = RIDER2 JETEXHAUST
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End

    ConditionState        = JETEXHAUST JETAFTERBURNER
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ParticleSysBone     = Engine01 JetLenzflare
      ParticleSysBone     = Engine02 JetLenzflare
    End
    ConditionState        = RIDER1 JETEXHAUST JETAFTERBURNER
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ParticleSysBone     = Engine01 JetLenzflare
      ParticleSysBone     = Engine02 JetLenzflare
    End
    ConditionState        = RIDER2 JETEXHAUST JETAFTERBURNER
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ParticleSysBone     = Engine01 JetLenzflare
      ParticleSysBone     = Engine02 JetLenzflare
    End

    ConditionState        = REALLYDAMAGED
      Model               = LSFF22d
      ; damage (LSFF22d has Engine01, no Smoke01 bone)
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
    End
    
    ConditionState        = REALLYDAMAGED JETEXHAUST
      Model               = LSFF22d
      ; damage
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
      Model               = LSFF22d
      ; damage
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
      ; afterburner (LSFF22 has Engine01/02, no BurnerFX subobjects)
      ParticleSysBone     = Engine01 JetLenzflare
      ParticleSysBone     = Engine02 JetLenzflare
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End

    ConditionState        = RUBBLE
      Model               = LSFF22k
      HideSubObject       = None 
      ShowSubObject       = None
    End

    ConditionState        = RUBBLE JETEXHAUST JETAFTERBURNER
      Model               = LSFF22k
      ;HideSubObject is needed cause there're inherited from default condition state      
      HideSubObject       = None 
      ShowSubObject       = None
      ParticleSysBone     = Engine01 JetExhaust
      ParticleSysBone     = Engine02 JetExhaust
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End
    AliasConditionState = RIDER1 REALLYDAMAGED
    AliasConditionState = RIDER1 REALLYDAMAGED JETEXHAUST
    AliasConditionState = RIDER1 REALLYDAMAGED JETEXHAUST JETAFTERBURNER
    AliasConditionState = RIDER1 RUBBLE
    AliasConditionState = RIDER1 RUBBLE JETEXHAUST JETAFTERBURNER
    AliasConditionState = RIDER2 REALLYDAMAGED
    AliasConditionState = RIDER2 REALLYDAMAGED JETEXHAUST
    AliasConditionState = RIDER2 REALLYDAMAGED JETEXHAUST JETAFTERBURNER
    AliasConditionState = RIDER2 RUBBLE
    AliasConditionState = RIDER2 RUBBLE JETEXHAUST JETAFTERBURNER

    OkToChangeModelColor = Yes

  End

  ; ***DESIGN parameters ***
  DisplayName           = OBJECT:AmericaJetAuterF22
  EditorSorting         = VEHICLE
  Side                  = America
  TransportSlotCount    = 0                 ;how many "slots" we take in a transport (0 == not transportable)
  VisionRange           = 680.0 
  ShroudClearingRange   = 420.0
  Prerequisites
    ;Object = AmericaAirfield
  End
  WeaponSet
    Conditions          = None
    Weapon              = PRIMARY     AIM120D_BVR_MRAAM_F22A
  End
  WeaponSet
    Conditions          = PLAYER_UPGRADE
    Weapon              = PRIMARY    GBU-39_SDB_F22A
    Weapon              = SECONDARY  AN/APG77_AESA_Radar_AGMode
    ;Weapon              = TERTIARY   AN/APG77_AESA_Radar_AGMode2
  End
  WeaponSet
    Conditions          = WEAPON_RIDER2
    Weapon              = PRIMARY     AIM120D_BVR_MRAAM_F22A
    Weapon              = SECONDARY   AN/APG77_AESA_Radar_AAMode
    Weapon              = TERTIARY    2x_AIM-9X
  End
  ArmorSet
    Conditions      = None
    Armor           = AirplaneArmor_P
    DamageFX        = None
  End
  ArmorSet
    Conditions            = PLAYER_UPGRADE
    Armor                 = CountermeasuresAirplaneArmor_P
    DamageFX              = None
  End

  BuildCost           = 1600
  BuildTime           = 20.0            ;in seconds  
  ExperienceValue     = 100 100 200 300 ;Experience point value at each level
  ExperienceRequired  = 0 200 300 600   ; Experience points needed to gain each level
  IsTrainable         = Yes             ;Can gain experience
  CrusherLevel           = 1  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet = F22A_AA_CommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect     = StealthFighterVoiceSelect
  VoiceMove       = StealthFighterVoiceMove
  VoiceAttack     = StealthFighterVoiceAttack
  VoiceAttackAir  = StealthFighterVoiceAttackAir
  VoiceGuard      = StealthFighterVoiceAirPatrol
  SoundAmbient    = StealthFighterAmbientLoop
  SoundAmbientRubble    = NoSound
  SoundStealthOn  = StealthOn
  SoundStealthOff = StealthOff
  UnitSpecificSounds
    VoiceCreate   = StealthFighterVoiceCreate
    SoundEject    = PilotSoundEject
    VoiceEject    = PilotVoiceEject
    Afterburner   = RaptorAfterburner
    VoiceLowFuel  = AuroraBomberVoiceLowFuel
    VoiceGarrison = StealthFighterVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority   = LOCAL_UNIT_ONLY
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 520.0
    InitialHealth   = 520.0
  End

  Behavior                          = JetSlowDeathBehavior ModuleTag_03
    FXOnGroundDeath                 = FX_JetOnGroundDeath
    OCLOnGroundDeath                = OCL_StealthDeathFinalBlowUp
    DestructionDelay                = 99999999; destruction will happen when we
    RollRate                        = 0.2
    RollRateDelta                   = 100% ;each frame, rollrate = rollrate * rollrateDelta
    PitchRate                       = 0.0
    FallHowFast                     = 110.0%  ;Bigger is faster (can be over 100%,it's a fraction of gravity)
    FXInitialDeath                  = FX_StealthFighterDeathInitial
    ;OCLInitialDeath                = None
    DelaySecondaryFromInitialDeath  = 500  ; in milliseconds
    FXSecondary                     = FX_JetDeathSecondary
    ;OCLSecondary                   = None
    FXHitGround                     = FX_JetDeathHitGround
    ;OCLHitGround                   = None
    DelayFinalBlowUpFromHitGround   = 200 ; in milliseconds
    FXFinalBlowUp                   = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp                  = OCL_StealthDeathFinalBlowUp
;   DeathLoopSound                  = MICAL NEEDS TO MAKE ME
  End
  Behavior = EjectPilotDie ModuleTag_04
    GroundCreationList = OCL_EjectPilotOnGround
    AirCreationList = OCL_EjectPilotViaParachute
    ExemptStatus = HIJACKED
    VeterancyLevels =  ALL -REGULAR ;only vet+ gives pilot
  End
 
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 500.0
  End

  Behavior = JetAIUpdate ModuleTag_06
    OutOfAmmoDamagePerSecond = 10%  ; amount of damage to take per SEC (not per frame) when out of ammo
                                    ; note that it's expressed as a percent of max health, not an absolute
    TakeoffDistForMaxLift     = 0%   ; larger numbers give more lift sooner when taking off
    TakeoffPause           = 500
    MinHeight              = 6
    ReturnToBaseIdleTime   = 10000         ; if idle for this long, return to base, even if not out of ammo
  End

  Behavior = ExperienceScalarUpgrade ModuleTag_08
    TriggeredBy = Upgrade_AmericaAdvancedTraining
    AddXPScalar = 1.0 ;Increases experience gained by an additional 100%
  End
  Behavior = WeaponSetUpgrade ModuleTag_MTS
    TriggeredBy = Upgrade_MTS
  End
  Behavior = WeaponSetUpgrade ModuleTag_USAAirForceBombs
    TriggeredBy = Upgrade_America_AirForceBombs
  End

  Behavior = StealthUpdate ModuleTag_09
    StealthDelay                          = 500 ; msec
    StealthForbiddenConditions            = FIRING_PRIMARY
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
  Behavior                = ArmorUpgrade ModuleTag_Armor01
    TriggeredBy           = Upgrade_AmericaCountermeasures
  End
  Behavior                = CountermeasuresBehavior ModuleTag_10
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureFlare
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 3     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = 60.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 2.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 750  ; Time between flare volleys
    NumberOfVolleys       = 6     ; Number of times the volleys will fire before reloading
    ReloadTime            = 0     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 45%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 0     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 200   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End
  Behavior                = CountermeasuresBehavior ModuleTag_2d0
    TriggeredBy           = Upgrade_ChaffUpgrade
    FlareTemplateName     = CountermeasureCHAFF
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 8     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = 90.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 6.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 200  ; Time between flare volleys
    NumberOfVolleys       = 12     ; Number of times the volleys will fire before reloading
    ReloadTime            = 0     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 70%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 0     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 150   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End
  Behavior = GrantUpgradeCreate ModuleTag_Chaff
    UpgradeToGrant = Upgrade_ChaffUpgrade
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_ALQ135
    WeaponTemplate        = AN/ALQ-135
    PrimaryTargetTypes    = SMALL_MISSILE
    ScanRate              = 1000
    ScanRange             = 520
    PredictTargetVelocityFactor = 3.0
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_ALQ135AHAM
    WeaponTemplate        = AN/ALQ-135_AHAM
    PrimaryTargetTypes    = BALLISTIC_MISSILE
    ScanRate              = 1000
    ScanRange             = 520
    PredictTargetVelocityFactor = 3.0
  End
  ;Behavior = PointDefenseLaserUpdate ModuleTag_ALQ135B
    ;WeaponTemplate        = AN/ALQ-135B
    ;PrimaryTargetTypes    = FS_BASE_DEFENSE STRUCTURE
    ;ScanRate              = 10000
