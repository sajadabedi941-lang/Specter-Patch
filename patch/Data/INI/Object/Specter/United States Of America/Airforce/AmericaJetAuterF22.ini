    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Behavior = CreateObjectDie ModuleTag_Deletion
    DeathTypes   = NONE +EXTRA_6
    CreationList = None
  End
  Behavior = RiderChangeContain ModuleTag_AGAA
    Rider1 = GenericAircraftAGMode  RIDER1 WEAPON_RIDER1 STATUS_RIDER1 GenericMultiRoleFighter_AG_CommandSet SET_NORMAL
    Rider2 = GenericAircraftAAMode  RIDER2 WEAPON_RIDER2 STATUS_RIDER2 GenericMultiRoleFighter_AA_CommandSet SET_NORMAL
    ScuttleDelay              = 1000
    ScuttleStatus             = TOPPLED
    Slots                     = 1
    HealthRegen%PerSec        = 0
    ScatterNearbyOnExit       = No
    DamagePercentToUnits      = 0%
    AllowInsideKindOf         = INFANTRY
    BurnedDeathToUnits        = No
    ExitDelay                 = 0
    GoAggressiveOnExit        = No
    DoorOpenTime              = 0
    NumberOfExitPaths         = 1
    OrientLikeContainerOnExit = Yes
  End
  Behavior               = OCLSpecialPower ModuleTag_AGMode
    SpecialPowerTemplate = SpecialAbility_AGMode
    OCL                  = OCL_SpecialAbilityAGMode
  End
  Behavior               = OCLSpecialPower ModuleTag_AAMode
    SpecialPowerTemplate = SpecialAbility_AAMode
    OCL                  = OCL_SpecialAbilityAAMode
