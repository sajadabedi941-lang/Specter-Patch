;
; Identity kept:
;   Object = AmericaJetB21Clean
;   Draw/model = AVB21_A
;   BuildCost = 12000
;   Stealth = LOCAL_UNIT_ONLY + StealthUpdate
;   Airfield spawn redirects = AmericaJetB21Clean
;
; Control / attack architecture cloned from AmericaJetF-16C_AG:
;   JetAIUpdate, F100_PW_229 locomotor, F16C_AG_CommandSet,
;   WeaponSet Conditions=None, KindOf, Vision/targeting fields.
;
; PRIMARY weapon = AmericaJetB21_AirLaunchedBGM109Weapon
