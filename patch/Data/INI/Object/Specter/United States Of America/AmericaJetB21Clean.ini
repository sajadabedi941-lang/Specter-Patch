  ExperienceValue         = 50 50 100 150
  ExperienceRequired      = 0 100 200 400
  IsTrainable = Yes
  CrusherLevel           = 1
  CrushableLevel         = 2
  ; Donor CommandSet (has AttackMove; auto-attack does not require FIRE button)
