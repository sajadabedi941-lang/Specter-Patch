;==============================================================================
; AmericaJetB21_AirLaunchedBGM109
; Aircraft PRIMARY projectile for AmericaJetB21_AirLaunchedBGM109Weapon.
; Based on packed BGM109ECruiseMissileObject (US_BGM109 visual / guidance).
; NOT a General Power / SpecialPower / VLS / OCL summon object.
;==============================================================================

Object AmericaJetB21_AirLaunchedBGM109

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = US_BGM109
      ParticleSysBone = Engine01 Spec_GenericMissileFlare
      ParticleSysBone = Engine01 Spec_GenericMissileTrail
    End
    ConditionState = JAMMED
      Model = US_BGM109
      ParticleSysBone = None SparksMedium
      ParticleSysBone = None MissileContrail
    End
  End

  ; *** DESIGN parameters ***
  DisplayName       = OBJECT:CruiseMissile
  EditorSorting     = SYSTEM
  Side              = America
  VisionRange       = 50.0

  ArmorSet
    Conditions      = None
    Armor           = CruiseMissileArmor
    DamageFX        = None
  End

  SoundAmbient      = GenericMissileAmbientLoop

  ; *** ENGINEERING Parameters ***
  RadarPriority     = UNIT
  KindOf            = PROJECTILE SMALL_MISSILE VEHICLE CAN_ATTACK
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 800.0
    InitialHealth   = 800.0
    SubdualDamageCap = 200
    SubdualDamageHealRate = 100000
    SubdualDamageHealAmount = 50
  End

  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    FX         = FX_GenericMissileDeath
  End

  Behavior = PhysicsBehavior ModuleTag_05
    Mass                  = 500.0
    ShockResistance       = 0.8
    AerodynamicFriction   = 1.2
    CenterOfMassOffset    = 2
    AllowBouncing         = Yes
    AllowCollideForce     = Yes
    KillWhenRestingOnGround = No
  End

  Behavior = MissileAIUpdate ModuleTag_AI
    TryToFollowTarget             = Yes
    DetonateCallsKill             = No
    FuelLifetime                  = 99999999999
    InitialVelocity               = 40
    IgnitionDelay                 = 0
    DistanceToTravelBeforeTurning = 0
    DistanceToTargetBeforeDiving  = 200
  End
  Locomotor = SET_NORMAL BGM109ECruiseMissileLocomotor

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
End
