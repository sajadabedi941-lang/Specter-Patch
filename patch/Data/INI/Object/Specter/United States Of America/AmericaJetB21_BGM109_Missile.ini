;==============================================================================
; AmericaJetB21_BGM109_Missile
; Aircraft projectile architecture cloned from working B-2 bomb MK-84
; (USA_WeaponObjects.ini) so PRIMARY stays fireable with B-2 weapon logic.
; Visual/trail from real BGM-109 mesh US_BGM109 (same W3D as BGM109ECruiseMissileObject).
; No General Power / VLS / OCL / ship summon logic.
;==============================================================================

Object AmericaJetB21_BGM109_Missile

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model = US_BGM109
      ParticleSysBone = Engine01 Spec_GenericMissileFlare
      ParticleSysBone = Engine01 Spec_GenericMissileTrail
    End
  End

  ; ***DESIGN parameters ***
  Side = America
  EditorSorting     = SYSTEM
  ArmorSet
    Conditions      = None
    Armor           = ProjectileArmor
    DamageFX        = None
  End
  VisionRange       = 0.0

  ; *** ENGINEERING Parameters ***
  KindOf            = PROJECTILE
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End

  Behavior              = PhysicsBehavior ModuleTag_03
    Mass                = 75.0
    AerodynamicFriction = 2
    ForwardFriction     = 2
    CenterOfMassOffset  = 2
    AllowCollideForce = Yes
  End

  Behavior = MissileAIUpdate ModuleTag_04
    TryToFollowTarget   = No
    FuelLifetime        = 0
    IgnitionDelay       = 0
    InitialVelocity     = 0
    DistanceToTravelBeforeTurning = 0
    DistanceToTargetBeforeDiving  = 0
  End
  Locomotor = SET_NORMAL AuroraBombLocomotor

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 2.0
End
