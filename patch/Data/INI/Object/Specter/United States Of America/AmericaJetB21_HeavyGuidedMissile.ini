;==============================================================================
; AmericaJetB21_HeavyGuidedMissile
; Guided air-to-ground projectile for AmericaJetB21_HeavyGuidedMissileWeapon.
; Visual = US_BGM109 (same W3D as working B-21 / BGM109ECruiseMissileObject).
; Guided tracking enabled (TryToFollowTarget = Yes) for moving ground targets.
; No General Power / VLS / ship summon logic.
;==============================================================================

Object AmericaJetB21_HeavyGuidedMissile

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model = US_BGM109
      ParticleSysBone = Engine01 Spec_GenericMissileFlare
      ParticleSysBone = Engine01 Spec_GenericMissileTrail
    End
  End

  ; ***DESIGN parameters ***
  Side = America
  EditorSorting     = SYSTEM
  ArmorSet
    Conditions      = None
    Armor           = ProjectileArmor
    DamageFX        = None
  End
  VisionRange       = 0.0

  ; *** ENGINEERING Parameters ***
  KindOf            = PROJECTILE
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End

  Behavior              = PhysicsBehavior ModuleTag_03
    Mass                = 75.0
    AerodynamicFriction = 2
    ForwardFriction     = 2
    CenterOfMassOffset  = 2
    AllowCollideForce = Yes
  End

  Behavior = MissileAIUpdate ModuleTag_04
    TryToFollowTarget   = Yes
    DetonateCallsKill   = No
    FuelLifetime        = 99999999999
    InitialVelocity     = 40
    IgnitionDelay       = 0
    DistanceToTravelBeforeTurning = 0
    DistanceToTargetBeforeDiving  = 200
  End
  Locomotor = SET_NORMAL BGM109ECruiseMissileLocomotor

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 2.0
End
