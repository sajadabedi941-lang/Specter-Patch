; B-21 10-ton class MOP / GBU-57 projectile (visual from TEOD B21MOP_Bomb).
; Combat damage comes from AmericaJetB21_SingleHeavyBunkerBuster weapon
; (clone of USA_B2_Spirit_BunkerBuster). No nuke death modules.

Object AmericaJetB21_MOP_Bomb

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = GBU_57
    End
  End

  ; *** DESIGN parameters ***
  Side = America
  EditorSorting     = SYSTEM
  ArmorSet
    Conditions      = None
    Armor           = ProjectileArmor
    DamageFX        = None
  End
  VisionRange       = 0.0

  ; *** ENGINEERING Parameters ***
  KindOf            = PROJECTILE
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End

  Behavior              = PhysicsBehavior ModuleTag_03
    Mass                = 75.0
    AerodynamicFriction = 2
    ForwardFriction     = 2
    CenterOfMassOffset  = 2
    AllowCollideForce = Yes
  End

  Behavior = MissileAIUpdate ModuleTag_04
    TryToFollowTarget   = No
    FuelLifetime        = 0
    IgnitionDelay       = 0
    InitialVelocity     = 0
    DistanceToTravelBeforeTurning = 0
    DistanceToTargetBeforeDiving  = 0
  End
  Locomotor = SET_NORMAL AuroraBombLocomotor

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 2.0
End
