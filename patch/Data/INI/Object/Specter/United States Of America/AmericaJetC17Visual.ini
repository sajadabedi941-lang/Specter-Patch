Object AmericaJetC17ParaDropTransport
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = IUAC17HXNew
    End
    OkToChangeModelColor = Yes
  End
  DisplayName = OBJECT:CargoPlane
  EditorSorting = SYSTEM
  Side = America
  Buildable = No
  KindOf = PRELOAD VEHICLE AIRCRAFT IGNORED_IN_GUI EMP_HARDENED
  Body = ActiveBody ModuleTag_03
    MaxHealth = 1.0
    InitialHealth = 1.0
  End
  Geometry = Box
  GeometryMajorRadius = 1.0
  GeometryMinorRadius = 1.0
  GeometryHeight = 1.0
End
