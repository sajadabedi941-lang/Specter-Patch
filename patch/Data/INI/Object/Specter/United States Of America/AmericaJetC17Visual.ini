;==============================================================================
; AmericaJetC17Visual - USA C-17 Globemaster transport
; Flight = same JetAI + D30-F6 as working An-124 / IL-76 cargo jets.
; No fire weapon. No CombatDrop (that dumps tanks at jet speed).
; Paradrop is SpecialPower -> OCL DeliverPayload through
; AmericaJetC17ParaDropTransport + GenericVehicleParachute.
; Model IUAC17HXNew unchanged. Do not add DeliverPayloadAI (blocks JetAI).
;==============================================================================

Object AmericaJetC17Visual

  SelectPortrait         = C17GlobalMaster
  ButtonImage            = C17GlobalMaster

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model = IUAC17HXNew
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = Engine03 JetBlackTrailThin
      ParticleSysBone = Engine04 JetBlackTrailThin
    End

    ConditionState = JETEXHAUST
      Model = IUAC17HXNew
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = Engine03 JetBlackTrailThin
      ParticleSysBone = Engine04 JetBlackTrailThin
    End

    ConditionState = REALLYDAMAGED
      Model = IUAC17HXNew
      ParticleSysBone = Smoke01 JetSmoke
    End

    ConditionState = REALLYDAMAGED JETEXHAUST
      Model = IUAC17HXNew
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
    End

    ConditionState = RUBBLE
      Model = IUAC17HXNew
    End
  End

  DisplayName = OBJECT:Starlifter
  EditorSorting = VEHICLE
  Side = America
  TransportSlotCount = 0
  VisionRange = 300.0
  ShroudClearingRange = 300
  Prerequisites
  End
  Buildable = Ignore_Prerequisites

  ArmorSet
    Conditions = None
    Armor = AirplaneArmor
    DamageFX = None
  End

  BuildCost = 7000
  BuildTime = 50
  ExperienceValue = 50 50 100 150
  IsTrainable = No
  CommandSet = AmericaC17StarlifterCommandSet
  VoiceSelect = RaptorVoiceSelect
  VoiceMove = RaptorVoiceMove
  VoiceGuard = RaptorVoiceAirPatrol
  SoundAmbient = AdvancedFightEngineLoop
  SoundAmbientRubble = NoSound
  UnitSpecificSounds
    VoiceCreate = RaptorVoiceCreate
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    Afterburner = RaptorAfterburner
    VoiceLowFuel = RaptorVoiceLowFuel
    VoiceGarrison = RaptorVoiceMove
    VoiceCombatDrop = ChinookVoiceCombatDrop
  End

  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS SELECTABLE VEHICLE SCORE AIRCRAFT TRANSPORT

  Body = ActiveBody ModuleTag_02
    MaxHealth = 500.0
    InitialHealth = 500.0
  End

  Behavior = JetSlowDeathBehavior ModuleTag_05
    FXOnGroundDeath = FX_JetOnGroundDeath
    OCLOnGroundDeath = OCL_RaptorDeathFinalBlowUp
    DestructionDelay = 99999999
    RollRate = 0.2
    RollRateDelta = 100%
    PitchRate = 0.0
    FallHowFast = 110.0%
    FXInitialDeath = FX_RaptorDeathInitial
    OCLInitialDeath = OCL_RaptorDeathInitial
    DelaySecondaryFromInitialDeath = 500
    FXSecondary = FX_JetDeathSecondary
    OCLSecondary = OCL_RaptorDeathSecondary
    FXHitGround = FX_JetDeathHitGround
    OCLHitGround = OCL_RaptorDeathHitGround
    DelayFinalBlowUpFromHitGround = 200
    FXFinalBlowUp = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp = OCL_RaptorDeathFinalBlowUp
  End

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 500.0
  End

  Behavior = TransitionDamageFX ModuleTag_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  Behavior = JetAIUpdate ModuleTag_09
    KeepsParkingSpaceWhenAirborne = Yes
    MinHeight = 5
    NeedsRunway = Yes
    OutOfAmmoDamagePerSecond = 0%
    ReturnToBaseIdleTime = 20000
    TakeoffPause = 500
    TakeoffDistForMaxLift = 0%
    AutoAcquireEnemiesWhenIdle = No
    ParkingOffset = 5
  End
  Locomotor = SET_NORMAL D30-F6_JetLocomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  ; Point-target vehicle paradrop. Not a fire weapon.
  ; OCL uses AmericaJetC17ParaDropTransport (velocity stripped).
  Behavior = OCLSpecialPower ModuleTag_C17StarGeneralDrop
    SpecialPowerTemplate = SpecialPowerAmericaC17ParaDrop
    OCL                  = OCL_AmericaC17TargetParaDrop
    CreateLocation       = CREATE_AT_LOCATION
  End

  ; Carry cargo only. Airborne dump buttons are not on the CommandSet.
  ; KeepContainerVelocityOnExit = No so a landed unload does not slam.
  Behavior = TransportContain ModuleTag_StarlifterCargo
    Slots                       = 32
    ScatterNearbyOnExit         = No
    OrientLikeContainerOnExit   = Yes
    KeepContainerVelocityOnExit = No
    ExitPitchRate               = 0
    ExitBone                    = WeaponA01
    DamagePercentToUnits        = 0%
    AllowInsideKindOf           = INFANTRY VEHICLE PROJECTILE DOZER PARACHUTABLE
    ForbidInsideKindOf          = AIRCRAFT HUGE_VEHICLE
    ExitDelay                   = 150
    DoorOpenTime                = 0
    NumberOfExitPaths           = 1
    DestroyRidersWhoAreNotFreeToExit = No
  End

  Geometry = Box
  GeometryIsSmall = No
  GeometryMajorRadius = 40.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 10.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End

;------------------------------------------------------------------------------
; Scripted C-17 paradrop shell. Not buildable.
; AmericaJetCargoPlane keeps AmericaParachute + KeepContainerVelocityOnExit=Yes
; (infantry airdrops). This shell uses GenericVehicleParachute and strips
; inherited jet velocity so tanks descend on the chute and survive landing.
;------------------------------------------------------------------------------
Object AmericaJetC17ParaDropTransport
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model           = US_C130H
      Animation       = US_C130H.US_C130H
      AnimationMode   = LOOP
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = Engine03 JetBlackTrailThin
      ParticleSysBone = Engine04 JetBlackTrailThin
    End
    OkToChangeModelColor = Yes
  End

  DisplayName        = OBJECT:CargoPlane
  EditorSorting      = SYSTEM
  Side               = America
  TransportSlotCount = 0
  VisionRange        = 0.0
  Buildable          = No
  ArmorSet
    Conditions = None
    Armor      = C130jArmor
    DamageFX   = TankDamageFX
  End
  CommandSet = Command_ScriptedTransportDrops
  SoundAmbient = C130AmbientLoop
  KindOf = PRELOAD CAN_CAST_REFLECTIONS VEHICLE SCORE TRANSPORT AIRCRAFT FORCEATTACKABLE IGNORED_IN_GUI EMP_HARDENED
  Body = ActiveBody ModuleTag_03
    MaxHealth     = 1000.0
    InitialHealth = 1000.0
  End

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 500.0
  End

  Behavior = DeliverPayloadAIUpdate ModuleTag_09
    DoorDelay      = 500
    MaxAttempts    = 4
    DropOffset     = X:0 Y:0 Z:-10
    DropDelay      = 400
    PutInContainer = GenericVehicleParachute
    DeliveryDistance = 0
  End
  Locomotor = SET_NORMAL C130HLocomotor

  Behavior = TransportContain ModuleTag_10
    Slots                       = 100
    ScatterNearbyOnExit         = No
    OrientLikeContainerOnExit   = Yes
    KeepContainerVelocityOnExit = No
    ExitPitchRate               = 0
    ExitBone                    = WeaponA01
    DamagePercentToUnits        = 0%
    AllowInsideKindOf           = INFANTRY VEHICLE PROJECTILE DOZER PARACHUTABLE
    DoorOpenTime                = 0
    NumberOfExitPaths           = 1
    DestroyRidersWhoAreNotFreeToExit = No
  End

  Behavior = JetSlowDeathBehavior ModuleTag_11
    DestructionDelay               = 2000
    RollRate                       = 0.0
    RollRateDelta                  = 100%
    PitchRate                      = 0
    FallHowFast                    = 25.0%
    FXInitialDeath                 = FX_JetBigDeathInitial
    OCLInitialDeath                = OCL_AmericaJetCargoDeathStart
    DelaySecondaryFromInitialDeath = 2000
    OCLSecondary                   = OCL_AmericaJetCargoHulkDeath
    FXSecondary                    = FX_BigPlaneDeath
  End

  Geometry = Box
  GeometryIsSmall = No
  GeometryMajorRadius = 40.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 10.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End
