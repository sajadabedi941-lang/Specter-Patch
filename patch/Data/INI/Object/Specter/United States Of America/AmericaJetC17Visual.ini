;==============================================================================
; AmericaJetC17Visual - USA C-17 Globemaster (VISUAL / BASE ONLY) RESTORED
; Specter-safe structure + donor ART. Flight template = AmericaJetE737Visual.
; Donor DATA = NOT USED. Weapons = NONE.
; Cargo = Star General para-drop (DeliverPayload + GenericVehicleParachute).
; Transport ability kept. Model IUAC17HXNew unchanged.
; Primary W3D = IUAC17HXNew
;==============================================================================

Object AmericaJetC17Visual

  SelectPortrait         = C17GlobalMaster
  ButtonImage            = C17GlobalMaster

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model = IUAC17HXNew
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = Engine03 JetBlackTrailThin
      ParticleSysBone = Engine04 JetBlackTrailThin
    End

    ConditionState = JETEXHAUST
      Model = IUAC17HXNew
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = Engine03 JetBlackTrailThin
      ParticleSysBone = Engine04 JetBlackTrailThin
    End

    ConditionState = REALLYDAMAGED
      Model = IUAC17HXNew
      ParticleSysBone = Smoke01 JetSmoke
    End

    ConditionState = REALLYDAMAGED JETEXHAUST
      Model = IUAC17HXNew
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
    End

    ConditionState = RUBBLE
      Model = IUAC17HXNew
    End
  End

  DisplayName = OBJECT:Starlifter
  EditorSorting = VEHICLE
  Side = America
  TransportSlotCount = 0
  VisionRange = 300.0
  ShroudClearingRange = 300
  Prerequisites
  End
  Buildable = Ignore_Prerequisites

  ArmorSet
    Conditions = None
    Armor = AirplaneArmor
    DamageFX = None
  End

  BuildCost = 7000
  BuildTime = 50
  ExperienceValue = 50 50 100 150
  IsTrainable = No
  CommandSet = C17GlobalMasterCommandSet
  VoiceSelect = RaptorVoiceSelect
  VoiceMove = RaptorVoiceMove
  VoiceGuard = RaptorVoiceAirPatrol
  SoundAmbient = AdvancedFightEngineLoop
  SoundAmbientRubble = NoSound
  UnitSpecificSounds
    VoiceCreate = RaptorVoiceCreate
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    Afterburner = RaptorAfterburner
    VoiceLowFuel = RaptorVoiceLowFuel
    VoiceGarrison = RaptorVoiceMove
  End

  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS SELECTABLE VEHICLE SCORE AIRCRAFT TRANSPORT

  Body = ActiveBody ModuleTag_02
    MaxHealth = 500.0
    InitialHealth = 500.0
  End

  Behavior = JetSlowDeathBehavior ModuleTag_05
    FXOnGroundDeath = FX_JetOnGroundDeath
    OCLOnGroundDeath = OCL_RaptorDeathFinalBlowUp
    DestructionDelay = 99999999
    RollRate = 0.2
    RollRateDelta = 100%
    PitchRate = 0.0
    FallHowFast = 110.0%
    FXInitialDeath = FX_RaptorDeathInitial
    OCLInitialDeath = OCL_RaptorDeathInitial
    DelaySecondaryFromInitialDeath = 500
    FXSecondary = FX_JetDeathSecondary
    OCLSecondary = OCL_RaptorDeathSecondary
    FXHitGround = FX_JetDeathHitGround
    OCLHitGround = OCL_RaptorDeathHitGround
    DelayFinalBlowUpFromHitGround = 200
    FXFinalBlowUp = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp = OCL_RaptorDeathFinalBlowUp
  End

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 500.0
  End

  Behavior = TransitionDamageFX ModuleTag_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  Behavior = JetAIUpdate ModuleTag_09
    KeepsParkingSpaceWhenAirborne = Yes
    MinHeight = 1
    NeedsRunway = Yes
    OutOfAmmoDamagePerSecond = 0%
    ReturnToBaseIdleTime = 10000
    TakeoffPause = 1000
    TakeoffDistForMaxLift = 0%
    AutoAcquireEnemiesWhenIdle = No
    ParkingOffset = 5
  End
  Locomotor = SET_NORMAL F100_PW_229
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  ; Star General para-drop (AmericaJetCargoPlane / AirF B-52 DeliverPayload).
  ; Vehicles/tanks exit the aircraft inside GenericVehicleParachute and land safely.
  ; Transport load/unload buttons kept. Model unchanged.
  Behavior = DeliverPayloadAIUpdate ModuleTag_StarlifterParaDrop
    DoorDelay         = 500
    MaxAttempts       = 4
    DropOffset        = X:0 Y:0 Z:-10
    DropDelay         = 300
    PutInContainer    = GenericVehicleParachute
    DeliveryDistance  = 150
  End

  Behavior = TransportContain ModuleTag_StarlifterCargo
    Slots                       = 32
    ScatterNearbyOnExit         = No
    OrientLikeContainerOnExit   = Yes
    KeepContainerVelocityOnExit = Yes
    ExitPitchRate               = 30
    ExitBone                    = WeaponA01
    DamagePercentToUnits        = 0%
    AllowInsideKindOf           = INFANTRY VEHICLE PROJECTILE DOZER PARACHUTABLE
    ForbidInsideKindOf          = AIRCRAFT HUGE_VEHICLE
    ExitDelay                   = 100
    DoorOpenTime                = 0
    NumberOfExitPaths           = 1
    DestroyRidersWhoAreNotFreeToExit = No
  End


  Geometry = Box
  GeometryIsSmall = No
  GeometryMajorRadius = 40.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 10.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End
