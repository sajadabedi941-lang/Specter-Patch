Object AmericaJetE737AEW
; Specter-compatible E-737 AEW rebuild.
; Skeleton: working AmericaJetE3AWACS. ART: donor KVE737.
; Original donor Object avionE737 is reference-only (not loaded).

  SelectPortrait         = avionE737
  ButtonImage            = avionE737

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = No
    ParticlesAttachedToAnimatedBones = Yes

    DefaultConditionState
      Model           = KVE737
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = WingTip01 JetContrailThin
      ParticleSysBone = WingTip02 JetContrailThin
    End

    ConditionState = JETEXHAUST
      Model           = KVE737
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = WingTip01 JetContrailThin
      ParticleSysBone = WingTip02 JetContrailThin
    End

    ConditionState = REALLYDAMAGED
      Model           = KVE737
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Smoke02 JetSmoke
    End

    ConditionState = REALLYDAMAGED JETEXHAUST
      Model           = KVE737
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Smoke02 JetSmoke
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = WingTip01 JetContrailThin
      ParticleSysBone = WingTip02 JetContrailThin
    End

    ConditionState = RUBBLE
      Model           = KVE737
    End
  End

  DisplayName         = OBJECT:AmericaJetE737AEW
  EditorSorting       = VEHICLE
  Side                = America
  TransportSlotCount  = 0
  VisionRange         = 1000.0
  ShroudClearingRange = 1610
  Prerequisites
  End
  Buildable = Ignore_Prerequisites

  ; No WeaponSet - AEW only, no offensive weapons / no ECM attack modules

  ArmorSet
    Conditions = None
    Armor      = AirplaneArmor
    DamageFX   = None
  End
  ArmorSet
    Conditions = PLAYER_UPGRADE
    Armor      = CountermeasuresAirplaneArmor
    DamageFX   = None
  End

  BuildCost       = 8000
  BuildTime       = 50
  ExperienceValue = 50 50 100 150
  IsTrainable     = Yes
  CommandSet      = AmericaJetF16CommandSet

  VoiceSelect        = RaptorVoiceSelect
  VoiceMove          = RaptorVoiceMove
  VoiceAttack        = RaptorVoiceAttack
  VoiceAttackAir     = RaptorVoiceAttackAir
  VoiceGuard         = RaptorVoiceAirPatrol
  SoundAmbient       = AdvancedFightEngineLoop
  SoundAmbientRubble = NoSound
  UnitSpecificSounds
    VoiceCreate   = RaptorVoiceCreate
    SoundEject    = PilotSoundEject
    VoiceEject    = PilotVoiceEject
    Afterburner   = RaptorAfterburner
    VoiceLowFuel  = RaptorVoiceLowFuel
    VoiceGarrison = RaptorVoiceMove
  End

  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS SELECTABLE VEHICLE SCORE AIRCRAFT REVEALS_ENEMY_PATHS

  Body = ActiveBody ModuleTag_02
    MaxHealth     = 300.0
    InitialHealth = 300.0
  End

  Behavior = ArmorUpgrade ModuleTag_Armor01
    TriggeredBy = Upgrade_AmericaCountermeasures
  End

  Behavior = CountermeasuresBehavior ModuleTag_10
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureFlare
    FlareBoneBaseName     = Flare
    VolleySize            = 3
    VolleyArcAngle        = 90.0
    VolleyVelocityFactor  = 1.0
    DelayBetweenVolleys   = 500
    NumberOfVolleys       = 3
    ReloadTime            = 6500
    EvasionRate           = 35%
    ReactionLaunchLatency = 0
    MissileDecoyDelay     = 200
  End

  Behavior = JetSlowDeathBehavior ModuleTag_05
    FXOnGroundDeath                = FX_JetOnGroundDeath
    OCLOnGroundDeath               = OCL_USAF16HULL
    DestructionDelay               = 99999999
    RollRate                       = 0.2
    RollRateDelta                  = 100%
    PitchRate                      = 0.0
    FallHowFast                    = 110.0%
    FXInitialDeath                 = FX_RaptorDeathInitial
    OCLInitialDeath                = OCL_RaptorDeathInitial
    DelaySecondaryFromInitialDeath = 500
    FXSecondary                    = FX_JetDeathSecondary
    OCLSecondary                   = OCL_RaptorDeathSecondary
    FXHitGround                    = FX_JetDeathHitGround
    OCLHitGround                   = OCL_RaptorDeathHitGround
    DelayFinalBlowUpFromHitGround  = 200
    FXFinalBlowUp                  = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp                 = OCL_USAF16HULL
  End

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 500.0
  End

  Behavior = TransitionDamageFX ModuleTag_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  Behavior = JetAIUpdate ModuleTag_09
    KeepsParkingSpaceWhenAirborne = Yes
    MinHeight = 1
    NeedsRunway = Yes
    OutOfAmmoDamagePerSecond = 10%
    ReturnToBaseIdleTime = 10000
    TakeoffPause = 1000
    TakeoffDistForMaxLift = 0%
    AutoAcquireEnemiesWhenIdle = No
    ParkingOffset = 5
  End
  Locomotor = SET_NORMAL AmericaF16ALocomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Scale = 0.8
  Geometry = Box
  GeometryIsSmall = No
  GeometryMajorRadius = 40.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 10.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End
