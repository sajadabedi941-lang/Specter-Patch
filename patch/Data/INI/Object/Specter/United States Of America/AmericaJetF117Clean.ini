;==============================================================================
; AmericaJetF117Clean - F-117 Nighthawk
;
; VISUAL DONOR  = TEOD AmericaJetStealthFighter (New folder.zip !TEOD_*)
;                 Models AVStealth / AVStealth_D + avstealth*.dds
; GAMEPLAY DONOR = AmericaJetF-16C_AG (Airfield Command_ConstructAmericaJetF-16C_AG)
;                 JetAIUpdate / Locomotor / Weapon / CommandSet / Body / RTB
;
; Clean object (B-21 method): do NOT activate obsolete TEOD F117 science,
; SpecialPower, HelixContain, laser-missile upgrade Draw, or TEOD locomotor.
;
; Stealth: InnateStealth StealthUpdate + RadarPriority LOCAL_UNIT_ONLY
; BuildCost = 7000
; Visual Scale 0.9 = same USA fighter scale as F-22A / A-10C / EA-18G.
; Gameplay / weapons / object name unchanged.
;==============================================================================

Object AmericaJetF117Clean
Scale = 0.9

  ; *** ART Parameters — REAL F-117 (TEOD AVStealth) ***
  SelectPortrait         = CWCusF117_Portrait
  ButtonImage            = CWCusF117_Command

  UpgradeCameo1 = Upgrade_AmericaCountermeasures

  Draw = W3DModelDraw ModuleTag_01

    DefaultConditionState
      Model                           = AVStealth
      HideSubObject                   = BurnerFX01 BurnerFX02
      WeaponLaunchBone                = PRIMARY WeaponA
    End

    ConditionState        = JETEXHAUST
      Model                           = AVStealth
      ParticleSysBone                 = WINGTIP01 JetContrail
      ParticleSysBone                 = WINGTIP02 JetContrail
      WeaponLaunchBone                = PRIMARY WeaponA
    End

    ConditionState        = JETEXHAUST JETAFTERBURNER
      Model                           = AVStealth
      Animation                       = AVStealth.AVStealth
      AnimationMode                   = LOOP
      ParticleSysBone                 = WINGTIP01 JetContrail
      ParticleSysBone                 = WINGTIP02 JetContrail
      ParticleSysBone                 = ENGINE01 JetLenzflare
      ParticleSysBone                 = ENGINE02 JetLenzflare
      WeaponLaunchBone                = PRIMARY WeaponA
    End

    ConditionState        = REALLYDAMAGED
      Model                           = AVStealth_D
      ParticleSysBone                 = Smoke01 JetSmoke
      ParticleSysBone                 = Engine01 JetEngineDamagedSmoke
      WeaponLaunchBone                = PRIMARY WeaponA
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST
      Model                           = AVStealth_D
      ParticleSysBone                 = Smoke01 JetSmoke
      ParticleSysBone                 = Engine01 JetEngineDamagedSmoke
      ParticleSysBone                 = WINGTIP01 JetContrail
      ParticleSysBone                 = WINGTIP02 JetContrail
      WeaponLaunchBone                = PRIMARY WeaponA
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
      Model                           = AVStealth_D
      Animation                       = AVStealth_D.AVStealth_D
      AnimationMode                   = LOOP
      ParticleSysBone                 = Smoke01 JetSmoke
      ParticleSysBone                 = Engine01 JetEngineDamagedSmoke
      ParticleSysBone                 = WINGTIP01 JetContrail
      ParticleSysBone                 = WINGTIP02 JetContrail
      ParticleSysBone                 = ENGINE01 JetLenzflare
      ParticleSysBone                 = ENGINE02 JetLenzflare
      WeaponLaunchBone                = PRIMARY WeaponA
    End

    ConditionState        = RUBBLE
      Model                           = AVStealth_D
      ParticleSysBone                 = WINGTIP01 JetContrail
      ParticleSysBone                 = WINGTIP02 JetContrail
    End

    ConditionState        = RUBBLE JETEXHAUST JETAFTERBURNER
      Model                           = AVStealth_D
      ParticleSysBone                 = WINGTIP01 JetContrail
      ParticleSysBone                 = WINGTIP02 JetContrail
    End

    OkToChangeModelColor = Yes
  End

  ; *** DESIGN parameters — F-16C_AG gameplay architecture ***
  DisplayName             = OBJECT:AmericaJetF117
  EditorSorting           = VEHICLE
  Side                    = America
  TransportSlotCount      = 0
  VisionRange             = 700.0
  ShroudClearingRange     = 200
  Prerequisites
  End
  WeaponSet
    Conditions = None
    Weapon               = PRIMARY    GBU38_JDAM_F16C
  End
  WeaponSet
    Conditions          = PLAYER_UPGRADE
    Weapon              = PRIMARY    AGM-154C_JSOW_F16C
    Weapon              = SECONDARY  AN/AAQ33_SniperXR_ATP_F16C
  End
  ArmorSet
    Conditions            = None
    Armor                 = AirplaneArmor
    DamageFX              = None
  End
  ArmorSet
    Conditions            = PLAYER_UPGRADE
    Armor                 = CountermeasuresAirplaneArmor
    DamageFX              = None
  End

  BuildCost               = 7000
  BuildTime               = 16
  ExperienceValue         = 50 50 100 150
  ExperienceRequired      = 0 100 200 400
  IsTrainable             = Yes
  CrusherLevel            = 1
  CrushableLevel          = 2
  CommandSet              = F16C_AG_CommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect            = RaptorVoiceSelect
  VoiceMove              = RaptorVoiceMove
  VoiceAttack            = RaptorVoiceAttack
  VoiceAttackAir         = RaptorVoiceAttackAir
  VoiceGuard             = RaptorVoiceAirPatrol
  SoundAmbient           = RaptorAmbientLoop
  SoundAmbientRubble     = NoSound
  SoundStealthOn         = StealthOn
  SoundStealthOff        = StealthOff
  UnitSpecificSounds
    VoiceCreate          = RaptorVoiceCreate
    SoundEject           = PilotSoundEject
    VoiceEject           = PilotVoiceEject
    Afterburner          = RaptorAfterburner
    VoiceLowFuel         = RaptorVoiceLowFuel
    VoiceGarrison        = RaptorVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority          = LOCAL_UNIT_ONLY
  KindOf                 = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
  Body                   = ActiveBody ModuleTag_02
    MaxHealth            = 600.0
    InitialHealth        = 600.0
  End

  Behavior                = ArmorUpgrade ModuleTag_Armor01x2
    TriggeredBy           = Upgrade_AmericaCountermeasures
  End

  Behavior                = CountermeasuresBehavior ModuleTag_10
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureFlare
    FlareBoneBaseName     = Flare
    VolleySize            = 2
    VolleyArcAngle        = 96.0
    VolleyVelocityFactor  = 3.0
    DelayBetweenVolleys   = 1000
    NumberOfVolleys       = 4
    ReloadTime            = 0
    EvasionRate           = 35%
    ReactionLaunchLatency = 0
    MissileDecoyDelay     = 200
  End

  Behavior = ExperienceScalarUpgrade ModuleTag_04
    TriggeredBy = Upgrade_AmericaAdvancedTraining
    AddXPScalar = 1.0
  End
  Behavior = WeaponSetUpgrade ModuleTag_JSOW
    TriggeredBy = Upgrade_AGM154C
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_ALQ135
    WeaponTemplate        = AN/ALQ-135
    PrimaryTargetTypes    = PROJECTILE INERT
    ScanRate              = 900
    ScanRange             = 450
    PredictTargetVelocityFactor = 3.0
  End
  Behavior                = ArmorUpgrade ModuleTag_Armor77
    TriggeredBy           = Upgrade_AmericaCountermeasures
  End
  Behavior                = CountermeasuresBehavior ModuleTag_88
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureFlare
    FlareBoneBaseName     = Flare
    VolleySize            = 2
    VolleyArcAngle        = -90.0
    VolleyVelocityFactor  = 4.0
    DelayBetweenVolleys   = 500
    NumberOfVolleys       = 2
    ReloadTime            = 1800
    EvasionRate           = 45%
    ReactionLaunchLatency = 0
    MissileDecoyDelay     = 50
  End
  Behavior                = CountermeasuresBehavior ModuleTag_300
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureCHAFF
    FlareBoneBaseName     = Flare
    VolleySize            = 3
    VolleyArcAngle        = 180.0
    VolleyVelocityFactor  = 5.0
    DelayBetweenVolleys   = 180
    NumberOfVolleys       = 2
    ReloadTime            = 2000
    EvasionRate           = 60%
    ReactionLaunchLatency = 0
    MissileDecoyDelay     = 50
  End
  Behavior = ProductionUpdate ModuleTag_SelfUp
  End
  Behavior                          = JetSlowDeathBehavior ModuleTag_05
    FXOnGroundDeath                 = FX_JetOnGroundDeath
    OCLOnGroundDeath                = OCL_RaptorDeathFinalBlowUp
    DestructionDelay                = 99999999
    RollRate                        = 0.2
    RollRateDelta                   = 100%
    PitchRate                       = 0.0
    FallHowFast                     = 110.0%
    FXInitialDeath                  = FX_RaptorDeathInitial
    OCLInitialDeath                 = OCL_RaptorDeathInitial
    DelaySecondaryFromInitialDeath  = 500
    FXSecondary                     = FX_JetDeathSecondary
    OCLSecondary                    = OCL_RaptorDeathSecondary
    FXHitGround                     = FX_JetDeathHitGround
    OCLHitGround                    = OCL_RaptorDeathHitGround
    DelayFinalBlowUpFromHitGround   = 200
    FXFinalBlowUp                   = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp                  = OCL_RaptorDeathFinalBlowUp
  End
  Behavior = CreateObjectDie ModuleTag_Deletion
    DeathTypes   = NONE +EXTRA_6
    CreationList = None
  End
  Behavior                    = EjectPilotDie ModuleTag_06
    ExemptStatus         = HIJACKED
    GroundCreationList = OCL_EjectPilotOnGround
    AirCreationList = OCL_EjectPilotViaParachute
    VeterancyLevels =  ALL -REGULAR
  End

  Behavior               = PhysicsBehavior ModuleTag_07
    Mass                 = 500.0
  End

  Behavior                 = TransitionDamageFX ModuleTag_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  ; Exact F-16C_AG JetAI / takeoff / return-to-base
  Behavior = JetAIUpdate ModuleTag_09
    OutOfAmmoDamagePerSecond  = 10%
    TakeoffDistForMaxLift     = 0%
    TakeoffPause              = 500
    MinHeight                 = 5
    ParkingOffset             = 3
    ReturnToBaseIdleTime      = 10000
  End
  Locomotor = SET_NORMAL F100_PW_229
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  ; Permanent innate radar stealth (same proven B-2 runtime architecture)
  Behavior = StealthUpdate ModuleTag_F117InnateStealth
    StealthDelay                          = 0
    StealthForbiddenConditions            = FIRING_PRIMARY
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 14.0
  GeometryMinorRadius      = 7.0
  GeometryHeight           = 5.0
  Shadow                   = SHADOW_VOLUME
  ShadowSizeX              = 89

End
