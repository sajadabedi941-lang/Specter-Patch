;==============================================================================
; AmericaJetV22Visual - USA V-22 Osprey (VISUAL / BASE ONLY)
; Method: Specter-safe VTOL structure + donor ART only (B-21 workflow)
; Donor DATA = NOT USED. Transport = NOT YET
; Primary W3D = AVOsprey
; Movement skeleton: working helicopter JetAI + T700 locomotor (no weapons)
;==============================================================================

Object AmericaJetV22Visual

  SelectPortrait         = V22
  ButtonImage            = V22

  ; Complete donor Osprey VISUAL hierarchy (Draw only; no donor gameplay):
  ; ModuleTag_01 = fuselage/wing/tail body (AVOsprey)
  ; ModuleTag_Engines01 = BOTH nacelles + BOTH rotors (AVOsprey_A* / _DA*)

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = No

    DefaultConditionState
      Model = AVOsprey
    End

    ConditionState = REALLYDAMAGED
      Model = AVOsprey_D
    End
    AliasConditionState = RUBBLE
    AliasConditionState = RUBBLE SPECIAL_DAMAGED
  End

  Draw = W3DModelDraw ModuleTag_Engines01
    OkToChangeModelColor = No
    ParticlesAttachedToAnimatedBones = Yes

    ConditionState = NONE
      Model = AVOsprey_A4
      Animation = AVOsprey_A4.AVOsprey_A4
      AnimationMode = LOOP
      TransitionKey = TRANS_IDLE
    End

    TransitionState = TRANS_IDLE TRANS_MOVING
      Model = AVOsprey_A2
      Animation = AVOsprey_A2.AVOsprey_A2
      AnimationMode = ONCE
      ParticleSysBone = EXHAUST01 HelixExhaust
      ParticleSysBone = EXHAUST02 HelixExhaust
    End

    ConditionState = MOVING
      Model = AVOsprey_A1
      Animation = AVOsprey_A1.AVOsprey_A1
      AnimationMode = LOOP
      TransitionKey = TRANS_MOVING
      ParticleSysBone = EXHAUST01 HelixExhaust
      ParticleSysBone = EXHAUST02 HelixExhaust
    End

    TransitionState = TRANS_MOVING TRANS_IDLE
      Model = AVOsprey_A3
      Animation = AVOsprey_A3.AVOsprey_A3
      AnimationMode = ONCE
    End

    ConditionState = REALLYDAMAGED
      Model = AVOsprey_DA4
      Animation = AVOsprey_DA4.AVOsprey_DA4
      AnimationMode = LOOP
      TransitionKey = TRANS_IDLE_DAMAGED
    End
    AliasConditionState = RUBBLE

    TransitionState = TRANS_IDLE_DAMAGED TRANS_MOVING_DAMAGED
      Model = AVOsprey_DA2
      Animation = AVOsprey_DA2.AVOsprey_DA2
      AnimationMode = ONCE
      ParticleSysBone = EXHAUST01 HelixExhaust
      ParticleSysBone = EXHAUST02 HelixExhaust
    End

    ConditionState = REALLYDAMAGED MOVING
      Model = AVOsprey_DA1
      Animation = AVOsprey_DA1.AVOsprey_DA1
      AnimationMode = LOOP
      TransitionKey = TRANS_MOVING_DAMAGED
      ParticleSysBone = EXHAUST01 HelixExhaust
      ParticleSysBone = EXHAUST02 HelixExhaust
    End
    AliasConditionState = MOVING RUBBLE

    TransitionState = TRANS_MOVING_DAMAGED TRANS_IDLE_DAMAGED
      Model = AVOsprey_DA3
      Animation = AVOsprey_DA3.AVOsprey_DA3
      AnimationMode = ONCE
    End
  End

  DisplayName = OBJECT:AmericaJetV22Visual
  EditorSorting = VEHICLE
  Side = America
  TransportSlotCount = 0
  VisionRange = 300.0
  ShroudClearingRange = 300
  Prerequisites
  End
  Buildable = Ignore_Prerequisites

  ArmorSet
    Conditions = None
    Armor = AirplaneArmor
    DamageFX = None
  End

  BuildCost = 5000
  BuildTime = 40
  ExperienceValue = 50 50 100 150
  IsTrainable = No
  CommandSet = GenericAttackHelicopterHoverCommandSet

  VoiceSelect = ComancheVoiceSelect
  VoiceMove = ComancheVoiceMove
  VoiceGuard = ComancheVoiceMove
  SoundAmbient = ComancheAmbientLoop
  SoundAmbientRubble = NoSound
  UnitSpecificSounds
    VoiceCreate = ComancheVoiceCreate
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    VoiceGarrison = ComancheVoiceMove
  End

  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS SELECTABLE VEHICLE SCORE AIRCRAFT PRODUCED_AT_HELIPAD

  Body = ActiveBody ModuleTag_02
    MaxHealth = 400.0
    InitialHealth = 400.0
  End

  Behavior = FXListDie ModuleTag_05
    DeathFX = FX_ComancheStartDeath
  End

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 500.0
  End

  Behavior = TransitionDamageFX ModuleTag_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  Behavior = JetAIUpdate ModuleTag_09
    MinHeight = 10
    NeedsRunway = No
    KeepsParkingSpaceWhenAirborne = No
    AutoAcquireEnemiesWhenIdle = No
    OutOfAmmoDamagePerSecond = 0%
  End
  Locomotor = SET_NORMAL T700_GE_701D_B2
  Locomotor = SET_TAXIING BasicHelicopterTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Geometry = Box
  GeometryIsSmall = No
  GeometryMajorRadius = 30.0
  GeometryMinorRadius = 12.0
  GeometryHeight = 10.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End
