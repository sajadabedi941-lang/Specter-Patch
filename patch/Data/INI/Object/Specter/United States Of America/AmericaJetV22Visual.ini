;==============================================================================
; AmericaJetV22Visual - USA V-22 Osprey (VISUAL / BASE ONLY)
; Method: Specter-safe VTOL structure + donor ART only (B-21 workflow)
; Donor DATA = NOT USED. Transport = NOT YET
; Primary W3D = AVOsprey
; Movement skeleton: working helicopter JetAI + T700 locomotor (no weapons)
;==============================================================================

Object AmericaJetV22Visual

  SelectPortrait         = V22
  ButtonImage            = V22

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model = AVOsprey
      Animation = AVOsprey_A1.AVOsprey_A1
      AnimationMode = LOOP
    End

    ConditionState = REALLYDAMAGED
      Model = AVOsprey_D
      Animation = AVOsprey_DA1.AVOsprey_DA1
      AnimationMode = LOOP
      ParticleSysBone = Smoke01 JetSmoke
    End

    ConditionState = RUBBLE
      Model = AVOsprey_D
    End
  End

  DisplayName = OBJECT:AmericaJetV22Visual
  EditorSorting = VEHICLE
  Side = America
  TransportSlotCount = 0
  VisionRange = 300.0
  ShroudClearingRange = 300
  Prerequisites
  End
  Buildable = Ignore_Prerequisites

  ArmorSet
    Conditions = None
    Armor = AirplaneArmor
    DamageFX = None
  End

  BuildCost = 5000
  BuildTime = 40
  ExperienceValue = 50 50 100 150
  IsTrainable = No
  CommandSet = GenericAttackHelicopterHoverCommandSet

  VoiceSelect = ComancheVoiceSelect
  VoiceMove = ComancheVoiceMove
  VoiceGuard = ComancheVoiceMove
  SoundAmbient = ComancheAmbientLoop
  SoundAmbientRubble = NoSound
  UnitSpecificSounds
    VoiceCreate = ComancheVoiceCreate
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    VoiceGarrison = ComancheVoiceMove
  End

  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS SELECTABLE VEHICLE SCORE AIRCRAFT PRODUCED_AT_HELIPAD

  Body = ActiveBody ModuleTag_02
    MaxHealth = 400.0
    InitialHealth = 400.0
  End

  Behavior = FXListDie ModuleTag_05
    DeathFX = FX_ComancheStartDeath
  End

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 500.0
  End

  Behavior = TransitionDamageFX ModuleTag_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  Behavior = JetAIUpdate ModuleTag_09
    MinHeight = 10
    NeedsRunway = No
    KeepsParkingSpaceWhenAirborne = No
    AutoAcquireEnemiesWhenIdle = No
    OutOfAmmoDamagePerSecond = 0%
  End
  Locomotor = SET_NORMAL T700_GE_701D_B2
  Locomotor = SET_TAXIING BasicHelicopterTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Geometry = Box
  GeometryIsSmall = No
  GeometryMajorRadius = 30.0
  GeometryMinorRadius = 12.0
  GeometryHeight = 10.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End
