
;------------------------------------------------------------------------------
Object AmericaPatriotBattery

  ; *** ART Parameters ***
  SelectPortrait         = us_mim90d
  ButtonImage            = us_mim90d
  Draw = W3DModelDraw ModuleTag_01
    ExtraPublicBone = FIREPOINT01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model             = US_CRAM
      Turret            = TURRET
      TurretPitch       = Turretle
      WeaponLaunchBone  = PRIMARY   WeaponA
      WeaponLaunchBone  = SECONDARY WeaponA
      WeaponFireFXBone  = PRIMARY   WeaponA
      WeaponFireFXBone  = SECONDARY WeaponA
      WeaponFireFXBone  = TERTIARY  WeaponA
      WeaponLaunchBone  = TERTIARY  WeaponA
    End
    AliasConditionState = NIGHT
    
    ConditionState      = DAMAGED
      Model             = US_CRAM
      Turret            = TURRET
      TurretPitch       = Turretle
      WeaponLaunchBone  = PRIMARY   WeaponA
      WeaponLaunchBone  = SECONDARY WeaponA
      WeaponFireFXBone  = PRIMARY   WeaponA
      WeaponFireFXBone  = SECONDARY WeaponA
      WeaponFireFXBone  = TERTIARY  WeaponA
      WeaponLaunchBone  = TERTIARY  WeaponA
    End
    AliasConditionState = DAMAGED NIGHT
    
    ConditionState      = REALLYDAMAGED RUBBLE
      Model             = US_CRAM
      Turret            = TURRET
      TurretPitch       = Turretle
      WeaponLaunchBone  = PRIMARY   WeaponA
      WeaponLaunchBone  = SECONDARY WeaponA
      WeaponFireFXBone  = PRIMARY   WeaponA
      WeaponFireFXBone  = SECONDARY WeaponA
      WeaponFireFXBone  = TERTIARY  WeaponA
      WeaponLaunchBone  = TERTIARY  WeaponA
    End
  End

  PlacementViewAngle = -45

  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:CRAM
  Side              = America
  EditorSorting     = STRUCTURE
  Prerequisites
    Object = AmericaPowerPlant
  End
  BuildCost        = 1000
  BuildTime        = 18.0           ; in seconds
  EnergyProduction = -2
  WeaponSet
    Conditions          = None 
    Weapon              = PRIMARY     20mm_HEIT-SD_LPWS_G
    Weapon              = SECONDARY   20mm_HEIT-SD_LPWS_AAM
    Weapon              = TERTIARY    20mm_HEIT-SD_LPWS_AA
  End
  VisionRange    = 800.0           ; Shroud clearing distance AND targeting range
  ShroudClearingRange = 450
  ArmorSet
    Conditions      = None
    Armor           = BaseDefenseArmor
    DamageFX        = StructureDamageFXNoShake
  End
  CommandSet        = AmericaPatriotBatteryCommandSet
  ExperienceValue     = 200 200 200 200  ; Experience point value at each level

  ; *** AUDIO Parameters ***
  VoiceSelect = PatriotBatterySelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End

  UnitSpecificSounds
  ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    TurretMoveStart = NoSound
    TurretMoveLoop = NoSound ;These aren't playing properly, will revisit (mp) TurretMoveLoopLoud
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority   = STRUCTURE
  KindOf          = PRELOAD STRUCTURE SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT IMMOBILE SCORE FS_TECHNOLOGY POWERED FS_BASE_DEFENSE IMMUNE_TO_CAPTURE
  Body            = StructureBody ModuleTag_04
    MaxHealth     = 1000.0
    InitialHealth = 1000.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 1200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
 
  
  Behavior = StealthDetectorUpdate ModuleTag_StealthDetection_Radar_Inf
    DetectionRate             = 500
    DetectionRange            = 200
    ExtraForbiddenKindOf      = AIRCRAFT VEHICLE
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
  End
  Behavior = BaseRegenerateUpdate ModuleTag_05
    ;No data
  End 
  Behavior = AIUpdateInterface ModuleTag_06
    Turret
      TurretTurnRate        = 880   // turn rate, in degrees per sec
      ControlledWeaponSlots = PRIMARY SECONDARY TERTIARY
      MinIdleScanInterval   = 250    ; in milliseconds
      MaxIdleScanInterval   = 250    ; in milliseconds
      MinIdleScanAngle      = 0       ; in degrees off the natural turret angle
      MaxIdleScanAngle      = 360     ; in degrees off the natural turret angle
      TurretPitchRate       = 160.0
      AllowsPitch           = Yes
      FiresWhileTurning     = Yes
    End
    AutoAcquireEnemiesWhenIdle = Yes ;ATTACK_BUILDINGS; defensive weapon
    MoodAttackCheckRate        = 1
  End
  Behavior = DestroyDie ModuleTag_08
    ;nothing
  End
  Behavior             = CreateObjectDie ModuleTag_09
    CreationList  = OCL_AmericanRangerDebris03
    ExemptStatus  = UNDER_CONSTRUCTION
  End
  Behavior             = FXListDie ModuleTag_10
    DeathFX       = FX_StructureTinyDeath
  End

  Behavior = FlammableUpdate ModuleTag_12
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Behavior = StealthDetectorUpdate ModuleTag_InfantryDetection
    DetectionRate             = 500
    DetectionRange            = 300
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
    ;ExtraRequiredKindOf       = INFANTRY VEHICLE
    ExtraForbiddenKindOf      = AIRCRAFT DRONE
  End

  Behavior = TransitionDamageFX ModuleTag_14
    ;-------------DESIGNED FOR TINY SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionTinySmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionTinySmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionTinyExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionTinyShockwave
  End
  Behavior = OverlordContain ModuleTag_RCWS
    Slots                   = 1
    DamagePercentToUnits    = 100%
    AllowInsideKindOf       = PORTABLE_STRUCTURE
    PassengersAllowedToFire = Yes
    PassengersInTurret      = Yes ; My passengers ride in my turret, that's where the Firepoint bones are
    ExperienceSinkForRider  = Yes ; I get the Exp for things my turret friend kills
    PayloadTemplateName     = America_BGMM71F_RCWS
  End

  Geometry            = CYLINDER
  GeometryMajorRadius = 38.0
  GeometryMinorRadius = 30.0
  GeometryHeight      = 14.0
  GeometryIsSmall     = No
  Shadow          = SHADOW_VOLUME
  BuildCompletion = PLACED_BY_PLAYER

End
;------------------------------------------------------------------------------
Object America_BGMM71F_RCWS
  ; *** ART Parameters ***
  SelectPortrait            = SNGatTower_L
  ButtonImage               = SNGatTower
  Draw                      = W3DDependencyModelDraw ModuleTag_01
    OkToChangeModelColor    = Yes
    AttachToBoneInContainer = FIREPOINT01
    DefaultConditionState
      Model               = US_TOW_TRT
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY TURRETMS01
      WeaponMuzzleFlash   = PRIMARY TURRETMS01
      WeaponFireFXBone    = SECONDARY TURRETMS01
      WeaponMuzzleFlash   = SECONDARY TURRETMS01
    End
    ConditionState        = REALLYDAMAGED 
      Model               = US_TOW_TRT
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY TURRETMS01
      WeaponMuzzleFlash   = PRIMARY TURRETMS01
      WeaponFireFXBone    = SECONDARY TURRETMS01
      WeaponMuzzleFlash   = SECONDARY TURRETMS01
    End
    ConditionState = WEAPONSET_PLAYER_UPGRADE
      Model               = US_TOW_TRT
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY TURRETMS01
      WeaponMuzzleFlash   = PRIMARY TURRETMS01
      WeaponFireFXBone    = SECONDARY TURRETMS01
      WeaponMuzzleFlash   = SECONDARY TURRETMS01
    End
    ConditionState = REALLYDAMAGED WEAPONSET_PLAYER_UPGRADE
      Model               = US_TOW_TRT
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY TURRETMS01
      WeaponMuzzleFlash   = PRIMARY TURRETMS01
      WeaponFireFXBone    = SECONDARY TURRETMS01
      WeaponMuzzleFlash   = SECONDARY TURRETMS01
    End
  End
  ; ***DESIGN parameters ***
  Side             = America
  EditorSorting    = SYSTEM
  TransportSlotCount = 1
  WeaponSet
    Conditions          = None 
    Weapon              = PRIMARY   BGM-71E_Tow-Def
  End
  ArmorSet
    Conditions     = None
    Armor          = InvulnerableAllArmor ; We can't be hurt on the field.  We share damage from the Overlord with his damage module
  End
  VisionRange     = 700
  ; *** AUDIO Parameters ***
  UnitSpecificSounds
    TurretMoveStart = NoSound
    TurretMoveLoop  = NoSound ;TurretMoveLoop
    VoiceRapidFire  = NoSound
  End
  ; *** ENGINEERING Parameters ***
  KindOf            = PRELOAD PORTABLE_STRUCTURE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CLICK_THROUGH IGNORED_IN_GUI
    Body            = StructureBody ModuleTag_02
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End
  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      ControlledWeaponSlots = PRIMARY SECONDARY
      TurretTurnRate      = 140   // turn rate, in degrees per sec
      TurretPitchRate     = 140
      AllowsPitch         = Yes
      FiresWhileTurning   = Yes
    End
    AutoAcquireEnemiesWhenIdle = Yes 
    MoodAttackCheckRate        = 1
  End
  Behavior             = DestroyDie ModuleTag_04
    ;nothing
  End
  Geometry            = BOX
  GeometryMajorRadius = 8.0
  GeometryMinorRadius = 8.0
  GeometryHeight      = 9.0
  GeometryIsSmall     = No      
  Shadow              = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length
End