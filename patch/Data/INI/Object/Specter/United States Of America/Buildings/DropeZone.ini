
;------------------------------------------------------------------------------
Object AmericaSupplyDropZone
Scale = 0.9

  ; *** ART Parameters ***
  SelectPortrait         = us_supplyzone
  ButtonImage            = us_supplyzone
    Draw                 = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes   
    ConditionState       = NONE
      Model              = US_DropZone
      ParticleSysBone    = Flare01 LandingZoneSmoke
      Animation          = US_DropZone.US_DropZone
      AnimationMode      = LOOP
    End
    
    ConditionState       = DAMAGED
      Model              = US_DropZone
      ParticleSysBone    = Flare01 LandingZoneSmoke
      Animation          = US_DropZone.US_DropZone
      AnimationMode      = LOOP
    End
   
    ConditionState     = REALLYDAMAGED RUBBLE
      Model              = US_DropZone
      ParticleSysBone    = Flare01 LandingZoneSmoke
      Animation          = US_DropZone.US_DropZone
      AnimationMode      = LOOP
    End
  End
  PlacementViewAngle = -45

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:AmericaSupplyDropZone
  Side                = America
  EditorSorting       = STRUCTURE
  BuildCost           = 2500
  BuildTime           = 45.0           ; in seconds
  Prerequisites
    ;Object            = AmericaStrategyCenter AmericaStrategyCenter_T
  End
  EnergyProduction = -4
  ShroudClearingRange = 100
  ArmorSet
    Conditions        = None
    Armor             = StructureArmor
    DamageFX          = StructureDamageFXNoShake
  End
  ExperienceValue     = 200 200 200 200  ; Experience point value at each level

  ; *** AUDIO Parameters ***
  VoiceSelect = SupplyDropZoneSelect

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End


  ; *** ENGINEERING Parameters ***  
  ; Please note that this structure is not a kindof IMMUNE_TO_CAPTURE, ther is code that allows 
  ; CAPTURABLE+STRUCTUES, and FS_TECHNOLOGY kindofs to be disabled, unless explicitly IMMUNE_TO_CAPTURE...
  ; If this boggles too much, then it is time for a KINDOF_DISABLEABLE!--ML 
  KindOf              = STRUCTURE SELECTABLE IMMOBILE SCORE FS_TECHNOLOGY MP_COUNT_FOR_VICTORY FS_SUPPLY_DROPZONE
  RadarPriority       = STRUCTURE
  
  Body                = ActiveBody ModuleTag_04
    MaxHealth         = 1000.0
    InitialHealth     = 1000.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 1200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End

  Behavior       = OCLUpdate ModuleTag_05 ; Context window is a reaction to this, no CommandSet 
    OCL          = OCL_AmericaSupplyDropZoneCrateDrop
    MinDelay     = 120000
    MaxDelay     = 120000
    CreateAtEdge = Yes ; as opposed to just creating on self
  End

  Behavior  = DestroyDie ModuleTag_06
  End
  
  Behavior             = CreateObjectDie ModuleTag_07
    CreationList  = OCL_AmericanRangerDebris03
    ExemptStatus  = UNDER_CONSTRUCTION
  End
  
  Behavior                  = CreateObjectDie ModuleTag_08
    CreationList       = OCL_LargeStructureDebris
  End

  Behavior             = FlammableUpdate ModuleTag_09
    AflameDuration     = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay  = 500       ; this often.
  End
  
  Behavior                  = FXListDie ModuleTag_10
    DeathFX            = FX_StructureMediumDeath
  End
  Behavior = GrantUpgradeCreate ModuleTag_ICBMBK
    UpgradeToGrant = Upgrade_ICBM_BoosterKiller
  End
  Behavior                  = ObjectCreationUpgrade ModuleTag_MMT
    UpgradeObject           = OCL_USBTD
    TriggeredBy             = Upgrade_ICBM_BoosterKiller
  End
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_KillMarker
    DeathWeapon  = GenericTargetMarkerKiller
    StartsActive = Yes
  End
  Behavior          = FireWeaponWhenDeadBehavior ModuleTag_KillMarker2
    DeathWeapon     = GenericTargetMarkerKiller
    StartsActive    = Yes
    RequiredStatus  = SOLD
  End

  Behavior = BaseRegenerateUpdate ModuleTag_11
    ;No data
  End 

  Behavior = TransitionDamageFX ModuleTag_31
    ;-------------DESIGNED FOR SMALL SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionSmallSmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionSmallSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionSmallExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionSmallShockwave
  End

  Geometry            = BOX
  GeometryMajorRadius = 27.0
  GeometryMinorRadius = 27.0
  GeometryHeight      = 9.0
  GeometryIsSmall     = No
  Shadow              = SHADOW_VOLUME

End