Object AmericaDroneMQ4
Scale = 0.9
  ; *** ART Parameters ***
  SelectPortrait         = us_mq4
  ButtonImage            = us_mq4

  Draw = W3DModelDraw ModuleTag_01

    OkToChangeModelColor = Yes
    DefaultConditionState
      Model             = US_MQ-4
      ParticleSysBone   = Wingtip01 JetContrailThin
      ParticleSysBone   = Wingtip02 JetContrailThin
    End

    ConditionState      = REALLYDAMAGED
      Model             = US_MQ-4
      ParticleSysBone = Wingtip01 JetContrailThin
      ParticleSysBone = Wingtip02 JetContrailThin
    End
    AliasConditionState  = RUBBLE

   ParticlesAttachedToAnimatedBones = Yes 

  End

  ; ***DESIGN parameters ***
  DisplayName             = OBJECT:MQ4D
  EditorSorting           = VEHICLE
  Side                    = America
  TransportSlotCount      = 0 ;how many "slots" we take in a transport (0 == not transportable)
  VisionRange             = 700.0 
  ShroudClearingRange     = 650
  ArmorSet
    Conditions            = None
    Armor                 = AirplaneArmor
    DamageFX              = None
  End
  MaxSimultaneousOfType = 4

  ArmorSet
    Conditions            = PLAYER_UPGRADE
    Armor                 = CountermeasuresAirplaneArmor
    DamageFX              = None
  End
  BuildCost               = 2200
  BuildTime               = 12   
  ExperienceValue         = 50 50 100 150  ;Experience point value at each level
  ExperienceRequired      = 0 100 200 400   ;Experience points needed to gain each level
  IsTrainable             = Yes             ;Can gain experience
  CrusherLevel           = 1  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet              = AmericaDroneRq4CommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect            = RaptorVoiceSelect
  VoiceMove              = RaptorVoiceMove
  VoiceAttack            = RaptorVoiceAttack
  VoiceAttackAir         = RaptorVoiceAttackAir
  VoiceGuard             = RaptorVoiceAirPatrol
  SoundAmbient           = A10ThunderboltAmbientLoop
  SoundAmbientRubble     = NoSound
  ; SoundMoveLoop          = RaptorAmbientLoop  ; don't want sound while sitting at airfield
  ; SoundAmbient           = NoSound
  UnitSpecificSounds
    VoiceCreate          = RaptorVoiceCreate
    SoundEject           = PilotSoundEject
    VoiceEject           = PilotVoiceEject
    Afterburner          = RaptorAfterburner
    VoiceLowFuel         = RaptorVoiceLowFuel
    VoiceGarrison        = RaptorVoiceMove
    StartDive  = A10ThunderboltDive
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority          = LOCAL_UNIT_ONLY
  KindOf                 = PRELOAD PRODUCED_AT_HELIPAD CAN_CAST_REFLECTIONS SELECTABLE VEHICLE SCORE DRONE
  Body                   = ActiveBody ModuleTag_02
    MaxHealth            = 600.0
    InitialHealth        = 600.0
  End
  Behavior                = ArmorUpgrade ModuleTag_Armor01
    TriggeredBy           = Upgrade_AmericaCountermeasures
  End

  Behavior                = CountermeasuresBehavior ModuleTag_10
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureFlare
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 4     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = 10.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 5.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 150  ; Time between flare volleys
    NumberOfVolleys       = 4     ; Number of times the volleys will fire before reloading
    ReloadTime            = 1500     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 70%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 100     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 200   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End
  Behavior                = CountermeasuresBehavior ModuleTag_300f34
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureCHAFF
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 2     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = -190.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 5.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 150  ; Time between flare volleys
    NumberOfVolleys       = 3     ; Number of times the volleys will fire before reloading
    ReloadTime            = 2600     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 75%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 100     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 200   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_ALQ135
    WeaponTemplate        = AN/ALQ-135_F15E
    PrimaryTargetTypes    = SMALL_MISSILE BALLISTIC_MISSILE
    ScanRate              = 1000
    ScanRange             = 500
    PredictTargetVelocityFactor = 3.0
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_ALQ135AHAM
    WeaponTemplate        = AN/ALQ-135_AHAM
    PrimaryTargetTypes    = BALLISTIC_MISSILE
    ScanRate              = 1000
    ScanRange             = 400
    PredictTargetVelocityFactor = 3.0
  End
  Behavior                          = JetSlowDeathBehavior ModuleTag_05
    FXOnGroundDeath                 = FX_JetOnGroundDeath
    OCLOnGroundDeath                = OCL_RaptorDeathFinalBlowUp
    DestructionDelay                = 99999999; destruction will happen when we
    RollRate                        = 0.2
    RollRateDelta                   = 100% ;each frame, rollrate = rollrate * rollrateDelta
    PitchRate                       = 0.0
    FallHowFast                     = 110.0%  ;Bigger is faster (can be over 100%,it's a fraction of gravity)
    FXInitialDeath                  = FX_RaptorDeathInitial
    OCLInitialDeath                 = OCL_RaptorDeathInitial
    DelaySecondaryFromInitialDeath  = 500  ; in milliseconds
    FXSecondary                     = FX_JetDeathSecondary
    OCLSecondary                    = OCL_RaptorDeathSecondary
    FXHitGround                     = FX_JetDeathHitGround
    OCLHitGround                    = OCL_RaptorDeathHitGround
    DelayFinalBlowUpFromHitGround   = 200 ; in milliseconds
    FXFinalBlowUp                   = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp                  = OCL_RaptorDeathFinalBlowUp
;   DeathLoopSound                  = MICAL NEEDS TO MAKE ME
  End
  Behavior               = OCLSpecialPower ModuleTag_RadioWaveJammer
    SpecialPowerTemplate = SuperweaponKrasukha4_RadioWaveDisabler
    OCL                  = OCL_Krasukha4_RadioWaveDisabler
    CreateLocation       = USE_OWNER_OBJECT
  End
  Behavior               = OCLSpecialPower ModuleTag_RadarDetectionJam
    SpecialPowerTemplate = SuperweaponKrasukha4_RadarDetectionJam
    OCL                  = OCL_Krasukha4_RadarDetectionJam
    CreateLocation       = USE_OWNER_OBJECT
  End
  
  Behavior               = PhysicsBehavior ModuleTag_07
    Mass                 = 500.0
  End
  Behavior = StealthUpdate ModuleTag_0x239
    StealthDelay                          = 1200 ; msec
    ;RevealDistanceFromTarget             = 0.0f
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
  Behavior = StealthDetectorUpdate ModuleTag_StealthDetection_Radar_Missiles
    DetectionRate             = 500
    DetectionRange            = 400
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
  End
  Behavior                 = TransitionDamageFX ModuleTag_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  Behavior = AIUpdateInterface ModuleTag_04iu
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate = 1
  End
  Locomotor = SET_NORMAL F137_RR_100_TurbofanLocomotor
  Locomotor = SET_WANDER F137_RR_100_TurbofanLocomotorW
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
;---------- Radar Signature --------------- ;
  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE
  End
;---------- End Of Radar Signature ----------;




  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 14.0
  GeometryMinorRadius      = 7.0
  GeometryHeight           = 5.0
  Shadow                   = SHADOW_VOLUME
  ShadowSizeX = 89  ; minimum elevation angle above horizon. Used to limit shadow length.

End