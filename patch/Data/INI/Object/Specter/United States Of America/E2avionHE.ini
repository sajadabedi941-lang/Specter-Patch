Object E2avionHE

  ; *** ART Parameters ***
  SelectPortrait         = E2avionHE
  ButtonImage            = E2avionHE
  
  UpgradeCameo1 = Upgrade_AmericaCountermeasures
  UpgradeCameo2 = Upgrade_AmericaAdvancedTraining
  
  Draw = W3DModelDraw ModuleTag_01
   OkToChangeModelColor = Yes

    DefaultConditionState
      Model                      = AVHawk
      Animation              = AVHawk.AVHawk
      AnimationMode       = ONCE
    End
    
    ConditionState        = JETEXHAUST
      Model                      = AVHawk
      Animation              = AVHawk.AVHawk
      AnimationMode       = MANUAL
      Flags               = MAINTAIN_FRAME_ACROSS_STATES
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End

    ConditionState        = JETEXHAUST JETAFTERBURNER
      Animation              = AVHawk.AVHawk
      AnimationMode       = ONCE_BACKWARDS
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ; afterburners
    End

    ConditionState        = REALLYDAMAGED
      Model               = AVHawk_D
      Animation              = AVHawk_D.AVHawk_D
      AnimationMode       = ONCE
      ; damage
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Smoke02 JetEngineDamagedSmoke
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST
      Model                      = AVHawk_D
      Animation              = AVHawk_D.AVHawk_D
      AnimationMode       = MANUAL
      ; damage
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Smoke02 JetEngineDamagedSmoke
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
      Model               = AVHawk_D
      Animation              = AVHawk_D.AVHawk_D
      AnimationMode       = ONCE_BACKWARDS
      ; damage
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Smoke02 JetEngineDamagedSmoke
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ; afterburners
    End

    ConditionState        = RUBBLE
      Model               = AVHawk_D1
      HideSubObject       = None 
      ShowSubObject       = None
    End

    ConditionState        = RUBBLE JETEXHAUST JETAFTERBURNER
      Model               = AVHawk_D1
      ;HideSubObject is needed cause there're inherited from default condition state      
      HideSubObject       = None 
      ShowSubObject       = None
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End
 End
    
  Draw = W3DModelDraw ModuleTag_Propeller

    AttachToBoneInAnotherModule = Chassis

    ConditionState = NONE
      Model                           = AVHawk_P
 ;     Animation                     = AVReaper_P.AVReaper_P
 ;     AnimationMode              = None
    End
    
    ConditionState        = MOVING
      Model                           = AVHawk_P
