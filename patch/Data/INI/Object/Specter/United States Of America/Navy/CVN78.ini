Object AmericaAircraftCarrierCVN78_AnchorUp

  ; *** ART Parameters ***
  SelectPortrait         = SACarrier_L
  ButtonImage            = SACarrier_L
  Draw = W3DOverlordTankDraw ModuleTag_01
    ReceivesDynamicLights = No
    OkToChangeModelColor               = Yes
    ; day ********************************************
    DefaultConditionState
      Model               = US_CVN78AU
      ParticleSysBone     = BOWWAKE AirCarrierWaterRipples 
      ParticleSysBone     = LEFTWAKE AirCarrierWaterRipples 
      ParticleSysBone     = RIGHTWAKE AirCarrierWaterRipples
      ParticleSysBone     = BOWWAKEL AirCarrierWaterRipples
      ParticleSysBone     = BOWWAKERB AirCarrierWaterRipples
    End

    ; day moving********************************************
    ConditionState = MOVING
      Model               = US_CVN78AU
      ParticleSysBone     = BOWWAKE AirCarrierBowWake
      ParticleSysBone     = LEFTWAKE AirCarrierSideWake
      ParticleSysBone     = RIGHTWAKE AirCarrierSideWake
      ParticleSysBone     = PROPELLERWAKE AirCarrierPropWake
      ParticleSysBone     = BOWWAKEL AirCarrierWaterWake
      ParticleSysBone     = BOWWAKERB AirCarrierWaterWakePort     
    End

    ; night ******************************************
    ConditionState        = NIGHT
      Model               = US_CVN78AU
    End
    
    ConditionState        = NIGHT SNOW
      Model               = US_CVN78AU
    End

  End
  ; ***DESIGN parameters ***
  DisplayName          = OBJECT:AircraftCarrier
  Side                 = America
  EditorSorting        = VEHICLE
  TransportSlotCount   = 60
  WeaponSet
    Conditions         = None
    Weapon             = PRIMARY  CVN78_AnchorDown
  End
  Prerequisites
    ;Object = AmericaStrategyCenter AmericaStrategyCenter_T
  End
  ArmorSet
    Conditions         = None
    Armor              = ArleighBurkeArmor
    DamageFX           = TankDamageFX
  End
  BuildCost            = 5000
  BuildTime            = 60.0
  VisionRange          = 2500
  ShroudClearingRange  = 450
  ExperienceValue      = 160 160 260 420
  ExperienceRequired   = 0 500 1000 1700
  IsTrainable          = Yes
  CrusherLevel         = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel       = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet           = AmericaCVN78_AnchorDownCommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect         = AircraftCarrierVoiceSelect
  VoiceAttack         = AircraftCarrierVoiceAttack
  VoiceMove           = AircraftCarrierVoiceMove
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE HEAL_PAD NO_HEAL_ICON DONT_AUTO_CRUSH_INFANTRY CAN_ATTACK CAN_CAST_REFLECTIONS VEHICLE HUGE_VEHICLE SCORE ;BOI?
  Body = ActiveBody ModuleTag_02f34
    MaxHealth       = 400.0
    InitialHealth   = 400.0
    SubdualDamageCap = 480
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = AIUpdateInterface ModuleTag_545DE
    AutoAcquireEnemiesWhenIdle = Yes
  End
  Locomotor = SET_NORMAL      CVN78Locomotor
  Behavior  = PhysicsBehavior ModuleTag_07_1
  Mass      = 5000.0
  End
  Behavior             = ReplaceObjectUpgrade ModuleTag_AD
    TriggeredBy   = Upgrade_AADS_AA_Mode
    ReplaceObject = AmericaAircraftCarrierCVN78_AnchorDown
  End
;------------------------ Radar Signature --------------------
  Behavior = FireWeaponUpdate ModuleTag_6g34
    Weapon = GenericSAMRadar
    ExclusiveWeaponDelay = 500
  End
  Behavior = ObjectCreationUpgrade ModuleTag_Signature01r334
    UpgradeObject = OCL_AntiRadarSignature
    TriggeredBy = Upgrade_AntiSignatureUpgrade
  End
  Behavior = GrantUpgradeCreate ModuleTag_Signature02d231
    UpgradeToGrant = Upgrade_AntiSignatureUpgrade
  End
  Behavior = ObjectCreationUpgrade ModuleTag_Signature02
    UpgradeObject = OCL_GenericRadarSignature_Buildings
    TriggeredBy = Upgrade_GenericSignature_Buildings
  End
  Behavior = GrantUpgradeCreate ModuleTag_SignatureStart2
    UpgradeToGrant = Upgrade_GenericSignature_Buildings
  End
;------------------------ End Of Radar Signature --------------------



;------------------------ Death ----------------------------------
  Behavior = DestroyDie ModuleTag_14g34
    ;nothing
  End
  Behavior             = CreateObjectDie ModuleTag_15d2
    CreationList  = OCL_ABPowerPlantExplode
  End
  Behavior             = FXListDie ModuleTag_17ntr
    DeathFX       = FX_StructureMediumDeath
  End

  Behavior = FlammableUpdate ModuleTag_19dqw
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = TransitionDamageFX ModuleTag_31g34
    ;-------------DESIGNED FOR MEDIUM SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End
  Behavior = ProductionUpdate ModuleTag_05k67
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
;------------------------ End Of Death ----------------------------------

  Geometry            = BOX
  GeometryMajorRadius = 312.0
  GeometryMinorRadius = 274.0
  GeometryHeight      = 25.0
  GeometryIsSmall     = No
  FactoryExitWidth    = 25
  Shadow          = SHADOW_VOLUME
  BuildCompletion = PLACED_BY_PLAYER

End
