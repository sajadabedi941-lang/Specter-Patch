      WeaponFireFXBone  = TERTIARY WEAPONC
      WeaponMuzzleFlash = TERTIARY WEAPONC
      WeaponLaunchBone  = TERTIARY WEAPONC
      WeaponRecoilBone  = TERTIARY Barrel
      ParticleSysBone   = TreadFX03 BattleShipWaterRipples
      ParticleSysBone   = TreadFX01 BattleShipWaterRipples
    End
    ConditionState      = RUBBLE
      Model             = US_DDG89
      ;Animation         = US_SSN774.US_SSN774
      ;AnimationMode     = Once
      Turret            = Turret
      TurretPitch       = Turretle
      WeaponFireFXBone  = PRIMARY WEAPONA
      WeaponMuzzleFlash = PRIMARY WEAPONA
      WeaponLaunchBone  = PRIMARY WEAPONA
      WeaponFireFXBone  = SECONDARY WEAPONB
      WeaponMuzzleFlash = SECONDARY WEAPONB
      WeaponLaunchBone  = SECONDARY WEAPONB
      WeaponFireFXBone  = TERTIARY WEAPONC
      WeaponMuzzleFlash = TERTIARY WEAPONC
