  BuildTime       = 50.0          ;in seconds    
  VisionRange     = 1300
  ShroudClearingRange = 450
  Prerequisites
    ;Object = AmericaWarFactory
  End
  ExperienceValue = 50 50 100 150   ;Experience point value at each level
  ExperienceRequired = 0 100 150 300  ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet      = AmericaArleighBurkeCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = BattleshipVoiceSelect
  VoiceMove = BattleshipVoiceMove
  VoiceGuard = BattleshipVoiceMove
  VoiceAttack = BattleshipVoiceAttack
  SoundAmbient = BattleshipAmbientLoop

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    TurretMoveLoop       = OverlordTankTurretMoveLoop
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS VEHICLE SCORE BOAT
  Body = ActiveBody ModuleTag_02f43
    MaxHealth       = 1400.0
    InitialHealth   = 1400.0
    SubdualDamageCap        = 480
    SubdualDamageHealRate   = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = AIUpdateInterface ModuleTag_043fr2
    Turret
      TurretTurnRate = 100
      TurretPitchRate = 100
      AllowsPitch = Yes
      FirePitch = 5
      ControlledWeaponSlots = TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes NotWhileAttacking
  End
  Locomotor = SET_NORMAL   GE_LM2500GTLocomotor
  Behavior  = PhysicsBehavior ModuleTag_04d23
    Mass    = 500.0
  End
  Behavior = DestroyDie ModuleTag_14g34
    ;nothing
  End
  Behavior             = CreateObjectDie ModuleTag_15d23
    CreationList  = OCL_ABPowerPlantExplode
  End
  Behavior             = FXListDie ModuleTag_17h45
    DeathFX       = FX_StructureMediumDeath
  End
  ;Behavior = PointDefenseLaserUpdate ModuleTag_ABM
    ;WeaponTemplate        = RIM174_ERAM_ABM
    ;PrimaryTargetTypes    = SMALL_MISSILE BALLISTIC_MISSILE
    ;ScanRate              = 1200
    ;ScanRange             = 2800
    ;PredictTargetVelocityFactor = 3.0
 ;End

  Behavior = FlammableUpdate ModuleTag_19s12
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = TransitionDamageFX ModuleTag_31f34
    ;-------------DESIGNED FOR MEDIUM SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End
  Behavior = ProductionUpdate ModuleTag_05h45
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  ;Behavior = StealthDetectorUpdate ModuleTag_DSs
    ;DetectionRate   = 800
    ;DetectionRange  = 400
  ;End
  Behavior = EnemyNearUpdate ModuleTag_03f2
  End
  Behavior = OverlordContain ModuleTag_RCWS
    Slots                   = 1
    DamagePercentToUnits    = 100%
    AllowInsideKindOf       = PORTABLE_STRUCTURE
    PassengersAllowedToFire = Yes
    PassengersInTurret      = Yes ; My passengers ride in my turret, that's where the Firepoint bones are
    ExperienceSinkForRider  = Yes ; I get the Exp for things my turret friend kills
    PayloadTemplateName     = AmericaCIWS_F
    ExperienceSinkForRider  = Yes
  End
  Behavior        = ReplaceObjectUpgrade ModuleTag_ADM
    TriggeredBy   = Upgrade_AADS_AA_Mode
    ReplaceObject = AmericaVehicleArleighBurke_Aegis
  End
  ClientUpdate = AnimatedParticleSysBoneClientUpdate ModuleTag_Dancing
  End
;-------------------- Fire Control System --------------------

  Behavior                    = FireWeaponCollide ModuleTag_RadarSearchMode
    CollideWeapon             = AN_SPS73V12_Radar_Power
  End
  Behavior = StealthDetectorUpdate ModuleTag_StealthDetection_AN_SPS67V2
    DetectionRate             = 600
    DetectionRange            = 620
    ExtraForbiddenKindOf      = AIRCRAFT DRONE
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
  End
  Behavior = StealthDetectorUpdate ModuleTag_StealthDetection_AN_SQS53C
    DetectionRate             = 500
    DetectionRange            = 420
    ExtraForbiddenKindOf      = BOAT
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
  End

;-------------------- End Of Fire Control System --------------------

  Geometry = BOX
  GeometryMajorRadius = 324.0
  GeometryMinorRadius = 317.0
  GeometryHeight = 11.5     
  GeometryIsSmall = Yes 
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End
