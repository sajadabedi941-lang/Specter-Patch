;;==============================================================================
; TEOD AmericaJetB2 - real B-2 Spirit port for Specter USA stock Airfield
; Source: TEOD Data/INI/Object/USA/Aircrafts/B2.ini (Object AmericaJetB2)
; Model: AVB3bmbr (TEOD W3D/Textures). NOT Specter AmericaJetB2Spirit/US_B1R.
; Adaptations for Specter stock airfield only:
;   - Prerequisites cleared (immediate Airfield build)
;   - CommandSet -> GenericTacticalBomberCommandSet (TEOD Aurora2 set absent)
;   - NeedsRunway=Yes ParkingOffset=3 Scale=0.65
;   - Voices remapped to Aurora* (TEOD B2 AudioEvents have no sound assets)
;   - DamageFX -> None (TEOD AAHitscanDamageFX not in Specter)
;   - JetSlowDeathBehavior fields adapted to Specter ZH syntax
;   - Optional TEOD upgrades/special-power modules omitted (missing in Specter)
; No AdvancedAirBase. Airfield Object/model/dozer untouched.
;==============================================================================

Object AmericaJetB2
  Scale = 0.65

  ; *** ART Parameters ***
  SelectPortrait         = B2-ic_L
  ButtonImage            = B2-ic_L
  
  UpgradeCameo1 = Upgrade_AmericaCountermeasures
  ;UpgradeCameo5 = NONE
  
  Draw = W3DModelDraw ModuleTag_01

    DefaultConditionState
      Model                           = AVB3bmbr
      HideSubObject                   = BurnerFX03 BurnerFX04
      Animation        = AVB3bmbr.AVB3bmbr
      AnimationMode = MANUAL
      Flags = START_FRAME_LAST
      WeaponLaunchBone  = PRIMARY WeaponA
      WeaponLaunchBone  = SECONDARY WeaponB
    End
    
    ConditionState        = JETEXHAUST
      Model            = AVB3bmbr
      Animation        = AVB3bmbr.AVB3bmbr
      AnimationMode    = ONCE_BACKWARDS
      Flags = START_FRAME_FIRST
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End

    ConditionState        = JETEXHAUST JETAFTERBURNER
      Model            = AVB3bmbr
      Animation        = AVB3bmbr.AVB3bmbr
      AnimationMode    = ONCE_BACKWARDS
      Flags = START_FRAME_LAST
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ; afterburners
      ParticleSysBone     = ENGINE01 JetLenzflare
      ParticleSysBone     = ENGINE02 JetLenzflare
    End

    ConditionState        = REALLYDAMAGED
      Model               = AVB3bmbr_D
      Animation        = AVB3bmbr_D.AVB3bmbr_D
      AnimationMode = MANUAL
      Flags = START_FRAME_LAST
      ; damage
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST
      Model               = AVB3bmbr_D
      Animation        = AVB3bmbr_D.AVB3bmbr_D
      AnimationMode    = ONCE_BACKWARDS
      Flags = START_FRAME_FIRST
      ; damage
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
      Model               = AVB3bmbr_D
      Animation        = AVB3bmbr_D.AVB3bmbr_D
      AnimationMode    = ONCE_BACKWARDS
      Flags = START_FRAME_LAST
      ; damage
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ; afterburners
      ParticleSysBone     = ENGINE01 JetLenzflare
      ParticleSysBone     = ENGINE02 JetLenzflare
    End

    ConditionState        = RUBBLE
      Model               = AVB3bmbr_D
      HideSubObject       = None 
      ShowSubObject       = None
    End

    ConditionState        = RUBBLE JETEXHAUST JETAFTERBURNER
      Model               = AVB3bmbr_D
      ;HideSubObject is needed cause there're inherited from default condition state      
      HideSubObject       = None 
      ShowSubObject       = None
      ParticleSysBone     = ENGINE01 JetLenzflare
      ParticleSysBone     = ENGINE02 JetLenzflare
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End
    
    OkToChangeModelColor = Yes

  End

  Draw = W3DModelDraw ModuleTag_PickBox
    DefaultConditionState
      Model               = JetPickBox
    End
  End

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:B2
  EditorSorting       = VEHICLE
  Side                = America
  TransportSlotCount  = 0                 ;how many "slots" we take in a transport (0 == not transportable)
  VisionRange         = 450.0 
  ShroudClearingRange = 400
  Prerequisites
  End
  BuildCost           = 2800
  BuildTime           = 32.0          ;in seconds     

  WeaponSet
    Conditions = None 
    Weapon = PRIMARY B2SmallBombWeapon
    PreferredAgainst    = PRIMARY     HUGE_VEHICLE VEHICLE
    AutoChooseSources   = PRIMARY     FROM_PLAYER FROM_SCRIPT FROM_AI 
  End

  ArmorSet
    Conditions      = None
    Armor           = USAB2Armor
    DamageFX        = None
  End
  ArmorSet
    Conditions            = PLAYER_UPGRADE
    Armor                 = USAB2AdvancedArmor
    DamageFX              = None
  End

  ExperienceValue         = 300 300 600 900  ;Experience point value at each level
  ExperienceRequired      = 0 320 800 1300   ;Experience points needed to gain each level
  IsTrainable = Yes                   ;Can gain experience
  CrusherLevel           = 1  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet        = GenericTacticalBomberCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = AuroraBomberVoiceSelect
  VoiceMove = AuroraBomberVoiceMove
  VoiceGuard = AuroraBomberVoiceMove
  VoiceAttack = AuroraBomberVoiceAttack
  SoundAmbient = AuroraBomberAmbientLoop
  SoundAmbientRubble    = NoSound
  UnitSpecificSounds
    VoiceCreate          = AuroraBomberVoiceCreate
    SoundEject           = PilotSoundEject
    VoiceEject           = PilotVoiceEject
    Afterburner          = RaptorAfterburner
    VoiceLowFuel         = AuroraBomberVoiceLowFuel
    VoiceGarrison        = AuroraBomberVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT EMP_HARDENED CANNOT_RETALIATE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 220
    InitialHealth   = 220
  End

  Behavior = EjectPilotDie ModuleTag_03
    GroundCreationList = OCL_EjectPilotOnGround
    AirCreationList = OCL_EjectPilotViaParachute
    ExemptStatus = HIJACKED
    VeterancyLevels =  ALL -REGULAR ;only vet+ gives pilot
  End

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 500.0
  End

  Behavior = JetAIUpdate ModuleTag_05
    NeedsRunway = Yes
    OutOfAmmoDamagePerSecond  = 10%  ; amount of damage to take per SEC (not per frame) when out of ammo
                                    ; note that it's expressed as a percent of max health, not an absolute
    TakeoffDistForMaxLift     = 0%   ; larger numbers give more lift sooner when taking off
    TakeoffPause              = 500
    MinHeight                 = 5
    ParkingOffset             = 3             ; scooch it a little forward so the tail doesn't hit the doors
    ReturnToBaseIdleTime      = 10000         ; if idle for this long, return to base, even if not out of ammo
    AutoAcquireEnemiesWhenIdle    = Yes
    MoodAttackCheckRate = 333
  End
  Locomotor = SET_NORMAL B2Locomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

;Upgrades----------------------------------------------------------
  Behavior                = ArmorUpgrade Upgrade_02
    TriggeredBy           = Upgrade_AmericaCountermeasures
  End
  Behavior                = CountermeasuresBehavior Upgrade_05
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureFlare
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 2     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = 60.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 2.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 650  ; Time between flare volleys
    NumberOfVolleys       = 4     ; Number of times the volleys will fire before reloading
    ReloadTime            = 0     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 35%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 0     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 200   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End

;Deaths-------------------------------------------------------------
; Specter ZH JetSlowDeath fields (TEOD used nonstandard FX/OCL = INITIAL syntax)
  Behavior = JetSlowDeathBehavior DeathTag_01
    FXOnGroundDeath                 = FX_JetOnGroundDeath
    OCLOnGroundDeath                = OCL_B2DeathFinalBlowUp
    DestructionDelay                = 99999999
    RollRate                        = 0.2
    RollRateDelta                   = 100%
    PitchRate                       = 0.0
    FallHowFast                     = 110.0%
    FXInitialDeath                  = FX_B2DeathInitial
    DelaySecondaryFromInitialDeath  = 500
    FXSecondary                     = FX_JetDeathSecondary
    FXHitGround                     = FX_JetDeathHitGround
    DelayFinalBlowUpFromHitGround   = 200
    FXFinalBlowUp                   = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp                  = OCL_B2DeathFinalBlowUp
  End
;Stealth-------------------------------------------------------------
  Behavior = StealthUpdate ModuleStealth_01
    StealthDelay                = 1000 ; msec
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
;---------------------------------------------------------------------

  Behavior = FlammableUpdate ModuleTag_06
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior                 = TransitionDamageFX ModuleTag_07
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  Behavior = ProductionUpdate ModuleTag_08
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End

  Behavior = FireWeaponUpdate ModuleTag_09
    Weapon = StealthBombersRadarWeapon
    ExclusiveWeaponDelay = 1000
  End

  Behavior = VeterancyGainCreate ModuleTag_10
    StartingLevel = VETERAN
   End

  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 20.0
  GeometryMinorRadius      = 30.0
  GeometryHeight           = 5.0
  Shadow                   = SHADOW_VOLUME
  ShadowSizeX              = 89  ; minimum elevation angle above horizon. Used to limit shadow length
End

Object B2SlowBDObject
    ; *** ART Parameters ***
  Draw                = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model               = AVB3bmbr_D
      Animation        = AVB3bmbr_D.AVB3bmbr_D
      AnimationMode    = ONCE_BACKWARDS
      Flags = START_FRAME_LAST
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetBurning
      ParticleSysBone     = Engine02 JetSmokeLarge
      ParticleSysBone     = Wingtip01 JetBurning
      ParticleSysBone     = Wingtip02 JetContrail
    End
  End
  KindOf = CAN_CAST_REFLECTIONS NO_COLLIDE HULK IGNORED_IN_GUI UNATTACKABLE
  ;------------------!!!
  Behavior                  = PhysicsBehavior ModuleTag_02
    Mass                    = 0.8
    AllowCollideForce       = No

    ZFriction = 1 ;Hi Altitude Bomber
    LateralFriction = 15;
    ForwardFriction = 0.2
    ShockResistance = 1
    ;CenterOfMassOffset       = 1
  End
  ;------------------!!!

  Behavior = SlowDeathBehavior DeathTag_01
    OCL                 = FINAL   OCL_B2DeathFinalBlowUp
    Weapon              = FINAL   FallingJetWeapon
  End

  Behavior = HeightDieUpdate DeathTag_02
    TargetHeight = 1
    TargetHeightIncludesStructures = Yes
    InitialDelay                    = 1 ; Can't explode in the first second so we don't explode on the pad
  End

  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 1.0
  GeometryMinorRadius      = 1.0
  GeometryHeight           = 1.0
  Shadow                   = SHADOW_VOLUME
  ShadowSizeX = 89  ; minimum elevation angle above horizon. Used to limit shadow length.

End

;-------------------------------------------------------


Object B2DeadHull
 ; *** ART Parameters ***
  Draw                = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model           = AVB3bmbr_D1
    End
  End

  ; ***DESIGN parameters ***
  TransportSlotCount = 3                 ;how many "slots" we take in a transport (0 == not transportable)

  ; *** AUDIO Parameters ***
  ; *** ENGINEERING Parameters ***
  KindOf = CAN_CAST_REFLECTIONS NO_COLLIDE HULK IGNORED_IN_GUI UNATTACKABLE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 1.0
    InitialHealth   = 1.0
  End

  Behavior = PhysicsBehavior ModuleTag_03
    Mass = 50
    AllowBouncing = No
  End

  Behavior = LifetimeUpdate ModuleTag_04
    MinLifetime = 500   ; min lifetime in msec
    MaxLifetime = 500   ; max lifetime in msec
  End

  Behavior = SlowDeathBehavior DeathTag_01
    SinkDelay = 0
    SinkRate = 3     ; in Dist/Sec
    DestructionDelay = 3000
  End

  Geometry = BOX
  GeometryMajorRadius = 38.0
  GeometryMinorRadius = 7.0
  GeometryHeight = 6.5     
  GeometryIsSmall = Yes  
End

Object RaptorStealthRadar
  EditorSorting = SYSTEM
  RadarPriority   = NOT_ON_RADAR
  KindOf = UNATTACKABLE INERT IGNORED_IN_GUI

  ; *** ENGINEERING Parameters ***
  Body = ImmortalBody ModuleTag_01
    MaxHealth = 1    
    InitialHealth = 1
  End
  ShroudClearingRange     = 260
  
  Behavior = AIUpdateInterface ModuleTag_03
  End 

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 9999.0
    AllowBouncing = No
  End

  Behavior = StealthDetectorUpdate ModuleTag_SDU
    DetectionRate     = 500   ; how often to rescan for stealthed things in my sight (msec)
    DetectionRange   = 330 
    ExtraRequiredKindOf      = AIRCRAFT
    CanDetectWhileGarrisoned  = Yes ;Garrisoned means being in a structure that you units can shoot out of.
    CanDetectWhileContained   = Yes ;Contained means being in a transport or tunnel network.
  End
  Behavior = StealthDetectorUpdate ModuleTag_SDUa
    DetectionRate     = 500   ; how often to rescan for stealthed things in my sight (msec)
    DetectionRange   = 330 
    ExtraRequiredKindOf      = DRONE
    CanDetectWhileGarrisoned  = Yes ;Garrisoned means being in a structure that you units can shoot out of.
    CanDetectWhileContained   = Yes ;Contained means being in a transport or tunnel network.
  End
  Behavior = DeletionUpdate ModuleTag_09
    MinLifetime = 750   ; min lifetime in msec
    MaxLifetime = 750   ; max lifetime in msec
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0

End

