;==============================================================================
; AmericaJetB2 - working B-2 Spirit (Specter B-52 behavior + AVB3bmbr visual)
; Base: AmericaJetB52H modules (JetAIUpdate / death / return-to-base).
; Visual only: AVB3bmbr. Not B1R mesh. Not TEOD behaviors. No AdvancedAirBase.
; Prerequisites empty: build from stock USA Airfield from game start.
;==============================================================================

Object AmericaJetB2
  Scale = 0.55

  ; *** ART Parameters ***
  ; Portrait MappedImage (not 3D mesh).
  SelectPortrait         = B2-ic_L
  ButtonImage            = B2-ic_L

  ; VISUAL ONLY: real B-2 Spirit W3D (AVB3bmbr). Bones from AVB3bmbr.W3D.
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model               = AVB3bmbr
      WeaponLaunchBone    = PRIMARY WeaponA01
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ParticleSysBone     = Engine01 JetContrail
      ParticleSysBone     = Engine02 JetContrail
    End
    ConditionState        = JETEXHAUST
      Model               = AVB3bmbr
      WeaponLaunchBone    = PRIMARY WeaponA01
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ParticleSysBone     = Engine01 JetContrail
      ParticleSysBone     = Engine02 JetContrail
    End
    ConditionState        = JETEXHAUST JETAFTERBURNER
      Model               = AVB3bmbr
      WeaponLaunchBone    = PRIMARY WeaponA01
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ParticleSysBone     = Engine01 JetLenzflare
      ParticleSysBone     = Engine02 JetLenzflare
    End
    ConditionState        = DAMAGED
      Model               = AVB3bmbr
      WeaponLaunchBone    = PRIMARY WeaponA01
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End
    ConditionState        = DAMAGED JETEXHAUST
      Model               = AVB3bmbr
      WeaponLaunchBone    = PRIMARY WeaponA01
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End
    ConditionState        = DAMAGED JETEXHAUST JETAFTERBURNER
      Model               = AVB3bmbr
      WeaponLaunchBone    = PRIMARY WeaponA01
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
      ParticleSysBone     = Engine01 JetLenzflare
      ParticleSysBone     = Engine02 JetLenzflare
    End
    ConditionState        = REALLYDAMAGED
      Model               = AVB3bmbr_D
      WeaponLaunchBone    = PRIMARY WeaponA01
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
    End
    ConditionState        = REALLYDAMAGED JETEXHAUST
      Model               = AVB3bmbr_D
      WeaponLaunchBone    = PRIMARY WeaponA01
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End
    ConditionState        = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
      Model               = AVB3bmbr_D
      WeaponLaunchBone    = PRIMARY WeaponA01
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End
    ConditionState        = RUBBLE
      Model               = AVB3bmbr_D1
    End
    ConditionState        = RUBBLE JETEXHAUST
      Model               = AVB3bmbr_D1
    End
    ConditionState        = RUBBLE JETEXHAUST JETAFTERBURNER
      Model               = AVB3bmbr_D1
    End
    OkToChangeModelColor = Yes
  End

  ; *** DESIGN parameters ***
  DisplayName         = OBJECT:B2
  EditorSorting       = VEHICLE
  Side                = America
  WeaponSet
    Conditions = None
    Weapon = PRIMARY USA_B2_Spirit_BunkerBuster
  End
  Prerequisites
  End
  Buildable           = Ignore_Prerequisites
  TransportSlotCount  = 0
  VisionRange         = 660.0
  ShroudClearingRange = 225
  MaxSimultaneousOfType = 4
  BuildCost           = 2500
  BuildTime           = 30.0

  ArmorSet
    Conditions      = None
    Armor           = AirplaneArmor
    DamageFX        = None
  End
  ArmorSet
    Conditions            = PLAYER_UPGRADE
    Armor                 = CountermeasuresAirplaneArmor
    DamageFX              = None
  End

  ExperienceValue         = 50 50 100 150
  ExperienceRequired      = 0 100 200 400
  IsTrainable = Yes
  CrusherLevel           = 1
  CrushableLevel         = 2
  CommandSet        = GenericTacticalBomberCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = AuroraBomberVoiceSelect
  VoiceMove = AuroraBomberVoiceMove
  VoiceGuard = AuroraBomberVoiceMove
  VoiceAttack = AuroraBomberVoiceAttack
  SoundAmbient = RaptorAmbientLoop
  SoundAmbientRubble    = NoSound
  UnitSpecificSounds
    VoiceCreate          = AuroraBomberVoiceCreate
    SoundEject           = PilotSoundEject
    VoiceEject           = PilotVoiceEject
    Afterburner          = RaptorAfterburner
    VoiceLowFuel         = AuroraBomberVoiceLowFuel
    VoiceGarrison        = AuroraBomberVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
  Body                   = ActiveBody ModuleTag_02
    MaxHealth            = 600.0
    InitialHealth        = 600.0
  End

  Behavior                          = JetSlowDeathBehavior ModuleTag_03
    FXOnGroundDeath                 = FX_JetOnGroundDeath
    OCLOnGroundDeath                = OCL_AuroraDeathFinalBlowUp
    DestructionDelay                = 99999999
    RollRate                        = 0.2
    RollRateDelta                   = 100%
    PitchRate                       = 0.0
    FallHowFast                     = 110.0%
    FXInitialDeath                  = FX_AuroraDeathInitial
    DelaySecondaryFromInitialDeath  = 500
    FXSecondary                     = FX_JetDeathSecondary
    FXHitGround                     = FX_JetDeathHitGround
    DelayFinalBlowUpFromHitGround   = 200
    FXFinalBlowUp                   = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp                  = OCL_AuroraDeathFinalBlowUp
  End

  Behavior = CreateObjectDie ModuleTag_Deletion
    DeathTypes   = NONE +EXTRA_6
    CreationList = None
  End

  Behavior = EjectPilotDie ModuleTag_04
    GroundCreationList = OCL_EjectPilotsOnGround
    AirCreationList = OCL_EjectPilotsViaParachute
    ExemptStatus = HIJACKED
    VeterancyLevels =  ALL -REGULAR
  End

  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 500.0
  End

  Behavior = PointDefenseLaserUpdate ModuleTag_ALQ135
    WeaponTemplate        = AN/ALQ-135
    PrimaryTargetTypes    = PROJECTILE INERT
    ScanRate              = 900
    ScanRange             = 400
    PredictTargetVelocityFactor = 3.0
  End

  Behavior = PointDefenseLaserUpdate ModuleTag_ALQ135AHAM
    WeaponTemplate        = AN/ALQ-135_AHAM
    PrimaryTargetTypes    = PROJECTILE
    ScanRate              = 1000
    ScanRange             = 200
    PredictTargetVelocityFactor = 3.0
  End

  ; Aircraft AI / takeoff / return-to-base (same as AmericaJetB52H)
  Behavior = JetAIUpdate ModuleTag_07
    OutOfAmmoDamagePerSecond  = 10%
    TakeoffDistForMaxLift     = 0%
    TakeoffPause              = 500
    MinHeight                 = 5
    ParkingOffset             = 3
    ReturnToBaseIdleTime      = 10000
  End
  Locomotor = SET_NORMAL D30-F6_JetLocomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior                = ArmorUpgrade ModuleTag_Armor01
    TriggeredBy           = Upgrade_AmericaCountermeasures
  End

  Behavior                = CountermeasuresBehavior ModuleTag_10
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureFlare
    FlareBoneBaseName     = Flare
    VolleySize            = 2
    VolleyArcAngle        = 90.0
    VolleyVelocityFactor  = 4.0
    DelayBetweenVolleys   = 180
    NumberOfVolleys       = 3
    ReloadTime            = 1600
    EvasionRate           = 55%
    ReactionLaunchLatency = 0
    MissileDecoyDelay     = 50
  End

  Behavior                = CountermeasuresBehavior ModuleTag_Chaffs
    TriggeredBy           = Upgrade_AmericaCountermeasures
    FlareTemplateName     = CountermeasureFlare
    FlareBoneBaseName     = Flare
    VolleySize            = 2
    VolleyArcAngle        = -196.0
    VolleyVelocityFactor  = 3.0
    DelayBetweenVolleys   = 150
    NumberOfVolleys       = 3
    ReloadTime            = 2000
    EvasionRate           = 65%
    ReactionLaunchLatency = 0
    MissileDecoyDelay     = 50
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Behavior                 = TransitionDamageFX ModuleTag_22
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End

  Behavior = ProductionUpdate ModuleTag_12gf65
  End

  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE
  End

  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 14.0
  GeometryMinorRadius      = 7.0
  GeometryHeight           = 5.0
  Shadow                   = SHADOW_VOLUME
  ShadowSizeX              = 89
End
