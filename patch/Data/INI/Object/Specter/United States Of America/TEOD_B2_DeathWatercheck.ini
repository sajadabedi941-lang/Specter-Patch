; TEOD B-2 DeathWaterCheck objects (from TEOD WaterWorks.ini)
; GenericBigAirplaneDeathWatercheckW is referenced by TEOD OCL_B2DeathWatercheck
; but has no Object definition in TEOD_INI - provided here as B2DeathWatercheckW alias.

Object B2DeathWatercheckG
  ArmorSet
    Conditions      = None
    Armor           = ProjectileWatercheckArmor
  End

  KindOf              = PRELOAD PARACHUTE IMMOBILE NO_COLLIDE INERT

  Body = ActiveBody ModuleTag_03
    MaxHealth       = 2000.0
    InitialHealth   = 2000.0
  End

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 10
  End

  Behavior = ParachuteContain ModuleTag_05
    PitchRateMax = 0
    RollRateMax = 0
    LowAltitudeDamping  = 0.0
    ParachuteOpenDist   = 0.0
    AllowInsideKindOf   = IMMOBILE UNATTACKABLE
  End

  Behavior = InstantDeathBehavior DeathModuleTag_07a
    DeathTypes = ALL
    FX = FX_BigPlaneHitGround
    OCL = OCL_B2DeathFinalBlowUp
  End

  Behavior = HeightDieUpdate ModuleTag_09
    TargetHeight = 999
    TargetHeightIncludesStructures = Yes
    OnlyWhenMovingDown = No
    InitialDelay = 33
    SnapToGroundOnDeath = No
  End
End

Object B2DeathWatercheckW
  TransportSlotCount  = 1
  KindOf = IMMOBILE UNATTACKABLE INERT NO_COLLIDE

  Body = ActiveBody ModuleTag_03
    MaxHealth       = 1.0
    InitialHealth   = 1.0
  End

  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_04
    StartsActive = Yes
    ReactionWeaponPristine = BIGPLANEFINALDEATHWATERFX
    ReactionWeaponDamaged = BIGPLANEFINALDEATHWATERFX
    ReactionWeaponReallyDamaged = BIGPLANEFINALDEATHWATERFX
    ReactionWeaponRubble = BIGPLANEFINALDEATHWATERFX
    DamageTypes = NONE +WATER
  End

  Behavior = HeightDieUpdate ModuleTag_06
    TargetHeight = 2000
    OnlyWhenMovingDown = No
  End
  Behavior = DestroyDie ModuleTag_07
  End
End

; Alias for TEOD OCL_B2DeathWatercheck ObjectNames (undefined in TEOD source)
Object GenericBigAirplaneDeathWatercheckW
  TransportSlotCount  = 1
  KindOf = IMMOBILE UNATTACKABLE INERT NO_COLLIDE

  Body = ActiveBody ModuleTag_03
    MaxHealth       = 1.0
    InitialHealth   = 1.0
  End

  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_04
    StartsActive = Yes
    ReactionWeaponPristine = BIGPLANEFINALDEATHWATERFX
    ReactionWeaponDamaged = BIGPLANEFINALDEATHWATERFX
    ReactionWeaponReallyDamaged = BIGPLANEFINALDEATHWATERFX
    ReactionWeaponRubble = BIGPLANEFINALDEATHWATERFX
    DamageTypes = NONE +WATER
  End

  Behavior = HeightDieUpdate ModuleTag_06
    TargetHeight = 2000
    OnlyWhenMovingDown = No
  End
  Behavior = DestroyDie ModuleTag_07
  End
End
