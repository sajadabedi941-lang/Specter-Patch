; TEOD B-2 support objects (not required for AmericaJetB2 INI parse)
; Kept separate so AmericaJetB2 Object file stays Specter-parse-safe.

Object B2SlowBDObject
  Draw                = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model               = AVB3bmbr_D
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetBurning
      ParticleSysBone     = Engine02 JetSmokeLarge
      ParticleSysBone     = Wingtip01 JetBurning
      ParticleSysBone     = Wingtip02 JetContrail
    End
  End
  KindOf = CAN_CAST_REFLECTIONS NO_COLLIDE HULK IGNORED_IN_GUI UNATTACKABLE
  Behavior                  = PhysicsBehavior ModuleTag_02
    Mass                    = 0.8
    AllowCollideForce       = No
    ZFriction = 1
    LateralFriction = 15
    ForwardFriction = 0.2
    ShockResistance = 1
  End
  Behavior = SlowDeathBehavior ModuleTag_03
    OCL                 = FINAL   OCL_B2DeathWatercheck
    Weapon              = FINAL   FallingJetWeapon
  End
  Behavior = HeightDieUpdate ModuleTag_04
    TargetHeight = 1
    TargetHeightIncludesStructures = Yes
    InitialDelay                    = 1
  End
  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 1.0
  GeometryMinorRadius      = 1.0
  GeometryHeight           = 1.0
  Shadow                   = SHADOW_VOLUME
  ShadowSizeX = 89
End

Object B2DeadHull
  Draw                = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model           = AVB3bmbr_D1
    End
  End
  TransportSlotCount = 3
  KindOf = CAN_CAST_REFLECTIONS NO_COLLIDE HULK IGNORED_IN_GUI UNATTACKABLE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 1.0
    InitialHealth   = 1.0
  End
  Behavior = PhysicsBehavior ModuleTag_03
    Mass = 50
    AllowBouncing = No
  End
  Behavior = LifetimeUpdate ModuleTag_04
    MinLifetime = 500
    MaxLifetime = 500
  End
  Behavior = SlowDeathBehavior ModuleTag_05
    SinkDelay = 0
    SinkRate = 3
    DestructionDelay = 3000
  End
  Geometry = Box
  GeometryMajorRadius = 38.0
  GeometryMinorRadius = 7.0
  GeometryHeight = 6.5
  GeometryIsSmall = Yes
End

Object RaptorStealthRadar
  EditorSorting = SYSTEM
  RadarPriority   = NOT_ON_RADAR
  KindOf = UNATTACKABLE INERT IGNORED_IN_GUI
  Body = ImmortalBody ModuleTag_01
    MaxHealth = 1
    InitialHealth = 1
  End
  ShroudClearingRange     = 260
  Behavior = AIUpdateInterface ModuleTag_03
  End
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 9999.0
    AllowBouncing = No
  End
  Behavior = StealthDetectorUpdate ModuleTag_SDU
    DetectionRate     = 500
    DetectionRange   = 330
    ExtraRequiredKindOf      = AIRCRAFT
    CanDetectWhileGarrisoned  = Yes
    CanDetectWhileContained   = Yes
  End
  Behavior = StealthDetectorUpdate ModuleTag_SDUa
    DetectionRate     = 500
    DetectionRange   = 330
    ExtraRequiredKindOf      = DRONE
    CanDetectWhileGarrisoned  = Yes
    CanDetectWhileContained   = Yes
  End
  Behavior = DeletionUpdate ModuleTag_09
    MinLifetime = 750
    MaxLifetime = 750
  End
  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
End
