; TEOD B-2 projectile objects (B2SmallBomb / B2BombCluster / B2Bomb)

Object B2SmallBomb
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = b2bomb
      Animation       = b2bomb.b2bomb
      AnimationMode   = ONCE
      ParticleSysBone     = ENGINE RussiaCountermeasureFlareParticleSys
      ParticleSysBone = ENGINE SmerchShellTrail
    End
  End

  ; ***DESIGN parameters ***
  EditorSorting     = SYSTEM
  ArmorSet
    Conditions      = NONE
    Armor           = ProjectileArmor
    DamageFX        = NONE
  End
  VisionRange       = 0.0

  ; *** AUDIO Parameters ***
  SoundFallingFromPlane = DaisyCutterWeapon

  ; *** ENGINEERING Parameters ***
  KindOf            = PROJECTILE UNATTACKABLE
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 600.0
    InitialHealth   = 600.0
  End

  Behavior = PhysicsBehavior ModuleTag_03
    Mass                  = 100.0
    AerodynamicFriction      = 0.83
    ForwardFriction          = 1
    CenterOfMassOffset       = 1
  End

  Behavior = MissileAIUpdate ModuleTag_04
    DetonateCallsKill = Yes
    TryToFollowTarget       = Yes
    FuelLifetime        = 9999
    IgnitionDelay       = 0
    InitialVelocity     = 0
    DistanceToTravelBeforeTurning = 0
    DistanceToTargetBeforeDiving  = 0
    DistanceToTargetForLock = 0
  End
  Locomotor = SET_NORMAL None

  Behavior = HeightDieUpdate ModuleTag_06
    TargetHeight = 50.0
    TargetHeightIncludesStructures = Yes
    OnlyWhenMovingDown  = Yes
    SnapToGroundOnDeath = No
  End

  Behavior = CreateObjectDie ModuleTag_07
    CreationList = OCL_B2BombClusters
  End

  Behavior = FXListDie ModuleTag_08
    DeathFX    = FX_B2ClusterRelease
  End

  Behavior = DestroyDie ModuleTag_10
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
  Scale = 0.9
End

;------------------------------------------------------------------------------

Object B2BombCluster
  ; *** ART Parameters ***
  Draw               = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model               = NONE
      ParticleSysBone     = NONE RussiaCountermeasureFlareParticleSys
    End
  End

  EditorSorting   = SYSTEM
  TransportSlotCount = 1

  ArmorSet
    Conditions      = NONE
    Armor           = InvulnerableAllArmor
    DamageFX        = NONE
  End

  SoundFallingFromPlane = DaisyCutterWeapon

  KindOf            = PROJECTILE UNATTACKABLE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 10.0
    InitialHealth   = 10.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
  End

  Behavior                  = PhysicsBehavior ModuleTag_04
    Mass = 5
    ZFriction                = 0.8
    AerodynamicFriction      = 0.8
    LateralFriction          = 0.1
  End

  Behavior = HeightDieUpdate ModuleTag_06
    TargetHeight = 1.0
    TargetHeightIncludesStructures = Yes
  End

  Behavior = FireWeaponUpdate ModuleTag_10
      Weapon               = B2ClusterForce
      InitialDelay         = 1
  End

  ; TEOD InstantDeath OCL_B2SmallBombClusterWatercheckObject needs
  ; SmallExplosionWatercheckW + S8WatercheckG (not in Specter). Damage comes from
  ; FireWeaponWhenDead B2ClusterWeapon — InstantDeath kept without missing OCL.
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = ALL
  End

  Behavior = FireWeaponWhenDeadBehavior DeathTag_02
    DeathTypes = ALL
    DeathWeapon   = B2ClusterWeapon
    StartsActive  = Yes
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
  Scale = 0.90
End

;------------------------------------------------------------------------------

Object B2Bomb
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = b2bomb
      ParticleSysBone = NONE JetContrailThin
    End
  End

  EditorSorting     = SYSTEM
  ArmorSet
    Conditions      = NONE
    Armor           = ProjectileArmor
    DamageFX        = NONE
  End
  VisionRange       = 0.0

  KindOf            = PROJECTILE UNATTACKABLE
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 600.0
    InitialHealth   = 600.0
  End

  Behavior = PhysicsBehavior ModuleTag_03
    Mass                  = 75.0
  End

  Behavior = MissileAIUpdate ModuleTag_04
    TryToFollowTarget   = No
    FuelLifetime        = 0
    IgnitionDelay       = 0
    InitialVelocity     = 0
    DistanceToTravelBeforeTurning = 0
    DistanceToTargetBeforeDiving  = 0
  End
  Locomotor = SET_NORMAL Kab1500BombLocomotor

  Behavior = HeightDieUpdate ModuleTag_05
    TargetHeight = 1.0
    TargetHeightIncludesStructures = Yes
  End

  ; TEOD used OCL_BulavaWatercheckObject (Specter-absent). Primary airfield weapon
  ; is B2SmallBombWeapon; keep B2Bomb object for completeness without missing OCL.
  Behavior = InstantDeathBehavior DeathModuleTag_11
    DeathTypes = ALL
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_MainWeapon
    DeathWeapon   = B2ClusterWeapon
    StartsActive  = Yes
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
  Scale = 1.15
End
