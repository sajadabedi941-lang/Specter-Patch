; TEOD B-2 projectile objects (parse-minimal)

Object B2SmallBomb
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = b2bomb
      ParticleSysBone = NONE JetContrailThin
    End
  End
  EditorSorting     = SYSTEM
  ArmorSet
    Conditions      = NONE
    Armor           = ProjectileArmor
    DamageFX        = NONE
  End
  VisionRange       = 0.0
  SoundFallingFromPlane = DaisyCutterWeapon
  KindOf            = PROJECTILE
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End
  Behavior = PhysicsBehavior ModuleTag_03
    Mass                  = 50.0
  End
  Behavior = MissileAIUpdate ModuleTag_04
    TryToFollowTarget       = No
    FuelLifetime        = 0
    IgnitionDelay       = 0
    InitialVelocity     = 0
    DistanceToTravelBeforeTurning = 0
    DistanceToTargetBeforeDiving  = 0
  End
  Locomotor = SET_NORMAL None
  Behavior = HeightDieUpdate ModuleTag_06
    TargetHeight = 1.0
    TargetHeightIncludesStructures = Yes
    OnlyWhenMovingDown  = Yes
  End
  Behavior = CreateObjectDie ModuleTag_07
    CreationList = OCL_B2BombClusters
  End
  Behavior = FXListDie ModuleTag_08
    DeathFX    = FX_B2ClusterRelease
  End
  Behavior = DestroyDie ModuleTag_10
  End
  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
End

Object B2BombCluster
  Draw               = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model               = NONE
    End
  End
  EditorSorting   = SYSTEM
  ArmorSet
    Conditions      = NONE
    Armor           = InvulnerableAllArmor
    DamageFX        = NONE
  End
  KindOf            = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 10.0
    InitialHealth   = 10.0
  End
  Behavior = AIUpdateInterface ModuleTag_03
  End
  Behavior                  = PhysicsBehavior ModuleTag_04
    Mass = 5
  End
  Behavior = HeightDieUpdate ModuleTag_06
    TargetHeight = 1.0
    TargetHeightIncludesStructures = Yes
  End
  Behavior = FireWeaponUpdate ModuleTag_10
      Weapon               = B2ClusterForce
      InitialDelay         = 1
  End
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = ALL
  End
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_11
    DeathTypes = ALL
    DeathWeapon   = B2ClusterWeapon
    StartsActive  = Yes
  End
  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
End
