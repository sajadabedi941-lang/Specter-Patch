; TEOD B-2 projectile objects (B2SmallBomb / B2Bomb)

Object B2SmallBomb

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = b2bomb
      Animation       = b2bomb.b2bomb
      AnimationMode   = ONCE
      ParticleSysBone     = ENGINE RussiaCountermeasureFlareParticleSys
      ParticleSysBone = ENGINE SmerchShellTrail
    End
  End


  ; ***DESIGN parameters ***
  EditorSorting     = SYSTEM
  ArmorSet
    Conditions      = NONE
    Armor           = ProjectileArmor
    DamageFX        = NONE
  End
  VisionRange       = 0.0  

  ; *** AUDIO Parameters ***
  SoundFallingFromPlane = DaisyCutterWeapon

  ; *** ENGINEERING Parameters ***
  KindOf            = PROJECTILE UNATTACKABLE
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 600.0
    InitialHealth   = 600.0
  End

  Behavior = PhysicsBehavior ModuleTag_03
    Mass                  = 100.0
    AerodynamicFriction      = 0.83
    ForwardFriction          = 1
    CenterOfMassOffset       = 1
  End

  Behavior = MissileAIUpdate ModuleTag_04
    DetonateCallsKill = Yes
    TryToFollowTarget       = Yes
    FuelLifetime        = 9999
    IgnitionDelay       = 0
    InitialVelocity     = 0                ; in dist/sec
    DistanceToTravelBeforeTurning = 0
    DistanceToTargetBeforeDiving  = 0
    DistanceToTargetForLock = 0  ; If it gets within 100 of the target, it kills the target.
  End
  Locomotor = SET_NORMAL None   ; yes, that's right.

  Behavior = HeightDieUpdate ModuleTag_06
    TargetHeight = 50.0
    TargetHeightIncludesStructures = Yes
    OnlyWhenMovingDown  = Yes
    SnapToGroundOnDeath = No
    ;InitialDelay                    = 200 ; Can't explode in the first second so we don't explode on the pad
  End

  Behavior = CreateObjectDie ModuleTag_07
    CreationList = OCL_B2BombClusters
  End

  Behavior = FXListDie ModuleTag_08
    DeathFX    = FX_B2ClusterRelease
  End

 ;Behavior = FireWeaponWhenDeadBehavior ModuleTag_09
 ;  DeathWeapon   = B2SMallBombFinalWeapon
 ;  StartsActive  = Yes
 ;End

  Behavior = DestroyDie ModuleTag_10
    ;nothing
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
  Scale = 0.9


End

;------------------------------------------------------------------------------

Object B2Bomb

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = b2bomb
      ParticleSysBone = NONE JetContrailThin
    End
  End

  ; ***DESIGN parameters ***
  
  EditorSorting     = SYSTEM
  ArmorSet
    Conditions      = NONE
    Armor           = ProjectileArmor
    DamageFX        = NONE
  End
  VisionRange       = 0.0  

  ; *** AUDIO Parameters ***

  ; *** ENGINEERING Parameters ***
  KindOf            = PROJECTILE UNATTACKABLE
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 600.0
    InitialHealth   = 600.0
  End

  Behavior = PhysicsBehavior ModuleTag_03
    Mass                  = 75.0
  End

  Behavior = MissileAIUpdate ModuleTag_04
    TryToFollowTarget   = No
    FuelLifetime        = 0
    IgnitionDelay       = 0
    InitialVelocity     = 0                ; in dist/sec
    DistanceToTravelBeforeTurning = 0
    DistanceToTargetBeforeDiving  = 0
  End
  Locomotor = SET_NORMAL Kab1500BombLocomotor   ; yes, that's right.

  Behavior = HeightDieUpdate ModuleTag_05
    TargetHeight = 1.0                          ;;; changed from previous, 50
    TargetHeightIncludesStructures = Yes
  End

  Behavior = InstantDeathBehavior DeathModuleTag_11
    DeathTypes = ALL
    OCL        = OCL_BulavaWatercheckObject
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_MainWeapon
    DeathWeapon   = SmallNukeFireBall
    StartsActive  = Yes
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_MainWeapon02
    DeathWeapon   = B2NukeFinalWeapon
    StartsActive  = Yes
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_AddWeapon
    DeathWeapon   = BallisticMissileAddWeapon
    StartsActive  = Yes
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
  Scale = 1.15
End

;------------------------------------------------------------------------------
