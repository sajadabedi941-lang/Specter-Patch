Object AmericaTankPaladin
  ; *** ART Parameters ***
  SelectPortrait         = us_m109a7
  ButtonImage            = us_m109a7
  Draw = W3DOverlordTankDraw ModuleTag_01
    ExtraPublicBone = TurretEX
    DefaultConditionState
      Model               = US_M109A7
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY MuzzleFX01
      WeaponRecoilBone    = PRIMARY Barrel
      WeaponMuzzleFlash   = PRIMARY MuzzleFX01
      WeaponLaunchBone    = PRIMARY MuzzleFX01
      WeaponFireFXBone    = SECONDARY MuzzleFX01
      WeaponRecoilBone    = SECONDARY Barrel
      WeaponMuzzleFlash   = SECONDARY MuzzleFX01
      WeaponLaunchBone    = SECONDARY MuzzleFX01
    End
    ConditionState       = REALLYDAMAGED
      Model               = US_M109A7D
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY MuzzleFX01
      WeaponRecoilBone    = PRIMARY Barrel
      WeaponMuzzleFlash   = PRIMARY MuzzleFX01
      WeaponLaunchBone    = PRIMARY MuzzleFX01
      WeaponFireFXBone    = SECONDARY MuzzleFX01
      WeaponRecoilBone    = SECONDARY Barrel
      WeaponMuzzleFlash   = SECONDARY MuzzleFX01
      WeaponLaunchBone    = SECONDARY MuzzleFX01
    End
    ConditionState       = RUBBLE
      Model               = US_M109A7D
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponFireFXBone    = PRIMARY MuzzleFX01
      WeaponRecoilBone    = PRIMARY Barrel
      WeaponMuzzleFlash   = PRIMARY MuzzleFX01
      WeaponLaunchBone    = PRIMARY MuzzleFX01
      WeaponFireFXBone    = SECONDARY MuzzleFX01
      WeaponRecoilBone    = SECONDARY Barrel
      WeaponMuzzleFlash   = SECONDARY MuzzleFX01
      WeaponLaunchBone    = SECONDARY MuzzleFX01
    End
    TrackMarks           = EXTnkTrack.tga
    TreadAnimationRate      = 2.0  ; amount of tread texture to move per second
    TreadDriveSpeedFraction = 0.3  ; fraction of locomotor speed below which treads stop moving.
    TreadPivotSpeedFraction = 0.6  ; fraction of locomotor speed below which we allow pivoting.
    OkToChangeModelColor = Yes
  End
  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:M109A7
  Side = America
  EditorSorting   = VEHICLE
  TransportSlotCount = 6                 ;how many "slots" we take in a transport (0 == not transportable)
  WeaponSet
    Conditions = None
    Weapon = PRIMARY M126_155mm_Howitzer
    Weapon = SECONDARY M126_155mm_Howitzer_M982A1 ;M126A1_155mm_Howitzer_Whitephosphor
    AutoChooseSources = SECONDARY None
    ShareWeaponReloadTime = Yes
  End
  ArmorSet
    Conditions           = None
    Armor                = TankArmor
    DamageFX             = TankDamageFX
  End
  BuildCost              = 1200
  BuildTime              = 16.0          ;in seconds    
  VisionRange            = 410
  ShroudClearingRange    = 150
  Prerequisites
    ;Object = AmericaWarFactory
  End
  ExperienceValue        = 100 100 200 400 ;Experience point value at each level
  ExperienceRequired     = 0 200 300 600 ;Experience points needed to gain each level
  IsTrainable            = Yes  ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet             = M109HowitzerCommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect = PaladinTankVoiceSelect
  VoiceMove = PaladinTankVoiceMove
  VoiceGuard = PaladinTankVoiceMove
  VoiceAttack = PaladinTankVoiceAttack
  SoundMoveStart = PaladinTankMoveStart
  SoundMoveStartDamaged = PaladinTankMoveStart
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate     = PaladinTankVoiceCreate
    TurretMoveLoop = TurretMoveLoop
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    VoiceCrush = PaladinTankVoiceCrush
    VoiceEnter = PaladinTankVoiceMove
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT VEHICLE SCORE 
  Body                   = ActiveBody ModuleTag_02
    MaxHealth       = 800
    InitialHealth   = 800
    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 960
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = AIUpdateInterface ModuleTag_043fr2
    Turret
      TurretTurnRate = 100
      TurretPitchRate = 100
      AllowsPitch = Yes
      FirePitch = 50
      ControlledWeaponSlots = PRIMARY SECONDARY
    End
    AutoAcquireEnemiesWhenIdle = Yes NotWhileAttacking
  End
  Behavior = LockWeaponCreate ModuleTag_Wl
    SlotToLock = PRIMARY
  End
  Locomotor            = SET_NORMAL YaMZ-238N_diesel
  Behavior = PhysicsBehavior ModuleTag_04xz
    Mass                 = 500.0
  End
  Behavior = WeaponSetUpgrade ModuleTag_09h56u56j
    TriggeredBy = Upgrade_AmericaCompositeArmor
  End
  Behavior = ProductionUpdate ModuleTag_07c3
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  Behavior = ExperienceScalarUpgrade ModuleTag_08h5
    TriggeredBy   = Upgrade_AmericaAdvancedTraining
    AddXPScalar   = 1.0 ;Increases experience gained by an additional 100%
  End
  Behavior = MaxHealthUpgrade ModuleTag_091sc
    TriggeredBy   = Upgrade_AmericaCompositeArmor
    AddMaxHealth  = 50.0
    ChangeType    = ADD_CURRENT_HEALTH_TOO   ;Choices are PRESERVE_RATIO, ADD_CURRENT_HEALTH_TOO, and SAME_CURRENTHEALTH
  End
  Behavior = OverlordContain ModuleTag_RCWS
    Slots                   = 1
    DamagePercentToUnits    = 100%
    AllowInsideKindOf       = PORTABLE_STRUCTURE
    PassengersAllowedToFire = Yes
    PassengersInTurret      = Yes ; My passengers ride in my turret, that's where the Firepoint bones are
    ExperienceSinkForRider  = Yes ; I get the Exp for things my turret friend kills
    PayloadTemplateName     = America_RCWS_M2
  End
  ; Turret fly off death
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 80
    DestructionDelay  = 100
    DestructionDelayVariance  = 10
    FX  = INITIAL  FX_GenericTankAmmoCockoff
    OCL = MIDPOINT OCL_2S19DeathEffect
    FX  = FINAL    FX_HE_UnguidedMissileDetonation
    OCL = FINAL    OCL_M109A7Turret
  End
  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_11
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier  = 80
    DestructionDelay  = 100
    DestructionDelayVariance  = 10
    FX  = INITIAL  FX_GenericTankAmmoCockoff
    OCL = FINAL    OCL_M109A7DeathEffect
    FX  = FINAL    FX_HE_UnguidedMissileDetonation
  End
  Behavior                 = TransitionDamageFX ModuleTag_12
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
  End
  Behavior                 = TransitionDamageFX ModuleTag_CFS
    ReallyDamagedParticleSystem1 = Bone:Smoke02 RandomBone:Yes PSys:GenericDamagedTankSmoke
  End
  Behavior                 = TransitionDamageFX ModuleTag_CS
    RubbleParticleSystem1  = Bone:Fire01 RandomBone:Yes PSys:TankFire
  End
  Behavior = DestroyDie ModuleTag_13v54
    DeathTypes = NONE +CRUSHED +SPLATTED
  End
  ; A crushing defeat
  Behavior = FXListDie ModuleTag_14v42
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = CreateObjectDie ModuleTag_15zcdx32
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End
  Behavior                    = CreateCrateDie ModuleTag_CratesChange
   CrateData             = SalvageCrateData
   ;CrateData             = EliteTankCrateData
   ;CrateData             = HeroicTankCrateData
  End
  Behavior = FlammableUpdate ModuleTag_21lk4hj
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Geometry               = BOX
  GeometryMajorRadius    = 25.0
  GeometryMinorRadius    = 20.0
  GeometryHeight         = 10.0     
  GeometryIsSmall        = Yes    
  Shadow = SHADOW_VOLUME
  ;ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length
End