; SPECTER USA air-force unique bomb / helper objects.
; Keep V-22 medium + B-21A heavy bomb objects (still referenced by old OCLs).
; Models: packed MK-84 only. New anchors use Model = None.

Object AmericaV22MediumBomb
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = MK-84
    End
  End
  DisplayName = OBJECT:CarpetBomb
  Side = America
  EditorSorting = SYSTEM
  TransportSlotCount = 0
  VisionRange = 0.0
  ArmorSet
    Conditions = None
    Armor = ProjectileArmor
    DamageFX = None
  End
  SoundFallingFromPlane = DaisyCutterWeapon
  KindOf = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End
  Behavior = AIUpdateInterface ModuleTag_03
  End
  Locomotor = SET_NORMAL None
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 75.0
    AerodynamicFriction = 1
    ForwardFriction = 33
    CenterOfMassOffset = 2
  End
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_05
    DeathWeapon = AmericaV22MediumBombDetonation
    StartsActive = Yes
  End
  Behavior = HeightDieUpdate ModuleTag_06
    TargetHeight = 1.0
    TargetHeightIncludesStructures = No
  End
  Behavior = FXListDie ModuleTag_08
    DeathFX = FX_FreeFallBombsDetonation
  End
  Behavior = DestroyDie ModuleTag_09
  End
End

