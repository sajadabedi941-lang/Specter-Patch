; Invisible fast projectile that dies on the clicked ground point and
; creates the B-52 Mk82 line there. Existing AmericaB52LineTargetAnchor
; is left unchanged because other weapons may still use it.
Object AmericaB52TargetCarpetAnchor
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = None
    End
  End
  DisplayName = OBJECT:CarpetBomb
  Side = America
  EditorSorting = SYSTEM
  VisionRange = 0.0
  ArmorSet
    Conditions = None
    Armor = ProjectileArmor
    DamageFX = None
  End
  KindOf = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End
  Behavior = DestroyDie ModuleTag_03
    DeathTypes = ALL
  End
  Behavior = CreateObjectDie ModuleTag_CarpetLine
    CreationList = OCL_AmericaB52TargetCarpetLine
  End
  Behavior = DumbProjectileBehavior ModuleTag_04
    FirstHeight = 10
    SecondHeight = 10
    FirstPercentIndent = 20%
    SecondPercentIndent = 80%
    FlightPathAdjustDistPerSecond = 0
  End
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 0.01
  End
  Behavior = LifetimeUpdate ModuleTag_Lifetime
    MinLifetime = 6000
    MaxLifetime = 6000
  End
  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
End

