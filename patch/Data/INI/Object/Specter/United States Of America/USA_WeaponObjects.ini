Object AGM184H_K_Object
Scale = 0.8
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState = NONE
      Model          = KH59Mk2
      Animation      = KH59Mk2.KH59Mk2
      AnimationMode  = ONCE
      Flags          = START_FRAME_FIRST
      ;ParticleSysBone = Engine01 CruiseMissileTrail
      ;ParticleSysBone = Engine01 CruiseMissileFlare
    End
    ConditionState = JAMMED
      Model = US_GBU43B
      ParticleSysBone = None SparksMedium
      ParticleSysBone = None MissileContrail
    End
  End

  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:Missile
  EditorSorting     = SYSTEM
  VisionRange = 50.0  

  ArmorSet
    Conditions      = None
    Armor           = CruiseMissileArmor
    DamageFX        = None
  End
  SoundAmbient  = GenericMissileAmbientLoop
  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD CAN_CAST_REFLECTIONS PROJECTILE BALLISTIC_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 200.0
    InitialHealth   = 200.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    ; A projectile is not disabled, but instead loses target and scatters
    SubdualDamageCap = 200
    SubdualDamageHealRate = 100000
    SubdualDamageHealAmount = 50
  End

; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
    ; we detonated normally.
    ; no FX, just quiet destroy ourselves
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    ; shot down by laser.
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    ; shot down by nonlaser.
    FX         = FX_GenericMissileDeath
  End
; ---- end Projectile death behaviors
  Behavior                = CountermeasuresBehavior ModuleTag_CMC
    TriggeredBy           = Upgrade_ChaffUpgrade
    FlareTemplateName     = CountermeasureCHAFF
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 3     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = 90.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 3.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 800  ; Time between flare volleys
    NumberOfVolleys       = 6     ; Number of times the volleys will fire before reloading
    ReloadTime            = 0     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 45%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 0     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 200   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End
  Behavior = GrantUpgradeCreate ModuleTag_CMCAF
    UpgradeToGrant = Upgrade_ChaffUpgrade
  End
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_10
    DeathWeapon   = BLU109_Pentrator
    StartsActive  = Yes                      
  End
  Behavior = PhysicsBehavior ModuleTag_05
    Mass                  = 1.0
    ShockResistance       = 0.8
    AerodynamicFriction   = 1.2  ; this is now friction-per-sec
    CenterOfMassOffset    = 2    ; Default of 0 means nothing tips as it falls.  Positive tips forward, negative tips back
    AllowBouncing = Yes
    AllowCollideForce = Yes
    KillWhenRestingOnGround = No ;Yes
  End
  Behavior = MissileAIUpdate ModuleTag_01ff8
    TryToFollowTarget     = Yes 
    FuelLifetime          = 999999
    InitialVelocity       = 40                ; in dist/sec
    IgnitionDelay         = 800
    IgnitionFX            = None
    DistanceToTravelBeforeTurning = 200
    DistanceToTargetBeforeDiving = 280
  End
  Locomotor = SET_NORMAL AGM184HMissileLocomotor
;---------- Radar Signature --------------- ;
  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE
  End
;---------- End Of Radar Signature ----------;

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0

End



