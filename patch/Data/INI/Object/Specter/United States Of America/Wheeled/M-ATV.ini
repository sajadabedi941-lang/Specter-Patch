
;------------------------------------------------------------------------------
;M-ATV MRAP
Object AmericaVehicleSentryDrone

  ; *** ART Parameters ***
  SelectPortrait         = us_matv
  ButtonImage            = us_matv
  
  ;UpgradeCameo1 = Upgrade_AmericaSentryDroneGun
  ;UpgradeCameo2 = NONE
  ;UpgradeCameo3 = NONE
  ;UpgradeCameo4 = NONE
  ;UpgradeCameo5 = NONE

  Draw = W3DTruckDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model                           = US_MATV
      Turret                          = TURRET
      WeaponFireFXBone  = PRIMARY   WEAPONA
      WeaponMuzzleFlash = PRIMARY   WEAPONA
      WeaponRecoilBone  = PRIMARY   WEAPONA
      WeaponFireFXBone    = SECONDARY WEAPONB
      WeaponMuzzleFlash   = SECONDARY WEAPONB
      WeaponLaunchBone    = SECONDARY WEAPONB
    End
    ConditionState                    = REALLYDAMAGED
      Model                           = US_MATV
      Turret                          = TURRET
      WeaponFireFXBone  = PRIMARY   WEAPONA
      WeaponMuzzleFlash = PRIMARY   WEAPONA
      WeaponRecoilBone  = PRIMARY   WEAPONA
      WeaponFireFXBone    = SECONDARY WEAPONB
      WeaponMuzzleFlash   = SECONDARY WEAPONB
      WeaponLaunchBone    = SECONDARY WEAPONB
    End
    ConditionState                    = RUBBLE
      Model                           = US_MATV
      Turret                          = TURRET
      WeaponFireFXBone  = PRIMARY   WEAPONA
      WeaponMuzzleFlash = PRIMARY   WEAPONA
      WeaponRecoilBone  = PRIMARY   WEAPONA
      WeaponFireFXBone    = SECONDARY WEAPONB
      WeaponMuzzleFlash   = SECONDARY WEAPONB
      WeaponLaunchBone    = SECONDARY WEAPONB
    End

    TrackMarks = EXTireTrack.tga

    Dust = RocketBuggyDust
    DirtSpray = RocketBuggyDirtSpray
    PowerslideSpray = RocketBuggyDirtPowerSlide

    ; These parameters are only used if the model has a separate suspension, 
    ; and the locomotor has HasSuspension = Yes.
    LeftFrontTireBone = Tire01
    RightFrontTireBone = Tire02
    LeftRearTireBone = Tire03
    RightRearTireBone = Tire04
    TireRotationMultiplier = 0.2   ; this * speed = rotation.
    PowerslideRotationAddition = 1.25   ; This speed is added to the rotation speed when powersliding.

  End

  ; ***DESIGN parameters ***
  DisplayName        = OBJECT:matv
  Side               = America
  EditorSorting      = VEHICLE
  TransportSlotCount = 3                 ;how many "slots" we take in a transport (0 == not transportable)
  WeaponSet
    Conditions = None 
    Weapon               = PRIMARY     12.7mm_M2HB
    Weapon               = SECONDARY   BGM-71E_Tow_Sgl
    PreferredAgainst     = SECONDARY   STRUCTURE VEHICLE
  End
  ArmorSet
    Conditions      = None
    Armor           = M-ATV_Armor
    DamageFX        = TruckDamageFX
  End
  BuildCost       = 600
  BuildTime       = 10.0          ;in seconds    
  VisionRange     = 320
  ShroudClearingRange = 350
  Prerequisites
    ;Object = AmericaWarFactory
  End

  ExperienceValue = 50 50 100 150   ;Experience point value at each level
  ExperienceRequired = 0 100 150 300  ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet    = US_MATVCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = HumveeVoiceSelect
  VoiceMove = HumveeVoiceMove
  VoiceGuard = HumveeVoiceMove
  VoiceAttack = HumveeVoiceAttack
  VoiceAttackAir = HumveeVoiceAttackTOW
  SoundMoveStart = HumveeMoveStart
  SoundMoveStartDamaged = HumveeMoveStart
  SoundEnter = HumveeEnter
  SoundExit = HumveeExit

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    ;TurretMoveStart    = NoSound
    VoiceCreate         = HumveeVoiceCreate
    TurretMoveLoop      = TurretMoveLoop
    SoundEject          = PilotSoundEject
    VoiceEject          = PilotVoiceEject
    VoiceCrush          = HumveeVoiceCrush
  ; Required for the W3DTruckDraw module
    TruckLandingSound = RocketBuggyLand
    TruckPowerslideSound = RocketBuggyPowerslide
    VoiceUnload = HumveeVoiceUnload
    VoiceEnter = HumveeVoiceMove
  End


  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE TRANSPORT

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 670.0
    InitialHealth   = 670.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 480
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = TransportAIUpdate ModuleTag_03
    Turret
      TurretTurnRate = 180
      RecenterTime = 5000   ; how long to wait during idle before recentering
      ControlledWeaponSlots = PRIMARY SECONDARY
    End
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate        = 250
  End
  Locomotor = SET_NORMAL Generic8x8Locomotor

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 200.0
  End

  Behavior = ProductionUpdate ModuleTag_08
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End

  Behavior = TransportContain ModuleTag_container
    Slots                 = 4
    ScatterNearbyOnExit   = Yes
    HealthRegen%PerSec    = 8
    EnterSound            = GarrisonEnter
    ExitSound             = GarrisonExit
    DamagePercentToUnits  = 100%
    AllowInsideKindOf     = INFANTRY
    ExitDelay             = 250
    NumberOfExitPaths     = 3 ; Defaults to 1.  Set 0 to not use ExitStart/ExitEnd, set higher than 1 to use ExitStart01-nn/ExitEnd01-nn
    GoAggressiveOnExit    = Yes ; AI Will tell people to set their mood to Aggressive on exiting
  End

  Behavior = SlowDeathBehavior ModuleTag_11
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 25
    DestructionDelay = 1
    OCL = INITIAL  OCL_InitialHumveeDebris
    FX  = FINAL    FX_BattleMasterExplosionOneFinal
    OCL = FINAL    OCL_FinalHumveeDebris
  End

  Behavior = DestroyDie ModuleTag_12
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  Behavior = FXListDie ModuleTag_13
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End

  Behavior = CreateCrateDie ModuleTag_CratesChange
    CrateData = SalvageCrateData
    ;CrateData = EliteTankCrateData
    ;CrateData = HeroicTankCrateData
  End

; This is commented out per hotlist request 10/9 ML
;  Behavior = CreateObjectDie ModuleTag_15
;    DeathTypes = ALL -CRUSHED -SPLATTED
;    CreationList = OCL_AmericanRangerDebris01
;    ExemptStatus = HIJACKED
;  End
  Behavior = TransitionDamageFX ModuleTag_17
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Geometry = BOX
  GeometryMajorRadius = 24.0
  GeometryMinorRadius = 17.0
  GeometryHeight = 11.5     
  GeometryIsSmall = Yes 
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End