



;------------------------------------------------------------------------------
Object AmericaVehicleM142
  ; *** ART Parameters ***
  SelectPortrait         = us_m270
  ButtonImage            = us_m270  
  UpgradeCameo1 = Upgrade_AmericaAdvancedTraining 
  Draw = W3DTruckDraw ModuleTag_01
    OkToChangeModelColor  = Yes
    ConditionState        = NONE
      Model               = US_M142
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponLaunchBone    = PRIMARY   Missile
      WeaponLaunchBone    = SECONDARY Missile
      WeaponLaunchBone    = TERTIARY  Missile
    End
    ConditionState        = REALLYDAMAGED
      Model               = US_M142D
      Turret              = Turret
      TurretPitch         = Turretle
      WeaponLaunchBone    = PRIMARY   Missile
      WeaponLaunchBone    = SECONDARY Missile
      WeaponLaunchBone    = TERTIARY  Missile
    End
    ConditionState        = RUBBLE
      Model               = US_M142D
    End
    TrackMarks = EXTireTrack.tga
    Dust = RocketBuggyDust
    DirtSpray = RocketBuggyDirtSpray
    LeftFrontTireBone = Tire02
    RightFrontTireBone = Tire01
    MidLeftRearTireBone = Tire04
    MidRightRearTireBone = Tire03
    LeftRearTireBone = Tire06
    RightRearTireBone = Tire05
    TireRotationMultiplier = 0.2 ; this * speed = rotation.
  End
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:M142
  Side                = America
  EditorSorting       = VEHICLE
  TransportSlotCount  = 1                 ;how many "slots" we take in a transport (0 == not transportable)
  WeaponSet
    Conditions          = None 
    Weapon              = PRIMARY     6x_200lb_GMLRS_M31A2_Unitary
  End
  ArmorSet
    Conditions      = None
    Armor           = TruckArmor
    DamageFX        = TankDamageFX
  End
  BuildCost       = 1200
  BuildTime       = 18.0          ;in seconds    
  VisionRange     = 470
  ShroudClearingRange = 170
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet            = US_M270CommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect = TomahawkVoiceSelect
  VoiceMove = TomahawkVoiceMove
  VoiceGuard = TomahawkVoiceMove
  VoiceAttack = TomahawkVoiceAttack
  SoundMoveStart = TomahawkMoveStart
  SoundMoveStartDamaged = TomahawkMoveStart
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate = TomahawkVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoopLoud
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    VoiceCrush = TomahawkVoiceCrush
    VoiceEnter = TomahawkVoiceMove
    VoiceBombard = TomahawkVoiceAttack
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE DONT_AUTO_CRUSH_INFANTRY CAN_ATTACK CAN_CAST_REFLECTIONS VEHICLE SCORE

  Body = ActiveBody ModuleTag_023TA
    MaxHealth       = 400
    InitialHealth   = 400

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 240
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = AIUpdateInterface ModuleTag_03FA3
      Turret
      TurretTurnRate        = 32
      TurretPitchRate       = 30
      FirePitch             = 50
      MinPhysicalPitch      = 20
      RecenterTime          = 10000
      AllowsPitch           = Yes
      ControlledWeaponSlots = PRIMARY
    End
    AutoAcquireEnemiesWhenIdle = No
   End
  Locomotor = SET_NORMAL Caterpillar3115_ATAAC6_6LD
  Behavior = PhysicsBehavior ModuleTag_04D3
    Mass = 60.0
  End
  Behavior = ProductionUpdate ModuleTag_08AD
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_L8F09
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 50
    DestructionDelay = 100
    DestructionDelayVariance = 300
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_BM21DeathEffect
    FX  = FINAL    FX_MediumHeatExplosion
  End
  Behavior = ExperienceScalarUpgrade ModuleTag_092c3
    TriggeredBy = Upgrade_AmericaAdvancedTraining
    AddXPScalar = 1.0 ;Increases experience gained by an additional 100%
  End
  Behavior = DestroyDie ModuleTag_12
    DeathTypes = NONE +CRUSHED +SPLATTED
  End
  Behavior = FXListDie ModuleTag_13
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = TransitionDamageFX ModuleTag_14A33ADA
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = FlammableUpdate ModuleTag_213RE3AE
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Geometry = BOX
  GeometryMajorRadius = 15.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 10.0     
  GeometryIsSmall = Yes
  Shadow = SHADOW_VOLUME 
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length   
End