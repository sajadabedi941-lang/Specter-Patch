;==============================================================================
; America_AdvancedAirBase - TEOD airfield model/art only
; Source: TEOD !TEOD_INI / !TEOD_W3D / !TEOD_Textures
;   USA Airfield.ini Scale=1.1 Geometry=140x85x25
;   Mesh: GLA-Airfield (TEOD airfield W3D; uses UVAirfield textures)
; Does NOT use Specter AdvancedAirBase / Revolution ABAirF2 / US_AirField@1.60.
; CommandSet / unlocks unchanged.
;==============================================================================

Object America_AdvancedAirBase

  ; *** ART Parameters (TEOD airfield) ***
  SelectPortrait         = Patch_AdvancedAirBase
  ButtonImage            = Patch_AdvancedAirBase

  ; Original TEOD USA Airfield scale/geometry (real size).
  Scale = 1.1

  Draw = W3DModelDraw ModuleTag_01
    ExtraPublicBone = Runway1Parking1
    ExtraPublicBone = Runway1Park1Han
    ExtraPublicBone = Runway1Prep1
    ExtraPublicBone = RunwayStart1
    ExtraPublicBone = RunwayEnd1
    ExtraPublicBone = Runway1Parking2
    ExtraPublicBone = Runway1Park2Han
    ExtraPublicBone = Runway1Prep2
    OkToChangeModelColor = Yes

    ; day
    ConditionState = NONE
      Model = GLA-Airfield
    End
    ConditionState = DAMAGED
      Model = GLA-Airfield_D
    End
    ConditionState = REALLYDAMAGED RUBBLE
      Model = GLA-Airfield_E
    End

    ; night
    ConditionState = NIGHT
      Model = GLA-Airfield
    End
    ConditionState = NIGHT DAMAGED
      Model = GLA-Airfield_D
    End
    ConditionState = NIGHT REALLYDAMAGED RUBBLE
      Model = GLA-Airfield_E
    End

    ; snow
    ConditionState = SNOW
      Model = GLA-Airfield_S
    End
    ConditionState = DAMAGED SNOW
      Model = GLA-Airfield_DS
    End
    ConditionState = REALLYDAMAGED RUBBLE SNOW
      Model = GLA-Airfield_ES
    End

    ; snow night
    ConditionState = NIGHT SNOW
      Model = GLA-Airfield_S
    End
    ConditionState = NIGHT SNOW DAMAGED
      Model = GLA-Airfield_DS
    End
    ConditionState = NIGHT SNOW REALLYDAMAGED RUBBLE
      Model = GLA-Airfield_ES
    End

    ConditionState = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED
      Model = GLA-Airfield
      Flags = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
    End
    ConditionState = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED DAMAGED
      Model = GLA-Airfield_D
      Flags = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
    End
    ConditionState = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED REALLYDAMAGED
      Model = GLA-Airfield_E
      Flags = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
    End
    ConditionState = AWAITING_CONSTRUCTION
      Model = NONE
    End
  End

  PlacementViewAngle = -45

  ; *** DESIGN parameters ***
  DisplayName      = OBJECT:Patch_AdvancedAirBase
  Side             = America
  EditorSorting    = STRUCTURE
  Prerequisites
  End
  BuildCost           = 2500
  BuildTime           = 60.0
  EnergyProduction    = -1
  CommandSet          = America_AdvancedAirBaseCommandSet
  VisionRange         = 200.0
  ShroudClearingRange = 200
  ArmorSet
    Conditions        = None
    Armor             = StructureArmor
    DamageFX          = StructureDamageFXNoShake
  End
  MaxSimultaneousOfType = 1
  ExperienceValue     = 150 150 150 150

  ; *** AUDIO Parameters ***
  VoiceSelect         = AirfieldUSASelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy
  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority       = STRUCTURE
  KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE CAPTURABLE FS_FACTORY MP_COUNT_FOR_VICTORY AUTO_RALLYPOINT FS_AIRFIELD
  Body                = StructureBody ModuleTag_10
    MaxHealth         = 3200.0
    InitialHealth     = 3200.0
    SubdualDamageCap = 1700
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End

  ; TEOD USA Airfield parking (2x2) matching GLA-Airfield bones.
  Behavior = ParkingPlaceBehavior ModuleTag_11
    HealAmountPerSecond     = 25
    NumRows                 = 2
    NumCols                 = 2
    HasRunways              = Yes
    ApproachHeight          = 50
  End

  Behavior = ProductionUpdate ModuleTag_12
    NumDoorAnimations            = 4
    DoorOpeningTime              = 2000
    DoorWaitOpenTime             = 3000
    DoorCloseTime                = 2000
    ConstructionCompleteDuration = 1000
  End
  Behavior = BaseRegenerateUpdate ModuleTag_13
  End
  Behavior = DestroyDie ModuleTag_14
  End
  Behavior = CreateObjectDie ModuleTag_15
    CreationList  = OCL_ABPowerPlantExplode
  End
  Behavior = FXListDie ModuleTag_17
    DeathFX       = FX_StructureMediumDeath
  End
  Behavior = FlammableUpdate ModuleTag_19
    AflameDuration = 5000
    AflameDamageAmount = 5
    AflameDamageDelay = 500
  End

  ; Original TEOD USA Airfield geometry (real size).
  Geometry            = BOX
  GeometryMajorRadius = 140.0
  GeometryMinorRadius = 85.0
  GeometryHeight      = 25.0
  GeometryIsSmall     = No
  FactoryExitWidth    = 25
  Shadow          = SHADOW_VOLUME
  BuildCompletion = PLACED_BY_PLAYER

End
