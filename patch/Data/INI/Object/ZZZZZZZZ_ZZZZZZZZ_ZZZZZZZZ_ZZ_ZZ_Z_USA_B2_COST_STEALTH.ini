;==============================================================================
; AmericaJetB2 — EFFECTIVE ThingFactory last-wins (Data\INI\Object\ ONLY)
;
; Engine loads Object templates from Data\INI\Object\ (not root Data\INI\).
; Root ZZZ cost/stealth overrides never reach ThingFactory — that is why
; prior B-2 BuildCost/Stealth packs did not apply in-game.
;
; This file sorts after all other AmericaJetB2 Object INIs and locks:
;   BuildCost = 10000
;   RadarPriority = LOCAL_UNIT_ONLY
;   StealthUpdate InnateStealth = Yes  (permanent, no upgrade/science/SP)
;
; Does NOT touch: Draw/Model, WeaponSet, JetAIUpdate, Locomotor, CommandSet,
; Airfield roster, B-21, B-52H, bomb weapon / 2-per-pass.
;==============================================================================

Object AmericaJetB2
  BuildCost = 10000
  BuildTime = 30.0
  RadarPriority = LOCAL_UNIT_ONLY

  Behavior = StealthUpdate ModuleTag_B2CostStealthLock
    StealthDelay                          = 0
    StealthForbiddenConditions            = FIRING_PRIMARY
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
End
