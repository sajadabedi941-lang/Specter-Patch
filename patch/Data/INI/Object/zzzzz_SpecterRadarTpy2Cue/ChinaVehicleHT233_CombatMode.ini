; SPECTER last-win. Match US_AN_TPY2_CombatMode DataLink cue.
Object ChinaVehicleHT233_CombatMode
Scale = 0.8

  ; *** ART Parameters ***
  SelectPortrait         = pla_ht233
  ButtonImage            = pla_ht233
  Draw = W3DTruckDraw ModuleTag_01
    OkToChangeModelColor               = Yes
    DefaultConditionState
      Model                   = CHI_HT233_A
      Animation               = CHI_HT233_A.CHI_HT233_A
      AnimationMode           = LOOP
    End
    ConditionState            = REALLYDAMAGED
      Model                   = CHI_HT233_AD
      Animation               = CHI_HT233_AD.CHI_HT233_AD
      AnimationMode           = LOOP
    End
    ConditionState            = RUBBLE
      Model                   = CHI_HT233R
    End
    LeftFrontTireBone         = Tire01
    RightFrontTireBone        = Tire03
    LeftRearTireBone          = Tire06
    RightRearTireBone         = Tire08
    MidLeftFrontTireBone      = Tire02
    MidRightFrontTireBone     = Tire04
    MidLeftRearTireBone       = Tire05
    MidRightRearTireBone      = Tire07
    TireRotationMultiplier    = 0.2
  End
  ; ***DESIGN parameters ***
  DisplayName          = OBJECT:HT233
  Side                 = China
  EditorSorting        = VEHICLE
  WeaponSet
    Conditions         = None 
    Weapon             = PRIMARY   RadarTrackingBeam
    Weapon             = SECONDARY 92N6R_Pack
    AutoChooseSources  = SECONDARY None
  End
  VisionRange         = 900
  ShroudClearingRange = 150
  ArmorSet
    Conditions        = None
    Armor             = LargeAAVehicleArmor ;AATruckArmor
    DamageFX          = TruckDamageFX
  End
  ExperienceValue      = 160 160 260 420
  ExperienceRequired   = 0 500 1000 1700
  IsTrainable          = Yes
  CrusherLevel         = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel       = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet           = S400ECommandSet_Deployed
  ; *** AUDIO Parameters ***
  VoiceSelect = RadarVanVoiceSelect
  VoiceMove = RadarVanVoiceMove
  VoiceAttack = RadarVanVoiceMove
;  SoundMoveStart = RadarVanMoveStart
;  SoundMoveStartDamaged = RadarVanMoveStart
  SoundMoveLoop = ConvoyTruckMoveLoop
  SoundMoveLoopDamaged = ConvoyTruckMoveLoop
  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate     = RadarVanVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop  
    TruckLandingSound = NoSound ;RocketBuggyLand
    TruckPowerslideSound = NoSound ;RocketBuggyPowerslide
    VoiceCrush      = RadarVanVoiceCrush
    Deploy              = NukeCannonDeploy
    Undeploy            = NukeCannonUnDeploy
    VoiceEnter = RadarVanVoiceMove
  End
  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = DONT_AUTO_CRUSH_INFANTRY SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS PRELOAD VEHICLE SCORE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 800
    InitialHealth   = 800
    SubdualDamageCap = 480
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior                     = AIUpdateInterface ModuleTag_FT
    Turret
      TurretTurnRate           = 50
      ControlledWeaponSlots    = PRIMARY
    End
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate        = 1
  End
  ClientUpdate = AnimatedParticleSysBoneClientUpdate ModuleTag_Client05
  End
  Behavior  = PhysicsBehavior ModuleTag_06
    Mass    = 80
  End
  Behavior = StealthUpdate ModuleTag_SD1
    StealthDelay                = 2650
    StealthForbiddenConditions  = ATTACKING USING_ABILITY
    MoveThresholdSpeed          = 4
    InnateStealth               = No
    OrderIdleEnemiesToAttackMeUponReveal = Yes
  End
  Behavior = StealthUpgrade ModuleTag_SU
    TriggeredBy = Upgrade_MTS
  End
;------------------------ Death ----------------------------------
  ; Catch fire, and explode death
  Behavior = SlowDeathBehavior ModuleTag_08b65d
    DeathTypes = ALL -SPLATTED
    ProbabilityModifier = 50
    DestructionDelay = 2000
    DestructionDelayVariance = 300
    FX  = INITIAL  FX_CrusaderCatchFire
    OCL = FINAL    OCL_RadarVanDeathEffect 
    FX  = FINAL    FX_ScudLauncherExplosionOneFinal
  End
  Behavior = SlowDeathBehavior ModuleTag_TOPPLED01
    DeathTypes = NONE +SPLATTED
    OCL = FINAL    OCL_HT233_Pack
  End
  Behavior = TransitionDamageFX ModuleTag_10c23
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = ProductionUpdate ModuleTag_11vc34
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  Behavior = FlammableUpdate ModuleTag_12hb4
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  Behavior  = DestroyDie ModuleTag_07c23z4
  End
;------------------------ End Of Death ----------------------------------
;------------------------ Packing System ---------------------------
  Behavior               = FireWeaponWhenDeadBehavior ModuleTag_FCS_DOWN
    DeathWeapon          = Generic_SAM_FCS_PowerDown
    StartsActive         = Yes
  End
;------------------------ End Of Packing System ---------------------------
;-------------------- Fire Control System --------------------

  Behavior                    = FireWeaponUpdate ModuleTag_FCSSP
    Weapon                    = HT233_WaveEmitter
    ;ExclusiveWeaponDelay      = 1100
  End
  Behavior                    = FireWeaponUpdate ModuleTag_FCRL
    Weapon                    = FireControlRadarDataLink
    ExclusiveWeaponDelay      = 1000
  End
  Behavior                    = StealthDetectorUpdate ModuleTag_StealthDetection
    DetectionRate             = 1200
    DetectionRange            = 720
    ExtraForbiddenKindOf      = INFANTRY
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
  End

  Geometry            = BOX
  GeometryMajorRadius = 42.0
  GeometryMinorRadius = 10.0
  GeometryHeight      = 20.0     
  GeometryIsSmall     = Yes
  Shadow              = SHADOW_VOLUME 
  ShadowSizeX         = 45
End
;-------------------------------------------------------------------------------
