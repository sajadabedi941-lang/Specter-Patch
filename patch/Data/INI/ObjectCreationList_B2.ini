; B-2 OCL death/eject

ObjectCreationList OCL_AuroraDeathFinalBlowUp

  CreateObject
    ObjectNames = AmericaJetAuroraHulk
    Offset      = X:0.0 Y:0.0 Z:0.0
    Count       = 1
    Disposition = SEND_IT_FLYING INHERIT_VELOCITY RANDOM_FORCE
    DispositionIntensity = 0.4
    MinForcePitch = 0.0
    MaxForcePitch = 10.0
    RollRate      = 0.0
    PitchRate     = 0.0
    YawRate       = 0.0
  End

End

;------------------------------------------------------------------------------
;MIG has just been killed 
;------------------------------------------------------------------------------

ObjectCreationList OCL_EjectPilotsOnGround
  CreateObject
    ObjectNames = AmericaInfantryPilot 2
    IgnorePrimaryObstacle = Yes
    InheritsVeterancy = Yes
    Disposition = RANDOM_FORCE
    MinForceMagnitude = 2
    MaxForceMagnitude = 3
    MinForcePitch = 50
    MaxForcePitch = 60
    SpinRate = 0
    InvulnerableTime = 2000;milliseconds
    RequiresLivePlayer = Yes
  End
End


; -----------------------------------------------------------------------------
; Eject a pilot via direct paradrop.
; -----------------------------------------------------------------------------

ObjectCreationList OCL_EjectPilotsViaParachute
  CreateObject
    ObjectNames = AmericaInfantryPilot 2
    PutInContainer = AmericaParachute
    IgnorePrimaryObstacle = Yes
    InheritsVeterancy = Yes
    Disposition = RANDOM_FORCE
    MinForceMagnitude = 10
    MaxForceMagnitude = 12
    MinForcePitch = 50
    MaxForcePitch = 60
    SpinRate = 0
    InvulnerableTime = 2000;milliseconds
    RequiresLivePlayer = Yes
  End
End

