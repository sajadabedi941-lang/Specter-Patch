; SPECTER ABM overlay OCL last-win.
; Root extra-file pattern used by SPEC (ObjectCreationList_ZZZZ_*.ini).
; Loads after Data\INI\ObjectCreationList.ini so these names last-win.
; HQ-9 and S-400 OCLs are not last-won.
;
; S-400 ABM deploy is the in-game fire witness: it spawns
; S400R_FireControlSystem_ABM (FALLING, estimate 0) AND
; S400R_FireControlSystem_AUM (4x_MRSAM_9M96E2 CRUSH). The AUM FCS is
; what actually starts intercepts. The four systems below only spawned
; their named ABM FCS, whose SPEC primary is FALLING vs SRBMArmor 0%.

ObjectCreationList OCL_S500_Deployed_ABM
  CreateObject
    ObjectNames           = S500_FireControlSystem_ABM
    Disposition           = LIKE_EXISTING
    IgnorePrimaryObstacle = Yes
    Count                 = 1
  End
  CreateObject
    ObjectNames           = S400R_FireControlSystem_AUM
    Disposition           = LIKE_EXISTING
    IgnorePrimaryObstacle = Yes
    Count                 = 1
  End
  CreateObject
    ObjectNames           = RussiaVehicleS500CombatMode
    Disposition           = LIKE_EXISTING
    IgnorePrimaryObstacle = Yes
    Count                 = 1
  End
  CreateObject
    ObjectNames           = AirdefenseLinkRestarter
    Disposition           = LIKE_EXISTING
    IgnorePrimaryObstacle = Yes
    Count                 = 1
  End
End

