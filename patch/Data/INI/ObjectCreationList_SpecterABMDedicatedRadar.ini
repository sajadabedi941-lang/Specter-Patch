; SPECTER ABM overlay OCL last-win.
; Root extra-file pattern used by SPEC (ObjectCreationList_ZZZZ_*.ini).
; Only S-500 ABM deploy is last-won. THAAD / Arrow / S-300 OCLs already
; spawn their ABM FCS. S-400 and HQ-9 OCLs are not last-won.

ObjectCreationList OCL_S500_Deployed_ABM
  CreateObject
    ObjectNames           = S500_FireControlSystem_ABM
    Disposition           = LIKE_EXISTING
    IgnorePrimaryObstacle = Yes
    Count                 = 1
  End
  CreateObject
    ObjectNames           = AirdefenseLinkRestarter
    Disposition           = LIKE_EXISTING
    IgnorePrimaryObstacle = Yes
    Count                 = 1
  End
  CreateObject
    ObjectNames           = RussiaVehicleS500CombatMode
    Disposition           = LIKE_EXISTING
    IgnorePrimaryObstacle = Yes
    Count                 = 1
  End
End
