; B-2 sound AudioEvents

AudioEvent PilotSoundEject
  Sounds      = gejecta
  Type        = world shrouded everyone
End

;Played when bomb truck successfully disguises self.

AudioEvent RaptorAfterburner
  Sounds      = vjetafta
  Control     = interrupt random
  Limit       = 2
  VolumeShift = -10
  PitchShift  = -10  10
  Volume      = 100
  Priority    = low
  Type        = world shrouded everyone
End

AudioEvent RaptorAmbientLoop
  Control = loop all random
  Sounds =  US_JET_Ambient
  Attack =  US_JET_Ambient
  Decay =  US_JET_Ambient ;vraplo3a
  PitchShift = -5  5
  VolumeShift = -10
  Volume = 120
  MinRange = 75
  MaxRange = 1000
  Limit = 3
  Priority = critical ;low
  Type = world shrouded everyone
End

