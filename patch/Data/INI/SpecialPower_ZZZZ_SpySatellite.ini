; SPECTER last-wins: original Spy Satellite, 60-second ReloadTime.
; ReloadTime is milliseconds. 60000 = 60 seconds. Packed baseline already
; used this value; this overlay pins it after any later SpecialPower.ini edits.
SpecialPower SpecialPowerSpySatellite
  Enum                    = SPECIAL_SPY_SATELLITE
  ReloadTime              = 60000   ; in milliseconds
  PublicTimer             = No
  RadiusCursorRadius      = 300   ; align with SpySatellitePing ShroudClearingRange
  InitiateAtLocationSound = SpySatellite
  SharedSyncedTimer   = Yes
  ShortcutPower       = Yes
  AcademyClassify     = ACT_SUPERPOWER
End
