; All Japan missiles >= 1000 km (AttackRange >= 1720) so MinimumAttackRange 800 is legal.
; Japan A mass raised to 400 kg (global floor); PD 2000 / SD 100.
; ClipSize=1 AutoReloadsClip=Yes ClipReloadTime=300000 (PR #629).
; Death HACK is a separate path and is not folded into PrimaryDamage.

