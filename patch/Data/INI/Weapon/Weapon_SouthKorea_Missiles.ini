; All South Korea missiles >= 1000 km (AttackRange >= 1720) so MinimumAttackRange 800 is legal.
; Distinct SK balance: not a copy of Japan A-J identities or values.
; ClipSize=1 AutoReloadsClip=Yes ClipReloadTime=300000 (PR #629).
; Death HACK is a separate path and is not folded into PrimaryDamage.

