; Vietnam missiles A-H. Separate file so Weapon.ini / SRBM_ALHIJARAH_HE / HE_9M729_450kg stay frozen.
; Mapping from 9P117 MOTHER: 1000 km -> AttackRange 1720; 400 kg -> PrimaryDamage 2000 + death 2200;
; accuracy 10/100 -> ScatterRadius 175. Properties are independent (not auto-chained).
; MinimumAttackRange stays 800 (engine units). ClipReloadTime 95000 is fire cycle, not build time.

Weapon Weapon_Vietnam_VCM01
  PrimaryDamage               = 5000.0
  PrimaryDamageRadius         = 80.0
  SecondaryDamage             = 250.0
  SecondaryDamageRadius       = 10.0
  ScatterRadius               = 175
  ScatterRadiusVsInfantry     = 280
  AttackRange                 = 860.0
  MinimumAttackRange          = 800.0
  PreAttackDelay              = 500
  PreAttackType               = PER_SHOT
  DamageType                  = ARMOR_PIERCING
  DeathType                   = EXPLODED
  FireFX                      = FX_IskanderFiringEffects
  ProjectileObject            = Projectile_Vietnam_VCM01
  ProjectileDetonationFX      = FX_SmallSRBM_Explosion
  RadiusDamageAffects         = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  FireSound                   = Iskander_Firing
  WeaponSpeed                 = 280
  AcceptableAimDelta          = 360
  DelayBetweenShots           = 3000
  ClipSize                    = 1
  ClipReloadTime              = 95000
  ShockWaveAmount             = 680.0
  ShockWaveRadius             = 150.0
  ShockWaveTaperOff           = 0.33
  AntiGround                  = Yes
End

