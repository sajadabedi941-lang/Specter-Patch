;==============================================================================
; AmericaJetB21_15BombWeapon
; Clone of working B-2 PRIMARY America_Weapon_B2_BunkerBuster
; (ZZZZZZZZ_ZZZZZ_USA_B2_ZZ_Z_DEDICATED_BUNKERBUSTER.ini) — same damage,
; MK-84 gravity bomb, ranges, FX, RTB. Ammo ONLY changed for B-21 payload:
;
;   SAGE: each fireWeapon() consumes 1 ClipSize and spawns ShotsPerBarrel
;   projectiles. Therefore:
;     ClipSize = 3
;     ShotsPerBarrel = 5
;     => TOTAL physical MK-84 bombs per full load = 3 x 5 = EXACTLY 15
;     => bombs per attack fire / pass = EXACTLY 5
;     => attack fires before empty = EXACTLY 3
;
; NOT ClipSize=15 + ShotsPerBarrel=5 (that would be 75 projectiles).
; ProjectileObject = MK-84 (normal B-2 bomb). No guided / BGM-109.
;==============================================================================

Weapon AmericaJetB21_15BombWeapon
  PrimaryDamage           = 12000.0
  PrimaryDamageRadius     = 140.0
  SecondaryDamage         = 1600.0
  SecondaryDamageRadius   = 85.0
  ScatterRadius           = 12.0
  ScatterRadiusVsInfantry = 100.0
  AttackRange             = 520.0
  MinimumAttackRange      = 400.0
  DamageType              = ARMOR_PIERCING
  DeathType               = EXPLODED
  WeaponSpeed             = 9999.0
  ProjectileObject        = MK-84
  FireFX                  = FX_AuroraBombLaunch
  ProjectileDetonationFX  = FX_FreeFallBombsDetonation
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 10
  ShotsPerBarrel          = 5
  ClipSize                = 3
  ClipReloadTime          = 0
  AutoReloadsClip         = RETURN_TO_BASE
  ShowsAmmoPips           = Yes
  ProjectileCollidesWith  = STRUCTURES
  ShockWaveAmount         = 380.0
  ShockWaveRadius         = 200.0
  ShockWaveTaperOff       = 0.30
End
