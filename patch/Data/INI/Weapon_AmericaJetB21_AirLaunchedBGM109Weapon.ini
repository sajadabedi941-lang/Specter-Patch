;==============================================================================
; AmericaJetB21_AirLaunchedBGM109Weapon
; NORMAL aircraft PRIMARY (not SpecialPower / General Power).
; Architecture cloned from working America_Weapon_B2_BunkerBuster.
; Projectile = AmericaJetB21_AirLaunchedBGM109 (US_BGM109 / guided).
;
; SAGE ammo: each fireWeapon() consumes 1 ClipSize and fires 1 projectile.
; ShotsPerBarrel only cycles barrels (default 1). Therefore:
;   ClipSize = 7
;   ShotsPerBarrel = 1
;   => TOTAL physical BGM-109 missiles = EXACTLY 7 (not 49).
; AutoReloadsClip = RETURN_TO_BASE (rearm only at Airfield).
;==============================================================================

Weapon AmericaJetB21_AirLaunchedBGM109Weapon
  PrimaryDamage           = 12000.0
  PrimaryDamageRadius     = 140.0
  SecondaryDamage         = 1600.0
  SecondaryDamageRadius   = 85.0
  ScatterRadius           = 12.0
  ScatterRadiusVsInfantry = 100.0
  AttackRange             = 520.0
  MinimumAttackRange      = 400.0
  DamageType              = ARMOR_PIERCING
  DeathType               = EXPLODED
  WeaponSpeed             = 9999.0
  ProjectileObject        = AmericaJetB21_AirLaunchedBGM109
  FireFX                  = FX_AuroraBombLaunch
  ProjectileDetonationFX  = FX_FreeFallBombsDetonation
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 200
  ShotsPerBarrel          = 1
  ClipSize                = 7
  ClipReloadTime          = 0
  AutoReloadsClip         = RETURN_TO_BASE
  ShowsAmmoPips           = Yes
  ProjectileCollidesWith  = STRUCTURES
  ShockWaveAmount         = 380.0
  ShockWaveRadius         = 200.0
  ShockWaveTaperOff       = 0.30
End
