;==============================================================================
; AmericaJetB21_HeavyGuidedMissileWeapon
; Working B-21 aircraft PRIMARY lineage (USA_B2_Spirit_BunkerBuster fields)
; with ONE-salvo 7-missile payload:
;   ClipSize = 1
;   ShotsPerBarrel = 7
;   => one firing event releases 7 guided missiles, then clip empty / RTB.
; Projectile = AmericaJetB21_HeavyGuidedMissile (US_BGM109 guided AG).
; Not General Power / 8x_BGM109_CruiseMissile logic.
;==============================================================================

Weapon AmericaJetB21_HeavyGuidedMissileWeapon
  PrimaryDamage           = 9000.0
  PrimaryDamageRadius     = 170.0
  SecondaryDamage         = 1100.0
  SecondaryDamageRadius   = 100.0
  ScatterRadius           = 18.0
  ScatterRadiusVsInfantry = 120.0
  AttackRange             = 520.0
  MinimumAttackRange      = 400.0
  DamageType              = ARMOR_PIERCING
  DeathType               = EXPLODED
  WeaponSpeed             = 9999.0
  ProjectileObject        = AmericaJetB21_HeavyGuidedMissile
  FireFX                  = FX_AuroraBombLaunch
  ProjectileDetonationFX  = FX_FreeFallBombsDetonation
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 10
  ShotsPerBarrel          = 7
  ClipSize                = 1
  ClipReloadTime          = 600000
  AutoReloadsClip         = RETURN_TO_BASE
  ShowsAmmoPips           = Yes
  ProjectileCollidesWith  = STRUCTURES
  ShockWaveAmount         = 320.0
  ShockWaveRadius         = 220.0
  ShockWaveTaperOff       = 0.33
End
