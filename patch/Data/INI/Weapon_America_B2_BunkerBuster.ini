;==============================================================================
; America_Weapon_B2_BunkerBuster — working AmericaJetB2 PRIMARY
; SAGE: each fireWeapon() fires exactly 1 physical projectile and consumes 1 ClipSize.
; ShotsPerBarrel only cycles barrels — does NOT multiply projectiles.
;
; Total physical bombs = ClipSize = 10
; DelayBetweenShots sized so ~2 fires fit in the B-2 release window
; (AttackRange 520 - MinimumAttackRange 400) per overflight pass.
; Pattern matches packed multi-pass free-fall weapons (e.g. 6_MK-82).
; AutoReloadsClip = RETURN_TO_BASE (no airborne reload).
;==============================================================================

Weapon America_Weapon_B2_BunkerBuster
  PrimaryDamage           = 12000.0
  PrimaryDamageRadius     = 140.0
  SecondaryDamage         = 1600.0
  SecondaryDamageRadius   = 85.0
  ScatterRadius           = 12.0
  ScatterRadiusVsInfantry = 100.0
  AttackRange             = 520.0
  MinimumAttackRange      = 400.0
  AcceptableAimDelta      = 40
  DamageType              = ARMOR_PIERCING
  DeathType               = EXPLODED
  WeaponSpeed             = 9999.0
  ProjectileObject        = MK-84
  FireFX                  = FX_AuroraBombLaunch
  ProjectileDetonationFX  = FX_FreeFallBombsDetonation
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 380
  ShotsPerBarrel          = 1
  ClipSize                = 10
  ClipReloadTime          = 0
  AutoReloadsClip         = RETURN_TO_BASE
  ShowsAmmoPips           = Yes
  ProjectileCollidesWith  = STRUCTURES
  ShockWaveAmount         = 380.0
  ShockWaveRadius         = 200.0
  ShockWaveTaperOff       = 0.30
End
