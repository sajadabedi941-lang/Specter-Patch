; TEOD B-2 weapons extracted from TEOD Weapon.ini

Weapon B2SmallBombWeapon
  PrimaryDamage           = 1.0            
  PrimaryDamageRadius     = 10.0   
  SecondaryDamage = 1.0
  SecondaryDamageRadius = 40  
  AttackRange             = 275.0       ; this needs to be pretty high, since the Aurora moves so fast
  MinimumAttackRange    = 5
  AcceptableAimDelta      = 30          ; we don't really need to be aimed directly at the target.
  ;ScatterRadius     = 1.0
  DamageType              = AURORA_BOMB
  DeathType               = EXPLODED
  WeaponSpeed             = 99999
  FireFX                      = FX_B2BombDrop
  ProjectileObject        = B2SmallBomb
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 160
  ClipSize                = 7                       ; how many shots in a Clip (0 == infinite)
  ClipReloadTime          = 20000              ; how long to reload a Clip, msec
  AutoReloadsClip         = RETURN_TO_BASE                 ; must return to base to reload this weapon
  ShowsAmmoPips           = Yes
  ProjectileCollidesWith  = STRUCTURES
End

Weapon B2NukeBombWeapon
  PrimaryDamage           = 1.0            
  PrimaryDamageRadius     = 15.0   
  SecondaryDamage = 59
  SecondaryDamageRadius = 30  
  AttackRange             = 330.0       ; this needs to be pretty high. since the Aurora moves so fast
  MinimumAttackRange    = 5
 AcceptableAimDelta      = 100          ; we don't really need to be aimed directly at the target.
  ;ScatterRadius     = 70.0
  DamageType              = JET_MISSILES
  DeathType               = EXPLODED
  WeaponSpeed             = 99999
  FireFX                      = FX_B2BombDrop
  ProjectileObject        = B2Bomb
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 200
  ClipSize                = 1                       ; how many shots in a Clip (0 == infinite)
  ClipReloadTime          = 30000
  AutoReloadsClip         = RETURN_TO_BASE                 ; must return to base to reload this weapon
  ShowsAmmoPips           = Yes

  ; note. these only apply to units that aren't the explicit target 
  ; (ie. units that just happen to "get in the way"... projectiles
  ; always collide with the Designated Target. regardless of these flags
  ProjectileCollidesWith  = STRUCTURES
End

