;==============================================================================
; FINAL: America_AdvancedAirBase production CommandSet (last-wins)
; Load order: ZZZZZZZZ_ sorts after CommandSet_ZZZZ_* / other CommandSet files.
; Loose Data INI last-wins overlay. Does not rebuild BIG files.
; Controls America_AdvancedAirBase (Advanced Airfield). B-2 spawn Object kept.
; Normal AmericaAirfieldCommandSet is NOT overridden here (stock airfield unchanged).
; Six aircraft only — existing objects, no new aircraft defs.
;==============================================================================

; --- CommandButton: AAB B-2 production target (PR242/252 spawn chain) ---
CommandButton Command_ConstructPatch_America_B2
  Command       = UNIT_BUILD
  Object        = Patch_America_B2
  TextLabel     = CONTROLBAR:ConstructAmericaJetB2Spirit
  ButtonImage   = us_b1r
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipUSABuildB2Spirit
End

; --- C-5 slot: no Patch_America_C5 object in patch; link existing Patch_America_C17 ---
CommandButton Command_ConstructPatch_America_C5
  Command       = UNIT_BUILD
  Object        = Patch_America_C17
  TextLabel     = CONTROLBAR:ConstructPatch_America_C17
  ButtonImage   = us_airfield
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipConstructPatch_America_C17
End

; --- Advanced Airfield production: exactly 6 existing aircraft ---
CommandSet America_AdvancedAirBaseCommandSet
  1  = Command_ConstructPatch_America_B52
  2  = Command_ConstructPatch_America_C5
  3  = Command_ConstructPatch_America_B2
  4  = Command_ConstructPatch_America_B21
  5  = Command_ConstructAmericaJetStealthFighter
  6  = Command_ConstructPatch_America_E3
  13 = Command_SetRallyPoint
  14 = Command_Sell
End
