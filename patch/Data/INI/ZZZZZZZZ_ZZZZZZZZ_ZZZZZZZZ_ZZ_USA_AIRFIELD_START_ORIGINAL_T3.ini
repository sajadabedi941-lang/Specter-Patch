; =============================================================================
; PROVEN FIX - AmericaAirfield_T ("Air Field" + player name) starts on original T3
;
; Proof (PR #285 baseline):
;   DisplayName OBJECT:Airfield => "Air Field" (UI: "AirField <Player>")
;   Dozer AmericaDozerCommandSet slot 13
;     -> Command_ConstructAmericaAirfield_T
;       -> Object AmericaAirfield_T
;         -> stock CommandSet AmericaAirfieldCommandSet_T  (6-button menu)
;         -> CommandSetUpgrade Upgrade_US_Tier1/2/3 -> _T1/_T2/_T3
;
; Matched in-game 6-button roster = AmericaAirfieldCommandSet_T in CommandSet.ini
;   AH64E, B-2 Spirit, F-16CM Block50/52, B-52H (us_b52gbu43), Countermeasures, E-3
;
; Minimal change: bind THIS object to original AmericaAirfieldCommandSet_T3 and
; restore that CommandSet's original final slots (undo prior experiment rewrites).
; Does NOT invent a new CommandSet name. Does NOT edit CommandSet.ini.
; Does NOT touch B-2/B-52H/B-21 model/Draw/weapon, Strategy Center, AI, other factions.
; =============================================================================

; Restore ORIGINAL fully-upgraded final roster from CommandSet.ini
CommandSet AmericaAirfieldCommandSet_T3
  1 = Command_ConstructAmericaJetRaptor
  2 = Command_ConstructAmericaHelicopterAH64E
  3 = Command_ConstructAmericaJetAurora
  4 = Command_ConstructAmericaJetA10C
  5 = Command_ConstructAmericaJetB2Spirit
  6 = Command_ConstructAmericaJetF-16C_AG
  7 = Command_ConstructAmericaJetB52H
  8 = Command_ConstructAmericaJetF-22A_AA
  9 = Command_UpgradeAmericaCountermeasures
 10 = Command_ConstructAmericaJetF35C
 11 = Command_ConstructAmericaJetEA18
 12 = Command_ConstructAmericaJetE3AWACS
 13 = Command_ConstructAmericaJetB1R
 14 = Command_Upgrade_NuclearTipWarhead2
 15 = Command_Sell
End

; Bind the proven runtime object; bypass Tier1/2/3 progression.
Object AmericaAirfield_T
  CommandSet = AmericaAirfieldCommandSet_T3
  Behavior = CommandSetUpgrade ModuleTag_Tier1
    TriggeredBy = Upgrade_US_Tier1
    CommandSet  = AmericaAirfieldCommandSet_T3
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier2
    TriggeredBy = Upgrade_US_Tier2
    CommandSet  = AmericaAirfieldCommandSet_T3
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier3
    TriggeredBy = Upgrade_US_Tier3
    CommandSet  = AmericaAirfieldCommandSet_T3
  End
End
