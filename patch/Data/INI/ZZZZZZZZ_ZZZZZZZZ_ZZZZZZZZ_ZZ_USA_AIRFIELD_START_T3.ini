; =============================================================================
; ABSOLUTE LAST-WINS - USA Airfield starts on original final Tier3 CommandSet.
; Baseline: PR #285 only. Does NOT include PR #286 / #287 / #288.
;
; PROBLEM:
;   Last-wins AmericaAirfield_T still starts on AmericaAirfieldCommandSet_T
;   (ZZ_ZZ_AIRFIELD_RUNTIME_ROSTER). Tier grant approaches did not fix in-game.
;
; FIX (proven FINAL_CS style - no new CommandSet, no roster rewrite):
;   1) CommandSet = AmericaAirfieldCommandSet_T3  (final upgraded roster)
;   2) Retarget ModuleTag_Tier1/2/3 CommandSetUpgrade ALL to _T3
;      so the Airfield can never fall back to _T / _T1 / _T2
;   3) Do NOT use the never-granted roster-lock upgrade on AmericaAirfield_T
;
; Does NOT modify CommandSet.ini, aircraft Objects/Draw/weapons/costs,
; Strategy Center, or other factions.
; =============================================================================

Object AmericaAirfield_T
  CommandSet = AmericaAirfieldCommandSet_T3
  Behavior = CommandSetUpgrade ModuleTag_Tier1
    TriggeredBy = Upgrade_US_Tier1
    CommandSet  = AmericaAirfieldCommandSet_T3
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier2
    TriggeredBy = Upgrade_US_Tier2
    CommandSet  = AmericaAirfieldCommandSet_T3
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier3
    TriggeredBy = Upgrade_US_Tier3
    CommandSet  = AmericaAirfieldCommandSet_T3
  End
End
