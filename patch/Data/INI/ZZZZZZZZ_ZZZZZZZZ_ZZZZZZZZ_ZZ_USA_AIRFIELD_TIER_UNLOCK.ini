; =============================================================================
; ABSOLUTE LAST-WINS - USA Airfield original Tier upgrade chain unlock.
; Baseline: PR #285. Does NOT use PR #286 / #287.
;
; ORIGINAL Specter chain (Airfield_T.ini):
;   Base CommandSet = AmericaAirfieldCommandSet_T
;   Upgrade_US_Tier1 -> AmericaAirfieldCommandSet_T1
;   Upgrade_US_Tier2 -> AmericaAirfieldCommandSet_T2
;   Upgrade_US_Tier3 -> AmericaAirfieldCommandSet_T3  (FINAL)
;
; Scope: Upgrade_US_Tier1/2/3 are PLAYER-WIDE
;   (CommandButton Command_US_Tier* uses Command = PLAYER_UPGRADE).
;
; Proven grant syntax (same as Z_USA_AIRFIELD_FINAL_CS):
;   Object AmericaCommandCenter
;     Behavior = GrantUpgradeCreate ...
;       UpgradeToGrant = Upgrade_US_TierN
;
; Why prior packs stayed on the small base roster:
;   ZZ_ZZ_AIRFIELD_RUNTIME_ROSTER retargeted CommandSetUpgrade TriggeredBy to
;   Upgrade_USA_AirfieldRosterLocked (never granted), so Tier grants could not
;   advance AmericaAirfield_T to AmericaAirfieldCommandSet_T3.
;
; This file:
;   1) Restores original CommandSetUpgrade TriggeredBy / CommandSet targets
;   2) Reaffirms ONLY Upgrade_US_Tier1/2/3 on AmericaCommandCenter
; Does NOT rewrite Airfield CommandSet slot contents.
; Does NOT create new CommandSet names.
; Does NOT touch Strategy Center / aircraft Objects / CommandSet.ini.
; =============================================================================

; --- Restore original AmericaAirfield_T upgrade chain ---
Object AmericaAirfield_T
  CommandSet = AmericaAirfieldCommandSet_T
  Behavior = CommandSetUpgrade ModuleTag_Tier1
    TriggeredBy = Upgrade_US_Tier1
    CommandSet  = AmericaAirfieldCommandSet_T1
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier2
    TriggeredBy = Upgrade_US_Tier2
    CommandSet  = AmericaAirfieldCommandSet_T2
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier3
    TriggeredBy = Upgrade_US_Tier3
    CommandSet  = AmericaAirfieldCommandSet_T3
  End
End

; --- Auto-grant ONLY the three Airfield roster PLAYER upgrades at match start ---
Object AmericaCommandCenter
  Behavior = GrantUpgradeCreate ModuleTag_USAAirfieldTier_T1
    UpgradeToGrant = Upgrade_US_Tier1
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirfieldTier_T2
    UpgradeToGrant = Upgrade_US_Tier2
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirfieldTier_T3
    UpgradeToGrant = Upgrade_US_Tier3
  End
End
