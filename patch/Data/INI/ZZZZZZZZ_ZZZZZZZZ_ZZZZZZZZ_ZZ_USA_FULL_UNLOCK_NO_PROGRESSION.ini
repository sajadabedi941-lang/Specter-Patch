; =============================================================================
; ABSOLUTE LAST-WINS - USA full unlock by removing upgrade PROGRESSION.
; Baseline: PR #285 only. No later FINAL14 / SC-build / tier-grant PRs.
;
; TRACED USA UNLOCK LOCKS (PR #285 pack):
;   AmericaAirfield_T  (Airfield_T.ini):
;     AmericaAirfieldCommandSet_T
;       + Upgrade_US_Tier1 -> AmericaAirfieldCommandSet_T1
;       + Upgrade_US_Tier2 -> AmericaAirfieldCommandSet_T2
;       + Upgrade_US_Tier3 -> AmericaAirfieldCommandSet_T3   (FINAL)
;     RUNTIME_ROSTER last-wins wrongly kept base = _T and used a
;     never-granted roster-lock token on CommandSetUpgrade.
;
;   AmericaWarFactory_T (Warfactory.ini):
;     AmericaWarFactoryCommandSet_T
;       + Upgrade_US_Tier1 -> AmericaWarFactoryCommandSet_T1
;       + Upgrade_US_Tier2 -> AmericaWarFactoryCommandSet_T2
;       + Upgrade_US_Tier3 -> AmericaWarFactoryCommandSet_T3  (FINAL)
;
;   No RequiredUpgrade on USA ConstructAmerica* aircraft/unit buttons
;   (visibility is CommandSet-tier based only).
;
;   Command_US_Tier* purchase buttons live on Strategy Center CommandSets;
;   effective AmericaStrategyCenter*_T already uses PatchAAB sets without
;   those Tier purchase buttons. Strategy Center Object/model NOT modified.
;
; FIX (do NOT simulate purchases):
;   Set DEFAULT CommandSet to each building's ORIGINAL FINAL upgraded set.
;   Retarget ModuleTag_Tier* CommandSetUpgrade to that same FINAL set so
;   the building can never fall back to an earlier tier.
;   Do NOT use the never-granted roster-lock token on AmericaAirfield_T.
;
; Does NOT rewrite CommandSet slot maps / CommandSet.ini.
; Does NOT create new CommandSet names.
; Does NOT touch B-2 / B-52H / B-21 Objects, Strategy Center, other factions.
; =============================================================================

; --- USA Airfield: start at original final Tier3 CommandSet ---
Object AmericaAirfield_T
  CommandSet = AmericaAirfieldCommandSet_T3
  Behavior = CommandSetUpgrade ModuleTag_Tier1
    TriggeredBy = Upgrade_US_Tier1
    CommandSet  = AmericaAirfieldCommandSet_T3
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier2
    TriggeredBy = Upgrade_US_Tier2
    CommandSet  = AmericaAirfieldCommandSet_T3
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier3
    TriggeredBy = Upgrade_US_Tier3
    CommandSet  = AmericaAirfieldCommandSet_T3
  End
End

Object AmericaAirfield
  CommandSet = AmericaAirfieldCommandSet_T3
End

; --- USA War Factory: start at original final Tier3 CommandSet ---
Object AmericaWarFactory_T
  CommandSet = AmericaWarFactoryCommandSet_T3
  Behavior = CommandSetUpgrade ModuleTag_Tier1
    TriggeredBy = Upgrade_US_Tier1
    CommandSet  = AmericaWarFactoryCommandSet_T3
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier2
    TriggeredBy = Upgrade_US_Tier2
    CommandSet  = AmericaWarFactoryCommandSet_T3
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier3
    TriggeredBy = Upgrade_US_Tier3
    CommandSet  = AmericaWarFactoryCommandSet_T3
  End
End
