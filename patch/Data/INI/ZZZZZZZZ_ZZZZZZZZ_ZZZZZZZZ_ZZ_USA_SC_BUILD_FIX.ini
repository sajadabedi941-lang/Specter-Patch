; =============================================================================
; ABSOLUTE LAST-WINS - USA Strategy Center dozer build button unlock.
;
; ROOT CAUSE (grey / disabled button):
;   AmericaDozerCommandSet slot 2 = Command_ConstructAmericaStrategyCenter_T
;   -> Object AmericaStrategyCenter_T
;   -> Prerequisites in StrategyCenter.ini:
;        Object = AmericaWarFactory_T          (line 44)
;        Object = AmericaRadarStation         (line 45)  <--- disables button
;   AmericaRadarStation also requires AmericaAirfield / AmericaAirfield_T
;   (Buildings/AN_FPS117.ini line 28), so SC stays grey until Airfield+Radar+WF.
;
; FIX (Strategy Center only; does NOT touch Airfield / aircraft / CommandSet.ini):
;   1) Force construct buttons to Object = AmericaStrategyCenter
;   2) Restore AmericaStrategyCenter Prerequisites to original Specter
;      (commented Object lines = no active object locks)
;   3) Restore original AmericaStrategyCenter CommandSet
;   No RequiredScience / RequiredUpgrade / Rank on construct buttons.
; =============================================================================

CommandButton Command_ConstructAmericaStrategyCenter
  Command       = DOZER_CONSTRUCT
  Object        = AmericaStrategyCenter
  TextLabel     = CONTROLBAR:ConstructAmericaStrategyCenter
  ButtonImage   = us_stratcenter
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipUSABuildStrategyCenter
End

CommandButton Command_ConstructAmericaStrategyCenter_T
  Command       = DOZER_CONSTRUCT
  Object        = AmericaStrategyCenter
  TextLabel     = CONTROLBAR:ConstructAmericaStrategyCenter
  ButtonImage   = us_stratcenter
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipUSABuildStrategyCenter
End

; Original Specter AmericaStrategyCenter build conditions (StrategyCenter_AI.ini)
Object AmericaStrategyCenter
  Prerequisites
    ;Object = AmericaWarFactory AmericaAirfield
    ;Object = AmericaRadarStation
  End
  CommandSet = AmericaStrategyCenterCommandSet
End
