;==============================================================================
; AmericaJetB2 FINAL — cost / stealth / 2-bombs-per-pass payload
; Last-wins after prior ZZZZZZZZ_ZZZZZ_USA_B2_* gameplay twins.
;
; - BuildCost = 10000
; - StealthUpdate + RadarPriority LOCAL_UNIT_ONLY (proven B-2 stealth)
; - PRIMARY = America_Weapon_B2_BunkerBuster (exact working weapon name)
; - ClipSize 10 / DelayBetweenShots 380 / ShotsPerBarrel 1
;   => 10 physical MK-84, ~2 per attack pass, RETURN_TO_BASE rearm
;
; Does NOT modify: Draw/Model, JetAIUpdate, CommandSet, Locomotor,
; Airfield CommandSet roster, B-21, B-52H.
;==============================================================================

Object AmericaJetB2
  BuildCost = 10000
  BuildTime = 30.0
  RadarPriority = LOCAL_UNIT_ONLY

  WeaponSet
    Conditions = None
    Weapon = PRIMARY America_Weapon_B2_BunkerBuster
  End

  Behavior = StealthUpdate ModuleTag_Stealth
    StealthDelay                          = 0
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
End

Weapon America_Weapon_B2_BunkerBuster
  PrimaryDamage           = 12000.0
  PrimaryDamageRadius     = 140.0
  SecondaryDamage         = 1600.0
  SecondaryDamageRadius   = 85.0
  ScatterRadius           = 12.0
  ScatterRadiusVsInfantry = 100.0
  AttackRange             = 520.0
  MinimumAttackRange      = 400.0
  AcceptableAimDelta      = 40
  DamageType              = ARMOR_PIERCING
  DeathType               = EXPLODED
  WeaponSpeed             = 9999.0
  ProjectileObject        = MK-84
  FireFX                  = FX_AuroraBombLaunch
  ProjectileDetonationFX  = FX_FreeFallBombsDetonation
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 380
  ShotsPerBarrel          = 1
  ClipSize                = 10
  ClipReloadTime          = 0
  AutoReloadsClip         = RETURN_TO_BASE
  ShowsAmmoPips           = Yes
  ProjectileCollidesWith  = STRUCTURES
  ShockWaveAmount         = 380.0
  ShockWaveRadius         = 200.0
  ShockWaveTaperOff       = 0.30
End
