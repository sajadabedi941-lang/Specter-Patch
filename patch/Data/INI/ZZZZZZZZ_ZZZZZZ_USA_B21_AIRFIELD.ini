;;==============================================================================
; Absolute last-wins — AmericaJetB21 (B-21 Raider) USA Airfield production
; Sorts after B-52 / Airfield test-unlock last-wins files.
;
; Proven clone method (B-2 / B-52 style):
;   AmericaJetB1R pipeline -> AmericaJetB21
;   Draw fallback US_B1R / us_b1r (no dedicated B-21 art in ART BIG)
;   Weapon placeholder America_Weapon_B21_JASSM
;   Isolated Command_ConstructAmericaJetB21
;
; Slot 11 only (replaced EA-18 airfield button):
;   was: Command_ConstructAmericaJetEA18
;   now: Command_ConstructAmericaJetB21
;
; Does NOT modify B-2 (slot 5), B-52 slots, upgrades, Sell, or other aircraft.
; No Strategy Center / TEOD / Science / Rank gates.
; CVN EA-18 production untouched.
;==============================================================================

Object AmericaJetB21
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
End

CommandButton Command_ConstructAmericaJetB21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = us_b1r
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

CommandButton Command_ConstructPatch_America_B21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = us_b1r
  ButtonBorderType = BUILD
