; =============================================================================
; Empty USA General Star panel completely (powers removed).
; Absolute last-wins twin (case-sensitive pair with ZZZZ_USA_ZZZZ_ZZZZZ_Z_...).
;
; Clears SCIENCE_AMERICA Rank1/3/8 star UI and USA general-power shortcuts.
; Does NOT modify: Strategy Center, Airfield, aircraft Objects, aircraft
; CommandButtons, Weapon, Cost, Limit, AI, Units.
; =============================================================================

; 1-Star / 3-Star / 5-Star (Rank8) panels — no entries
CommandSet SCIENCE_AMERICA_CommandSetRank1
End

CommandSet SCIENCE_AMERICA_CommandSetRank3
End

CommandSet SCIENCE_AMERICA_CommandSetRank8
End

; No General Power icons on shortcut / power palette
CommandSet SpecialPowerShortcutUSA
End

CommandSet AmericaSpecialPowerCommandSet
End
