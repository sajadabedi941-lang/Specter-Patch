; =============================================================================
; USA fully unlocked — no upgrade progression.
; Absolute last-wins twin: auto-grant all USA research upgrades at CommandCenter create;
; strip USA PLAYER_UPGRADE purchase buttons from building CommandSets.
;
; Does NOT modify: aircraft Objects/Weapon/Draw, Airfield production slots
; (only clears upgrade-button slots), costs, limits, AI, locomotors,
; other factions, General Star (already empty), Strategy Center building object.
; =============================================================================

; --- Force research-relevant OBJECT upgrades to PLAYER so CC can grant ---
Upgrade Upgrade_AADS_AA_Mode
  Type = PLAYER
End

Upgrade Upgrade_AADS_ABM_Mode
  Type = PLAYER
End

Upgrade Upgrade_AGM154C
  Type = PLAYER
End

Upgrade Upgrade_AIM-120C
  Type = PLAYER
End

Upgrade Upgrade_AmericaAdvancedControlRods
  Type = PLAYER
End

Upgrade Upgrade_AmericaRadar
  Type = PLAYER
End

Upgrade Upgrade_NuclearTipWarhead
  Type = PLAYER
End

; --- Silent grant at game start (AmericaCommandCenter always present) ---
