; =============================================================================
; ABSOLUTE LAST-WINS — real USA Airfield runtime production chain.
;
; Traced runtime path (do NOT assume T3):
;   AmericaDozerCommandSet slot 13
;     -> Command_ConstructAmericaAirfield_T
;       -> Object AmericaAirfield_T
;         -> CommandSet AmericaAirfieldCommandSet_T   (B2_RUNTIME binding)
;         -> CommandSetUpgrade Tier1/2/3 -> _T1/_T2/_T3
;
; ZH CommandSet slot overrides MERGE: omitting a slot does NOT clear it.
; Slot 9/14 MUST be assigned Command_FAKECOMMAND_PurchaseScienceMOAB
; (SCRIPT_ONLY) to remove Countermeasures / NuclearTip upgrade buttons.
;
; Sorts after ZZZZZZZZ_ZZZZ_USA_AIRFIELD_B2_RUNTIME.ini and STATIC twins.
; Does NOT create a new parallel CommandSet name.
; Does NOT modify aircraft Draw/Weapon/Cost/Limit/AI/Locomotor.
; Does NOT modify Strategy Center.
; =============================================================================

; Dummy upgrade — never granted — disables CommandSetUpgrade transitions.
Upgrade Upgrade_USA_AirfieldRosterLocked
  Type = PLAYER
  BuildTime = 99999
  BuildCost = 999999
  ButtonImage = None
End

; Ensure B21 production button exists for slot 11 (Object AmericaJetB21 unchanged).
CommandButton Command_ConstructAmericaJetB21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = us_b1r
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

; --- Bind runtime Airfield objects to the fixed sets (no tier gate) ---
Object AmericaAirfield_T
  CommandSet = AmericaAirfieldCommandSet_T
  Behavior = CommandSetUpgrade ModuleTag_Tier1
    TriggeredBy = Upgrade_USA_AirfieldRosterLocked
    CommandSet  = AmericaAirfieldCommandSet_T
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier2
    TriggeredBy = Upgrade_USA_AirfieldRosterLocked
    CommandSet  = AmericaAirfieldCommandSet_T
  End
  Behavior = CommandSetUpgrade ModuleTag_Tier3
    TriggeredBy = Upgrade_USA_AirfieldRosterLocked
    CommandSet  = AmericaAirfieldCommandSet_T
  End
End

Object AmericaAirfield
  CommandSet = AmericaAirfieldCommandSet_T
End

; --- Exact CommandSets used by AmericaAirfield_T (all identical final roster) ---
; Slots 9 + 14 cleared via SCRIPT_ONLY fake (merge-safe).

