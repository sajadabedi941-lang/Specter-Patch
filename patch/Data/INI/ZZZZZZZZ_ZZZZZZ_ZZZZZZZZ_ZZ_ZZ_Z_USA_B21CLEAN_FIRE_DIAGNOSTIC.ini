;==============================================================================
; HARD FIRE DIAGNOSTIC — last-wins for AmericaJetB21Clean fire path
;
; ROOT CAUSE (packed AmericaAirfieldCommandSet):
;   Slot 10 = Command_ConstructAmericaJetB21 -> AmericaJetB21
;             PRIMARY America_Weapon_B21_JASSM (ClipReloadTime=200000)
;             => Command_FireMainWeapon greys (engine ClipReloadTime!=0 gate)
;   Slot 11 = Command_ConstructAmericaJetE3AWACS -> AmericaJetB21Clean
;
; Both buttons use TextLabel CONTROLBAR:ConstructAmericaJetB21.
; In-game "B-21" builds were hitting AmericaJetB21 (JASSM), NOT Clean.
;
; FIX (does NOT edit Airfield CommandSet roster slots):
;   1) Redirect ConstructAmericaJetB21 / Patch_America_B21 -> AmericaJetB21Clean
;   2) Force Clean PRIMARY = America_Weapon_B2_BunkerBuster (working B-2 weapon)
;==============================================================================

; --- Redirect airfield B-21 build buttons to AmericaJetB21Clean (not legacy AmericaJetB21) ---
CommandButton Command_ConstructAmericaJetB21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21Clean
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = B21_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

CommandButton Command_ConstructPatch_America_B21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21Clean
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = B21_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

; Keep E3 alias on Clean (same as HeavyAircraft unlock final)
CommandButton Command_ConstructAmericaJetE3AWACS
  Command       = UNIT_BUILD
  Object        = AmericaJetB21Clean
  TextLabel     = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage   = B21_L
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipAmericaJetB21
End

; --- Force effective Clean fire path = working B-2 weapon (ClipReloadTime=0) ---
Object AmericaJetB21Clean
  CommandSet = GenericTacticalBomberCommandSet

  WeaponSet
    Conditions = None
    Weapon = PRIMARY America_Weapon_B2_BunkerBuster
  End

  RadarPriority = LOCAL_UNIT_ONLY

  Behavior = StealthUpdate ModuleTag_Stealth
    StealthDelay                          = 0
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
End
