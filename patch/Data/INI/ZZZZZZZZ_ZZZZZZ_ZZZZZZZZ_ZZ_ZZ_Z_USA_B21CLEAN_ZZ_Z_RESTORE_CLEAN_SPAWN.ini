;==============================================================================
; Last-wins: B-21 airfield spawn = AmericaJetB21Clean
; + force F-16C_AG auto-attack control architecture + 1x BGM-109 PRIMARY
;
; Donor: AmericaJetF-16C_AG / F16C_AG_CommandSet / F100_PW_229 / JetAIUpdate
; Sorts AFTER prior B21CLEAN override INIs under lowercase load order.
;==============================================================================

CommandButton Command_ConstructAmericaJetB21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21Clean
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = B21_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

CommandButton Command_ConstructPatch_America_B21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21Clean
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = B21_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

CommandButton Command_ConstructAmericaJetE3AWACS
  Command       = UNIT_BUILD
  Object        = AmericaJetB21Clean
  TextLabel     = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage   = B21_L
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipAmericaJetB21
End

; Force donor attack architecture on Clean (partial last-wins)
Object AmericaJetB21Clean
  CommandSet = F16C_AG_CommandSet
  VisionRange = 700.0
  ShroudClearingRange = 200

  WeaponSet
    Conditions = None
    Weapon = PRIMARY AmericaJetB21_AirLaunchedBGM109Weapon
  End

  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT

  Behavior = JetAIUpdate ModuleTag_09
    OutOfAmmoDamagePerSecond  = 10%
    TakeoffDistForMaxLift     = 0%
    TakeoffPause              = 500
    MinHeight                 = 5
    ParkingOffset             = 3
    ReturnToBaseIdleTime      = 10000
  End
  Locomotor = SET_NORMAL F100_PW_229
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor
End
