;==============================================================================
; Restore B-21 Airfield construct buttons to AmericaJetB21Clean
; (undo CONTROL TEST-A which temporarily spawned AmericaJetB2).
; Airfield CommandSet slot list unchanged.
; Sorts AFTER ..._ZZ_TEST_A_SPAWN_B2.ini under lowercase load order.
;==============================================================================

CommandButton Command_ConstructAmericaJetB21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21Clean
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = B21_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

CommandButton Command_ConstructPatch_America_B21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21Clean
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = B21_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

CommandButton Command_ConstructAmericaJetE3AWACS
  Command       = UNIT_BUILD
  Object        = AmericaJetB21Clean
  TextLabel     = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage   = B21_L
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipAmericaJetB21
End

; Force Clean PRIMARY = air-launched BGM-109 aircraft weapon (last-wins)
Object AmericaJetB21Clean
  WeaponSet
    Conditions = None
    Weapon = PRIMARY AmericaJetB21_AirLaunchedBGM109Weapon
  End
End
