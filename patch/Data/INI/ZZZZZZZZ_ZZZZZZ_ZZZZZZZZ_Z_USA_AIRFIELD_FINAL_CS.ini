; =============================================================================
; USA Airfield FINAL CommandSet from game start (fix PR #277).
; Absolute last-wins twin — sorts after FULL_UNLOCK / B2_RUNTIME.
;
; FINDINGS:
;   AmericaAirfield_T base CommandSet = AmericaAirfieldCommandSet_T
;   CommandSetUpgrade Tier1 TriggeredBy Upgrade_US_Tier1 -> AmericaAirfieldCommandSet_T1
;   CommandSetUpgrade Tier2 TriggeredBy Upgrade_US_Tier2 -> AmericaAirfieldCommandSet_T2
;   CommandSetUpgrade Tier3 TriggeredBy Upgrade_US_Tier3 -> AmericaAirfieldCommandSet_T3  (FINAL)
;   Dozer builds AmericaAirfield_T (primary).
;   B2_RUNTIME overlay had reset CommandSet back to _T (pre-tier).
;
; FIX:
;   Force AmericaAirfield_T CommandSet = AmericaAirfieldCommandSet_T3
;   Retarget all Tier CommandSetUpgrades to T3 (no downgrade if tiers grant).
;   Restore FINAL_ROSTER aircraft buttons (B2Spirit/B52H/B21); no upgrade purchase slots.
;   Also force WarFactory_T / StrategyCenter_T final tier CommandSets.
;
; Does NOT modify aircraft Objects/Weapon/Draw/Cost/AI/Locomotor or other factions.
; =============================================================================

