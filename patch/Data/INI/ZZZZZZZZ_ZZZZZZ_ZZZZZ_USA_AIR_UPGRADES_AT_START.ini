; =============================================================================
; USA aircraft upgrades active from game start (upgrade-only).
; Absolute last-wins twin (case-sensitive pair with ZZZZ_USA_ZZZZ_ZZZZ_...).
;
; Grants PLAYER upgrades via AmericaCommandCenter GrantUpgradeCreate
; (same pattern as Upgrade_ICBM_BoosterKiller).
;
; Does NOT modify: Airfield CommandSets, Slots, CommandButtons, Object names,
; Weapon, Draw, Cost, Limit, AI, Locomotor, or aircraft stats.
; =============================================================================

; OBJECT-scoped air upgrades -> PLAYER so CC can grant them globally.
Upgrade Upgrade_AGM154C
  Type = PLAYER
End

Upgrade Upgrade_AADS_AA_Mode
  Type = PLAYER
End

Upgrade Upgrade_AADS_ABM_Mode
  Type = PLAYER
End

Object AmericaCommandCenter
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_Countermeasures
    UpgradeToGrant = Upgrade_AmericaCountermeasures
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_NuclearTip2
    UpgradeToGrant = Upgrade_NuclearTipWarhead2
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_MTS
    UpgradeToGrant = Upgrade_MTS
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_AdvTraining
    UpgradeToGrant = Upgrade_AmericaAdvancedTraining
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_BunkerBusters
    UpgradeToGrant = Upgrade_AmericaBunkerBusters
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_LaserMissiles
    UpgradeToGrant = Upgrade_AmericaLaserMissiles
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_ComanchePods
    UpgradeToGrant = Upgrade_ComancheRocketPods
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_AIM9X
    UpgradeToGrant = Upgrade_AIM-9X
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_AIM120D
    UpgradeToGrant = Upgrade_AIM-120D
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_F15EX
    UpgradeToGrant = Upgrade_F15EX
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_Chaff
    UpgradeToGrant = Upgrade_ChaffUpgrade
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_AGM154C
    UpgradeToGrant = Upgrade_AGM154C
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_AADS_AA
    UpgradeToGrant = Upgrade_AADS_AA_Mode
  End
  Behavior = GrantUpgradeCreate ModuleTag_USAAirUpg_AADS_ABM
    UpgradeToGrant = Upgrade_AADS_ABM_Mode
  End
End
