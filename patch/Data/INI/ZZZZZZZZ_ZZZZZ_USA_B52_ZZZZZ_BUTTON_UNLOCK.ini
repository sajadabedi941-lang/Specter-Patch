; Sorts after ZZZZZZZZ_ZZZZZ_USA_B2_*. Clears sticky StrategyCenter locks.
; Forces all USA Airfield B-52 slots to Command_ConstructAmericaJetB52H.
;
; Does NOT touch Draw / Model / Weapon / Cost / Limit / AI / Locomotor / B-2.
;==============================================================================

Object AmericaJetB52H
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
  BuildCost = 8500
  MaxSimultaneousOfType = 3
End

