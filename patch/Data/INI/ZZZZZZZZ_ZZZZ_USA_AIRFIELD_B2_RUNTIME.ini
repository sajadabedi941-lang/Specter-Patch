;==============================================================================
; RUNTIME FORCE - absolute last-wins among ALL Data/INI
; Sorts after ZZZZZZZZ_ZZZ_USA_B2_FORCE_UNLOCK.ini
;
; Traced runtime path:
;   AmericaDozerCommandSet slot 13
;     -> Command_ConstructAmericaAirfield_T
;       -> Object AmericaAirfield_T
;         -> CS AmericaAirfieldCommandSet_T
;         -> CommandSetUpgrade -> _T1 / _T2 / _T3
;
; This file FORCE-REPLACES every USA Airfield CommandSet and rebinds
; the Airfield objects to those sets. Slot 5 is ONLY:
;   Command_ConstructTEODAmericaJetB2 -> AmericaJetB2
;
; No Spirit / B1R / Patch_America_B2 on slot 5.
; No RequiredScience / Options / SpecialPower on B-2 buttons.
; AmericaJetB2 uses Ignore_Prerequisites (empty Prerequisites cannot
; always clear prior ObjectRequired merges in ZH).
; Does NOT touch AVB3bmbr Draw / weapon / AI / locomotor models.
;==============================================================================

; --- Runtime Airfield object CommandSet rebind ---
Object AmericaAirfield
  CommandSet = AmericaAirfieldCommandSet
End

Object AmericaAirfield_T
  CommandSet = AmericaAirfieldCommandSet_T
End

; --- Production object: ignore any leftover Science/Prereq/Rank gates ---
Object AmericaJetB2
  Buildable = Ignore_Prerequisites
  BuildCost = 2500
  BuildTime = 30.0
  MaxSimultaneousOfType = 4
  Prerequisites
  End
End

Object AmericaJetB2Spirit
  Buildable = Ignore_Prerequisites
  BuildCost = 2500
  BuildTime = 30.0
  MaxSimultaneousOfType = 4
  Prerequisites
  End
End

; --- Slot 5 button: direct UNIT_BUILD, no Science/Upgrade/Rank/Options ---
CommandButton Command_ConstructTEODAmericaJetB2
  Command          = UNIT_BUILD
  Object           = AmericaJetB2
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB2
  ButtonImage      = B2-ic_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB2
End

; Redirect every legacy slot-5 alias away from Spirit/B1R
