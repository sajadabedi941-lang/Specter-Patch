;==============================================================================
; AmericaJetB2 gameplay balance — last-wins among ZZZZZZZZ_ZZZZ_* Data/INI
; (FORCE_UNLOCK ZZZZZZZZ_ZZZ_* may still override cost/limit; kept in sync.)
;
; Balance:
;   BuildCost = 10000
;   MaxSimultaneousOfType = 3
;   ClipSize = 10
;   ClipReloadTime = 300000 / AutoReloadsClip = Yes
;   Fully stealth (InnateStealth, no FIRING uncloak)
;   ReturnToBaseIdleTime kept (normal RTB)
;
; Does NOT touch Draw / AVB3bmbr / Scale / Attachments / Airfield path /
; CommandSet structure / Weapon damage / Locomotor.
;==============================================================================

Weapon USA_B2_Spirit_BunkerBuster
  PrimaryDamage           = 9000.0
  PrimaryDamageRadius     = 170.0
  SecondaryDamage         = 1100.0
  SecondaryDamageRadius   = 100.0
  ScatterRadius           = 18.0
  ScatterRadiusVsInfantry = 120.0
  AttackRange             = 520.0
  MinimumAttackRange      = 400.0
  DamageType              = ARMOR_PIERCING
  DeathType               = EXPLODED
  WeaponSpeed             = 9999.0
  ProjectileObject        = MK-84
  FireFX                  = FX_AuroraBombLaunch
  ProjectileDetonationFX  = FX_FreeFallBombsDetonation
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 10
  ClipSize                = 10
  ClipReloadTime          = 300000
  AutoReloadsClip         = Yes
  ShowsAmmoPips           = Yes
  ProjectileCollidesWith  = STRUCTURES
  ShockWaveAmount         = 320.0
  ShockWaveRadius         = 220.0
  ShockWaveTaperOff       = 0.33
End

Object AmericaJetB2
  BuildCost = 10000
  MaxSimultaneousOfType = 3

  ; Survive timed strike recharge; keep normal idle return-to-base.
  Behavior = JetAIUpdate ModuleTag_07
    OutOfAmmoDamagePerSecond  = 0%
    TakeoffDistForMaxLift     = 0%
    TakeoffPause              = 500
    MinHeight                 = 5
    ParkingOffset             = 3
    ReturnToBaseIdleTime      = 10000
  End

  ; Fully stealth — no FIRING_PRIMARY uncloak. Detectors can still reveal.
  Behavior = StealthUpdate ModuleTag_Stealth
    StealthDelay                          = 0
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
End
