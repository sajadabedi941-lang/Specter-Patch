;==============================================================================
; AmericaJetB2 strike cooldown — gameplay only
; Last-wins among Data/INI (after AIRFIELD runtime; before/near VISUAL draw).
;
; After full USA_B2_Spirit_BunkerBuster payload (ClipSize 6):
;   - Strike disabled
;   - Auto-reactivates after 5 minutes (300000 ms)
;   - No money cost
;   - No return-to-base / manual reload required
;
; OutOfAmmoDamagePerSecond = 0% so the aircraft survives the recharge window
; (otherwise JetAIUpdate would destroy it while ammo is empty).
;
; Does NOT touch Draw / AVB3bmbr / Scale / Attachments / Airfield /
; Production / Locomotor / takeoff-idle flight fields beyond ammo survival.
;==============================================================================

Weapon USA_B2_Spirit_BunkerBuster
  PrimaryDamage           = 9000.0
  PrimaryDamageRadius     = 170.0
  SecondaryDamage         = 1100.0
  SecondaryDamageRadius   = 100.0
  ScatterRadius           = 18.0
  ScatterRadiusVsInfantry = 120.0
  AttackRange             = 520.0
  MinimumAttackRange      = 400.0
  DamageType              = ARMOR_PIERCING
  DeathType               = EXPLODED
  WeaponSpeed             = 9999.0
  ProjectileObject        = MK-84
  FireFX                  = FX_AuroraBombLaunch
  ProjectileDetonationFX  = FX_FreeFallBombsDetonation
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 10
  ClipSize                = 6
  ClipReloadTime          = 300000
  AutoReloadsClip         = Yes
  ShowsAmmoPips           = Yes
  ProjectileCollidesWith  = STRUCTURES
  ShockWaveAmount         = 320.0
  ShockWaveRadius         = 220.0
  ShockWaveTaperOff       = 0.33
End

; Fire-ability availability during timed recharge (same ModuleTag_07).
Object AmericaJetB2
  Behavior = JetAIUpdate ModuleTag_07
    OutOfAmmoDamagePerSecond  = 0%
    TakeoffDistForMaxLift     = 0%
    TakeoffPause              = 500
    MinHeight                 = 5
    ParkingOffset             = 3
    ReturnToBaseIdleTime      = 10000
  End
End
