;==============================================================================
; AmericaJetB52 last-wins button unlock (loads AFTER AIRFIELD_B2_RUNTIME)
; Companion to ZZZZZZZZ_ZZZ_USA_B52_FORCE_UNLOCK.ini
;
; ZH loads Data\INI case-insensitively, so ZZZZZZZZ_ZZZZ_* wins over
; ZZZZZZZZ_ZZZ_*. This file re-applies the TEOD B-52 CommandSet force
; replace after RUNTIME so the B-52 slot cannot revert to B52H.
;
; Same Specter-proven B-2 unlock values:
;   Buildable = Ignore_Prerequisites
;   Prerequisites empty
;   Command_ConstructTEODAmericaJetB52 -> AmericaJetB52H
;   (real airfield bomber; NOT ScienceObject AmericaJetB52 payload)
;   No RequiredScience / Options / StrategyCenter / Rank gates
;
; Does NOT touch Draw / Model / Scale / Weapon / Ammo / AI / Locomotor /
; Cost / Limit on AmericaJetB52H base.
;==============================================================================

; Clear StrategyCenter / Rank gates only — keep stock BuildCost / MaxSim.
; Final last-wins for Buildable/button: ZZZZZZZZ_ZZZZ_USA_B52_ZZZZ_BUILD_TARGET.ini
Object AmericaJetB52H
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
End

CommandButton Command_ConstructTEODAmericaJetB52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB52
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB52
End

CommandButton Command_ConstructAmericaJetB52H
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB52
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB52
End

CommandButton Command_ConstructPatch_America_B52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB52
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB52
End

