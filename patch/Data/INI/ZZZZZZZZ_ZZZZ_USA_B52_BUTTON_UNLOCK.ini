;==============================================================================
; AmericaJetB52 / AmericaJetB52H build-button unlock only
; Same method as B-2 FORCE / AIRFIELD unlock (last-wins CommandButton + Buildable).
;
; Fixes disabled Airfield B-52 button:
;   Command_ConstructAmericaJetB52H was rebound to missing Patch_America_B52
;   AmericaJetB52H still required Strategy Center + SCIENCE_Rank4
;
; This file:
;   - Rebinds B-52 UNIT_BUILD buttons to AmericaJetB52H (existing bomber object)
;   - Clears object Prerequisites / RequiredScience / Strategy Center / Rank gates
;   - Buildable = Ignore_Prerequisites (Specter-safe "buildable now")
;   - No RequiredScience / Options / SpecialPower on buttons
;
; Does NOT touch Draw / Model / Scale / Weapon / AI / Locomotor /
; Airfield CommandSet slots / Cost / Limit.
;==============================================================================

Object AmericaJetB52
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
End

Object AmericaJetB52H
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
End

; Airfield slot button (Command_ConstructAmericaJetB52H)
CommandButton Command_ConstructAmericaJetB52H
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructAmericaJetB52H
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB52H
End

; Alias / leftover Patch button -> same unlocked AmericaJetB52H
CommandButton Command_ConstructPatch_America_B52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructAmericaJetB52H
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB52H
End
