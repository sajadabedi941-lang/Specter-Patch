;==============================================================================
; VISUAL-ONLY last-wins lock for AmericaJetB52
; Same method as ZZZZZZZZ_ZZZZ_USA_B2_VISUAL_DRAW_ONLY.ini
;
; Locks Draw / Model to the real B-52 bomber mesh:
;   Model = US_B52H on every ConditionState
;   HideSubObject BurnerFX01-04, ShowSubObject = None
;   (prevents leftover B-1R / BurnerFX subobject pull)
;
; Also locks AmericaJetB52H Draw only (airfield B-52 sibling) — same model.
;
; Does NOT touch CommandSet, Airfield, Production, Weapon, AI, locomotor,
; cost, or build limit. Return-to-base / flight behavior unchanged.
;==============================================================================

Object AmericaJetB52
