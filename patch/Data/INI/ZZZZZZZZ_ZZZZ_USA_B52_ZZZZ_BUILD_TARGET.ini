;==============================================================================
; MINIMAL last-wins B-52 build-target + unlock
; Sorts AFTER ZZZZZZZZ_ZZZZ_USA_B52_VISUAL_DRAW_ONLY.ini (CI load order).
;
; Fixes disabled Airfield B-52 button:
;   Command_ConstructTEODAmericaJetB52 -> AmericaJetB52H (real aircraft)
;   NOT ScienceObject AmericaJetB52 (payload / SUPERWEAPON transport)
;
; Clears StrategyCenter / SCIENCE_Rank4 / RequiredObject gates via
;   Buildable = Ignore_Prerequisites + empty Prerequisites
; Keeps stock BuildCost / BuildTime / MaxSimultaneousOfType from USA_System.ini
;
; Does NOT touch Draw / Model / Weapon / AI / Locomotor / Airfield /
; CommandSet slot layout / Cost / Limit values.
;==============================================================================

Object AmericaJetB52H
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
  ; Airfield bomber KindOf (stock USA_System; not ScienceObject / IGNORED_IN_GUI)
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
End

; Same UI button name — build real aircraft only. No SpecialPower / Science / Options.
CommandButton Command_ConstructTEODAmericaJetB52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB52
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB52
End

; Keep aliases on the same real target (no ScienceObject / missing Patch_* target)
CommandButton Command_ConstructAmericaJetB52H
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB52
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB52
End

CommandButton Command_ConstructPatch_America_B52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB52
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB52
End
