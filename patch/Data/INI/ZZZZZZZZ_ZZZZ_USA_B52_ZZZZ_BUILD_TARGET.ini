;==============================================================================
; Absolute last-wins — normal Airfield B-52H production (F-22 / F-35 path)
; Sorts AFTER ZZZZZZZZ_ZZZZ_USA_B52_VISUAL_DRAW_ONLY.ini
;
; Button: Command_ConstructAmericaJetB52H
; Object: AmericaJetB52H
; Same CommandSet slots. No Science / SpecialPower / TEOD / Rank / Options.
;
; Keeps BuildCost=8500 MaxSimultaneousOfType=3. Draw/Weapon/AI untouched.
;==============================================================================

; --- Production object: same pattern as normal USA airfield jets ---
Object AmericaJetB52H
  Buildable = Yes
  Prerequisites
  End
  BuildCost = 8500
  BuildTime = 115.0
  MaxSimultaneousOfType = 3
  IsTrainable = Yes
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
End

; --- Normal UNIT_BUILD button (mirror F-22 / F-35 CommandButton shape) ---
CommandButton Command_ConstructAmericaJetB52H
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructAmericaJetB52H
  ButtonImage      = us_b52gbu43
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB52H
End

; Missing Patch_* stub must not steal production target
CommandButton Command_ConstructPatch_America_B52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructAmericaJetB52H
  ButtonImage      = us_b52gbu43
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB52H
End

