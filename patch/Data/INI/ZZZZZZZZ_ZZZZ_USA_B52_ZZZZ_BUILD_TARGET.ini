;==============================================================================
; MINIMAL last-wins — normal Airfield B-52 production button
; Sorts AFTER ZZZZZZZZ_ZZZZ_USA_B52_VISUAL_DRAW_ONLY.ini
;
; Uses stock production command (NOT TEOD / ScienceObject / SUPERWEAPON):
;   Command_ConstructAmericaJetB52H -> AmericaJetB52H
;
; Same Airfield CommandSet B-52 slots as before (base 12, _T 7, _T1/_T2 8, _T3 7).
; Clears StrategyCenter / SCIENCE_Rank4 via Ignore_Prerequisites.
; Stock BuildCost / BuildTime / MaxSim kept from USA_System.ini.
;
; Does NOT touch Draw / Model / Weapon / AI / Locomotor / Airfield object /
; Cost / Limit values. Does NOT use Command_ConstructTEODAmericaJetB52.
;==============================================================================

Object AmericaJetB52H
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
End

; Normal Airfield UNIT_BUILD — no RequiredScience / Options / SpecialPower
CommandButton Command_ConstructAmericaJetB52H
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructAmericaJetB52H
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB52H
End

; Missing Patch_* stub must not steal the slot target
CommandButton Command_ConstructPatch_America_B52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructAmericaJetB52H
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB52H
End

; Same slots; B-2 slot 5 kept. B-52 slots use normal AmericaJetB52H button.
