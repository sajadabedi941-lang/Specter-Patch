;==============================================================================
; AmericaJetB52 FORCE UNLOCK — exact same method as AmericaJetB2
; Named force-unlock (same pattern as ZZZZZZZZ_ZZZ_USA_B2_FORCE_UNLOCK.ini).
; Under ZH case-insensitive load order, ZZZZZZZZ_ZZZZ_* loads AFTER this file;
; ZZZZZZZZ_ZZZZ_USA_AIRFIELD_B2_RUNTIME.ini and
; ZZZZZZZZ_ZZZZ_USA_B52_BUTTON_UNLOCK.ini also carry the TEOD B-52 CommandSet
; force-replace so the slot cannot revert to B52H.
;
; Runtime path (same as B-2):
;   AmericaAirfield / AmericaAirfield_T
;     -> AmericaAirfieldCommandSet / _T / _T1 / _T2 / _T3
;
; Force-replace every B-52 build slot with:
;   Command_ConstructTEODAmericaJetB52 -> AmericaJetB52H
;   (real airfield bomber; NOT ScienceObject AmericaJetB52 payload)
;
; Buildable = Ignore_Prerequisites on AmericaJetB52H only (clear SC/Rank gates)
; Stock BuildCost / BuildTime / MaxSimultaneousOfType kept from USA_System.ini
; No RequiredScience / Options / SpecialPower on buttons
;
; Keeps AmericaJetB2 slot 5 = Command_ConstructTEODAmericaJetB2
; Does NOT touch Draw / Model / Scale / Weapon / Ammo / AI / Locomotor /
; or AmericaJetB52H base object file.
;==============================================================================

; --- Airfield CommandSet rebind (same as B-2 runtime) ---
Object AmericaAirfield
  CommandSet = AmericaAirfieldCommandSet
End

Object AmericaAirfield_T
  CommandSet = AmericaAirfieldCommandSet_T
End

; --- AmericaJetB52H unlock (prereq clear only) ---
Object AmericaJetB52H
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
End

; --- TEOD B-52 button -> real airfield bomber ---
CommandButton Command_ConstructTEODAmericaJetB52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB52
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB52
End

; Redirect legacy aliases to the same real bomber
CommandButton Command_ConstructAmericaJetB52H
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB52
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB52
End

CommandButton Command_ConstructPatch_America_B52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB52
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB52
End

; --- FORCE REPLACE all USA Airfield CommandSets ---
; B-2 slot 5 kept. B-52 slots -> Command_ConstructTEODAmericaJetB52
CommandSet AmericaAirfieldCommandSet
  1  = Command_ConstructAmericaJetRaptor
  2  = Command_ConstructAmericaVehicleComanche
