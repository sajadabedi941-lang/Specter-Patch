;==============================================================================
; AmericaJetB52 absolute last-wins FORCE unlock
; Sorts after ZZZZZZZZ_ZZZZ_* and after ZZZZZZZZ_ZZZ_USA_B2_FORCE_UNLOCK.ini
; (name: ..._B52_ZZ_... > ..._B2_FORCE_...).
;
; Same Specter-proven B-2 unlock values:
;   Buildable = Ignore_Prerequisites
;   Prerequisites End (empty)
;   UNIT_BUILD button -> AmericaJetB52, no Science/Options
;==============================================================================

Object AmericaJetB52
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
  ; Drop IGNORED_IN_GUI so Airfield UNIT_BUILD can produce a selectable unit.
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT EMP_HARDENED
End

Object AmericaJetB52H
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
End

CommandButton Command_ConstructAmericaJetB52H
  Command          = UNIT_BUILD
  Object           = AmericaJetB52
  TextLabel        = CONTROLBAR:ConstructAmericaJetB52H
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB52H
End

CommandButton Command_ConstructPatch_America_B52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52
  TextLabel        = CONTROLBAR:ConstructAmericaJetB52H
  ButtonImage      = us_b52h
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB52H
End
