;==============================================================================
; USA Airfield B-2 button unlock (CommandButton + CommandSet + build gate)
; Slot 5 on base + tier CommandSets -> Command_ConstructTEODAmericaJetB2
; ProductionObject = AmericaJetB2
; No RequiredScience / Options / SpecialPower / Upgrade locks on buttons.
; Does NOT touch Draw / AVB3bmbr / weapon / locomotor / AI / Airfield Object.
; Root ZZZZ_ path last-wins after Object/ folder for Prerequisites clear.
;==============================================================================

; Clear UNIT_BUILD gates only (Draw modules preserved by Object merge).
; Final override is ZZZZ_ZZZ_USA_B2_FORCE_UNLOCK.ini (loads after this file).
Object AmericaJetB2
  Buildable = Yes
  BuildCost = 2500
  BuildTime = 30.0
  MaxSimultaneousOfType = 4
  Prerequisites
  End
End

Object AmericaJetB2Spirit
  Buildable = Yes
  BuildCost = 2500
  BuildTime = 30.0
  MaxSimultaneousOfType = 4
  Prerequisites
  End
End

CommandButton Command_ConstructTEODAmericaJetB2
  Command          = UNIT_BUILD
  Object           = AmericaJetB2
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB2
  ButtonImage      = B2-ic_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB2
End

; Stock / tier sets historically name this button on slot 5.
CommandButton Command_ConstructAmericaJetB2Spirit
  Command          = UNIT_BUILD
  Object           = AmericaJetB2
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB2
  ButtonImage      = B2-ic_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB2
End

