;==============================================================================
; Absolute last-wins — USA Airfield slot 11: EA-18G -> B-21 Raider
; Sorts AFTER ZZZZ_USA_Airfield_TEOD_B2_Production.ini
;           AND AFTER ZZZZZZZZ_ZZZZ_USA_B52_ZZZZ_BUILD_TARGET.ini
;
; Method (same as B-2 / B-52):
;   existing working USA bomber pipeline (cloned AmericaJetB1R -> AmericaJetB21)
;   + patch visual (US_B1R / us_b1r)
;   + patch weapon America_Weapon_B21_JASSM
;   + isolated airfield unlock
;
; Slot 11 only change vs stable B-52 CommandSets:
;   was: Command_ConstructAmericaJetEA18
;   now: Command_ConstructAmericaJetB21 -> AmericaJetB21
;
; Does NOT modify B-2 (slot 5) or B-52 production slots/buttons.
; Does NOT touch Strategy Center or BIG files.
; Does NOT touch CVN78 EA-18G.
;==============================================================================

; --- Production unlock (gates only; full object in Airforce/B21.ini) ---
Object AmericaJetB21
  Buildable = Yes
  Prerequisites
  End
  BuildCost = 6206
  BuildTime = 40.5
  MaxSimultaneousOfType = 2
  IsTrainable = Yes
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
End

; --- Normal UNIT_BUILD button (mirror B-52H / F-22 shape) ---
CommandButton Command_ConstructAmericaJetB21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = us_b1r
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

; Retarget Phase-G Patch stub to real airfield B-21 (same as B-52 Patch stub fix)
CommandButton Command_ConstructPatch_America_B21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = us_b1r
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

