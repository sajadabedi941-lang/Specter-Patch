;==============================================================================
; Absolute last-wins — USA Airfield slot 11: EA-18G -> B-21 Raider
; Sorts AFTER ZZZZZZZZ_ZZZZ_USA_B52_ZZZZ_BUILD_TARGET.ini
;
; Slot 11 only:
;   was: Command_ConstructAmericaJetEA18 -> AmericaJetEA18G
;   now: Command_ConstructAmericaJetB21  -> AmericaJetB21
;
; Normal UNIT_BUILD (same pattern as AmericaJetB52H).
; Weapon: America_Weapon_B21_JASSM
; CommandSet: GenericTacticalBomberCommandSet
; Prerequisites cleared: no Science / Rank / StrategyCenter / RequiredObject
;
; Does NOT modify B-2 (slot 5) or B-52 production slots/buttons.
; Does NOT touch CVN78 EA-18G slot.
;==============================================================================

; --- Production aircraft (full object; no stock AmericaJetB21 base) ---
Object AmericaJetB21
  Scale = 0.72
  SelectPortrait = us_b1r
  ButtonImage = us_b1r
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = US_B1R
      Animation = US_B1R.US_B1R
      AnimationMode = LOOP
      HideSubObject = BurnerFX01 BurnerFX02
      WeaponLaunchBone = PRIMARY WeaponA
    End
    ConditionState = JETEXHAUST
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End
    ConditionState = REALLYDAMAGED
      Model = US_B1R
      ParticleSysBone = Smoke01 JetSmoke
    End
    OkToChangeModelColor = Yes
  End
  DisplayName = OBJECT:AmericaJetB21
  EditorSorting = VEHICLE
  Side = America
  TransportSlotCount = 0
  VisionRange = 520
  ShroudClearingRange = 240
  Buildable = Yes
  Prerequisites
  End
  BuildCost = 6206
  BuildTime = 40.5
  MaxSimultaneousOfType = 2
  WeaponSet
    Conditions = None
    Weapon = PRIMARY America_Weapon_B21_JASSM
  End
  ArmorSet
    Conditions = None
    Armor = AirplaneArmor
    DamageFX = None
  End
  ExperienceValue = 80 80 120 160
  IsTrainable = Yes
  CommandSet = GenericTacticalBomberCommandSet
  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS SELECTABLE VEHICLE SCORE AIRCRAFT CAN_ATTACK
  Body = ActiveBody ModuleTag_02
    MaxHealth = 720.0
    InitialHealth = 720.0
  End
  Behavior = PhysicsBehavior ModuleTag_03
    Mass = 200.0
  End
  Behavior = JetAIUpdate ModuleTag_04
    OutOfAmmoDamagePerSecond = 8%
    TakeoffDistForMaxLift = 0%
    TakeoffPause = 500
    MinHeight = 5
    ParkingOffset = 5
    ReturnToBaseIdleTime = 12000
  End
  Locomotor = SET_NORMAL B52HLocomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor
  Behavior = JetSlowDeathBehavior ModuleTag_05
    DestructionDelay = 99999999
    RollRate = 0.2
    RollRateDelta = 100%
    PitchRate = 0.0
    FallHowFast = 110.0%
    FXInitialDeath = FX_JetDeathExplosion
    OCLInitialDeath = OCL_AmericaJetSlowDeathInitial
  End
  Behavior = ProductionUpdate ModuleTag_06
  End
  Geometry = Box
  GeometryIsSmall = No
  GeometryMajorRadius = 36.0
  GeometryMinorRadius = 12.0
  GeometryHeight = 18.0
  Shadow = SHADOW_VOLUME
End

; --- Normal UNIT_BUILD button (mirror F-22 / F-35 / B-52H shape) ---
CommandButton Command_ConstructAmericaJetB21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = us_b1r
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

; Old Patch_* stub must not leave a dead AAB production target
CommandButton Command_ConstructPatch_America_B21
  Command          = UNIT_BUILD
  Object           = AmericaJetB21
  TextLabel        = CONTROLBAR:ConstructAmericaJetB21
  ButtonImage      = us_b1r
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB21
End

