;==============================================================================
; AmericaJetB2 GAMEPLAY ONLY — stealth + 10-bomb bunker-buster payload
; Absolute last-wins among ZZZZ_USA_ZZZZ_B2_* (sorts after VISUAL_AVB3_ONLY (ZZ_ > VISUAL_)
; for weapon/object merge; does not redefine Draw).
;
; 1) Full innate stealth, low radar priority (LOCAL_UNIT_ONLY).
;    No FIRING_PRIMARY uncloak. Detectors can still reveal.
; 2) USA_B2_Spirit_BunkerBuster ClipSize = 10, AutoReloadsClip = RETURN_TO_BASE.
;    All 10 bombs expend in one run; then empty until RTB reload.
;
; Does NOT touch: Draw, Model, Scale, Airfield, CommandSet, Production,
; Cost, Limit, AI, Locomotor, or weapon damage values.
;==============================================================================

Object AmericaJetB2
  ; Very low radar signature (same class as AmericaJetStealthFighter).
  RadarPriority = LOCAL_UNIT_ONLY

  ; Full stealth strategic bomber. Keep normal flight / RTB idle via existing AI.
  Behavior = StealthUpdate ModuleTag_Stealth
    StealthDelay                          = 0
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
End

; Payload last-wins (Weapon.ini / Weapon_B2_* may first-win ClipSize otherwise).
Weapon USA_B2_Spirit_BunkerBuster
  PrimaryDamage           = 9000.0
  PrimaryDamageRadius     = 170.0
  SecondaryDamage         = 1100.0
  SecondaryDamageRadius   = 100.0
  ScatterRadius           = 18.0
  ScatterRadiusVsInfantry = 120.0
  AttackRange             = 520.0
  MinimumAttackRange      = 400.0
  DamageType              = ARMOR_PIERCING
  DeathType               = EXPLODED
  WeaponSpeed             = 9999.0
  ProjectileObject        = MK-84
  FireFX                  = FX_AuroraBombLaunch
  ProjectileDetonationFX  = FX_FreeFallBombsDetonation
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 10
  ClipSize                = 10
  ClipReloadTime          = 600000
  AutoReloadsClip         = RETURN_TO_BASE
  ShowsAmmoPips           = Yes
  ProjectileCollidesWith  = STRUCTURES
  ShockWaveAmount         = 320.0
  ShockWaveRadius         = 220.0
  ShockWaveTaperOff       = 0.33
End
