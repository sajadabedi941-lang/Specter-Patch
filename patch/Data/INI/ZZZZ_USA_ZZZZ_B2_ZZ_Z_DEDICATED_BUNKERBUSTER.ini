;==============================================================================
; AmericaJetB2 GAMEPLAY ONLY — dedicated bunker-buster payload
; Sorts after ZZZZ_USA_ZZZZ_B2_ZZ_GAMEPLAY_STEALTH_AMMO.ini (ZZ_Z_ > ZZ_GAMEPLAY_).
;
; - Keep InnateStealth / LOCAL_UNIT_ONLY radar (reaffirm; no Draw/Model).
; - PRIMARY = America_Weapon_B2_BunkerBuster (ClipSize 10).
; - Full 10-bomb sortie; empties in one run; RETURN_TO_BASE reload.
;
; Does NOT touch: Draw, Model, Scale, Airfield, CommandSet, Production,
; AI, Locomotor, health, speed, armor, build conditions.
;==============================================================================

Object AmericaJetB2
  RadarPriority = LOCAL_UNIT_ONLY

  WeaponSet
    Conditions = None
    Weapon = PRIMARY America_Weapon_B2_BunkerBuster
  End

  Behavior = StealthUpdate ModuleTag_Stealth
    StealthDelay                          = 0
    FriendlyOpacityMin                    = 50.0%
    FriendlyOpacityMax                    = 100.0%
    InnateStealth                         = Yes
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
End

Weapon America_Weapon_B2_BunkerBuster
  PrimaryDamage           = 12000.0
  PrimaryDamageRadius     = 140.0
  SecondaryDamage         = 1600.0
  SecondaryDamageRadius   = 85.0
  ScatterRadius           = 12.0
  ScatterRadiusVsInfantry = 100.0
  AttackRange             = 520.0
  MinimumAttackRange      = 400.0
  DamageType              = ARMOR_PIERCING
  DeathType               = EXPLODED
  WeaponSpeed             = 9999.0
  ProjectileObject        = MK-84
  FireFX                  = FX_AuroraBombLaunch
  ProjectileDetonationFX  = FX_FreeFallBombsDetonation
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 10
  ClipSize                = 10
  ClipReloadTime          = 0
  AutoReloadsClip         = RETURN_TO_BASE
  ShowsAmmoPips           = Yes
  ProjectileCollidesWith  = STRUCTURES
  ShockWaveAmount         = 380.0
  ShockWaveRadius         = 200.0
  ShockWaveTaperOff       = 0.30
End
