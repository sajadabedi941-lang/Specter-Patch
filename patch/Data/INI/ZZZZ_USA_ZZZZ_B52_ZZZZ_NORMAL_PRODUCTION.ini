;==============================================================================
; Absolute last-wins — AmericaJetB52H normal Airfield production (F-22/F-35 path)
; Case-sensitive sort: after ZZZZ_USA_ZZZZ_B2_* gameplay/visual files.
;
; STEP 1: Clear Rank / Science / StrategyCenter prerequisites on AmericaJetB52H
; STEP 2: Command_ConstructAmericaJetB52H -> AmericaJetB52H (UNIT_BUILD)
; STEP 3: All USA Airfield CommandSets use Command_ConstructAmericaJetB52H
;         (no Command_ConstructTEODAmericaJetB52). B-2 slot 5 unchanged.
;
; Does NOT touch: B-2 Draw/weapon/gameplay, Strategy Center object, B-52
; weapon/model/draw/cost/limit stats beyond production unlock fields.
;==============================================================================

Object AmericaJetB52H
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
  BuildCost = 8500
  BuildTime = 115.0
  MaxSimultaneousOfType = 3
End

; Normal UNIT_BUILD — no Science / SpecialPower / TEOD / Options / Rank
CommandButton Command_ConstructAmericaJetB52H
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructAmericaJetB52H
  ButtonImage      = us_b52gbu43
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB52H
End

; Retarget Patch_* / TEOD aliases so nothing steals production
CommandButton Command_ConstructPatch_America_B52
  Command          = UNIT_BUILD
  Object           = AmericaJetB52H
  TextLabel        = CONTROLBAR:ConstructAmericaJetB52H
  ButtonImage      = us_b52gbu43
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipAmericaJetB52H
End

CommandButton Command_ConstructTEODAmericaJetB52
