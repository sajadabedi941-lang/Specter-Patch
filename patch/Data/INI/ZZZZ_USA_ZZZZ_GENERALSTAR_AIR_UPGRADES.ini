; =============================================================================
; USA General Star → aircraft upgrades only (no active powers).
; Last-wins twin — sorts after prior USA Airfield / upgrade overlays.
;
; Tier panels (engine PurchaseScienceCommandSetRank1/3/8):
;   Rank1 = 1-Star Tier 1
;   Rank3 = 3-Star Tier 2
;   Rank8 = 5-Star Tier 3  (stock ZH third star page)
;
; Does NOT modify: Airfield CommandSets, aircraft Objects, Weapon, Draw,
; Cost, Limit, Locomotor. Does NOT restore Strategy Center production.
; Removes air-upgrade buttons from Strategy Center (Stars-only path).
; =============================================================================

; --- Ensure star-grantable PLAYER upgrades (was OBJECT) ---
Upgrade Upgrade_AGM154C
  Type = PLAYER
End

Upgrade Upgrade_AADS_AA_Mode
  Type = PLAYER
End

Upgrade Upgrade_AADS_ABM_Mode
  Type = PLAYER
End

Upgrade Upgrade_ChaffUpgrade
  Type = PLAYER
  BuildTime = 20.0
  BuildCost = 800
  ButtonImage = sys_flares
End

