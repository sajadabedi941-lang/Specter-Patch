; =============================================================================
; STABILITY ROLLBACK — restore stock USA General Star + Strategy Center.
; Last-wins twin — sorts after GENERALSTAR air-upgrade experiment overlays.
;
; Restores:
;   - SCIENCE_AMERICA_CommandSetRank1/3/8 (original powers)
;   - SpecialPowerShortcutUSA / AmericaSpecialPowerCommandSet
;   - AmericaStrategyCenterCommandSet (+ _T / _T1 / _T2) original upgrades
;   - Strategy Center DOZER_CONSTRUCT buttons (AmericaStrategyCenter)
;
; Does NOT modify: Airfield CommandSets/slots, aircraft Objects, Weapon,
; Draw, Cost, Limit, AI, Locomotor.
; =============================================================================

; --- Strategy Center building construct (original objects) ---
CommandButton Command_ConstructAmericaStrategyCenter
  Command       = DOZER_CONSTRUCT
  Object        = AmericaStrategyCenter
  TextLabel     = CONTROLBAR:ConstructAmericaStrategyCenter
  ButtonImage   = us_stratcenter
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipUSABuildStrategyCenter
End

CommandButton Command_ConstructAmericaStrategyCenter_T
  Command       = DOZER_CONSTRUCT
  Object        = AmericaStrategyCenter_T
  TextLabel     = CONTROLBAR:ConstructAmericaStrategyCenter
  ButtonImage   = us_stratcenter
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipUSABuildStrategyCenter
End

