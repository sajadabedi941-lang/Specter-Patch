; =============================================================================
; USA Airfield STATIC final roster — bypass ALL aircraft upgrade progression.
; Last-wins twin — sorts after AIRFIELD_FINAL_CS / FULL_UNLOCK / B2_RUNTIME.
;
; All AmericaAirfieldCommandSet / _T / _T1 / _T2 / _T3 are IDENTICAL.
; AmericaAirfield_T CommandSet forced to AmericaAirfieldCommandSet_T3.
; CommandSetUpgrade modules retargeted to same static set AND gated by a
; non-granted upgrade token so they cannot change the roster at runtime.
;
; No Command Center grants. No Strategy Center dependency. No redesign.
; Preserves B-2 Spirit, B-52H, B-21. Aircraft objects/weapons/draw untouched.
; =============================================================================

; Dummy upgrade — never granted — disables CommandSetUpgrade transitions.
