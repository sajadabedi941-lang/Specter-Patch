; =============================================================================
; ABSOLUTE LAST-WINS — restore USA Strategy Center building construct + art.
; Sorts after STATIC_FINAL_ROSTER / AIRFIELD_FINAL_CS overlays.
;
; Fixes: Command_ConstructAmericaStrategyCenter* must place AmericaStrategyCenter*
; (NOT America_AdvancedAirBase / AmericaAirfield / runway models).
;
; Does NOT modify: AmericaAirfield, America_AdvancedAirBase object, aircraft
; Objects, weapons, models, costs, limits, or Airfield production buttons.
; =============================================================================

; --- Dozer construct: original Specter Strategy Center objects ---
CommandButton Command_ConstructAmericaStrategyCenter
  Command       = DOZER_CONSTRUCT
  Object        = AmericaStrategyCenter
  TextLabel     = CONTROLBAR:ConstructAmericaStrategyCenter
  ButtonImage   = us_stratcenter
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipUSABuildStrategyCenter
End

CommandButton Command_ConstructAmericaStrategyCenter_T
  Command       = DOZER_CONSTRUCT
  Object        = AmericaStrategyCenter_T
  TextLabel     = CONTROLBAR:ConstructAmericaStrategyCenter
  ButtonImage   = us_stratcenter
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipUSABuildStrategyCenter
End

; --- Reaffirm original Specter Strategy Center Draw / geometry / identity ---
; (Models US_StrtgyCenter — NOT US_AirField / ABAirF2 runway art.)
Object AmericaStrategyCenter
  SelectPortrait         = us_stratcenter
  ButtonImage            = us_stratcenter
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState = NONE
      Model              = US_StrtgyCenter
      Animation          = US_StrtgyCenter.US_StrtgyCenter
      AnimationMode      = LOOP
    End
    ConditionState = DAMAGED
      Model              = US_StrtgyCenter
      Animation          = US_StrtgyCenter.US_StrtgyCenter
      AnimationMode      = LOOP
    End
    ConditionState = REALLYDAMAGED RUBBLE
      Model              = US_StrtgyCenter
      Animation          = US_StrtgyCenter.US_StrtgyCenter
      AnimationMode      = LOOP
    End
  End
  DisplayName      = OBJECT:StrategyCenter
  Side = America
  EditorSorting    = STRUCTURE
  Geometry            = BOX
  GeometryMajorRadius = 62.0
  GeometryMinorRadius = 44.0
  GeometryHeight      = 24.0
  GeometryIsSmall     = No
  Shadow          = SHADOW_VOLUME
  BuildCompletion = PLACED_BY_PLAYER
End

Object AmericaStrategyCenter_T
  SelectPortrait         = us_stratcenter
  ButtonImage            = us_stratcenter
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState = NONE
      Model              = US_StrtgyCenter
      Animation          = US_StrtgyCenter.US_StrtgyCenter
      AnimationMode      = LOOP
    End
    ConditionState = DAMAGED
      Model              = US_StrtgyCenter
      Animation          = US_StrtgyCenter.US_StrtgyCenter
      AnimationMode      = LOOP
    End
    ConditionState = REALLYDAMAGED RUBBLE
      Model              = US_StrtgyCenter
      Animation          = US_StrtgyCenter.US_StrtgyCenter
      AnimationMode      = LOOP
    End
  End
  DisplayName      = OBJECT:StrategyCenter
  Side = America
  EditorSorting    = STRUCTURE
  Geometry            = BOX
  GeometryMajorRadius = 62.0
  GeometryMinorRadius = 44.0
  GeometryHeight      = 24.0
  GeometryIsSmall     = No
  Shadow          = SHADOW_VOLUME
  BuildCompletion = PLACED_BY_PLAYER
End
