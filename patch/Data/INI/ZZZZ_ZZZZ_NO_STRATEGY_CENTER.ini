;==============================================================================
; Absolute last-wins — Remove Strategy Center for ALL factions
; Sorts AFTER CommandSet.ini / CommandButton.ini / any Restore overlays.
;
; ROOT CAUSE (SC still visible):
;   SAGE CommandSet overrides MERGE slots. Omitting a slot does NOT clear it.
;   Prior overlay also re-declared Construct buttons as DOZER_CONSTRUCT, which
;   re-enabled Strategy Center production.
;
; THIS FILE:
;   1) Buildable = No on every Strategy Center object
;   2) All Construct Strategy Center CommandButtons -> SCRIPT_ONLY (hidden)
;   3) Explicitly overwrite dozer/worker SC slots with SCRIPT_ONLY dummy
;      so merge cannot keep the old Construct button
;
; Does NOT modify B-2 / B-52 / B-21 production files.
; General Star sciences remain in Science_GeneralStar_Addon.ini.
;==============================================================================

; Hidden dummy used to clear merged CommandSet slots
CommandButton Command_RemovedStrategyCenterSlot
  Command = PURCHASE_SCIENCE
  Options = SCRIPT_ONLY
  Science = SCIENCE_MOAB
  ButtonImage = SNCentered
End

