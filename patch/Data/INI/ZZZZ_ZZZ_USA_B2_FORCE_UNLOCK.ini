;==============================================================================
; FORCE USA Airfield B-2 unlock from game start (last-wins among ZZZZ_*)
; Filename sorts after ZZZZ_USA_Airfield_TEOD_B2_Production.ini (ZZZ > USA).
;
; Removes ALL build gates:
;   Science / NeededScience / RequiredScience
;   Upgrade / Strategy Center / General Star
;   Prerequisites Object / RequiredObject
;   CommandButton Options / SpecialPower
;
; Slot 5 unchanged: Command_ConstructTEODAmericaJetB2 -> AmericaJetB2
; Does NOT touch Draw / AVB3bmbr / weapon / AI / locomotor / Airfield Object.
;==============================================================================

; Object gate: Ignore_Prerequisites (Buildable=Yes still checks prereqs).
Object AmericaJetB2
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
End

; Also clear stock Spirit object if any CommandSet still names its button.
Object AmericaJetB2Spirit
  Buildable = Ignore_Prerequisites
  Prerequisites
  End
End

CommandButton Command_ConstructTEODAmericaJetB2
  Command          = UNIT_BUILD
  Object           = AmericaJetB2
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB2
  ButtonImage      = B2-ic_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB2
End

CommandButton Command_ConstructAmericaJetB2Spirit
  Command          = UNIT_BUILD
  Object           = AmericaJetB2
  TextLabel        = CONTROLBAR:ConstructTEODAmericaJetB2
  ButtonImage      = B2-ic_L
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipConstructTEODAmericaJetB2
End

; Keep slot 5 on TEOD B-2 for base + tier airfield CommandSets.
