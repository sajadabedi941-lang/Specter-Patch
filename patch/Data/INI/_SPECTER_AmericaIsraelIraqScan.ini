; SPECTER country scan and Iraq radar.
; This file sorts after CommandSet.ini, CommandSet_ZZZZ_SpySatelliteRadar.ini,
; and the shadowed Data\INI\SpecialPower.ini / ObjectCreationList.ini / CommandButton.ini.
; INIZH registers those shared paths first, so copies inside _SPEC_DATA_ONE do not load.
; The powers below are country-specific. They do not use SpecialPowerSpySatellite,
; Command_SpySatelliteScan, or Upgrade_SpecterSpySatelliteScan.

SpecialPower SpecialPowerAmericaCountryScan
  Enum                    = SPECIAL_SPY_SATELLITE
  ReloadTime              = 60000
  PublicTimer             = No
  RadiusCursorRadius      = 300
  InitiateAtLocationSound = SpySatellite
  SharedSyncedTimer       = Yes
  ShortcutPower           = Yes
  AcademyClassify         = ACT_SUPERPOWER
End

