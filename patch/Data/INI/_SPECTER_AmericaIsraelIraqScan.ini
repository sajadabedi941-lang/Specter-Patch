ObjectCreationList SUPERWEAPON_AmericaCountryScan
  CreateObject
    ObjectNames = AmericaCountryScanPing
    Count = 1
  End
End

ObjectCreationList SUPERWEAPON_IsraelCountryScan
  CreateObject
    ObjectNames = IsraelCountryScanPing
    Count = 1
  End
End

ObjectCreationList SUPERWEAPON_IraqiRadarScan
  CreateObject
    ObjectNames = IraqiRadarScan
    Count = 1
  End
End

Object AmericaCountryScanPing
  VisionRange = 300.0
  EditorSorting = SYSTEM
  KindOf = NO_COLLIDE IMMOBILE UNATTACKABLE INERT
  Body = ImmortalBody ModuleTag_01
    MaxHealth = 1
    InitialHealth = 1
  End
  Behavior = DynamicShroudClearingRangeUpdate ModuleTag_02
    FinalVision = 0.0
    ShrinkDelay = 10000
    ShrinkTime = 5000
    GrowDelay = 0
    GrowTime = 1000
    GrowInterval = 10
    ChangeInterval = 80
    GridDecalTemplate
      Texture           = EXGrid
      Style             = SHADOW_ADDITIVE_DECAL
      OpacityMin        = 50%
      OpacityMax        = 100%
      OpacityThrobTime  = 500
      Color             = R:32 G:64 B:128 A:0
    End
  End
  Behavior = DeletionUpdate ModuleTag_03
    MinLifetime = 13000
    MaxLifetime = 13000
  End
  Behavior = StealthDetectorUpdate ModuleTag_04
    DetectionRate = 500
  End
End

