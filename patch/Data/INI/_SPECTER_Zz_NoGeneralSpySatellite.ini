; Loaded after INIZH CommandSet.ini, _SPEC_DATA_ONE CommandSet.ini,
; z_SPECTER_IndiaRadarMenu CommandSet_ZZZZ_SpySatelliteRadar.ini,
; and _SPECTER_AmericaIsraelIraqScan.ini.
; Each block keeps every non-spy button from the original archive menu
; and from the effective loose menu. Command_SpySatelliteScan,
; Command_SpySatelliteScanFromShortcut, and Command_SpecterSpySatelliteFee
; are removed. America, Israel, and Iraq country scans stay in the old spy slot.
; A button moves to a free slot only when two original menus used that same slot
; for two different commands. The earlier archive button keeps the slot.

