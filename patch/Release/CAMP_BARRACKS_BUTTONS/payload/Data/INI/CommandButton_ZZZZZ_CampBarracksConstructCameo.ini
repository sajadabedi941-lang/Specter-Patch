; SPECTER - restore Camp / Barracks construct cameos for 16 countries
; Last-win overlay. Does not add new CommandButton names or CommandSets.
;
; Root cause: live CommandButton.ini points these DOZER_CONSTRUCT buttons at
; Specter_CampFlags MappedImages (Texture = XX_Flag, 128x64 pole-flag TGAs).
; Working factions use command-bar atlas cameos:
;   AmericaBarracks / NatoBootCamp -> us_camp (US-Icons05)
;   Iraq_Barracks                  -> irq_barracks (Irq_Icons02)
; Pole-flag TGAs are 3D building-flag textures, not HUD cameo atlas frames.
;
; This overlay keeps Command / Object / labels / border unchanged and only
; retargets ButtonImage to those proven cameos.
;
; Pakistan is omitted: CommandButton_Pakistan.ini already last-wins us_camp.
; No CommandSet, Object, ART, cost, or prerequisite edits.

; ---- Iraq-mesh Barracks (10-country group minus Pakistan; plus JP/SK/VN) ----

CommandButton Command_ConstructSouthAfrica_Barracks
  Command       = DOZER_CONSTRUCT
  Object        = SouthAfrica_Barracks
  TextLabel     = CONTROLBAR:ConstructSouthAfrica_Barracks
  ButtonImage   = irq_barracks
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipConstructSouthAfrica_Barracks
End

