; Unique Israel Iron Dome Mobile vehicle.
; Art from purchased BONDKS.W3D. Bones used below exist in that W3D.
; 1.ini referenced Turret, MUZZLEFX01, WEAPONB, IRFX which are NOT in the W3D
; and PatriotMissilemWeapon which is NOT in ss1. Those names are not used.

Object Israel_VehicleIronDomeMobile

  SelectPortrait         = isi_ironedome
  ButtonImage            = isi_ironedome

  Draw = W3DTruckDraw ModuleTag_01
    OkToChangeModelColor = Yes

    ConditionState = NONE
      Model = BONDKS
      Turret = HERO
      TurretPitch = CYLINDER12
      WeaponLaunchBone = PRIMARY MUZZLE
      WeaponFireFXBone = PRIMARY MUZZLE
      WeaponLaunchBone = PRIMARY MUZZLE01
      WeaponFireFXBone = PRIMARY MUZZLE01
    End

    ConditionState = MOVING
      Model = BONDKS
      Turret = HERO
      TurretPitch = CYLINDER12
      WeaponLaunchBone = PRIMARY MUZZLE
      WeaponFireFXBone = PRIMARY MUZZLE
      WeaponLaunchBone = PRIMARY MUZZLE01
      WeaponFireFXBone = PRIMARY MUZZLE01
    End

    ConditionState = REALLYDAMAGED
      Model = BONDKS
      Turret = HERO
      TurretPitch = CYLINDER12
      WeaponLaunchBone = PRIMARY MUZZLE
      WeaponFireFXBone = PRIMARY MUZZLE
      WeaponLaunchBone = PRIMARY MUZZLE01
      WeaponFireFXBone = PRIMARY MUZZLE01
    End

    ConditionState = REALLYDAMAGED MOVING
      Model = BONDKS
      Turret = HERO
      TurretPitch = CYLINDER12
      WeaponLaunchBone = PRIMARY MUZZLE
      WeaponFireFXBone = PRIMARY MUZZLE
      WeaponLaunchBone = PRIMARY MUZZLE01
      WeaponFireFXBone = PRIMARY MUZZLE01
    End
  End

  PlacementViewAngle = -45

  DisplayName       = OBJECT:Israel_VehicleIronDomeMobile
  Side              = Israel
  EditorSorting     = VEHICLE
  TransportSlotCount = 10
  BuildCost        = 1000
  BuildTime        = 25.0
  VisionRange    = 800.0
  ShroudClearingRange = 360
  WeaponSet
    Conditions          = None
    Weapon              = PRIMARY     IroneDome_AA
    PreferredAgainst    = PRIMARY     AIRCRAFT
  End
  ArmorSet
    Conditions      = None
    Armor           = AATruckArmor
    DamageFX        = TruckDamageFX
  End
  CommandSet        = Israel_VehicleIronDomeMobileCommandSet
  ExperienceValue     = 200 200 200 200
  CrusherLevel           = 2
  CrushableLevel         = 2
  IsTrainable = Yes

  VoiceSelect = PatriotBatterySelect
  VoiceMove             = QuadCannonVoiceMove
  VoiceAttack           = QuadCannonVoiceAttack
  VoiceAttackAir        = QuadCannonVoiceAttackAir
  VoiceGuard             = QuadCannonVoiceMove
  SoundMoveStart        = QuadCannonMoveStart
  SoundMoveStartDamaged = QuadCannonMoveStart
  UnitSpecificSounds
    VoiceCreate         = QuadCannonVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = NoSound
    TruckLandingSound    = NoSound
    TruckPowerslideSound = NoSound
  End

  RadarPriority   = UNIT
  KindOf     = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE

  Body  = ActiveBody ModuleTag_02
    MaxHealth     = 1000.0
    InitialHealth = 1000.0
    SubdualDamageCap = 1200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End

  Behavior = StealthDetectorUpdate ModuleTag_03
    DetectionRate             = 900
    DetectionRange            = 300
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
  End

  Behavior = AIUpdateInterface ModuleTag_06
    Turret
      TurretTurnRate        = 60
      TurretPitchRate       = 60
      AllowsPitch           = Yes
      NaturalTurretPitch    = 1
      GroundUnitPitch       = 40
      MinPhysicalPitch      = -20
      ControlledWeaponSlots = PRIMARY
      MinIdleScanInterval   = 550
      MaxIdleScanInterval   = 950
      MinIdleScanAngle      = 0
      MaxIdleScanAngle      = 360
    End
    AutoAcquireEnemiesWhenIdle = Yes
  End

  Locomotor = SET_NORMAL Generic8x8Locomotor

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 200.0
  End

  Behavior = SlowDeathBehavior ModuleTag_07
    DeathTypes = ALL -CRUSHED -SPLATTED
    DestructionDelay = 500
    DestructionDelayVariance = 500
    FX  = INITIAL  FX_CrusaderCatchFire
    FX  = FINAL    FX_UnguidedRocketExplosion
  End
  Behavior = FlammableUpdate ModuleTag_08
    AflameDuration   = 5000
    AflameDamageAmount    = 5
    AflameDamageDelay     = 500
  End
  Behavior = TransitionDamageFX ModuleTag_09
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionSmallSmoke
  End
  Behavior = FXListDie ModuleTag_10
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = DestroyDie ModuleTag_11
    DeathTypes = NONE +CRUSHED +SPLATTED
  End
  Behavior = CreateCrateDie ModuleTag_12
    CrateData = SalvageCrateData
  End

  Geometry                 = Box
  GeometryIsSmall          = Yes
  GeometryMajorRadius      = 14.0
  GeometryMinorRadius      = 7.0
  GeometryHeight           = 5.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45
End
