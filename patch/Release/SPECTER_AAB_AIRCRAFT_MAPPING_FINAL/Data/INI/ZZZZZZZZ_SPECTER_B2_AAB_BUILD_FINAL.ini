; Model/placement unchanged (US_AirField @ Scale 1.60 Attach).
; No Strategy Center / Science / Upgrade locks on these CommandButtons.
; Does not touch Dozer CommandSet, Russia, or aircraft mapping architecture.
;==============================================================================

; --- UNIT_BUILD buttons (restriction-free) ---
