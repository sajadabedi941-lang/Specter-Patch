;==============================================================================
; FINAL: America_AdvancedAirBase production CommandSet (last-wins)
; Load order: ZZZZZZZZ_ sorts after CommandSet_ZZZZ_* / other CommandSet files.
; Loose Data INI last-wins overlay. Does not rebuild BIG files.
; Advanced Air Base replaces Strategy Center on the USA dozer.
; Scale 2.0x set on America_AdvancedAirBase object overlays.
; Normal AmericaAirfieldCommandSet is NOT overridden here.
; Build list: B-52, B-2, B-21, F-117, E-3 only (no C-5).
;==============================================================================

; --- CommandButton: AAB B-2 production target ---
CommandButton Command_ConstructPatch_America_B2
  Command       = UNIT_BUILD
  Object        = Patch_America_B2
  TextLabel     = CONTROLBAR:ConstructAmericaJetB2Spirit
  ButtonImage   = us_b1r
  ButtonBorderType = BUILD
  DescriptLabel = CONTROLBAR:ToolTipUSABuildB2Spirit
End

; --- Advanced Air Base production: five existing aircraft ---
CommandSet America_AdvancedAirBaseCommandSet
  1  = Command_ConstructPatch_America_B52
  2  = Command_ConstructPatch_America_B2
  3  = Command_ConstructPatch_America_B21
  4  = Command_ConstructAmericaJetStealthFighter
  5  = Command_ConstructPatch_America_E3
  13 = Command_SetRallyPoint
  14 = Command_Sell
End
