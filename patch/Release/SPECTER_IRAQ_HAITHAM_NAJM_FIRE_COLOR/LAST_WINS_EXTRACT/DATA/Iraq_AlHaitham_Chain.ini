; Haitham ICBM chain cloned from AlAbid/Hussiean. Parents are not modified.

Object Projectile_Iraq_AlHaitham_AlAbid
Scale = 0.9
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ParticlesAttachedToAnimatedBones = Yes
    ConditionState
      Model = Irq_AlHaithamM
      ParticleSysBone = ENGINE01 LRBM_Trail
      ParticleSysBone = ENGINE01 LRBM_Flare
    End
    ConditionState = POWER_PLANT_UPGRADED
      Model = NONE
    End
  End

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:Alhusain
  EditorSorting    = SYSTEM
  VisionRange      = 0.0
  ArmorSet
    Conditions      = None
    Armor           = InvulnerableAllArmor
    DamageFX        = None
  End
  SoundAmbient  = GenericMissileAmbientLoop
  ; *** ENGINEERING Parameters ***
  RadarPriority = NOT_ON_RADAR
  KindOf = PROJECTILE BALLISTIC_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 6800.0
    InitialHealth   = 6800.0
  End
; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = ALL
  End
; ---- end Projectile death behaviors
    
  Behavior = PhysicsBehavior ModuleTag_06
    Mass = 1
  End
  ;Behavior = FireWeaponUpdate ModuleTag_BitsPopOff
    ;Weapon = TubedMissilesLauchingCapBitsPopOffTube
    ;InitialDelay = 450
  ;End
  Behavior = CreateObjectDie ModuleTag_Alarm2
    DeathTypes = ALL
    CreationList = OCL_ICBM_AfterStrikeAlarm_HE
  End
  Behavior = PowerPlantUpgrade ModuleTag_IBK
    TriggeredBy = Upgrade_ICBM_BoosterKiller
  End
  Behavior = PowerPlantUpdate ModuleTag_IBKT
    RodsExtendTime = 11500
  End
  Behavior = MissileAIUpdate ModuleTag_07
    DetonateCallsKill = Yes
    TryToFollowTarget = No 
    FuelLifetime = 0
    IgnitionDelay = 0
    InitialVelocity = 9               ; in dist/sec
    DistanceToTravelBeforeTurning = 1450
    DistanceToTargetBeforeDiving = 800 ; When I hit this close to target, I ignore PreferredHeight.
    IgnitionFX = FX_IskanderFiringEffects ;FX_ICBM_MissileLaunchIgnition
  End
  Locomotor = SET_NORMAL AlhussaienMissileLocomotor
  Behavior = CreateObjectDie ModuleTag_10
    DeathTypes = ALL
    CreationList = OCL_AlHaitham_AlAbidReentry
  End
  Geometry = Cylinder ; Since collision extents can't tilt, this is a little fake
  GeometryMajorRadius = 4.0
  GeometryHeight = 4.0
  GeometryIsSmall = Yes
End
;-----------------------------------------------------------------------------

