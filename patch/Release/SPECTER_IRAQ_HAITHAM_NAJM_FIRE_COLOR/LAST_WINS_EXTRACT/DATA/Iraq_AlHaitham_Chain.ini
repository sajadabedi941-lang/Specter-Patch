Object Projectile_Iraq_AlHaitham_AlAbidRV
Scale = 0.9
  ; *** ART Parameters ***
  Draw                   = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model              = Iraq_Alhusain_W
      ;ParticleSysBone    = Engine01 GenericMirvWarheadExhaust
      ;ParticleSysBone    = Engine01 SmallCruiseMissileFlare
      ParticleSysBone    = Engine01 AGM_MissileLenzFlare
      ParticleSysBone    = Engine01 UnguidedRocketEngineFlare
    End
    ConditionState       = JAMMED
      ParticleSysBone    = None SparksMedium
    End
  End
  ; ***DESIGN parameters ***
  DisplayName            = OBJECT:Warhead
  EditorSorting          = SYSTEM
  VisionRange            = 0.0
  ShroudClearingRange    = 100
  ArmorSet
    Conditions           = None
    Armor                = MirvWarHeadArmor
    DamageFX             = None
  End
  ; *** AUDIO Parameters ***
  SoundAmbient           = GenericMissileAmbientLoop
  ; *** ENGINEERING Parameters ***
  KindOf                 = PROJECTILE SMALL_MISSILE
  Body                   = ActiveBody ModuleTag_02
    MaxHealth            = 2000.0
    InitialHealth        = 2000.0
    SubdualDamageCap        = 200
    SubdualDamageHealRate   = 100000
    SubdualDamageHealAmount = 50
  End
; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    FX         = FX_GenericMissileDeath
  End
; ---- end Projectile death behaviors
; ---- Explosion
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_0RV
    DeathWeapon   = Weapon_Iraq_AlHaitham_AlAbidWH
    StartsActive  = Yes
  End
  Behavior        = FireWeaponUpdate ModuleTag_Alarm
    Weapon        = ICBM_BeforeStrikeAlarm
  End
  Behavior        = FireWeaponUpdate ModuleTag_Alarm2
    Weapon        = SpecterTacticalNuclearWarheadMarkIcon
  End
; ---- End Of Explosion
; ---- Flight Profile
  Behavior         = PhysicsBehavior ModuleTag_07
    Mass           = 1
  End
  Behavior                = MissileAIUpdate ModuleTag_08
    DetonateCallsKill     = Yes
    TryToFollowTarget     = No
    FuelLifetime          = 9999999999
    InitialVelocity       = 75                ; in dist/sec
    IgnitionDelay         = 6
    IgnitionFX            = FX_JetMissileIgnition
    DistanceToTravelBeforeTurning = 1000
    DistanceToTargetBeforeDiving  = 2500
  End
  Locomotor             = SET_NORMAL MirvWarheadProjectileLocomotor
  Behavior              = NeutronMissileSlowDeathBehavior ModuleTag_HKQ
    DestructionDelay    = 80
    FXList              = FX_None
    Blast1Enabled       = Yes
    Blast1Delay         = 1
    Blast1InnerRadius   = 20.0
    Blast1OuterRadius   = 80.0
    Blast1MaxDamage     = 0.0
    Blast1MinDamage     = 0.0
    Blast1ToppleSpeed   = 0.5  
    Blast1PushForce     = 10.0
    Blast2Enabled       = No
    Blast3Enabled       = No
    Blast4Enabled       = No
    Blast5Enabled       = No
    Blast6Enabled       = No
    Blast7Enabled       = No
    Blast8Enabled       = No
    Blast9Enabled       = No    
  End
; ---- End Of Flight Profile
  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0

End
