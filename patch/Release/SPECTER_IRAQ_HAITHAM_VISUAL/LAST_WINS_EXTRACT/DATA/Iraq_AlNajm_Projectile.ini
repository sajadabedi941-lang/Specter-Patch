; Najm projectile cloned from MRBM_Raad2_Object. Parent is not modified.
Object Projectile_Iraq_AlNajm
;Scale = 0.9
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState
      Model = Irq_AlNajmM
      ParticleSysBone = ENGINE01 GMLRS_LG_Trail ;LRBM_Trail
      ParticleSysBone = ENGINE01 LRBM_Flare2 ;LargeSAMMissilesFlare
      ParticleSysBone = ENGINE01 AGM_MissileLenzFlare
    End
    ConditionState = POWER_PLANT_UPGRADED
      Model = Raad2W
    End
  End
  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:Raad2
  EditorSorting   = SYSTEM
  VisionRange = 50.0
  ShroudClearingRange = 50
  ArmorSet
    Conditions      = None
    Armor           = CruiseMissileArmor
    DamageFX        = None
  End
  SoundAmbient  = GenericMissileAmbientLoop
  ; *** ENGINEERING Parameters ***
  RadarPriority = LOCAL_UNIT_ONLY
  KindOf = PROJECTILE SMALL_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 2000.0
    InitialHealth   = 2000.0
    SubdualDamageCap = 200
    SubdualDamageHealRate = 100000
    SubdualDamageHealAmount = 50
  End
; ---- begin Projectile death behaviors
  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
    ; we detonated normally.
    ; no FX, just quiet destroy ourselves
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    ; shot down by laser.
    FX         = FX_GenericMissileDisintegrate
    OCL        = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    ; shot down by nonlaser.
    FX         = FX_GenericMissileDeath
  End
  Behavior = PowerPlantUpgrade ModuleTag_IBK
    TriggeredBy = Upgrade_ICBM_BoosterKiller
  End
  Behavior = PowerPlantUpdate ModuleTag_IBKT
    RodsExtendTime = 2500
  End
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_f43y
    DeathWeapon   = Weapon_Iraq_AlNajm_Warhead
    StartsActive  = Yes
  End
;---------- Radar Signature --------------- ;
  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE
  End
;---------- End Of Radar Signature ----------;
; ---- end Projectile death behaviors
  Behavior = PhysicsBehavior ModuleTag_05v54yh
    Mass                  = 100
  End
  Behavior = MissileAIUpdate ModuleTag_c343t
    DetonateCallsKill = Yes
    TryToFollowTarget = No
    FuelLifetime = 0
    IgnitionDelay = 0
    InitialVelocity = 310               ; in dist/sec
    DistanceToTravelBeforeTurning = 200
    DistanceToTargetBeforeDiving = 500 ; When I hit this close to target, I ignore PreferredHeight.
  End
  Locomotor = SET_NORMAL PGMRaad2RocketLocomotor
  Geometry = Cylinder ; Since collision extents can't tilt, this is a little fake
  GeometryMajorRadius = 4.0
  GeometryHeight = 4.0
  GeometryIsSmall = Yes 
  Shadow = SHADOW_DECAL
End
;------------------------------------------------------------------------------
