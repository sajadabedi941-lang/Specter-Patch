; Per-object rebuild after firing. Rebuild Cost = Price * 0.50.
; Type = OBJECT so each TEL pays its own reactivation, not a player-wide flag.
; Command_BuyAlhussaienMissile / OBJECT_UPGRADE is the SPECTER paid-rearm pattern.

Upgrade Upgrade_Iraq_AlHusseinII_Rebuild
  DisplayName      = UPGRADE:Iraq_AlHusseinII_Rebuild
  Type             = OBJECT
  BuildCost        = 900
  BuildTime        = 25.0
  ButtonImage      = specter_missile_b
End

