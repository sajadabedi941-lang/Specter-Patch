; AL-Fahd 500 weapon last-wins.
; Packed as Data\INI\Weapon\Weapon_Iraq_AlFahd500.ini so TheWeaponStore loads it
; after Weapon.ini. Do NOT ship this at Data\INI\Weapon_Iraq_AlFahd500.ini
; (that path is not loaded).
;
; MOTHER baseline (DO NOT CHANGE Iraq_R11ScudB / SRBM_ALHIJARAH_HE / HE_9M729_450kg):
;   AttackRange 1720 = 1000 km scale
;   PrimaryDamage 2000 = 400 kg warhead
;   ScatterRadius 175 = 10/100 accuracy
;   HE_9M729_450kg PrimaryDamage 2200 = MOTHER impact warhead extra
;
; Al-Fahd500 Radar Stealth 20/100 = 4x MOTHER projectile travel speed
; (WeaponSpeed 280→1120). Range/accuracy equal to MOTHER. Warhead 4x.

Weapon Weapon_Iraq_AlFahd500
  PrimaryDamage               = 8000.0
  PrimaryDamageRadius         = 80.0
  SecondaryDamage             = 400.0
  SecondaryDamageRadius       = 10.0
  ScatterRadius               = 175
  ScatterRadiusVsInfantry     = 280.0
  AttackRange                 = 1720.0
  MinimumAttackRange          = 800.0
  PreAttackDelay              = 500
  PreAttackType               = PER_SHOT
  DamageType                  = ARMOR_PIERCING
  DeathType                   = EXPLODED
  FireFX                      = FX_IskanderFiringEffects
  ProjectileObject            = Projectile_Iraq_AlFahd500
  ProjectileDetonationFX      = FX_SmallSRBM_Explosion
  RadiusDamageAffects         = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  FireSound                   = Iskander_Firing
  WeaponSpeed                 = 1120
  AcceptableAimDelta          = 360
  DelayBetweenShots           = 3000
  ClipSize                    = 1
  ClipReloadTime              = 95000
  ShockWaveAmount             = 680.0
  ShockWaveRadius             = 150.0
  ShockWaveTaperOff           = 0.33
  AntiGround                  = Yes
End

; 4x MOTHER death-warhead HE_9M729_450kg (2200 -> 8800). Dedicated so the
; shared 9P117 death weapon is not mutated.
Weapon Weapon_Iraq_AlFahd500_Warhead
  PrimaryDamage           = 8800
  PrimaryDamageRadius     = 20.0
  AttackRange             = 1
  DamageType              = HACK
  DeathType               = EXPLODED
  WeaponSpeed             = 9999999999
  RadiusDamageAffects     = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  ClipSize                = 1
  ProjectileCollidesWith  = STRUCTURES
End
