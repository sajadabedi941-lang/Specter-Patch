; SPECTER last-wins: Israel AirF-cloned dozer slot 14 Clear Mines -> missile factory.
; IsraelDozerCommandSet (starting dozer) already constructs Israel_MissileFactory at 14.
; AirF_AmericaDozerCommandSet is the remaining Israel-side Clear Mines slot
; (AirF_AmericaVehicleDozer Side=Israel, produced from AirF_AmericaCommandCenter).
; Other countries' Command_DisarmMinesAtPosition slots are not in this overlay.

