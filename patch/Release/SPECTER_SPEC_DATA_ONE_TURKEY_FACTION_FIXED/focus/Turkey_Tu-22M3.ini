;SPECTER REPAIR - Turkey_Tu-22M3
; Donor: Russia RussiaJetTu22M3M (Armed Forces Of Russian Federation/Airforce/TU22M3M.ini)
; Identity: Turkey_Tu-22M3 + Side=Turkey + SCIENCE_Turkey_Tu-22 + Turkey_MIC
; Role: Turkish strategic bomber
; Fixed: invalid missing W3D model + Iraqi portrait removed
; Uses working RUS_TU22M3M model/animation and Russia Tu-22M3M weapon sets
Object Turkey_Tu-22M3
Scale = 0.8

  ; *** ART Parameters ***
  SelectPortrait         = rus_tu22m3m
  ButtonImage            = rus_tu22m3m
  
  
  UpgradeCameo1 = Upgrade_Turkey_Countermeasures
  UpgradeCameo2 = Upgrade_Turkey_PrecisionMunitions
  ;UpgradeCameo4 = Upgrade_FAB500
  ;UpgradeCameo5 = NONE
  
  Draw = W3DModelDraw ModuleTag_01

    OkToChangeModelColor = Yes

    DefaultConditionState
      Model               = RUS_TU22M3M
      HideSubObject       = BurnerFX01 BurnerFX02
      Animation           = RUS_TU22M3M.RUS_TU22M3M
      AnimationMode       = ONCE_BACKWARDS
      WeaponLaunchBone    = PRIMARY   MISSILE
      WeaponFireFXBone    = SECONDARY WeaponA
      WeaponLaunchBone    = SECONDARY Weaponb
      WeaponLaunchBone    = TERTIARY  WeaponC
    End

    ConditionState        = JETEXHAUST
      ; exhaust
      ParticleSysBone     = WINGTIP01 JetContrail
      ParticleSysBone     = WINGTIP02 JetContrail
      Animation           = RUS_TU22M3M.RUS_TU22M3M
      AnimationMode       = ONCE
      TransitionKey       = TRANS_JETEXHAUST
      ParticleSysBone     = ENGINE01 SpectreEngineFlare2
      ParticleSysBone     = ENGINE02 SpectreEngineFlare2
      ParticleSysBone     = ENGINE01 SpectreAfterburnerTrail
      ParticleSysBone     = ENGINE02 SpectreAfterburnerTrail
    End

    
    ConditionState        = JETEXHAUST JETAFTERBURNER
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail

      Animation           = RUS_TU22M3M.RUS_TU22M3M
      AnimationMode       = ONCE_BACKWARDS
      ; afterburner
      ShowSubObject       = BurnerFX01 BurnerFX02
      ParticleSysBone     = Engine01 JetLenzflare
      ParticleSysBone     = Engine02 JetLenzflare
    End

    ConditionState        = REALLYDAMAGED
      Model               = RUS_TU22M3M
      ; damage
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
    End
    
    ConditionState        = REALLYDAMAGED JETEXHAUST
      Model               = RUS_TU22M3M
      ; damage
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End

    ConditionState        = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
      Model               = RUS_TU22M3M
      ; damage
      ParticleSysBone     = Smoke01 JetSmoke
      ParticleSysBone     = Engine01 JetEngineDamagedSmoke
      ; afterburner
      ShowSubObject       = BurnerFX01 BurnerFX02
      ParticleSysBone     = Engine01 JetLenzflare
      ;ParticleSysBone     = Engine02 JetLenzflare
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End

    ConditionState        = RUBBLE
      Model               = RUS_TU22M3M
      HideSubObject       = None 
      ShowSubObject       = None
    End

    ConditionState        = RUBBLE JETEXHAUST JETAFTERBURNER
      Model               = RUS_TU22M3M
      ;HideSubObject is needed cause there're inherited from default condition state      
      HideSubObject       = None 
      ShowSubObject       = None
      ParticleSysBone     = Engine01 JetExhaust
      ParticleSysBone     = Engine02 JetExhaust
      ; exhaust
      ParticleSysBone     = Wingtip01 JetContrail
      ParticleSysBone     = Wingtip02 JetContrail
    End

    OkToChangeModelColor = Yes

  End

  ; ***DESIGN parameters ***
  DisplayName             = OBJECT:Turkey_Tu-22M3
  EditorSorting           = VEHICLE
  Side                    = Turkey
  TransportSlotCount      = 0 ;how many "slots" we take in a transport (0 == not transportable)
  VisionRange             = 700.0 
  ShroudClearingRange     = 200
  MaxSimultaneousOfType   = 6
  WeaponSet
    Conditions            = None 
    Weapon                = PRIMARY    3x_FAB500_TU22M3M_CRF
    Weapon                = SECONDARY  3x_FAB500_TU22M3M_CRB
    Weapon                = TERTIARY   2x_FAB500_TU22M3M_WR
  End
  WeaponSet
    Conditions            = PLAYER_UPGRADE
    Weapon                = PRIMARY    KH101_CruiseMissile_TU22M3M
    Weapon                = SECONDARY  SVP-24-22_TU22M3M
  End
  Prerequisites
    Science = SCIENCE_Turkey_Tu-22
    Object = Turkey_MIC
  End
  
  ArmorSet
    Conditions            = None
    Armor                 = CountermeasuresAirplaneArmor
    DamageFX              = None
  End


  BuildCost           = 1615
  BuildTime           = 24.3   
  ExperienceValue         = 150 150 275 475  ;Experience point value at each level
  ExperienceRequired      = 0 400 1000 1600   ;Experience points needed to gain each level
  IsTrainable             = Yes             ;Can gain experience
  CrusherLevel           = 1  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet              = GenericTacticalBomberCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect            = Spec_RUS_TU22_Select
  VoiceMove              = Spec_RUS_TU22_Move
  VoiceAttack            = Spec_RUS_TU22_Attack
  VoiceAttackAir         = Spec_RUS_TU22_Attack
  VoiceGuard             = Spec_RUS_TU22_Move
  SoundAmbient           = RaptorAmbientLoop
  SoundAmbientRubble     = NoSound
  UnitSpecificSounds
    VoiceCreate          = Spec_RUS_TU22_Created
    SoundEject           = Spec_RUS_Eject
    VoiceEject           = Spec_RUS_Eject
    Afterburner          = RaptorAfterburner
    VoiceLowFuel         = Spec_RUS_TU22_UA
    VoiceGarrison        = Spec_RUS_TU22_Move
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = SALVAGER PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT CANNOT_RETALIATE
  Body                   = ActiveBody ModuleTag_02
    MaxHealth            = 700.0
    InitialHealth        = 700.0
  End
 
  Behavior                          = JetSlowDeathBehavior ModuleTag_03
    FXOnGroundDeath                 = FX_JetOnGroundDeath
    OCLOnGroundDeath                = OCL_MIGDeathFinalBlowUp
    DestructionDelay                = 99999999  ; destruction will happen when we
    RollRate                        = 0.2
    RollRateDelta                   = 100%      ;each frame, rollrate = rollrate * rollrateDelta
    PitchRate                       = 0.0
    FallHowFast                     = 110.0%    ;Bigger is faster (can be over 100%,it's a fraction of gravity)
    FXInitialDeath                  = FX_MigDeathInitial
    OCLInitialDeath                 = OCL_MIGDeathInitial
    DelaySecondaryFromInitialDeath  = 500       ; in milliseconds
    FXSecondary                     = FX_JetDeathSecondary
    OCLSecondary                    = OCL_MIGDeathSecondary
    FXHitGround                     = FX_JetDeathHitGround
    OCLHitGround                    = OCL_MIGDeathHitGround
    DelayFinalBlowUpFromHitGround   = 200       ; in milliseconds
    FXFinalBlowUp                   = FX_JetDeathFinalBlowUp
    ;OCLFinalBlowUp                  = OCL_MIGDeathFinalBlowUp
  End

  Behavior                = ArmorUpgrade ModuleTag_Armor25
    TriggeredBy           = Upgrade_Turkey_Countermeasures
  End
  Behavior = WeaponSetUpgrade ModuleTag_MTS
    TriggeredBy = Upgrade_Turkey_PrecisionMunitions
  End

  Behavior                = CountermeasuresBehavior ModuleTag_10
    TriggeredBy           = Upgrade_Turkey_Countermeasures
    FlareTemplateName     = RussiaSystemCountermeasureFlare
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 3     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = -90.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 5.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 180  ; Time between flare volleys
    NumberOfVolleys       = 4     ; Number of times the volleys will fire before reloading
    ReloadTime            = 1700     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 55%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 100     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 200   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End

  Behavior                = CountermeasuresBehavior ModuleTag_Chaffs
    TriggeredBy           = Upgrade_Turkey_Countermeasures
    FlareTemplateName     = CountermeasureFlare
    FlareBoneBaseName     = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize            = 2     ; Number of flares launched per volley (requires bones)
    VolleyArcAngle        = 100.0  ; Max angle of flare relative to forward direction (with VolleySize of 1, flare will always goes straight back).
    VolleyVelocityFactor  = 4.0   ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys   = 200  ; Time between flare volleys
    NumberOfVolleys       = 2     ; Number of times the volleys will fire before reloading
    ReloadTime            = 2000     ; After all volleys launched, then reloading must occur. If 0, then reloading occurs at airstrip only.
    EvasionRate           = 68%   ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 100     ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay     = 200   ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End

  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 500.0
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_SAP14
    WeaponTemplate        = KNIRTI_SAP_14
    PrimaryTargetTypes    = INERT
    ScanRate              = 1000
    ScanRange             = 400
    PredictTargetVelocityFactor = 3.0
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_SAP14A
    WeaponTemplate        = KNIRTI_SAP_14_SU35_AHAM
    PrimaryTargetTypes    = PROJECTILE
    ScanRate              = 1000
    ScanRange             = 400
    PredictTargetVelocityFactor = 3.0
  End
  Behavior = CreateObjectDie ModuleTag_Deletion
    DeathTypes   = NONE +EXTRA_6
    CreationList = None
  End

  Behavior = JetAIUpdate ModuleTag_06
    OutOfAmmoDamagePerSecond  = 10%     ; amount of damage to take per SEC (not per frame) when out of ammo
                                        ; note that it's expressed as a percent of max health, not an absolute
    TakeoffDistForMaxLift     = 0%   ; larger numbers give more lift sooner when taking off
    TakeoffPause              = 1500
    MinHeight                 = 5
    ReturnToBaseIdleTime      = 10000         ; if idle for this long, return to base, even if not out of ammo
    AutoAcquireEnemiesWhenIdle    = No
    MoodAttackCheckRate           = 1
  End
  Locomotor = SET_NORMAL NK-32-02_JetEngine
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor


  Behavior = FlammableUpdate ModuleTag_08
    AflameDuration = 5000        ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500      ; this often.
  End
  Behavior                       = TransitionDamageFX ModuleTag_09
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End


  Behavior = ProductionUpdate ModuleTag_133d2
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
;---------- Radar Signature --------------- ;
  Behavior = FireWeaponWhenDamagedBehavior ModuleTag_RS
    StartsActive                = Yes
    ReactionWeaponPristine      = RadarWaveEmitter
    ReactionWeaponDamaged       = RadarWaveEmitter
    ReactionWeaponReallyDamaged = RadarWaveEmitter
    ReactionWeaponRubble        = RadarWaveEmitter
    DamageTypes                 = NONE +MICROWAVE
  End
;---------- End Of Radar Signature ----------;

  Geometry = Cylinder
  GeometryIsSmall = Yes
  GeometryMajorRadius = 40.0
  GeometryMinorRadius = 25.0
  GeometryHeight = 15.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89  ; minimum elevation angle above horizon. Used to limit shadow length
  
End
