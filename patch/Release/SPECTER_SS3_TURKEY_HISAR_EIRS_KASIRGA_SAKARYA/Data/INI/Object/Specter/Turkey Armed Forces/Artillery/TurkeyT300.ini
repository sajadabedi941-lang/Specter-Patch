; Independent from TurkeyT122 (IRHM20 / 122mm Grad salvo) and from
; existing Turkey_TRG300 (BM-30 clone). Command_ConstructTurkeyVehicleKasirga
; is not reused.
; CWC T300_Rocket_Launcher / CWCruS300Locomotor / OCL_kaqiushache
; replaced with live TomahawkMissileWeapon. DeployStyleAIUpdate kept.

