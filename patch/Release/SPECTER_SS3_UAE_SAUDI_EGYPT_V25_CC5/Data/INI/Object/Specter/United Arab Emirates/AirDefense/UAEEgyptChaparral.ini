; SPECTER SS3 — Egypt V25 MIM-72 Chaparral
; V25 Object EgyptChapral. Models SDEGMIM48 + SDEGMIM48w, cameo EgyChaprral.
; Dropped CWC brake/housecolor draws (CWCusM48_l / CWCusHC_B).
; USAFCZ -> PatriotMissileWeaponAir. ArmorAntiAirArmor -> AntiAirVehicle.
; M60Locomotor is not in SS3 Locomotor.ini; CrusaderLocomotor is the live tank substitute.
; Unique UAE Object.

Object UAEEgyptChaparral
  SelectPortrait = EgyChaprral
  ButtonImage    = EgyChaprral

  Draw = W3DTankDraw ModuleTag_01
    OkToChangeModelColor = No
    ExtraPublicBone = CORE
    ProjectileBoneFeedbackEnabledSlots = PRIMARY
    DefaultConditionState
      Model = SDEGMIM48
      Turret = TURRET01
      TurretPitch = TURRETEL_E
      WeaponLaunchBone = PRIMARY MISSILE
      WeaponFireFXBone = PRIMARY MISSILE
    End
    ConditionState = REALLYDAMAGED
      Model = SDEGMIM48
      Turret = TURRET01
      TurretPitch = TURRETEL_E
      WeaponLaunchBone = PRIMARY MISSILE
      WeaponFireFXBone = PRIMARY MISSILE
    End
    ConditionState = RUBBLE
      Model = SDEGMIM48
    End
    TrackMarks = EXTnkTrack.tga
    TreadAnimationRate = 0.75
    TreadDriveSpeedFraction = 0.3
    TreadPivotSpeedFraction = 0.6
  End

  Draw = W3DTruckDraw ModuleTag_TracksDraw
    OkToChangeModelColor = No
    ParticlesAttachedToAnimatedBones = Yes
    AttachToBoneInAnotherModule = CORE
    DefaultConditionState
      Model = SDEGMIM48w
    End
    RightFrontTireBone = TIRE01
    LeftFrontTireBone = TIRE02
    MidRightFrontTireBone = TIRE03
    MidLeftFrontTireBone = TIRE04
    MidRightMidTireBone = TIRE05
    MidLeftMidTireBone = TIRE06
    MidLeftRearTireBone = TIRE07
    MidRightRearTireBone = TIRE08
    TireRotationMultiplier = 0.4
  End

  DisplayName = Chapral_AA
  Side = UAE
  EditorSorting = VEHICLE
  TransportSlotCount = 9
  MaxSimultaneousOfType = 10
  MaxSimultaneousLinkKey = Patch_AirDefense
  WeaponSet
    Conditions = None
    Weapon = PRIMARY PatriotMissileWeaponAir
    AutoChooseSources = PRIMARY FROM_PLAYER FROM_AI FROM_SCRIPT
    PreferredAgainst = PRIMARY AIRCRAFT BALLISTIC_MISSILE
  End
  ArmorSet
    Conditions = None
    Armor = AntiAirVehicle
    DamageFX = TankDamageFX
  End
  BuildCost = 1000
  BuildTime = 25.0
  VisionRange = 250
  ShroudClearingRange = 175
  Prerequisites
  End
  CrusherLevel = 2
  CrushableLevel = 2
  CommandSet = ChinaVehicleBattleMasterCommandSet
  VoiceSelect = AvengerVoiceSelect
  VoiceMove = AvengerVoiceMove
  VoiceGuard = AvengerVoiceMove
  VoiceAttack = AvengerVoicePaint
  VoiceAttackAir = AvengerVoiceAttack
  SoundMoveStart = InfernoCannonMoveStart
  SoundMoveStartDamaged = InfernoCannonMoveStart
  UnitSpecificSounds
    VoiceCreate = AvengerVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop
    VoiceCrush = AvengerVoiceMove
    VoiceEnter = AvengerVoiceMove
  End
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 350.0
    InitialHealth = 350.0
    SubdualDamageCap = 440
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate = 70
      TurretPitchRate = 70
      AllowsPitch = Yes
      FirePitch = 45
      FiresWhileTurning = No
      ControlledWeaponSlots = PRIMARY
      MinIdleScanInterval = 1000
      MaxIdleScanInterval = 2000
      MinIdleScanAngle = 25
      MaxIdleScanAngle = 45
    End
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate = 150
  End
  Locomotor = SET_NORMAL CrusaderLocomotor
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 40.0
  End
  Behavior = SlowDeathBehavior ModuleTag_Death
    DeathTypes = ALL -CRUSHED -SPLATTED
    DestructionDelay = 500
    DestructionDelayVariance = 500
    FX = INITIAL FX_CrusaderCatchFire
    OCL = FINAL OCL_2K12DeathEffect
    FX = FINAL FX_FreeFallBombsDetonation
  End
  Behavior = DestroyDie ModuleTag_CrushDie
    DeathTypes = NONE +CRUSHED +SPLATTED
  End
  Behavior = FXListDie ModuleTag_CrushFX
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = TransitionDamageFX ModuleTag_DamageFX
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = FlammableUpdate ModuleTag_Flame
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End
  Scale = 0.85
  Geometry = BOX
  GeometryMajorRadius = 13.0
  GeometryMinorRadius = 9.0
  GeometryHeight = 10
  GeometryIsSmall = Yes

End
