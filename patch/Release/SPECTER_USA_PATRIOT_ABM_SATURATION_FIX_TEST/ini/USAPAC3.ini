; SPECTER America PAC-3 TEL from New Donor (ss1 baseline)
; Vehicle / Draw / DeployStyle / bones / locomotor / CommandSet: New Donor Object USAPAC3
; AA: ss1 8x_LRSAM_THAAD / THAAD_AA_OBJECT (unchanged).
; ABM: Patriot-local CRUSH warhead. Stock THAADMissile_ABM / THAAD_ABM_OBJECT
; cannot kill SPECTER ballistic missiles (see ABM notes below).
; FirePoints stay Donor FIREPOINT/FIREFX prefixes. Unpack is DeployStyle on attack.
; America CC slot 6 already builds Object USAPAC3 in ss1 CommandSet.ini. Loose Data is not edited.

; ABM damage chain (why stock THAAD ABM does not kill SPECTER BMs):
; 1. BallisticMissileArmor / SRBMArmor: FALLING=0% WATER=0% PENALTY=0% CRUSH=100%.
; 2. Loose Data\INI\Weapon.ini first-wins THAADMissile_ABM as FALLING (packed is CRUSH).
;    estimateWeaponDamage=0 would block some shots; a launched FALLING hit still does 0.
; 3. THAAD_ABM_OBJECT FireWeaponUpdate fuzes: Generic_ABM_Missile_Fuze=WATER,
;    AMW_KintecEnergyDamage=FALLING. Both 0% vs BM armor. That is the visible
;    "intercept" with no kill.
; 4. THAAD_ABM_OBJECT ClientUpdate is a module and consumes its own End.
;    Geometry after that End is still on the Object (see THAAD_AA_OBJECT1).
;    Working HQ-9 ABM uses DamageType CRUSH, CAN_ATTACK, DistanceToTargetForLock,
;    and geometry on the Object. S-400 4x_MRSAM_9M96E2 uses CRUSH +
;    ProjectileCollidesWith=ENEMIES.
; Patriot-local templates below copy that working warhead path. Object US_THAAD
; and stock THAADMissile_ABM / THAAD_ABM_OBJECT are not edited.
;
; ABM saturation (5 Patriots vs ~10 simultaneous BMs, ~4 kills on crash-fix pack):
; ZH AI is one victim until that object dies. findClosestEnemy makes a battery
; pile onto the same closest BM. Default MoodAttackCheckRate is 2s after idle.
; DelayBetweenShots=800 dumps extra interceptors into that one BM and empties
; ClipSize=8 after a few sequential waves (matches ~4/10 then ClipReloadTime
; 8500). Working SPECTER ABM spreads via hidden FCS (MoodAttackCheckRate=1)
; plus STATUS MASKED lock; Patriot has one AI and no FCS. MASKED lock needs a
; new lock weapon / Object and is not added here (miss would leave a MASKED BM
; untargetable). Levers below stay on Object USAPAC3 only.

Weapon USAPAC3_ABM_Fuze
  PrimaryDamage          = 99999
  PrimaryDamageRadius    = 10
  AttackRange            = 75
  DamageType             = CRUSH
  DeathType              = LASERED
  WeaponSpeed            = 999999.0
  AcceptableAimDelta     = 360
  AntiBallisticMissile   = Yes
  AntiSmallMissile       = Yes
  RadiusDamageAffects    = ENEMIES
  ProjectileCollidesWith = ENEMIES
End

