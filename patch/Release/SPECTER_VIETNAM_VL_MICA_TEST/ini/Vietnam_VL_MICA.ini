; SPECTER Vietnam VL MICA
; Source: New Donor Object FranceVlmica (the only complete, buildable VL MICA
; in that pack). Taiwan Command Center in New Donor does not build it;
; Superweapon War Factory slot 8 does (comment: France or Taiwan).
; Independent Vietnam clone. FranceVlmica / Taiwan originals are not edited.
; Model/W3D/textures: New Donor LSFziyuan + Vlmica cameo + CWCruS300_m missile.
; Combat/deploy: original RiderChangeContain + CWCruTEL stats.
; SPECTER FX/sound names replace missing CWC FXList/audio (documented below).
; Do not convert this unit into Patriot / THAAD.

; Suicide used by hidden deploy riders (copy of CWCgenSuicideWeapon).
Weapon Vietnam_VL_MICA_Suicide
  PrimaryDamage = 99999
  PrimaryDamageRadius = 75
  SecondaryDamage = 0
  SecondaryDamageRadius = 0
  AttackRange = 99999
  DamageType = HACK
  DeathType = EXTRA_2
  RadiusDamageAffects = SELF ALLIES SUICIDE
  WeaponSpeed = 99999
  ClipSize = 1
  ClipReloadTime = 99999
  DamageDealtAtSelfPosition = Yes
  LeechRangeWeapon = Yes
End

; Copy of New Donor CWCruTEL (FranceVlmica PRIMARY when deployed).
