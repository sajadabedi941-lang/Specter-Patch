; KM-SAM's own packed and deployed sets. These names do not exist in SS3.
; SouthKorea_CommandCenterCommandSet is restated here because this file
; sorts after CommandSet_zzzzzzzzzz_SPECTER_SS2_TunnelLoader.ini, which is
; the previous runtime winner. Slots 1, 4, 13 and 14 are that winner unchanged.
; Slot 2 is the only addition on that set.
;
; Live playable Korea does not use that bar. PlayerTemplate FactionSouthKorea
; StartingBuilding is SouthKorea_MilitaryHQ, whose CommandSet is
; SouthKorea_MilitaryHQCommandSet (packed SPECTER_PATCH: Dozer/Puma/E3A).
; That name is restated here so KM-SAM occupies the first empty slot (4)
; without replacing Puma on slot 2. No new CommandSet name. Korea only.
CommandSet SouthKorea_CommandCenterCommandSet
  1  = Command_ConstructSouthKorea_VT72B
  2  = Command_ConstructSouthKoreaKMSAM
  4  = Command_ConstructSouthKorea_VehicleDozerm
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

CommandSet SouthKorea_MilitaryHQCommandSet
  1  = Command_ConstructSouthKorea_VehicleDozer
  2  = Command_ConstructSouthKorea_TankPuma
  3  = Command_ConstructSouthKorea_E3A
  4  = Command_ConstructSouthKoreaKMSAM
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

CommandSet Korea_V25_PackedCommandSet
  1 = Command_Korea_V25_Deploy
  14 = Command_Stop
End

CommandSet Korea_V25_DeployedCommandSet
  1 = Command_Korea_V25_Pack
  14 = Command_Stop
End
