    TurretsMustCenterBeforePacking  = Yes
    ResetTurretBeforePacking        = Yes
  End

  Locomotor = SET_NORMAL ChinaVehicleDozerLocomotor
  Behavior  = PhysicsBehavior ModuleTag_04
