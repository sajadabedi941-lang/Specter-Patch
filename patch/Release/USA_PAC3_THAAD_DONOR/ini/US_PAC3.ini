; SPECTER America PAC-3 TEL — New Donor deploy architecture + THAAD combat.
; Source object: New Donor Data\INI\object\America.ini Object USAPAC3.
; Combat numbers/projectiles: cloned from US_THAAD FCS (US_M1120.ini is not edited).
; Produced by existing Command_ConstructUSAPAC3 (America CC slot 6). Loose Data\INI is not edited.
;
; Deploy is the native New Donor DeployStyleAIUpdate unpack (UsaPac3Car jack clip,
; then model swap to UsaPac3F). Command_ADSCombatMode / Command_ADS_ABM_CombatMode
; are FIRE_WEAPON SECONDARY/TERTIARY; those slots are US_PAC3_DeployCue (0 damage,
; no SELF SUICIDE, no OCL). Do not use S400R_Deploy / S400R_Pack on this object.
;
; Pack is native DeployStyle pack (move order). Command_FireControlPack is also
; FIRE_WEAPON SECONDARY and cannot pack a DeployStyle unit; this object therefore
; stays on S400ECommandSet_AA / _ABM after mode select (Deploy + Stop), not
; S400ECommandSet_Deployed.

Object USAPAC3
  SelectPortrait = USAPAC3
  ButtonImage    = USAPAC3

  Draw = W3DTruckDraw ModuleTag_01
    OkToChangeModelColor = No

    DefaultConditionState
      Model                           = UsaPac3Car
      Animation                       = UsaPac3Car.UsaPac3Car
      AnimationMode                   = ONCE
      Flags                           = MAINTAIN_FRAME_ACROSS_STATES PRISTINE_BONE_POS_IN_FINAL_FRAME
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = Turret01
      TurretPitch                     = TurretEL01
    End

    ConditionState                    = REALLYDAMAGED
      Model                           = UsaPac3Car_d
      Animation                       = UsaPac3Car_d.UsaPac3Car_d
      AnimationMode                   = ONCE
      Flags                           = MAINTAIN_FRAME_ACROSS_STATES PRISTINE_BONE_POS_IN_FINAL_FRAME
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = Turret01
      TurretPitch                     = TurretEL01
    End

    ConditionState                    = RUBBLE
      Model                           = UsaPac3Car_d
      Animation                       = UsaPac3Car_d.UsaPac3Car_d
      AnimationMode                   = ONCE
      Flags                           = MAINTAIN_FRAME_ACROSS_STATES PRISTINE_BONE_POS_IN_FINAL_FRAME
      ParticleSysBone                 = none TheDeathSmokeHeavy
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = Turret01
      TurretPitch                     = TurretEL01
    End

    ;*** PACKED STATE -- ready to move ***
    ConditionState                    = MOVING
      Model                           = UsaPac3Car
      Animation                       = UsaPac3Car.UsaPac3Car
      AnimationMode                   = ONCE_BACKWARDS
      Flags                           = START_FRAME_FIRST
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = Turret01
      TurretPitch                     = TurretEL01
    End
    AliasConditionState               = MOVING BETWEEN_FIRING_SHOTS_A
    AliasConditionState               = BETWEEN_FIRING_SHOTS_A

    ConditionState                    = REALLYDAMAGED MOVING
      Model                           = UsaPac3Car_d
      Animation                       = UsaPac3Car_d.UsaPac3Car_d
      AnimationMode                   = ONCE_BACKWARDS
      Flags                           = START_FRAME_FIRST
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = Turret01
      TurretPitch                     = TurretEL01
    End
    AliasConditionState               = REALLYDAMAGED MOVING BETWEEN_FIRING_SHOTS_A

    ;*** PACKING STATE -- preparing to move ***
    ; New Donor maps engine UNPACKING to the Car jack clip (Z on YYG01/YYG08).
    ConditionState                    = UNPACKING
      Model                           = UsaPac3Car
      Animation                       = UsaPac3Car.UsaPac3Car
      AnimationMode                   = ONCE_BACKWARDS
      Flags                           = START_FRAME_LAST
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = Turret01
      TurretPitch                     = TurretEL01
    End
    AliasConditionState               = PACKING BETWEEN_FIRING_SHOTS_A

    ConditionState                    = REALLYDAMAGED UNPACKING
      Model                           = UsaPac3Car_d
      Animation                       = UsaPac3Car_d.UsaPac3Car_d
      AnimationMode                   = ONCE_BACKWARDS
      Flags                           = START_FRAME_LAST
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = Turret01
      TurretPitch                     = TurretEL01
    End
    AliasConditionState               = REALLYDAMAGED PACKING BETWEEN_FIRING_SHOTS_A

    ;*** UNPACKING STATE  -- preparing to fire ***
    ; New Donor maps engine PACKING / DEPLOYED to the F mesh (launcher already vertical).
    ; UsaPac3F.UsaPac3F is a named 101-frame header with zero transform channels; MANUAL.
    ConditionState                    = PACKING
      Model                           = UsaPac3F
      Animation                       = UsaPac3F.UsaPac3F
      AnimationMode                   = MANUAL
      Flags                           = MAINTAIN_FRAME_ACROSS_STATES PRISTINE_BONE_POS_IN_FINAL_FRAME
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = TURRET01
      TurretPitch                     = TURRETEL01
    End
    AliasConditionState               = UNPACKING BETWEEN_FIRING_SHOTS_A

    ConditionState                    = REALLYDAMAGED PACKING
      Model                           = UsaPac3F_d
      Animation                       = UsaPac3F_d.UsaPac3F_d
      AnimationMode                   = MANUAL
      Flags                           = MAINTAIN_FRAME_ACROSS_STATES PRISTINE_BONE_POS_IN_FINAL_FRAME
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = TURRET01
      TurretPitch                     = TURRETEL01
    End
    AliasConditionState               = REALLYDAMAGED UNPACKING BETWEEN_FIRING_SHOTS_A

    ;*** DEPLOYED STATE -- ready to fire ***
    ConditionState                    = DEPLOYED
      Model                           = UsaPac3F
      Animation                       = UsaPac3F.UsaPac3F
      AnimationMode                   = MANUAL
      Flags                           = MAINTAIN_FRAME_ACROSS_STATES PRISTINE_BONE_POS_IN_FINAL_FRAME
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = Turret01
      TurretPitch                     = TurretEL01
    End
    AliasConditionState               = DEPLOYED FIRING_A
    AliasConditionState               = DEPLOYED BETWEEN_FIRING_SHOTS_A
    AliasConditionState               = DEPLOYED RELOADING_A
    AliasConditionState               = DEPLOYED MOVING

    ConditionState                    = DEPLOYED REALLYDAMAGED
      Model                           = UsaPac3F_d
      Animation                       = UsaPac3F_d.UsaPac3F_d
      AnimationMode                   = MANUAL
      Flags                           = MAINTAIN_FRAME_ACROSS_STATES PRISTINE_BONE_POS_IN_FINAL_FRAME
      WeaponLaunchBone                = PRIMARY FIREPOINT
      WeaponFireFXBone                = PRIMARY FIREFX
      Turret                          = TURRET01
      TurretPitch                     = TURRETEL01
    End
    AliasConditionState               = DEPLOYED REALLYDAMAGED FIRING_A
    AliasConditionState               = DEPLOYED REALLYDAMAGED BETWEEN_FIRING_SHOTS_A
    AliasConditionState               = DEPLOYED REALLYDAMAGED RELOADING_A
    AliasConditionState               = DEPLOYED REALLYDAMAGED MOVING

    TrackMarks                      = EXTireTrack.tga
    Dust                            = RocketBuggyDust
    RightFrontTireBone              = TIRE02
    LeftFrontTireBone               = TIRE01
    MidRightFrontTireBone           = TIRE04
    MidLeftFrontTireBone            = TIRE03
    MidLeftRearTireBone             = TIRE05
    MidRightRearTireBone            = TIRE06
    RightRearTireBone               = TIRE08
    LeftRearTireBone                = TIRE07
    TireRotationMultiplier          = 0.2
  End

  Draw = W3DTruckDraw ModuleTag_TracksDraw
    ParticlesAttachedToAnimatedBones = Yes
    AttachToBoneInAnotherModule      = CORE
    DefaultConditionState
      Model = UsaPac3Car_w
    End
    RightFrontTireBone              = TIRE10
    LeftFrontTireBone               = TIRE09
    TireRotationMultiplier          = 0.2
    PowerslideRotationAddition      = 0
  End

  DisplayName      = OBJECT:USAPAC3
  Side             = America
  MaxSimultaneousOfType = 3
  EditorSorting    = VEHICLE
  TransportSlotCount = 0

  ArmorSet
    Conditions = None
    Armor      = LargeVehicleArmor
    DamageFX   = TankDamageFX
  End

  ; Default / AA mode: air intercept on PRIMARY. Deploy buttons fire the dummy cue.
  WeaponSet
    Conditions        = None
    Weapon            = PRIMARY   US_PAC3_LRSAM
    Weapon            = SECONDARY US_PAC3_DeployCue
    Weapon            = TERTIARY  US_PAC3_DeployCue
    AutoChooseSources = PRIMARY   FROM_PLAYER FROM_AI FROM_SCRIPT
    AutoChooseSources = SECONDARY NONE
    AutoChooseSources = TERTIARY  NONE
    PreferredAgainst  = PRIMARY   AIRCRAFT
  End

  ; ABM mode: ballistic intercept on PRIMARY. Same dummy cues for Deploy.
  ; ZH WeaponSetUpgrade only sets WEAPONSET_PLAYER_UPGRADE (one bit), so MTS
  ; cannot have a third exclusive set. MTS keeps the AA CommandSet (Deploy)
  ; and this ABM set is triggered only by Upgrade_AADS_ABM_Mode.
  WeaponSet
    Conditions        = PLAYER_UPGRADE
    Weapon            = PRIMARY   US_PAC3Missile_ABM
    Weapon            = SECONDARY US_PAC3_DeployCue
    Weapon            = TERTIARY  US_PAC3_DeployCue
    AutoChooseSources = PRIMARY   FROM_PLAYER FROM_AI FROM_SCRIPT
    AutoChooseSources = SECONDARY NONE
    AutoChooseSources = TERTIARY  NONE
    PreferredAgainst  = PRIMARY   BALLISTIC_MISSILE
  End

  BuildCost           = 3000
  BuildTime           = 22.0
  VisionRange         = 1800
  ShroudClearingRange = 175

  Prerequisites
    Object = AmericaStrategyCenter AmericaStrategyCenter_T
  End

  ExperienceValue    = 160 160 260 420
  ExperienceRequired = 0 500 1000 1700
  IsTrainable        = Yes
  CrusherLevel       = 2
  CrushableLevel     = 2
  CommandSet         = S400ECommandSet

  VoiceSelect = ScudLauncherVoiceSelect
  VoiceMove = ScudLauncherVoiceMove
  VoiceGuard = ScudLauncherVoiceMove
  VoiceAttack = ScudLauncherVoiceAttack
  SoundMoveStart = ScudLauncherMoveStart
