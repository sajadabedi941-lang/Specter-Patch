  End
  Behavior = CommandSetUpgrade ModuleTag_CombatMode_MTS
    TriggeredBy = Upgrade_AIM-120C
    CommandSet  = S400ECommandSet_AA
  End

  Behavior = WeaponSetUpgrade ModuleTag_ABM_Weapons
    TriggeredBy = Upgrade_AADS_ABM_Mode
  End

  Scale               = 1.1
  Geometry            = BOX
  GeometryMajorRadius = 25.0
  GeometryMinorRadius = 10.0
  GeometryHeight      = 22.0
  GeometryIsSmall     = Yes
  Shadow              = SHADOW_VOLUME
  ShadowSizeX         = 45
End

