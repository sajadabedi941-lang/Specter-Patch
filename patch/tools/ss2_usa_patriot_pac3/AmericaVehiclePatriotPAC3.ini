;   America_MIM104F_Launcher (W3DModelDraw, TURRET/TURRETLE/MISSILE/EXH).
; Fire: unique clones of live SS2 THAAD AA (8x_LRSAM_THAAD / THAAD_AA_OBJECT1)
;   and the CRUSH ABM path proven on USAPAC3 (stock THAAD_ABM_OBJECT fuzes
;   WATER/FALLING do 0% vs BallisticMissileArmor). US_THAAD is not edited.

