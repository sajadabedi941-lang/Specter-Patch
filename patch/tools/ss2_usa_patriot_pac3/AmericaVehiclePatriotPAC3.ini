  DelayBetweenShots           = 800
  ClipSize                    = 12
  ClipReloadTime              = 7000
  AutoReloadsClip             = Yes
  AntiAirborneVehicle         = Yes
  AntiAirborneInfantry        = Yes
  AntiGround                  = No
  AntiBallisticMissile        = No
  AntiSmallMissile            = No
