; SPECTER SS2 — America MIM-104F Patriot PAC-3 (V25 port, SS2-compatible).
; V25 AmericaPATRIO / PAC3Weapon cannot be copied as-is:
;   USPAC3/PAC3MSE models are not in SS2 ART ONE/TWO.
;   CWC locomotor/projectile/FX/OCL names are missing from SS2 Data.
;   V25 JET_MISSILES is 25% vs AirplaneArmor and 0% vs CruiseMissileArmor.
;   BallisticMissileArmor / SRBMArmor take CRUSH=100% and PENALTY=0%.
; Art: US_MIM104F_L + PAC-3 from _SPEC_ART_TWO.big (SS2 MIM-104F launcher).
; AA  = PENALTY vs AIRCRAFT. ABM = CRUSH vs BALLISTIC_MISSILE and cruise.

